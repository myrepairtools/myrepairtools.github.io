<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Members · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --red:#DC282E;--light-red:#E8474C;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;
  --grey:#B9BDCB;--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B;--amber:#C9820B;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#D2D5DF;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.head{font-family:'Nunito',sans-serif}

/* ===== app shell (sits right of the shared nav, which sets body margin) ===== */
.erec-root{display:flex;flex-direction:column;height:calc(100vh - var(--cpr-top-h, 0px));overflow:hidden;background:var(--light-grey)}
.erec-root[hidden]{display:none}
.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;color:#fff}
.dot7{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== landing — roster table (design 1a/3a) ===== */
.tm-page{flex:1;min-width:0;overflow-y:auto;padding:24px 28px 40px}
.tm-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm-title-row h1{font-family:'Nunito';font-weight:900;font-size:1.5rem;letter-spacing:-.4px;color:var(--dark);margin:0}
.sync-badge{font-family:'Nunito';font-weight:800;font-size:.64rem;color:var(--green);background:#E9F6EE;border:1px solid #CFE9D8;border-radius:6px;padding:3px 8px}
.tm-sub{color:var(--dark-grey);font-size:.85rem;font-weight:700;margin:3px 0 0}
.tm-toolbar{display:flex;align-items:center;gap:12px;margin:16px 0 14px;flex-wrap:wrap}
.tm-search{font-family:'Nunito Sans';font-size:.88rem;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;flex:1;max-width:300px;color:var(--dark);outline:none}
.tm-search:focus{border-color:var(--blue)}
.seg{display:inline-flex;gap:3px;background:var(--light-grey);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg button{font-family:'Nunito';font-weight:800;font-size:.76rem;padding:6px 13px;border-radius:7px;border:none;cursor:pointer;background:none;color:var(--dark-grey)}
.seg button.on{background:#fff;color:var(--dark);box-shadow:0 1px 2px rgba(45,45,59,.08)}
.seg button .n{color:var(--grey)}
.sync-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Nunito';font-weight:800;font-size:.78rem;border:1.5px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;background:#fff;color:var(--dark)}
.sync-btn:hover{border-color:var(--blue);color:#1E7AA8}
.sync-btn:disabled{color:var(--grey);opacity:.7;cursor:default}
.tm-banner{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:12px 15px;margin-bottom:10px}
.tm-banner.ok{background:#E9F6EE;border:1px solid #CFE9D8;color:#1B7A41}
.tm-banner.ok .bx{margin-left:auto;border:none;background:none;color:#1B7A41;font-weight:800;cursor:pointer;font-size:1rem;line-height:1}
.tm-banner.bad{background:#FBE9EA;border:1px solid #F3C7C9;color:#B91C1C;align-items:center}
.tm-banner .bt{font-size:.84rem;font-weight:700;line-height:1.5;flex:1}
.tm-banner .bt .l2{font-weight:600;color:#2E7D4F;font-size:.78rem;margin-top:2px}
.tm-banner.bad .bbtn{font-family:'Nunito';font-weight:800;font-size:.72rem;padding:6px 13px;background:#fff;color:#B91C1C;border:1.5px solid #F3C7C9;border-radius:8px;cursor:pointer;white-space:nowrap}
.table-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(45,45,59,.05);overflow:hidden}
.table-card table{width:100%;border-collapse:collapse;font-size:.86rem;color:var(--dark)}
.table-card th{font-family:'Nunito';font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--dark-grey);text-align:left;padding:11px 16px;background:var(--light-grey);border-bottom:1px solid var(--border)}
.table-card th.r{text-align:right}
.table-card td{padding:11px 16px;border-bottom:1px solid var(--border)}
.table-card tbody tr.person{cursor:pointer}
.table-card tbody tr.person:hover{background:#FAFAFB}
.table-card tr.grouphdr td{background:var(--light-grey);font-family:'Nunito';font-weight:800;font-size:.6rem;letter-spacing:.5px;text-transform:uppercase;color:var(--dark-grey);padding:7px 16px}
tbody tr.pinrow{background:#FCFBFA}
tbody tr.pinrow td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.pinchip{font-family:'Nunito';font-weight:800;font-size:.54rem;letter-spacing:.4px;text-transform:uppercase;color:var(--red);background:#FBE9EA;border:1px solid #F3C7C9;border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:middle}
.setupchip{font-family:'Nunito';font-weight:800;font-size:.54rem;letter-spacing:.4px;text-transform:uppercase;color:#8A5A00;background:#FCF1DD;border:1px solid #F2D7A8;border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:middle}
.who{display:flex;align-items:center;gap:11px}
.who .avatar{width:34px;height:34px}
.who .avatar{font-size:.72rem;font-weight:900}
.who .nm{font-family:'Nunito';font-weight:800;color:var(--dark);display:block;line-height:1.25}
tr.person:hover .who .nm{color:#1E7AA8;text-decoration:underline}
.who .un{font-size:.72rem;color:var(--grey);font-weight:600}
.tm-chip{font-family:'Nunito';font-weight:700;font-size:.66rem;padding:2px 8px;border-radius:20px;border:1px solid var(--border);background:var(--light-grey);color:var(--dark-grey);display:inline-block;margin:1px 2px 1px 0}
.stbadge{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito';font-weight:800;font-size:.66rem;padding:3px 9px;border-radius:20px}
.stbadge.ok{color:var(--green);background:#E9F6EE;border:1px solid #CFE9D8}
.stbadge.ok .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.stbadge.off{color:var(--dark-grey);background:var(--light-grey);border:1px solid var(--border)}
.rowbtn{font-family:'Nunito';font-weight:800;font-size:.72rem;padding:6px 13px;background:#fff;color:var(--dark);border:1.5px solid var(--border);border-radius:8px;cursor:pointer}
.rowbtn:hover{border-color:var(--green);color:#1B7A41}
.rowbtn.red{background:var(--red);color:#fff;border:none}
.rowbtn.red:hover{background:var(--light-red);color:#fff}
.chev{text-align:right;color:var(--grey);font-weight:800;font-size:1rem}
.tm-foot{font-size:.72rem;color:var(--grey);font-weight:700;margin-top:10px}
.tm-empty{padding:38px 20px;text-align:center;color:var(--grey);font-weight:700;font-size:.86rem}

/* ===== profile view (design 2a) ===== */
.pview{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pview[hidden]{display:none}
.tm-page[hidden]{display:none}
.backlink{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:800;color:var(--blue);text-decoration:none;font-size:.78rem;background:none;border:none;cursor:pointer;padding:0}
.prof-facts{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:.8rem;color:var(--dark-grey);font-weight:700}
.termbox{display:flex;gap:10px;align-items:flex-start;background:var(--light-grey);border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-top:14px}
.termbox .tb-t{font-size:.82rem;color:var(--dark-grey);line-height:1.55;flex:1}
.termbox .tb-t b{font-family:'Nunito'}
.termbox .tb-t .q{color:#7A7E8A}
.termbox .tb-edit{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:.7rem;padding:5px 11px;background:#fff;color:var(--dark-grey);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;white-space:nowrap;flex:none}
.btn-reinstate{font-family:'Nunito';font-weight:800;font-size:.74rem;border:1.5px solid #CFE9D8;border-radius:8px;padding:7px 13px;cursor:pointer;background:#E9F6EE;color:#1B7A41}
/* profile tab — form cards */
.pf-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pf-grid{padding:22px 24px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.fcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(45,45,59,.05);padding:18px 20px}
.fcard .fc-t{font-family:'Nunito';font-weight:900;font-size:.92rem;color:var(--dark);margin-bottom:14px}
.fcard .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label{display:block;font-family:'Nunito';font-weight:800;font-size:.58rem;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box;font-family:'Nunito Sans';font-size:.88rem;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--dark);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue)}
.fld .ro{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;background:var(--light-grey);color:var(--dark-grey);font-size:.88rem}
.fld input:disabled,.fld select:disabled{background:var(--light-grey);color:var(--dark-grey)}
.mt12{margin-top:12px}
.qbtbox{margin-top:14px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--light-grey)}
.qbtbox .qtop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.qbtbox .qttl{font-family:'Nunito';font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--dark-grey)}
.qbtbox .qstate{font-family:'Nunito Sans';font-size:.78rem;color:var(--grey);font-weight:700;margin-left:auto}
.qbtbox select,.qbtbox .ro{width:100%;box-sizing:border-box;font-family:'Nunito Sans';font-size:.86rem;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--dark)}
.qbtbox .ro{background:#fff;color:var(--dark-grey)}
.authwrap{display:flex;flex-wrap:wrap;gap:7px}
.authpill{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito';font-weight:700;font-size:.76rem;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--dark-grey);cursor:pointer}
.authpill.on{font-weight:800;border-color:var(--blue);background:#EAF6FD;color:#1E7AA8}
.authpill .home{font-size:.56rem;text-transform:uppercase;letter-spacing:.4px;color:var(--blue)}
.pinbox{margin-top:16px;background:#FBFBFC;border:1px solid var(--border);border-radius:11px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.pinbox input{width:120px;box-sizing:border-box;font-family:'Nunito';font-weight:800;font-size:1.05rem;letter-spacing:.3em;text-align:center;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;outline:none}
.pinbox input:focus{border-color:var(--blue)}
.term-btn{font-family:'Nunito';font-weight:800;font-size:.72rem;padding:6px 13px;background:#fff;color:var(--dark-grey);border:1.5px solid var(--border);border-radius:8px;cursor:pointer}
.term-btn:hover{border-color:var(--red);color:var(--red)}
.savebar{flex:none;margin-top:22px;background:#fff;border-top:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:12px}
.savebar[hidden]{display:none}
.savebar .unsaved{display:inline-flex;align-items:center;gap:7px;font-family:'Nunito';font-weight:800;font-size:.76rem;color:#8A5A00}
.savebar .unsaved .d{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.btn-save{font-family:'Nunito';font-weight:800;font-size:.78rem;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;background:var(--red);color:#fff}
.btn-save:hover{background:var(--light-red)}
.btn-save:disabled{opacity:.6;cursor:default}
/* PIN shown-once modal */
.pindig{width:44px;height:52px;border:1.5px solid var(--border);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:1.5rem;color:var(--dark);background:#FBFBFC}
/* commission tab */
.comm-wrap{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 28px}
.comm-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.comm-link{font-family:'Nunito';font-weight:800;font-size:.72rem;color:var(--blue);text-decoration:none;white-space:nowrap}
.commtier{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(45,45,59,.05);padding:2px 18px 16px;display:flex;flex-direction:column}
.commtier-hd{padding:13px 0 10px;border-bottom:1px solid var(--border)}
.commtier-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.commtier-row .when{flex:1;min-width:0;font-size:.85rem;font-weight:600;color:var(--dark-grey);line-height:2}
.commtier-row .earn{flex:none;display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;min-width:128px;font-family:'Nunito';font-weight:800;font-size:.85rem;color:var(--dark)}
.crin{width:48px;text-align:center;font-family:'Nunito';font-weight:800;font-size:.86rem;padding:6px 4px;border:1.5px solid var(--border);border-radius:7px;background:#fff;outline:none}
.crin:focus{border-color:var(--blue)}
.crin.ovr{border-color:var(--blue)}
.crpct{font-family:'Nunito';font-weight:800;color:var(--grey)}
.commfoot{margin-top:auto;font-family:'Nunito';font-weight:800;font-size:.72rem;color:var(--dark-grey);background:var(--light-grey);border-radius:8px;padding:9px 12px;text-align:right;margin-top:12px}
.comm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.ratesgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0 28px;padding-top:4px}
.ratecell{padding:11px 2px;border-bottom:1px solid var(--border)}
.ratehd{display:flex;align-items:center;gap:9px;font-size:.85rem;font-weight:600;color:var(--dark-grey)}
.ovrchip{font-family:'Nunito';font-weight:800;font-size:.56rem;padding:1px 7px;border-radius:20px;background:#EAF6FD;border:1px solid #CFE7F6;color:#1E7AA8}
.ratebody{display:flex;align-items:flex-end;gap:12px;margin-top:8px;flex-wrap:wrap}
.ratebox{display:flex;flex-direction:column;gap:3px}
.ratebox label{font-family:'Nunito';font-size:.54rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);text-align:center}
.ratebox .in{display:flex;align-items:center;justify-content:center;gap:3px;font-family:'Nunito';font-weight:800;color:var(--grey);font-size:.82rem}
.ratebox.off{opacity:.35}
.rtiertgl{align-self:flex-end;margin-bottom:1px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--blue);cursor:pointer;text-decoration:none;border:1.5px solid var(--border);border-radius:6px;padding:3px 7px;font-family:'Nunito'}
.hist-badge{font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:3px 9px;white-space:nowrap}
.hist-badge.live{color:#8A5A00;background:#FCF1DD;border:1px solid #F2D7A8}
.hist-badge.arch{color:var(--dark-grey);background:var(--light-grey);border:1px solid var(--border)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.planrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--light-grey);font-size:.85rem}
.planrow .k{color:var(--dark-grey);font-weight:700}
.planrow .v{font-family:'Nunito';font-weight:800;color:var(--dark);font-variant-numeric:tabular-nums}

/* ----- main ----- */
.erec-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--light-grey)}
.prof{flex:none;padding:18px 24px 16px;background:#fff;border-bottom:1px solid var(--border)}
.prof-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.prof-id{display:flex;align-items:center;gap:15px;min-width:0}
.prof .av{width:56px;height:56px;font-size:1.2rem}
.prof-name{font-family:'Nunito';font-weight:900;font-size:1.5rem;line-height:1;letter-spacing:-.4px}
.status-pill{font-family:'Nunito';font-weight:800;font-size:.64rem;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:4px 9px}
.prof-sub{font-size:.86rem;color:var(--dark-grey);font-weight:700;margin-top:5px}
.btn-red{font-family:'Nunito';font-weight:800;font-size:.82rem;border:none;border-radius:9px;padding:11px 20px;cursor:pointer;background:var(--red);color:#fff}
.btn-red:hover{background:var(--light-red)}
.metrics{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:13px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 16px}
.metric{display:flex;align-items:center;gap:7px}
.metric .mdot{width:8px;height:8px;border-radius:2px;flex:none}
.metric .mval{font-family:'Nunito';font-weight:900;font-size:1.02rem;line-height:1}
.metric .mval.sm{font-size:.86rem}
.metric .mlbl{font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--grey)}

.tabbar{flex:none;display:flex;align-items:center;gap:10px;padding:11px 22px 0;background:#fff;border-bottom:1px solid var(--border)}
.tab{font-family:'Nunito';font-weight:800;font-size:.84rem;background:none;border:none;border-bottom:3px solid transparent;color:var(--grey);padding:7px 4px 11px;cursor:pointer;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.tab.on{border-bottom-color:var(--red);color:var(--red)}
.tab .badge{font-family:'Nunito';font-weight:800;font-size:.62rem;color:#fff;border-radius:9px;padding:1px 7px}
.badge.amber{background:var(--amber)}.badge.blue{background:var(--blue)}
.tabdiv{align-self:center;width:1px;height:16px;background:var(--border);margin:0 4px 8px}

.work{flex:1;min-height:0;display:flex;overflow:hidden}
.list-pane{flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:#fff}
.detail-pane{flex:1;min-width:0;overflow-y:auto;background:var(--light-grey)}
.list-scroll{flex:1;overflow-y:auto;padding:10px}

.flt{flex:none;padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px}
.flt label{flex:1;min-width:0}
.flt .lbl{display:block;font-family:'Nunito';font-weight:800;font-size:.56rem;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);margin-bottom:4px}
.sel{width:100%;font-family:'Nunito Sans';font-size:.82rem;font-weight:600;padding:8px 28px 8px 10px;border:1.5px solid var(--border);border-radius:8px;color:var(--dark);cursor:pointer;-webkit-appearance:none;appearance:none;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.5L6 6.5L11 1.5' stroke='%23B9BDCB' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>") no-repeat right 10px center;background-size:11px}
.sel.sm{font-size:.72rem;font-weight:700;padding:4px 22px 4px 9px;border-radius:7px;color:var(--dark-grey);background-size:9px;background-position:right 7px center}
.sel:focus{outline:none;border-color:var(--blue)}
.flt2{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border)}
.flt2 .ecount{font-family:'Nunito';font-weight:800;font-size:.66rem;color:var(--dark-grey);flex:1}
.sortbtn{font-family:'Nunito';font-weight:800;font-size:.7rem;border:1.5px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;background:#fff;color:var(--dark-grey)}
.sortbtn:hover{border-color:var(--blue);color:var(--blue)}

.card{border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff}
.card:hover{box-shadow:0 2px 10px rgba(45,45,59,.08)}
.card .crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tbadge{font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 7px}
.cdate{font-size:.68rem;color:var(--grey);font-weight:700;white-space:nowrap}
.csubj{font-family:'Nunito';font-weight:800;font-size:.88rem;color:var(--dark);margin-top:7px;line-height:1.3}
.cmeta{display:flex;align-items:center;gap:7px;margin-top:8px}
.catchip{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito';font-weight:700;font-size:.66rem}
.disc{font-family:'Nunito';font-weight:700;font-size:.64rem;color:var(--green);margin-left:auto}
.empty{padding:42px 22px;text-align:center}
.empty .ico{font-size:1.6rem;margin-bottom:8px}

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){const x=Number(n)||0;return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function isoOf(v){return String(v||'').slice(0,10);}
function fmt(iso){iso=isoOf(iso);if(!iso)return '';const p=iso.split('-');if(p.length<3)return iso;return MONTHS[(+p[1])-1]+' '+(+p[2])+', '+p[0];}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tenure(iso){iso=isoOf(iso);if(!iso)return '—';const s=new Date(iso+'T00:00:00'),n=new Date(todayISO()+'T00:00:00');if(isNaN(s))return '—';let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());if(n.getDate()<s.getDate())m--;if(m<0)return '—';const y=Math.floor(m/12),mo=m%12;return (y?y+'y ':'')+mo+'m';}
function inRange(iso,range){iso=isoOf(iso);if(!iso||range==='all')return true;const d=new Date(iso+'T00:00:00'),now=new Date(todayISO()+'T00:00:00');if(range==='90'){const c=new Date(now);c.setDate(c.getDate()-90);return d>=c;}if(range==='ytd')return d>=new Date(now.getFullYear()+'-01-01T00:00:00');return true;}

function fn(body){return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON,'apikey':ANON},body:JSON.stringify(body)}).then(r=>r.json().then(d=>({status:r.status,data:d}),()=>({status:r.status,data:{}})));}
/* best available session token: getSession can intermittently return null when
   several Supabase clients share storage, so fall back to the stored token. */
async function sessionToken(){
  try{ const s=(await sb.auth.getSession()).data.session; if(s&&s.access_token) return s.access_token; }catch(e){}
  try{ const raw=localStorage.getItem('sb-xuvsehrevxackuhmbmry-auth-token');
    if(raw){ const o=JSON.parse(raw); const t=o&&(o.access_token||(o.currentSession&&o.currentSession.access_token)); if(t) return t; } }catch(e){}
  return ANON;
}
/* staff CRUD carries the authenticated session bearer (caller() requires owner/admin) */
async function authFn(body){
  const tok=await sessionToken();
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':ANON},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  return {status:r.status,data:d};
}

/* ===== auth (PIN only) ===== */
async function doLogin(){
  const pin=$('#lkPin').value;
  const err=$('#lkErr');
  if(!pin){err.textContent='Enter your PIN';return;}
  $('#lkGo').disabled=true;err.textContent='Signing in…';
  try{
    const r=await fn({action:'login',pin,device_id:deviceId()});
    if(r.status!==200){const d=r.data||{};
      if(r.status===423||d.locked)err.textContent='Locked after too many tries — an owner must reset this device.';
      else if(d.error==='invalid')err.textContent='Wrong PIN.'+(d.remaining!=null?(' '+d.remaining+' left.'):'');
      else err.textContent=d.error||'Login failed.';
      $('#lkGo').disabled=false;return;
    }
    await sb.auth.setSession({access_token:r.data.access_token,refresh_token:r.data.refresh_token});
    const st=r.data.staff||{};
    AUTH={id:st.id,name:st.display_name,role:st.role};
    err.textContent='';$('#lkGo').disabled=false;
    unlock();
  }catch(e){$('#lkGo').disabled=false;err.textContent=String(e&&e.message||e);}
}
function unlock(){$('#lock').setAttribute('hidden','');$('#app').removeAttribute('hidden');load();}
async function initAuth(){
  $('#lkGo').onclick=doLogin;
  $('#lkPin').focus();
  $('#lkPin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  const sess=(await sb.auth.getSession()).data.session;
  if(sess){
    const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
    if(sr.data){AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role};unlock();return;}
  }
  $('#lock').removeAttribute('hidden');
}

function roleLabel(r){return ({owner:'Owner',admin:'Manager',manager:'Manager',team_member:'Team Member',employee:'Team Member',candidate:'Candidate'})[r]||r||'';}
/* store priority: Locations settings order (stores.display_order) with a CPRLocations fallback */
function storeRank(full){
  for(let i=0;i<STORES.length;i++){if(STORES[i].store===full)return STORES[i].display_order==null?9990:STORES[i].display_order;}
  try{var s=window.CPRLocations&&CPRLocations.find&&CPRLocations.find(full);return s?s.order:9999;}catch(e){return 9999;}
}
function roleRank(rl){return (rl==='owner')?0:((rl==='admin'||rl==='manager')?1:2);} /* managers above team members */
function empSort(a,b){return storeRank(a.homeStore)-storeRank(b.homeStore)||roleRank(a.roleLevel)-roleRank(b.roleLevel)||String(a.name).localeCompare(String(b.name));}
/* The roster shows everyone (incl. the signed-in person — Settings behavior wins),
   minus hidden owner rows. Active vs Terminated comes from the segmented control. */
function refilter(){EMPLOYEES=ALL.filter(e=>(S.seg==='terminated'?e.archived:!e.archived)&&!e.hideFromRecords);}
function selEmp(){return ALL.find(e=>String(e.id)===String(S.empId))||null;}
function syncSel(e){if(!e){S.entryId=S.pipId=S.damageId=null;return;}
  const ents=sortedEntries(e);S.entryId=ents[0]?ents[0].id:null;
  S.pipId=e.pips[0]?e.pips[0].id:null;
  const dmg=dmgFor(e);S.damageId=dmg[0]?dmg[0].id:null;}

async function loadDamage(){
  /* Tech Damage Tracker is migrated — read from the damage_reports table and
     attribute to the employee by staff id (tech_id), with a name fallback. */
  try{
    const r=await sb.from('damage_reports')
      .select('id,report_date,tech_id,tech_name,store,manufacturer,part,device,cost_cents,ticket,how')
      .order('report_date',{ascending:false});
    const rows=r.error?[]:(r.data||[]);
    DMG_BYNAME={};DMG_BYID={};
    rows.forEach(row=>{
      const rec={id:String(row.id),date:isoOf(row.report_date),store:stripStore(row.store),
        device:row.device||'',mfr:row.manufacturer||'',part:row.part||'',
        cost:(row.cost_cents||0)/100,ticket:String(row.ticket||''),how:row.how||''};
      if(row.tech_id!=null)(DMG_BYID[row.tech_id]=DMG_BYID[row.tech_id]||[]).push(rec);
      const k=normName(row.tech_name);if(k)(DMG_BYNAME[k]=DMG_BYNAME[k]||[]).push(rec);
    });
    if(!$('#app').hasAttribute('hidden'))render();
  }catch(e){DMG_BYNAME={};DMG_BYID={};}
}
function normName(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ');}
function dmgFor(e){if(!e)return [];
  const byId=DMG_BYID[e.id];
  const list=(byId&&byId.length)?byId:(DMG_BYNAME[normName(e.name)]||[]);
  return list.slice().sort((a,b)=>b.date.localeCompare(a.date));}

function sortedEntries(e){
  let ents=e.entries.slice();
  ents.sort((a,b)=>S.sortNewest?b.incidentDate.localeCompare(a.incidentDate):a.incidentDate.localeCompare(b.incidentDate));
  return ents;
}

function writeHash(){
  let h='';
  if(S.view==='profile'&&S.empId!=null){
    h='e='+S.empId+(S.tab!=='profile'?('/'+S.tab):'')+((S.tab==='commission'&&S.commSub==='history')?'/history':'');
  }else if(S.seg==='terminated')h='terminated';
  try{if(location.hash.replace('#','')!==h)history.replaceState(null,'',h?('#'+h):location.pathname+location.search);}catch(e){}
}
function parseHash(){
  const h=location.hash.replace('#','');
  const TABS=['profile','log','pips','damage','docs','time','pto','commission'];
  if(h.slice(0,2)==='e='){
    const parts=h.slice(2).split('/');
    const raw=parts[0],id=(raw!==''&&!isNaN(+raw))?+raw:raw;
    S.view='profile';S.empId=id;
    S.tab=TABS.indexOf(parts[1])>-1?parts[1]:'profile';
    S.commSub=(parts[2]==='history')?'history':'settings';
    const e=ALL.find(x=>String(x.id)===String(id));if(e)syncSel(e);
    PD=null;CD=null;
  }else{S.view='list';S.empId=null;S.seg=(h==='terminated')?'terminated':'active';}
}
function relTime(ts){
  if(!ts)return null;const ms=Date.now()-new Date(ts).getTime();if(isNaN(ms)||ms<0)return null;
  const m=Math.round(ms/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';
  const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';
}

function wireLanding(){

  document.querySelectorAll('#landing [data-seg]').forEach(b=>{b.onclick=()=>{S.seg=b.dataset.seg;refilter();render();};});
  const sy=$('#syncBtn');if(sy)sy.onclick=syncEmployees;
  const bd=$('#landing [data-dismissbanner]');if(bd)bd.onclick=()=>{SYNCBANNER=null;renderLanding();};

  document.querySelectorAll('#landing [data-reinstate]').forEach(b=>{b.onclick=async ev=>{ev.stopPropagation();
    b.disabled=true;const r=await authFn({action:'update_staff',staff_id:b.dataset.reinstate,active:true,archived:false,hr_status:'active'});

/* ----- sync employees (owner; 3b states) ----- */
async function syncEmployees(){
  const btn=$('#syncBtn');if(btn){btn.disabled=true;btn.innerHTML=QBLOGO+'Syncing…';}
  try{
    const tok=await sessionToken();
    const r=await fetch(QBT_SYNC_FN+'?action=users',{headers:{'Authorization':'Bearer '+tok,'apikey':ANON}}).then(x=>x.json().catch(()=>({})));
    if(r&&r.ok){
      const bits=[(r.matched||0)+' linked'];
      if(r.created&&r.created.length)bits.push('<b>'+r.created.length+' new auto-created</b>');
      if(r.unmatched&&r.unmatched.length)bits.push(r.unmatched.length+' unmatched');
      if(r.termination_candidates&&r.termination_candidates.length)bits.push(r.termination_candidates.length+' inactive in QB');
      let html='Synced '+(r.fetched||0)+' QuickBooks Time users · '+bits.join(' · ')+'.';
      if(r.created&&r.created.length)html+='<div class="l2">New: '+r.created.map(c=>esc(c.name)).join(', ')+' — open '+(r.created.length>1?'their profiles':'the profile')+' to set a preferred name, store &amp; PIN.</div>';
      SYNCBANNER={kind:'ok',html};
    }else{
      SYNCBANNER={kind:'bad',html:'Sync failed — '+(r&&r.detail?esc(typeof r.detail==='string'?r.detail:JSON.stringify(r.detail)):'the QuickBooks Time connection has expired. Reconnect in Settings › Integrations › QuickBooks Time.')};
    }
  }catch(e){SYNCBANNER={kind:'bad',html:'Sync failed — '+esc(String(e&&e.message||e))};}
  await load();
}

function genPin(){let s='';for(let i=0;i<4;i++)s+=Math.floor(Math.random()*10);return s;}
function canEdit(e){const r=AUTH&&AUTH.role;if(r==='owner')return true;
  if(r!=='admin'&&r!=='manager')return false;           // caller must be a manager+ (cpr-auth vets this server-side too)
  const t=String(e.roleLevel||'').toLowerCase();return t==='employee'||t==='team_member';}   // mirrors cpr-auth canManageRole
function initPD(e){
  const prof=PROFILES[e.id]||{phone:'',email:''};
  const linked=QBU.filter(u=>String(u.staff_id)===String(e.id))[0]||null;
  PD={first:e.first,last:e.last,preferred:e.preferred,birthday:e.birthday||'',phone:prof.phone||'',email:prof.email||'',
    home:e.homeStore||'',title:e.title||'',start:e.start||'',status:e.archived?'terminated':(e.hrStatus||'active'),
    role:e.roleLevel||'team_member',username:e.username||'',auth:(e.authorizedStores||[]).slice(),pin:'',
    qbt:linked?String(linked.qbt_id):''};

  const act=STORES.filter(s=>s.active!==false).map(s=>s.store);
  const list=act.length?act:[...new Set(ALL.map(e=>e.homeStore).filter(Boolean))];
  if(sel&&list.indexOf(sel)<0)list.push(sel);

    +list.map(s=>'<option value="'+esc(s)+'"'+(s===sel?' selected':'')+'>'+esc(stripStore(s))+'</option>').join('');

function fld(label,inner,cls){return '<div class="fld'+(cls?' '+cls:'')+'"><label>'+label+'</label>'+inner+'</div>';}

    +'</div>'

    +'<div class="fcard"><div class="fc-t">Contact</div>'
    +'<div class="g2">'+fld('Phone',inp('phone',d.phone,' inputmode="tel"'))+fld('Email',inp('email',d.email,' inputmode="email"'))+'</div>'
    +qbox
    +'</div>'
    /* Employment */
    +'<div class="fcard"><div class="fc-t">Employment</div>'
    +'<div class="g2">'
    +fld('Home store','<select data-pk="home"'+dis+'>'+storeOptsFor(d.home)+'</select>')
    +fld('Job title',inp('title',d.title,' placeholder="e.g. Repair Technician"'))
    +fld('Start date','<input type="date" data-pk="start" value="'+esc(d.start)+'"'+dis+'>')
    +fld('Employment status','<select data-pk="status"'+dis+'>'+statusOpts+'</select>')

function wireProfileTab(e){
  const w=$('#work');
  w.querySelectorAll('[data-pk]').forEach(el=>{
    const k=el.getAttribute('data-pk');
    const h=()=>{let v=el.value;
      if(k==='username')v=v.replace(/\s+/g,'').toLowerCase();
      if(k==='pin')v=v.replace(/\D/g,'').slice(0,8);
      if(el.value!==v)el.value=v;
      if(k==='status'&&v==='terminated'&&PD.status!=='terminated'){el.value=PD.status;openTerminateModal(e,false);return;}
      if(k==='home'){PD.home=v;if(PD.auth.indexOf(v)<0)PD.auth.push(v);$('#work').innerHTML=profileTabHtml(e);wireProfileTab(e);pfSyncBar();return;}
      PD[k]=v;pfSyncBar();};
    el.addEventListener(el.tagName==='SELECT'?'change':'input',h);
  });
  w.querySelectorAll('[data-authpill]').forEach(b=>{b.onclick=()=>{
    const s=b.getAttribute('data-authpill');
    if(s===PD.home)return;   // home locked on
    const i=PD.auth.indexOf(s);
    if(i>-1)PD.auth.splice(i,1);else PD.auth.push(s);
    w.innerHTML=profileTabHtml(e);wireProfileTab(e);pfSyncBar();};});
  const gp=w.querySelector('[data-genpin]');if(gp)gp.onclick=()=>{PD.pin=genPin();w.innerHTML=profileTabHtml(e);wireProfileTab(e);pfSyncBar();};
  const hf=w.querySelector('[data-hidefr]');if(hf)hf.onchange=async()=>{
    const r=await authFn({action:'update_staff',staff_id:e.id,hide_from_records:hf.checked});
    if(r.status===200&&r.data.ok){toast(hf.checked?'Hidden from the list':'Shown in the list');await load();}
    else toast((r.data&&r.data.error)||'Failed',true);};
  const tb=w.querySelector('[data-terminate]');if(tb)tb.onclick=()=>openTerminateModal(e,false);
  const dc=w.querySelector('[data-pfdiscard]');if(dc)dc.onclick=()=>{PD=null;renderWork();};
  const sv=w.querySelector('[data-pfsave]');if(sv)sv.onclick=()=>saveProfile(e);
  pfSyncBar();
}
async function saveProfile(e){
  const d=PD;if(!d)return;
  if(!d.username){toast('Username is required',true);return;}
  if(!d.home){toast('Pick a home store',true);return;}
  if(d.auth.indexOf(d.home)<0)d.auth.push(d.home);   // home is always authorized
  const btn=$('#work [data-pfsave]');if(btn)btn.disabled=true;
  try{
    const body={action:'update_staff',staff_id:e.id,first_name:d.first,last_name:d.last,preferred_name:d.preferred,
      username:d.username,role:d.role,home_store:d.home,authorized_stores:d.auth,title:d.title,
      start_date:d.start,birthday:d.birthday,hr_status:d.status,phone:d.phone,email:d.email,
      archived:d.status==='terminated',active:d.status!=='terminated'};
    const r=await authFn(body);
    if(!(r.status===200&&r.data.ok)){toast((r.data&&r.data.error)||'Save failed',true);if(btn)btn.disabled=false;return;}
    let pinToShow=null;
    if(d.pin&&!/^\d{4,8}$/.test(d.pin)){toast('Saved, but the PIN must be 4-8 digits',true);d.pin='';}
    if(d.pin){
      const p=await authFn({action:'set_pin',staff_id:e.id,pin:d.pin});
      if(p.status===200&&p.data.ok)pinToShow=d.pin;
      else toast((p.data&&p.data.error)||'Saved, but PIN reset failed',true);
    }
    /* QB Time link (owner) — unlink the old row first, then link the new pick */
    const base=JSON.parse(PD_BASE);
    if(AUTH&&AUTH.role==='owner'&&String(d.qbt)!==String(base.qbt)){
      if(base.qbt){const r1=await qbtMap(base.qbt,null);if(!(r1&&r1.ok))toast('Saved, but QB link update failed',true);}
      if(d.qbt){const r2=await qbtMap(d.qbt,e.id);if(!(r2&&r2.ok))toast('Saved, but QB link update failed',true);}
    }
    PD=null;
    toast('Saved');
    await load();
    if(pinToShow)showPinModal((d.preferred||d.first||e.name).split(' ')[0],pinToShow);
  }catch(err){toast(String(err&&err.message||err),true);if(btn)btn.disabled=false;}
}

function showPinModal(firstName,pin){
  const digits=String(pin).split('').map(ch=>'<span class="pindig">'+esc(ch)+'</span>').join('');

}
/* Terminate modal (3g); editRecord=true just edits the stored record */
function openTerminateModal(e,editRecord){
  const today=todayISO();
  const reasons=['Voluntary resignation','Terminated for cause','Layoff','Job abandonment','Other'];
  const curReason=e.terminationReason||reasons[0];
  const rOpts=reasons.map(r=>'<option'+(r===curReason?' selected':'')+'>'+esc(r)+'</option>').join('')
    +((reasons.indexOf(curReason)<0&&curReason)?'<option selected>'+esc(curReason)+'</option>':'');
  modal('<h2>'+(editRecord?'Edit termination record':'Terminate '+esc(e.name))+'</h2>'
    +'<div class="msub">'+esc(e.role)+' · '+esc(e.store||'—')+'</div>'
    +(editRecord?'':'<div style="display:flex;gap:9px;background:#FBE9EA;border:1px solid #F3C7C9;border-radius:10px;padding:11px 13px;margin-bottom:14px"><span>⚠</span><div style="font-size:.78rem;color:#B91C1C;font-weight:700;line-height:1.5">Sign-in and store access end immediately. Their records, time &amp; commission history are kept.</div></div>')
    +'<div class="frow">'+field('Last day','<input id="tm_last" type="date" class="fin" value="'+esc(editRecord?(e.terminatedAt||today):today)+'">')
    +field('Reason','<select id="tm_reason" class="fin">'+rOpts+'</select>')+'</div>'
    +field('Details','<textarea id="tm_note" class="fin" placeholder="What happened, notice given, final-day notes…">'+esc(e.terminationNote||'')+'</textarea>')
    +'<label class="fcheck"><input type="checkbox" id="tm_rehire"'+(e.rehireEligible!==false?' checked':'')+'> Eligible for rehire</label>'
    +'<div class="mactions"><button class="btn-o" data-close>Cancel</button><button class="btn-red" id="tm_go">'+(editRecord?'Save record':'Terminate member')+'</button></div>');
  $('#tm_go').onclick=async()=>{
    $('#tm_go').disabled=true;
    const body={action:'update_staff',staff_id:e.id,
      terminated_at:$('#tm_last').value||today,termination_reason:$('#tm_reason').value,
      termination_note:$('#tm_note').value.trim(),rehire_eligible:$('#tm_rehire').checked};
    /* stamp terminated_by only on the initial terminate — editing the record keeps the original logger */
    if(!editRecord){body.active=false;body.archived=true;body.hr_status='terminated';
      if(AUTH&&AUTH.id)body.terminated_by=AUTH.id;}
    const r=await authFn(body);
    if(!(r.status===200&&r.data.ok)){$('#tm_go').disabled=false;toast((r.data&&r.data.error)||'Failed',true);return;}
    closeModal();toast(editRecord?'Record updated':'Terminated');PD=null;await load();
  };
}
async function reinstateFromProfile(e){
  const r=await authFn({action:'update_staff',staff_id:e.id,active:true,archived:false,hr_status:'active'});
  if(r.status===200&&r.data.ok){toast('Reinstated');PD=null;await load();}
  else toast((r.data&&r.data.error)||'Failed',true);
}

/* ===== Commission tab (1f settings · 3i/3j history · 3d read-only) ===== */
const MONTHFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function humanize(s){return String(s||'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function rateMapClean(m){const o={};for(const k in m){const v=m[k];if(v==null||v==='')continue;if(typeof v==='object'){if(v.goal||v.lo||v.hi)o[k]={goal:Number(v.goal)||0,lo:Number(v.lo)||0,hi:Number(v.hi)||0};}else o[k]=Number(v)||0;}return o;}
const ROLE_ALIAS={owner:'owner',admin:'admin',manager:'admin',employee:'team_member',team_member:'team_member'};
let CCFG_READY=false;
async function loadCommissionCfg(){
  try{
    const res=await Promise.all([
      sb.from('commission_rates').select('*').order('sort'),
      sb.from('commission_rules').select('*'),
      sb.from('commission_roster').select('*'),
      sb.from('commission_role_overrides').select('*'),
      sb.rpc('commission_service_keys'),
      sb.from('roles').select('id,key'),
      sb.from('permissions').select('id,key').like('key','commission.earn.%'),
      sb.from('role_permissions').select('role_id,permission_id'),
    ]);
    const byKey={};
    (res[0].error?[]:(res[0].data||[])).forEach(r=>{byKey[r.sku]={sku:r.sku,label:r.label||'',amount:Number(r.amount)||0,tiers:(r.tiers&&r.tiers.goal)?{goal:Number(r.tiers.goal)||'',lo:r.tiers.lo,hi:r.tiers.hi}:null,count:0};});
    (res[4].error?[]:(res[4].data||[])).forEach(d=>{if(!byKey[d.sku])byKey[d.sku]={sku:d.sku,label:'',amount:0,count:0};byKey[d.sku].count=Number(d.total)||0;});
    CRATES=Object.keys(byKey).map(k=>byKey[k]).sort((a,b)=>(b.count-a.count)||a.sku.localeCompare(b.sku));
    CRULES={};CSTORERATES={};(res[1].error?[]:(res[1].data||[])).forEach(r=>{CRULES[r.store]=r.rules||{};CSTORERATES[r.store]=r.rates||{};});
    CROSTER={};(res[2].error?[]:(res[2].data||[])).forEach(r=>{CROSTER[r.staff_id]={accy_goal:Number(r.accy_goal)||0,earns_override:r.earns_override||null,rules_override:r.rules_override||null,rates_override:r.rates_override||null};});
    CROLEOVER={};(res[3].error?[]:(res[3].data||[])).forEach(x=>{CROLEOVER[x.role_id]={rules:x.rules||{},rates:x.rates||{}};});
    RBROLES=(res[5].error?[]:(res[5].data||[]));
    RBPERMS=(res[6].error?[]:(res[6].data||[]));
    RBROLEPERMS=(res[7].error?[]:(res[7].data||[]));
    CCFG_READY=true;
    if(S.view==='profile'&&S.tab==='commission')renderWork();
  }catch(e){CCFG_READY=false;}
}
function commPermStreams(){const m={};RBPERMS.forEach(p=>{if(String(p.key).indexOf('commission.earn.')===0)m[p.id]=p.key.split('.').pop();});return m;}
function roleEarnsFor(roleKey){
  const rk=ROLE_ALIAS[roleKey]||roleKey;
  const role=RBROLES.filter(r=>r.key===rk)[0];
  if(!role)return {accessory:true,device:true,services:true};
  const pm=commPermStreams(),out={accessory:false,device:false,services:false};
  RBROLEPERMS.forEach(x=>{if(x.role_id===role.id&&pm[x.permission_id])out[pm[x.permission_id]]=true;});
  return out;
}
function ratesBase(){const b={};CRATES.forEach(r=>{b[r.sku]=r.tiers?{goal:r.tiers.goal,lo:r.tiers.lo,hi:r.tiers.hi}:r.amount;});return b;}
function personInherited(roleLevel,homeStore){
  const rk=ROLE_ALIAS[roleLevel]||roleLevel, role=RBROLES.filter(r=>r.key===rk)[0];
  const roleO=(role&&CROLEOVER[role.id])?CROLEOVER[role.id]:{rules:{},rates:{}};
  const E=window.CommissionEngine;
  return {rules:E?E.mergeRules(CRULES[homeStore],roleO.rules):{}, rates:E?E.mergeRates(ratesBase(),CSTORERATES[homeStore],roleO.rates):{}};
}
function initCD(e){
  const ros=CROSTER[e.id]||{};
  CD={comm_goal:(ros.accy_goal!=null?ros.accy_goal:0),earns_override:Object.assign({},ros.earns_override||{}),
    rules_override:Object.assign({},ros.rules_override||{}),rates_override:JSON.parse(JSON.stringify(ros.rates_override||{}))};
  CD_BASE=JSON.stringify(CD);
}
function cdDirty(){return CD&&JSON.stringify(CD)!==CD_BASE;}
function commOverridesHtml(e){
  const ovR=CD.rules_override||{}, ovRt=CD.rates_override||{};
  const inh=personInherited(e.roleLevel,e.homeStore);
  const pinp=(key,unit)=>{const has=ovR[key]!=null;const val=has?(unit==='%'?Math.round(ovR[key]*100):ovR[key]):'';
    const ph=unit==='%'?Math.round((inh.rules[key]||0)*100):(inh.rules[key]||0);
    return '<input type="number" data-prule="'+key+'" data-unit="'+unit+'" value="'+val+'" placeholder="'+ph+'" class="crin'+(has?' ovr':'')+'">'+(unit==='%'?'<span class="crpct">%</span>':'');};
  const pr=(label,earn)=>'<div class="commtier-row"><div class="when">'+label+'</div><div class="earn">'+earn+'</div></div>';
  const roleE=roleEarnsFor(e.roleLevel),eov=CD.earns_override||{};
  const earnSel=key=>{const cur=(eov[key]===true?'yes':(eov[key]===false?'no':''));const def=roleE[key]?'Yes':'No';
    return '<div style="display:flex;align-items:center;gap:6px"><span style="font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);font-family:Nunito,sans-serif">Earns</span>'
      +'<select data-earn="'+key+'" style="font-size:.74rem;padding:2px 6px;min-width:116px;border:1.5px solid var(--border);border-radius:6px;font-family:\'Nunito Sans\',sans-serif"><option value=""'+(cur===''?' selected':'')+'>Role default ('+def+')</option>'
      +'<option value="yes"'+(cur==='yes'?' selected':'')+'>Yes</option><option value="no"'+(cur==='no'?' selected':'')+'>No</option></select></div>';};
  const sec=(title,accent,rows,hr,extra)=>'<div class="commtier" style="border-top:3px solid '+accent+'"'+(extra||'')+'><div class="commtier-hd" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="font-family:Nunito,sans-serif;font-weight:900;font-size:.78rem">'+title+'</div>'+(hr||'')+'</div>'+rows+'</div>';
  const goalRowHtml='<div class="commtier-row"><div class="when">Accessory goal $</div><div class="earn"><span class="crpct">$</span><input type="number" data-cgoal value="'+esc(CD.comm_goal||'')+'" class="crin ovr" style="width:64px"></div></div>';
  const acc=sec('Accessories','var(--blue)',
    goalRowHtml
    +pr('Tier 1 attach '+pinp('accyAttach1','%'),'+ '+pinp('accyPct1','%'))
    +pr('Accessory $ goal bonus','+ '+pinp('accyGoalPct','%'))
    +pr('Tier 2 attach '+pinp('accyAttach2','%'),'+ '+pinp('accyPct2','%'))
    +'<div class="commfoot">Max accessory rate · 9%</div>',earnSel('accessory'));
  const dev=sec('Devices','var(--dark)',
    pr('Sells '+pinp('dev1Count','')+'+ net devices','earn '+pinp('dev1Pct','%'))
    +pr('Attach req '+pinp('devAttachReq','%'),'earn '+pinp('devAttachPct','%'))
    +pr('Band '+pinp('dev2Min','')+'–'+pinp('dev2Max',''),'earn '+pinp('dev2Pct','%'))
    +pr('Sells '+pinp('dev3Count','')+'+ net devices','earn '+pinp('dev3Pct','%'))
    +'<div class="commfoot">Device commission stacks up to 5%</div>',earnSel('device'));
  const pbox=(lbl,inner,off)=>'<div class="ratebox'+(off?' off':'')+'"><label>'+lbl+'</label><span class="in">'+inner+'</span></div>';
  const pfld=(attr,val,ph,moneyPre,dis)=>(moneyPre?'$':'')+'<input type="number" '+attr+' value="'+(val!=null&&val!==''?val:'')+'" placeholder="'+(ph||'')+'" class="crin"'+(dis?' disabled':'')+'>';
  const rtsRows=CRATES.map(rt=>{const sku=rt.sku,v=ovRt[sku],tiered=(v&&typeof v==='object');
    const inhSpec=(inh.rates[sku]!=null?inh.rates[sku]:(rt.tiers||rt.amount)),basePh=(typeof inhSpec==='object')?(inhSpec.lo||0):(Number(inhSpec)||0);
    const hasOvr=v!=null;
    const payout=pfld(tiered?'data-prt="'+esc(sku)+'" data-ptk="lo"':'data-prate="'+esc(sku)+'"', tiered?v.lo:(v!=null?v:''), basePh, true, false);
    const goal=pfld(tiered?'data-prt="'+esc(sku)+'" data-ptk="goal"':'', tiered?v.goal:'', '0', false, !tiered);
    const met=pfld(tiered?'data-prt="'+esc(sku)+'" data-ptk="hi"':'', tiered?v.hi:'', '0', true, !tiered);
    const tgl='<a class="rtiertgl" data-ptgl="'+esc(sku)+'">'+(tiered?'flat':'tier')+'</a>';
    return '<div class="ratecell"><div class="ratehd"><div>'+esc(rt.label||humanize(sku))+'</div>'+(hasOvr?'<span class="ovrchip">override</span>':'')+'</div><div class="ratebody">'
      +pbox('Payout',payout,false)+pbox('Goal',goal,!tiered)+pbox('If met',met,!tiered)+tgl+'</div></div>';}).join('');
  return '<div class="comm-grid">'+acc+dev+'</div>'
    +sec('Service payouts','var(--green)','<div class="ratesgrid">'+rtsRows+'</div>',earnSel('services'),' style="border-top:3px solid var(--green);margin-top:14px"')
    +'<div class="savebar" id="cdSave" style="margin:16px -24px 0"'+(cdDirty()?'':' hidden')+'><span class="unsaved"><span class="d"></span>Unsaved changes</span><span style="flex:1"></span>'
    +'<button class="btn-o" data-cdclear>Clear overrides</button><button class="btn-save" data-cdsave>Save changes</button></div>'
    +'<div style="display:flex;justify-content:flex-end;margin:14px -0px 0"'+(cdDirty()?' hidden':'')+' id="cdIdleBar"><button class="btn-o" data-cdclear>Clear overrides</button></div>';
}
function readonlyPlanHtml(e){
  const inh=personInherited(e.roleLevel,e.homeStore);
  const ros=CROSTER[e.id]||{};
  const E=window.CommissionEngine;
  const rules=E?E.mergeRules(inh.rules,ros.rules_override):inh.rules;
  const rates=E?E.mergeRates(inh.rates,ros.rates_override):inh.rates;
  const pct=v=>Math.round((v||0)*100)+'%';
  const rows=[
    ['Accessory goal','$'+(Number(ros.accy_goal)||0).toLocaleString()+' / month'],
    ['Tier 1 · '+pct(rules.accyAttach1)+' attach','+ '+pct(rules.accyPct1)+' of accessory sales'],
    ['Goal bonus (goal met)','+ '+pct(rules.accyGoalPct)],
    ['Tier 2 · '+pct(rules.accyAttach2)+' attach','+ '+pct(rules.accyPct2)],
    ['Devices · '+(rules.dev1Count||0)+'+ net','earn '+pct(rules.dev1Pct)],
  ];
  const ovRt=ros.rates_override||{};
  CRATES.slice(0,12).forEach(rt=>{const v=rates[rt.sku];if(v==null)return;
    const label=rt.label||humanize(rt.sku);
    const val=(typeof v==='object')?('$'+(Number(v.lo)||0)+' · $'+(Number(v.hi)||0)+' if '+(Number(v.goal)||0)+'+'):('$'+(Number(v)||0)+' each');
    rows.push([label,val+(ovRt[rt.sku]!=null?' (override)':'')]);});
  return '<div class="commtier" style="border-top:3px solid var(--blue);max-width:560px;padding:4px 20px 8px">'
    +'<div class="commtier-hd" style="display:flex;align-items:center;gap:10px"><div style="font-family:Nunito,sans-serif;font-weight:900;font-size:.9rem">Your commission plan</div>'
    +'<span style="margin-left:auto;font-family:Nunito,sans-serif;font-weight:800;font-size:.58rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);background:var(--light-grey);border:1px solid var(--border);border-radius:999px;padding:3px 9px">Read-only</span></div>'
    +rows.map(r=>'<div class="planrow"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>').join('')
    +'<div style="font-size:.72rem;color:var(--grey);font-weight:700;padding:9px 0 8px">Questions about your plan? Talk to your manager.</div></div>';
}
function renderCommissionTab(e){
  const w=$('#work');
  const seg='<span class="seg"><button data-csub="settings"'+(S.commSub==='settings'?' class="on"':'')+'>Settings</button>'
    +'<button data-csub="history"'+(S.commSub==='history'?' class="on"':'')+'>History</button></span>';
  let body;
  if(!CCFG_READY||!window.CommissionEngine){
    body='<div class="tm-empty">Loading commission configuration…</div>';
  }else if(S.commSub==='history'){
    body='<div id="commHist"><div class="tm-empty">Loading history…</div></div>';
  }else{
    const selfView=AUTH&&String(AUTH.id)===String(e.id)&&AUTH.role!=='owner';
    if(selfView)body=readonlyPlanHtml(e);
    else{if(!CD)initCD(e);body='<div id="commEdit">'+commOverridesHtml(e)+'</div>';}
  }
  w.innerHTML='<div class="comm-wrap"><div class="comm-bar">'+seg+'<span style="flex:1"></span>'
    +'<a class="comm-link" href="commission-dashboard.html" target="_blank" rel="noopener">Open in Commission Dashboard ↗</a></div>'
    +body+'</div>';
  w.querySelectorAll('[data-csub]').forEach(b=>{b.onclick=()=>{S.commSub=b.dataset.csub;writeHash();renderCommissionTab(e);};});
  if(S.commSub==='history'&&CCFG_READY&&window.CommissionEngine)loadHistoryFor(e);
  if(S.commSub==='settings'&&CD)wireCommissionEditor(e);
}
function wireCommissionEditor(e){
  const w=$('#work');
  const rerender=()=>{const host=$('#commEdit');if(host){host.innerHTML=commOverridesHtml(e);wireCommissionEditor(e);}};
  const syncBars=()=>{const b=$('#cdSave');if(b)b.hidden=!cdDirty();const i=$('#cdIdleBar');if(i)i.hidden=cdDirty();};
  const g=w.querySelector('[data-cgoal]');if(g)g.onchange=()=>{CD.comm_goal=(g.value===''?0:+g.value||0);syncBars();};
  w.querySelectorAll('[data-earn]').forEach(sel=>{sel.onchange=()=>{
    const k=sel.getAttribute('data-earn'),v=sel.value;CD.earns_override=CD.earns_override||{};
    if(v==='')delete CD.earns_override[k];else CD.earns_override[k]=(v==='yes');syncBars();};});
  w.querySelectorAll('[data-prule]').forEach(input=>{input.onchange=()=>{
    const key=input.getAttribute('data-prule'),unit=input.getAttribute('data-unit');CD.rules_override=CD.rules_override||{};
    if(input.value==='')delete CD.rules_override[key];else CD.rules_override[key]=(unit==='%'?((+input.value||0)/100):(+input.value||0));
    input.classList.toggle('ovr',input.value!=='');syncBars();};});
  w.querySelectorAll('[data-prate]').forEach(input=>{input.onchange=()=>{
    const sku=input.getAttribute('data-prate');CD.rates_override=CD.rates_override||{};
    if(input.value==='')delete CD.rates_override[sku];else CD.rates_override[sku]=+input.value||0;syncBars();};});
  w.querySelectorAll('[data-prt]').forEach(input=>{input.onchange=()=>{
    const sku=input.getAttribute('data-prt'),k=input.getAttribute('data-ptk');CD.rates_override=CD.rates_override||{};
    if(!CD.rates_override[sku]||typeof CD.rates_override[sku]!=='object')CD.rates_override[sku]={};
    CD.rates_override[sku][k]=(input.value===''?'':(+input.value||0));syncBars();};});
  w.querySelectorAll('[data-ptgl]').forEach(a=>{a.onclick=ev=>{ev.preventDefault();
    const sku=a.getAttribute('data-ptgl');CD.rates_override=CD.rates_override||{};const v=CD.rates_override[sku];
    if(v&&typeof v==='object'){if(v.lo!=null&&v.lo!=='')CD.rates_override[sku]=+v.lo||0;else delete CD.rates_override[sku];}
    else CD.rates_override[sku]={goal:'',lo:(v!=null?v:''),hi:''};
    rerender();syncBars();};});
  w.querySelectorAll('[data-cdclear]').forEach(b=>{b.onclick=()=>{
    CD.earns_override={};CD.rules_override={};CD.rates_override={};rerender();syncBars();};});
  const sv=w.querySelector('[data-cdsave]');if(sv)sv.onclick=()=>saveCommission(e);
  syncBars();
}
async function saveCommission(e){
  const nn=o=>(o&&Object.keys(o).length)?o:null;
  const btn=$('#work [data-cdsave]');if(btn)btn.disabled=true;
  const row={staff_id:e.id,accy_goal:Number(CD.comm_goal)||0,
    earns_override:nn(CD.earns_override),rules_override:nn(CD.rules_override),rates_override:nn(rateMapClean(CD.rates_override||{}))};
  const r=await sb.from('commission_roster').upsert(row,{onConflict:'staff_id'});
  if(r.error){if(btn)btn.disabled=false;toast('Save failed: '+r.error.message,true);return;}
  CROSTER[e.id]={accy_goal:row.accy_goal,earns_override:row.earns_override,rules_override:row.rules_override,rates_override:row.rates_override};
  SNAPS_FOR=null;                                       // History's live estimate must recompute with the new overrides
  CD_BASE=JSON.stringify(CD);
  toast('Commission settings saved');
  renderCommissionTab(e);
}
/* history: archived snapshots + a live current-month estimate (engine recompute) */
function blankTotals(){return {Tickets:0,AccyUnits:0,NetAccySales:0,AccyGP:0,DeviceUnits:0,DeviceReturns:0,DeviceRev:0,DeviceGP:0,DeviceAttach:0,ServiceNet:0,services:{}};}
function addInto(t,r){
  t.Tickets+=Number(r.tickets)||0;t.AccyUnits+=Number(r.accy_units)||0;t.NetAccySales+=Number(r.accy_net)||0;t.AccyGP+=Number(r.accy_gp)||0;
  t.DeviceUnits+=Number(r.device_units)||0;t.DeviceReturns+=Number(r.device_returns)||0;
  t.DeviceRev+=(Number(r.device_net)||0)+(Number(r.device_return_net)||0);
  t.DeviceGP+=(Number(r.device_gp)||0)+(Number(r.device_return_gp)||0);
  t.DeviceAttach+=(Number(r.device_attach)||0)-(Number(r.device_attach_return)||0);
  t.ServiceNet+=Number(r.service_net)||0;
  const sv=r.services||{};for(const k in sv){t.services[k]=(t.services[k]||0)+(Number(sv[k])||0);}
}
function tipFor(name,tips){let total=0;for(const store in tips){const d=tips[store]||{},pool=+d.pool||0,hrs=d.hours||{};if(!pool)continue;
  let totHrs=0;for(const nm in hrs){const h=hrs[nm]||{};totHrs+=(+h.pp1||0)+(+h.pp2||0);}
  const hh=hrs[name]||{},my=(+hh.pp1||0)+(+hh.pp2||0);if(totHrs>0&&my>0)total+=(my/totHrs)*pool;}
  return total;}
async function loadHistoryFor(e){
  if(SNAPS_FOR===String(e.id)&&SNAPS){renderHistory(e);return;}
  const n=new Date(),y=n.getFullYear(),mo=n.getMonth();
  const mStart=y+'-'+String(mo+1).padStart(2,'0')+'-01', mEnd=todayISO(), period=y+'-'+String(mo+1).padStart(2,'0');
  const [snapRes,salesRes,tipRes,goalRes]=await Promise.all([
    sb.from('commission_snapshots').select('month,totals,tips,total').eq('staff_id',e.id).order('month',{ascending:false}).limit(24),
    e.archived?Promise.resolve({data:[]}):sb.from('commission_sales').select('*').eq('staff_id',e.id).gte('biz_date',mStart).lte('biz_date',mEnd),
    e.archived?Promise.resolve({data:[]}):sb.from('commission_tips').select('*').eq('period',period),
    e.archived?Promise.resolve({data:[]}):sb.from('commission_goals').select('accy_goal').eq('staff_id',e.id).eq('month',period+'-01'),
  ]);
  SNAPS=(snapRes.error?[]:(snapRes.data||[]));
  SNAPS_FOR=String(e.id);
  LIVE=null;
  const E=window.CommissionEngine;
  const hasArchive=SNAPS.some(r=>isoOf(r.month).slice(0,7)===period);
  if(E&&!e.archived&&!hasArchive){
    try{
      const ros=CROSTER[e.id]||{};
      const roleKey=ROLE_ALIAS[e.roleLevel]||e.roleLevel;
      const role=RBROLES.filter(r=>r.key===roleKey)[0];
      const roleO=(role&&CROLEOVER[role.id])?CROLEOVER[role.id]:null;
      const earns=E.resolveEarns(roleEarnsFor(e.roleLevel),ros.earns_override);
      const effRules=E.mergeRules(CRULES[e.homeStore],roleO&&roleO.rules,ros.rules_override);
      const effRates=E.mergeRates(ratesBase(),CSTORERATES[e.homeStore],roleO&&roleO.rates,ros.rates_override);
      const mgRow=(goalRes.data&&goalRes.data[0])||null;
      const goal=(mgRow&&mgRow.accy_goal!=null)?(Number(mgRow.accy_goal)||0):(Number(ros.accy_goal)||0);
      const totals=blankTotals();(salesRes.data||[]).forEach(r=>addInto(totals,r));
      const c=E.computeCommission(totals,{accessoryGoal:goal,accDeviceUnits:totals.DeviceAttach,rates:effRates,earns:earns,rules:effRules});
      const tips={};(tipRes.data||[]).forEach(x=>{tips[x.store]={hours:x.hours||{},pool:Number(x.pool)||0};});
      LIVE={month:period,totals:totals,commission:c.total,tips:tipFor(e.name,tips)};
    }catch(err){LIVE=null;}
  }
  renderHistory(e);
}
function renderHistory(e){
  const host=$('#commHist');if(!host)return;
  const rows=[];
  const mLabel=iso=>{const p=isoOf(iso).split('-');return MONTHFULL[(+p[1])-1]+' '+p[0];};
  const money2=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const attach=t=>{const tk=Number(t&&t.Tickets)||0,au=Number(t&&t.AccyUnits)||0;return tk>0?Math.round(au/tk*100)+'%':'—';};
  if(LIVE)rows.push({label:mLabel(LIVE.month+'-01'),sub:'month to date',accy:LIVE.totals.NetAccySales,att:attach(LIVE.totals),comm:LIVE.commission,tips:LIVE.tips,live:true});
  SNAPS.forEach(r=>{const t=r.totals||{};
    rows.push({label:mLabel(r.month),sub:'',accy:Number(t.NetAccySales)||0,att:attach(t),comm:Number(r.total)||0,tips:Number(r.tips)||0,live:false});});
  if(!rows.length){host.innerHTML='<div class="tm-empty">No commission history yet — months appear here once payroll archives them.</div>';return;}
  const trs=rows.map(r=>'<tr>'
    +'<td><span style="font-family:Nunito,sans-serif;font-weight:800">'+esc(r.label)+'</span>'+(r.sub?'<span style="font-size:.7rem;color:var(--grey);font-weight:700"> · '+esc(r.sub)+'</span>':'')+'</td>'

/* ----- Time & PTO tabs (QuickBooks Time) ----- */
function qbtFor(e){return QBU.filter(u=>String(u.staff_id)===String(e.id))[0]||null;}
function toHrs(sec){return Math.round((sec/3600)*10)/10;}
function dowLabel(iso){const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+fmt(iso).replace(/,\s*\d{4}$/,'');}
function notLinkedHtml(what){return '<div class="work-pad"><div class="empty-sm">Not linked to QuickBooks Time — no '+esc(what)+' to show.<br>Link them with the pencil (edit) on their card.</div></div>';}
function timeHtml(e){
  if(!qbtFor(e))return notLinkedHtml('time entries');
  const rows=(TSBYSTAFF[e.id]||[]).slice();
  if(!rows.length)return '<div class="work-pad"><div class="empty-sm">No clocked time in the last 6 weeks.</div></div>';
  const wk={};
  rows.forEach(t=>{const d=new Date(t.biz_date+'T00:00:00');const sun=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());const k=isoOf(sun);
    (wk[k]||(wk[k]={sec:0,days:[]}));wk[k].sec+=Math.max(0,(+t.seconds||0)-(+t.off_seconds||0));wk[k].days.push(t);});
  let html='<div class="work-pad">';
  Object.keys(wk).sort().reverse().forEach(k=>{const W=wk[k];const sun=new Date(k+'T00:00:00');const sat=isoOf(new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+6));
    const tot=toHrs(W.sec),ot=Math.max(0,Math.round((tot-40)*10)/10);
    html+='<div class="tcard"><div class="tcard-hd"><b>'+fmt(k).replace(/,\s*\d{4}$/,'')+' – '+fmt(sat)+'</b><span>'+tot.toFixed(1)+' hrs'+(ot>0?' · <span style="color:var(--red)">'+ot+' OT</span>':'')+'</span></div>';
    W.days.sort((a,b)=>a.biz_date<b.biz_date?-1:1).forEach(d=>{html+='<div class="trow"><span>'+esc(dowLabel(d.biz_date))+'</span><span>'+toHrs(Math.max(0,(+d.seconds||0)-(+d.off_seconds||0))).toFixed(1)+' hrs'+(d.on_the_clock?'<span class="p-live">● on clock</span>':'')+'</span></div>';});
    html+='</div>';});
  return html+'</div>';
}
function toStatusStyle(st){return st==='approved'?'color:var(--green);background:#E9F6EE':st==='denied'?'color:var(--red);background:#FBE9EA':'color:var(--amber);background:#FCF3E3';}
function ptoHtml(e){
  const u=qbtFor(e);
  const bal=(u&&u.raw&&u.raw.pto_balances)||null, items=[];
  if(bal&&typeof bal==='object')Object.keys(bal).forEach(jc=>{const j=JOBCODES[jc];if(j&&j.type==='pto')items.push({name:j.name,sec:+bal[jc]||0});});
  items.sort((a,b)=>b.sec-a.sec);
  let html='<div class="work-pad">';
  // ── balances (QuickBooks Time) ──
  html+='<div class="sect-lbl">Balances</div>';
  if(!u)html+='<div class="empty-sm" style="text-align:left;padding:6px 2px 4px">Not linked to QuickBooks Time — no balances to show.</div>';
  else if(!items.length)html+='<div class="empty-sm" style="text-align:left;padding:6px 2px 4px">No PTO balances in QuickBooks Time.</div>';
  else{ html+='<div class="ptogrid">';
    items.forEach(it=>{html+='<div class="ptocard"><div class="pv">'+toHrs(it.sec).toFixed(1)+'</div><div class="pl">'+esc(it.name)+'</div><div class="ps">hrs available</div></div>';});

  // ── time-off requests (submitted in My Time) ──
  const reqs=(e.timeoff||[]).slice().sort((a,b)=>a.start<b.start?1:-1);
  html+='<div class="sect-lbl" style="margin-top:22px">Time-off requests</div>';
  if(!reqs.length)html+='<div class="empty-sm" style="text-align:left;padding:6px 2px">No requests submitted.</div>';
  else{ html+='<div class="toreqs">';
    reqs.forEach(r=>{const range=r.start===r.end?fmt(r.start):(fmt(r.start)+' – '+fmt(r.end));
      const days=reqDays(r), hrs=days*8;
      /* approval is owner-only (site rule: no self-approval; timeoff.approve defaults to owner) */
      const mayDecide=AUTH&&AUTH.role==='owner';
      const act=r.status==='pending'
        ? (mayDecide?'<span class="toact"><button class="tobtn deny" data-deny="'+r.id+'">Deny</button><button class="tobtn appr" data-appr="'+r.id+'">Approve</button></span>'
                    :'<span class="topill" style="'+toStatusStyle(r.status)+'">Pending</span>')
        : '<span class="topill" style="'+toStatusStyle(r.status)+'">'+esc(r.status.charAt(0).toUpperCase()+r.status.slice(1))+'</span>'+(mayDecide?'<button class="toreopen" data-reopen="'+r.id+'" title="Reopen as pending">Reopen</button>':'');
      html+='<div class="toreq"><div style="flex:1;min-width:0"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:.86rem">'+esc(range)+'</div><div style="font-family:Nunito Sans,sans-serif;font-weight:700;font-size:.72rem;color:var(--grey)">'+esc(r.type)+(r.note?(' · '+esc(r.note)):'')+'</div></div>'
        +'<span class="tohrs">'+hrs+' hrs<span class="sub">'+days+(days===1?' day':' days')+'</span></span>'+act+'</div>';});
    html+='</div><div class="empty-sm" style="text-align:left;padding:9px 2px 0;font-size:.72rem">Hours estimated at 8 per day.</div>'; }
  return html+'</div>';
}
/* inclusive calendar-day span of a request (start & end are YYYY-MM-DD) */
function reqDays(r){const s=new Date(r.start+'T00:00:00'),e=new Date(r.end+'T00:00:00');if(isNaN(s)||isNaN(e))return 1;const d=Math.round((e-s)/86400000)+1;return d<1?1:d;}
/* approve / deny / reopen a request — same write path as Schedule Admin (RLS: is_admin(store) or self) */
async function decideRequest(id,status){
  if(!(AUTH&&AUTH.role==='owner'))return;               // approval is owner-only
  let req=null; ALL.forEach(e=>{const r=(e.timeoff||[]).filter(x=>x.id===id)[0]; if(r)req=r;});
  if(!req)return;
  const prev=req.status; req.status=status; render();   // optimistic
  const patch=status==='pending'?{status:status,decided_by:null,decided_at:null}
    :{status:status,decided_by:(AUTH&&AUTH.id)||null,decided_at:new Date().toISOString()};
  const res=await sb.from('time_off_requests').update(patch).eq('id',id).select('id');
  if(res.error||!(res.data&&res.data.length)){          // RLS-filtered 0-row updates return no error
    req.status=prev;render();toast((res.error&&res.error.message)||'Not permitted',true);}
  else toast(status==='approved'?'Approved':status==='denied'?'Denied':'Reopened');
}

function wireDocsTab(e){
  const w=$('#work');

async function openDoc(d,btn){
  btn.disabled=true;
  const r=await sb.storage.from('hr-private').createSignedUrl(d.file_path,120);
  btn.disabled=false;
  if(r.error||!r.data){toast('Could not open that file: '+((r.error&&r.error.message)||'missing'),true);return;}
  window.open(r.data.signedUrl,'_blank');
}
async function uploadDoc(e,file){
  if(file.size>20*1024*1024){toast('That file is over 20 MB.',true);return;}
  const ext=(file.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);
  const path='staff/'+e.id+'/'+(crypto.randomUUID?crypto.randomUUID():String(Date.now()))+'.'+ext;
  toast('Uploading…');
  const up=await sb.storage.from('hr-private').upload(path,file,{contentType:file.type||'application/octet-stream'});
  if(up.error){toast('Upload failed: '+up.error.message,true);return;}
  const ins=await sb.from('staff_documents').insert({
    staff_id:e.id,kind:'upload',title:file.name.replace(/\.[^.]+$/,''),file_path:path,
    file_name:file.name,mime:file.type||null,file_size:file.size,
    uploaded_by:(AUTH&&AUTH.id)||null,uploaded_by_name:(AUTH&&AUTH.name)||null});
  if(ins.error){await sb.storage.from('hr-private').remove([path]);toast('Could not file that: '+ins.error.message,true);return;}
  toast('Filed');await load();
}
async function removeDoc(d){
  if(!confirm('Remove "'+d.title+'" from this employee\'s file?'))return;
  const r=await sb.from('staff_documents').update({deleted:true}).eq('id',d.id);
  if(r.error){toast(r.error.message,true);return;}
  toast('Removed');await load();
}
/* Backfill for anyone converted before documents were filed automatically. */
async function refileDocs(e,btn){
  btn.disabled=true;btn.textContent='Filing…';
  try{
    const r=await fetch(SB_URL+'/functions/v1/intake',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+(await sb.auth.getSession()).data.session.access_token},
      body:JSON.stringify({action:'archive_docs',staff_id:e.id})});
    const j=await r.json().catch(()=>({}));
    if(!(r.status===200&&j.ok)){toast(j.error==='not_found'?'No signed paperwork on file for them.':(j.error||'Failed'),true);return;}
    toast(j.filed?('Filed '+j.filed+' document'+(j.filed===1?'':'s')):'Nothing new to file'+(j.errors&&j.errors.length?' — '+j.errors[0]:''));
    await load();
  }catch(err){toast('Failed — '+(err.message||'error'),true);}
  finally{btn.disabled=false;btn.textContent='Re-file signed paperwork';}
}

/* ===== write actions (Phase B): editors -> Supabase ===== */
function modal(html){const m=$('#modal');m.innerHTML='<div class="mback" data-close></div><div class="mcard">'+html+'</div>';m.classList.add('show');}
function closeModal(){const m=$('#modal');m.classList.remove('show');m.innerHTML='';}
function field(label,inner){return '<div class="fblock"><label class="flbl">'+label+'</label>'+inner+'</div>';}
function optList(arr,cur){return arr.map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>').join('');}
const TYPES=[['observation','Observation'],['incident','Incident'],['conversation','Conversation']];
const CATS=[['coaching','Coaching'],['performance','Performance'],['attendance','Attendance'],['positive','Positive'],['general','General']];
const STATS=[['draft','Draft'],['active','Active'],['under-review','Under Review'],['closed-met','Closed — Met'],['closed-extended','Closed — Extended'],['closed-terminated','Closed — Terminated']];

function handleAct(a){
  if(a==='back'){backToList();return;}
  const e=selEmp();if(!e)return;
  const curEntry=()=>e.entries.find(x=>x.id===S.entryId);
  const curPip=()=>e.pips.find(p=>p.id===S.pipId);
  if(a==='export')exportEmployee(e);
  else if(a==='reinstate')reinstateFromProfile(e);
  else if(a==='edit-term')openTerminateModal(e,true);
  else if(a==='new-entry')openEntryEditor(e,null);
  else if(a==='edit'){const x=curEntry();if(x)openEntryEditor(e,x);}
  else if(a==='delete'){const x=curEntry();if(x)confirmDeleteEntry(e,x);}
  else if(a==='discuss'){const x=curEntry();if(x)logDiscussion(x);}
  else if(a==='new-pip')openPipEditor(e,null);
  else if(a==='edit-pip'){const p=curPip();if(p)openPipEditor(e,p);}
  else if(a==='add-checkin'){const p=curPip();if(p)openCheckinEditor(p);}
  else if(a==='download'){if(S.tab==='pips'){const p=curPip();if(p)downloadPip(e,p);}else{const x=curEntry();if(x)downloadEntry(e,x);}}
}

  const ta=(id,label,val)=>field(label,'<textarea id="'+id+'" class="fin">'+esc(val||'')+'</textarea>');
  modal(
    '<h2>'+(isNew?'New entry':'Edit entry')+'</h2><div class="msub">'+esc(e.name)+' · '+esc(e.role)+'</div>'
    +'<div class="frow">'+field('Type','<select id="f_type" class="fin">'+optList(TYPES,x.type||'observation')+'</select>')
      +field('Category','<select id="f_cat" class="fin">'+optList(CATS,x.category||'general')+'</select>')+'</div>'
    +field('Subject','<input id="f_subject" class="fin" value="'+esc(x.subject||'')+'">')
    +'<div class="frow">'+field('Date logged','<input id="f_date" type="date" class="fin" value="'+esc(x.date||todayISO())+'">')
      +field('Incident date','<input id="f_inc" type="date" class="fin" value="'+esc(x.incidentDate||x.date||todayISO())+'">')+'</div>'

    +ta('f_issue','Issue / What Happened',sec.issue)+ta('f_cause','Root Cause',sec.cause)
    +ta('f_coaching','Coaching Provided',sec.coaching)+ta('f_response','Employee Response',sec.response)
    +ta('f_actions','Action Items',sec.actions)
    +'<div class="mactions"><button class="btn-o" data-close>Cancel</button><button class="btn-red" id="f_save">'+(isNew?'Create entry':'Save changes')+'</button></div>'

  $('#f_disc').onchange=()=>{$('#f_discdate').disabled=!$('#f_disc').checked;};

async function saveEntry(e,id){
  const v=i=>$('#'+i);const sec={};
  [['issue','f_issue'],['cause','f_cause'],['coaching','f_coaching'],['response','f_response'],['actions','f_actions']]
    .forEach(([k,fid])=>{const t=v(fid).value.trim();if(t)sec[k]=t;});
  const rec={entry_type:v('f_type').value,category:v('f_cat').value,subject:v('f_subject').value.trim()||'(untitled)',
    entry_date:v('f_date').value||todayISO(),incident_date:v('f_inc').value||v('f_date').value||todayISO(),
    discussed:v('f_disc').checked,discussed_at:v('f_disc').checked?(v('f_discdate').value||todayISO()):null,
    sections:sec};
  v('f_save').disabled=true;
  let res,newId=id;
  if(id)res=await sb.from('staff_entries').update(rec).eq('id',id);
  else{rec.staff_id=e.id;rec.created_by=AUTH?AUTH.id:null;const r=await sb.from('staff_entries').insert(rec).select('id').single();res=r;newId=r.data&&r.data.id;}
  if(res.error){v('f_save').disabled=false;toast(res.error.message,true);return;}
  closeModal();toast(id?'Entry updated':'Entry created');if(newId)S.entryId=newId;await load();
}
function confirmDeleteEntry(e,x){
  modal('<h2>Delete entry?</h2><div class="msub">'+esc(x.subject)+'</div>'
    +'<p class="warn">This permanently removes the entry for '+esc(e.name)+'. This can’t be undone.</p>'
    +'<div class="mactions"><button class="btn-o" data-close>Cancel</button><button class="btn-red" id="f_del">Delete</button></div>');
  $('#f_del').onclick=async()=>{$('#f_del').disabled=true;const r=await sb.from('staff_entries').delete().eq('id',x.id);
    if(r.error){$('#f_del').disabled=false;toast(r.error.message,true);return;}closeModal();toast('Entry deleted');S.entryId=null;await load();};
}
async function logDiscussion(x){

  v('p_save').disabled=true;
  let res,newId=p&&p.id;
