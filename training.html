<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#F3F9FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--row:#F0F1F4;--green:#2E9E5B;
--greend:#0f6e56;--greenbg:#E1F5EE;--amberbg:#FBF1DC;--ambert:#7A5B10;--redbg:#FDEBEC;--card:0 1px 3px rgba(45,45,59,.05)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
.wrap{max-width:880px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:-.3px;margin:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.hd svg{flex:none}
.sub{color:var(--dark-grey);font-size:.85rem;font-weight:700;margin:2px 0 18px}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.9px;color:var(--grey);margin:0 0 8px}
.sect{margin-bottom:18px}
/* progress bar */
.pbar{height:7px;border-radius:999px;background:#ECEDF1;overflow:hidden;flex:none}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pbar>i.red{background:var(--red)}.pbar>i.green{background:var(--green)}
.pcount{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;color:var(--dark-grey);white-space:nowrap}
/* due chip */
.due{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;
padding:3px 9px;border-radius:999px;background:var(--bluebg);color:var(--blued);white-space:nowrap}
.due.past{background:var(--redbg);color:var(--red)}
/* buttons */
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;padding:7px 13px;border:none;border-radius:9px;
background:var(--red);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:#fff;color:var(--dark);border:1.5px solid var(--border)}
.btn.alt:hover{border-color:var(--blue);color:var(--blued);filter:none}
/* 10a — module summary cards */
.mcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);
padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mcard .nm{font-family:'Nunito',sans-serif;font-weight:900;font-size:.92rem}
.mcard .pr{display:flex;align-items:center;gap:8px;margin-top:6px}
.mcard .pbar{width:130px}
/* 10a — assigned training list */
.alist{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);overflow:hidden}
.arow{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--row);cursor:pointer}
.arow:last-child{border-bottom:none}
.arow:hover{background:#F8FAFD}
.arow .tile{width:30px;height:30px;border-radius:9px;background:#F3F6FA;color:var(--dark-grey);display:flex;align-items:center;justify-content:center;flex:none}
.arow .t{flex:1;min-width:0}
.arow .ttl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .sub2{font-size:.7rem;font-weight:700;color:var(--grey);margin-top:1px}
/* 10a — completed */
.clist{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.crow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--row)}
.crow:last-child{border-bottom:none}
.crow .ck{width:20px;height:20px;border-radius:50%;background:var(--greenbg);color:var(--greend);display:flex;align-items:center;justify-content:center;flex:none}
.crow .t{flex:1;min-width:0;font-size:.82rem;font-weight:700;color:var(--grey2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .d{font-size:.7rem;font-weight:700;color:var(--grey);white-space:nowrap}
/* 9b — track module card */
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);margin-bottom:14px;overflow:hidden}
.tcard-hd{display:flex;align-items:center;gap:10px;padding:12px 16px}
.tcard-hd .nm{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem}
.tcard-hd .pbar{width:100px;margin-left:auto}
.secthd{display:flex;align-items:center;gap:10px;background:#F8F8F9;border-top:1px solid var(--row);padding:7px 16px}
.secthd .nm{font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--grey2)}
.secthd .rule{flex:1;height:1px;background:#ECEDF1}
.secthd .ct{font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--grey)}
.irow{display:flex;align-items:center;gap:11px;padding:10px 16px;border-top:1px solid var(--row);border-left:3px solid transparent}
.irow.next{border-left-color:var(--blue);background:var(--bluebg)}
.irow.lock{opacity:.55}
.irow .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#F0F1F4;color:var(--grey2)}
.irow.done .ic{background:var(--greenbg);color:var(--greend)}
.irow.next .ic{background:var(--blue);color:#fff}
.irow .t{flex:1;min-width:0}
.irow .ttl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .meta{font-size:.7rem;font-weight:700;color:var(--grey);margin-top:1px}
.chip{display:inline-flex;align-items:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.64rem;
padding:3px 9px;border-radius:999px;background:var(--amberbg);color:var(--ambert);white-space:nowrap}
.lockbanner{padding:12px 16px;border-top:1px solid var(--row);font-size:.78rem;font-weight:700;color:var(--grey)}
.foot{font-size:.72rem;font-weight:700;color:var(--grey);margin-top:4px}
.backlnk{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;
color:var(--dark-grey);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px}
.backlnk:hover{color:var(--blued)}
/* in-page article reader — keeps employees inside Training */
.artcard{background:#fff;border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:12px;
box-shadow:var(--card);padding:24px 26px;max-width:820px}
.artcard h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3rem;margin:0 0 4px}
.artmeta{font-size:.76rem;font-weight:700;color:var(--grey);margin-bottom:16px}
.artbody{font-size:.95rem;line-height:1.65;color:var(--dark-grey)}
/* A section heading has to out-weigh the body text, or a long procedure runs
   together and authors start hand-spacing it with empty '#' lines. The air
   above each level is what separates sections — not a manual gap. */
.artbody h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.28rem;line-height:1.32;color:var(--dark);margin:40px 0 12px}
.artbody h4{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.04rem;line-height:1.32;color:var(--dark);margin:28px 0 8px}
.artbody h5{font-family:'Nunito',sans-serif;font-weight:800;font-size:.92rem;line-height:1.32;color:var(--dark);margin:20px 0 6px}
.artbody h6{font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;line-height:1.32;color:var(--dark-grey);margin:16px 0 5px}
.artbody>h3:first-child,.artbody>h4:first-child{margin-top:4px}
.artbody h3+h4,.artbody h4+h5,.artbody h5+h6{margin-top:14px}   /* sub-head straight under its section */
.artbody h3:empty,.artbody h4:empty,.artbody h5:empty,.artbody h6:empty{margin:0;height:18px}   /* a bare "#" spacer line */
.artbody img{max-width:100%;border-radius:10px;margin:8px 0}
.artbody code{background:var(--light-grey);border-radius:5px;padding:1px 6px;font-size:.85em}
.artbody ul,.artbody ol{margin:6px 0;padding-left:22px}
.artbody ol ol{list-style-type:lower-alpha}
.artbody ol ol ol{list-style-type:lower-roman}
.artbody ul ul{list-style-type:circle}
.artbody li>ul,.artbody li>ol{margin:4px 0}
.artbody hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.artbody .callout{display:flex;gap:12px;background:#FDF6E7;border:1.5px solid #F2DFAE;border-radius:10px;padding:13px 16px;margin:10px 0}
.artbody .callout .ci{font-size:1rem;flex:none}
.artbody .callout .ct{font-size:.85rem;font-weight:700;color:#7A5A08;line-height:1.55}
.artfoot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--row);margin-top:20px;padding-top:16px;flex-wrap:wrap}
.artfoot .note{font-size:.72rem;font-weight:700;color:var(--grey)}
/* 9e — zero state card */
.zero{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);
padding:22px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:150px}
.zero .tile{width:38px;height:38px;border-radius:11px;background:#F3F6FA;color:var(--grey2);display:flex;align-items:center;justify-content:center}
.zero .ttl{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;color:var(--dark)}
.zero .bd{font-size:.8rem;font-weight:600;color:var(--grey2);line-height:1.55}
.zero .cta{margin-top:auto;font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--blue);text-decoration:none}
.empty{color:var(--grey);font-weight:700;font-size:.85rem;padding:18px 0}
.toast{position:fixed;bottom:calc(24px + var(--cpr-bb-h,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
padding:12px 18px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;
opacity:0;pointer-events:none;transition:opacity .18s;z-index:900}
.toast.show{opacity:1}.toast.err{background:var(--red)}
@media(max-width:600px){.mcard{flex-wrap:wrap}.mcard .pr .pbar{width:90px}}
</style>
</head>
<body>
<div class="wrap" id="page"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="assets/kb-markup.js"></script>
<script src="assets/pin-gate.js"></script>
<script src="assets/nav.js" data-section="hub"></script>
<script src="assets/onboarding-track.js"></script>
<script type="module">
import { createClient } from "/assets/supabase-js.js";
const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
const sb=createClient(SB_URL,ANON);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m,err){ const t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),4200); }

/* Lucide chrome icons (inline; stroke = currentColor) */
const LI={
 grad:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>',
 book:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
 task:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/></svg>',
 user:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
 lock:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
 check:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
 cal:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>'};
const ic=(n,s)=>LI[n].replace(/\{s\}/g,s||14);

/* ---------- auth ---------- */
let AUTH=null,BOOTED=false;
async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){ BOOTED=true; AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role}; boot(); }
}
sb.auth.onAuthStateChange((_e,sess)=>{ if(sess) resolveMe(sess); });
(async()=>{ try{ const s=(await sb.auth.getSession()).data.session; if(s) resolveMe(s); }catch(e){} })();

/* ---------- state ---------- */
let MODULES=[],SECTIONS=[],ARTS=[],STEPS=[],ASSIGNS=[],READS={},QUIZ={},MYATT={},SDONE={};
let VIEW='home',READSLUG=null,BACKVIEW='home';
function parseHashView(){
  const h=location.hash.replace('#','');
  if(h==='track'){VIEW='track';READSLUG=null;}
  else if(h.slice(0,5)==='read='){VIEW='read';READSLUG=h.slice(5);}
  else{VIEW='home';READSLUG=null;}
}
parseHashView();
/* light markup → safe HTML (same family as knowledge.html's renderer) */
/* light markup → safe HTML: the shared KB renderer (assets/kb-markup.js), so a
   training article reads exactly like it does in the Knowledge Base */
function render(text){ return window.CPRMarkup.render(text); }
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDue(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).replace(',','');}
function fmtShort(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';return ('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2);}
function readMins(body){const w=String(body||'').split(/\s+/).length;return Math.max(1,Math.round(w/200));}

async function loadAll(){
  const [mo,se,ar,st,as,rd,qz,at,sd]=await Promise.all([
    sb.from('onboarding_modules').select('*').eq('active',true).order('sort'),
    sb.from('onboarding_sections').select('*'),
    sb.from('kb_articles').select('id,slug,title,summary,body,status,min_role,require_ack,emoji,icon_url,module_id,section_id,sort_order,category_id,updated_at,version').eq('status','published'),
    sb.from('onboarding_steps').select('*').eq('active',true),
    sb.from('onboarding_assignments').select('*').eq('staff_id',AUTH.id),
    sb.from('kb_reads').select('*').eq('staff_id',AUTH.id),
    sb.from('kb_quizzes').select('id,article_id,pass_pct,active,kb_quiz_questions(id)').eq('active',true),
    sb.from('kb_quiz_attempts').select('quiz_id,score_pct,passed').eq('staff_id',AUTH.id),
    sb.from('onboarding_step_done').select('*').eq('staff_id',AUTH.id),
  ]);
  MODULES=mo.data||[];SECTIONS=se.data||[];ARTS=ar.data||[];STEPS=st.data||[];
  ASSIGNS=(as.data||[]).filter(a=>a.module_id!=null);
  READS={};(rd.data||[]).forEach(r=>{READS[r.article_id]=r;});
  QUIZ={};(qz.data||[]).forEach(q=>{QUIZ[q.article_id]={id:q.id,pass_pct:q.pass_pct,nq:(q.kb_quiz_questions||[]).length};});
  MYATT={};(at.data||[]).forEach(a=>{const c=MYATT[a.quiz_id]||{best:0,passed:false};c.best=Math.max(c.best,a.score_pct||0);c.passed=c.passed||!!a.passed;MYATT[a.quiz_id]=c;});
  SDONE={};(sd.data||[]).forEach(r=>{SDONE[r.step_id]=r;});
}
function buildTrack(){
  /* back-office steps are manager-only — the employee never sees them and
     they never block the employee's sequential unlock */
  return CPRTrack.build({modules:MODULES,sections:SECTIONS,articles:ARTS,
    steps:STEPS.filter(s=>s.who!=='backoffice'),
    assignments:ASSIGNS,reads:READS,quizzes:QUIZ,attempts:MYATT,stepDone:SDONE,today:todayISO()});
}
/* assigned training = required published reads outside any module, not acked */
function assignedTraining(){
  return ARTS.filter(a=>a.require_ack&&!a.module_id).map(a=>{
    const r=READS[a.id];
    return {a,read:!!(r&&r.first_read_at),acked:!!(r&&r.acknowledged_at)};
  }).filter(x=>!x.acked);
}
function completedItems(){
  const out=[];
  ARTS.forEach(a=>{const r=READS[a.id];if(r&&r.acknowledged_at)out.push({t:a.title,d:r.acknowledged_at,k:'read'});});
  STEPS.filter(s=>s.who!=='backoffice').forEach(s=>{const r=SDONE[s.id];if(r)out.push({t:s.title,d:r.done_at,k:'done'});});
  out.sort((x,y)=>String(y.d).localeCompare(String(x.d)));
  return out.slice(0,25);
}

/* ---------- render ---------- */
function dueChip(iso,past){
  if(!iso)return'';
  return '<span class="due'+(past?' past':'')+'">'+ic('cal',10)+' '+(past?'Was due ':'Due ')+esc(fmtDue(iso))+'</span>';
}
function header(){
  return '<div class="hd">'+ic('grad',24)+'<h1>Training</h1></div>'
    +'<div class="sub">Your onboarding, assigned reading &amp; refreshers</div>';
}
function drawHome(){
  const mods=buildTrack();
  const activeMods=mods.filter(m=>!m.complete);
  const at=assignedTraining();
  const comp=completedItems();
  let h=header();

  h+='<div class="sect"><div class="eyebrow">My onboarding</div>';
  if(!ASSIGNS.length){
    h+='<div class="zero"><span class="tile">'+ic('grad',19)+'</span>'
      +'<div class="ttl">Nothing assigned yet</div>'
      +'<div class="bd">Your manager hasn’t assigned onboarding. Browse the Knowledge Base in the meantime.</div>'
      +'<a class="cta" href="knowledge.html">Browse all articles ›</a></div>';
  }else if(!activeMods.length){
    h+='<div class="empty">All onboarding modules complete — nice work. They’re in Completed below.</div>';
  }else{
    activeMods.forEach(mx=>{
      const pct=mx.total?Math.round(mx.done/mx.total*100):0;
      h+='<div class="mcard"><div style="flex:1;min-width:0"><div class="nm">'+esc(mx.mod.name)+'</div>'
        +'<div class="pr"><span class="pbar"><i class="'+(mx.pastDue?'red':(pct===100?'green':''))+'" style="width:'+pct+'%"></i></span>'
        +'<span class="pcount">'+mx.done+' / '+mx.total+'</span></div></div>'
        +dueChip(mx.due,mx.pastDue)
        +'<button class="btn" data-continue>Continue ›</button></div>';
    });
  }
  h+='</div>';

  h+='<div class="sect"><div class="eyebrow">Assigned training</div>';
  if(!at.length){
    h+='<div class="empty">Nothing assigned right now.</div>';
  }else{
    h+='<div class="alist">'+at.map(x=>{
      const reread=x.read&&!x.acked&&(x.a.version||1)>1;
      const sub=reread?('updated article · re-read required')
        :(readMins(x.a.body)+' min · required reading');
      return '<div class="arow" data-art="'+esc(x.a.slug)+'"><span class="tile">'+ic('book',14)+'</span>'
        +'<div class="t"><div class="ttl">'+(reread?'New: ':'')+esc(x.a.title)+'</div><div class="sub2">'+esc(sub)+'</div></div>'
        +'<button class="btn alt" data-art="'+esc(x.a.slug)+'">Read ›</button></div>';
    }).join('')+'</div>';
  }
  h+='</div>';

  h+='<div class="sect"><div class="eyebrow">Completed</div>';
  if(!comp.length)h+='<div class="empty">Finished reading and tasks land here.</div>';
  else h+='<div class="clist">'+comp.map(c=>'<div class="crow"><span class="ck">'+ic('check',11)+'</span>'
    +'<span class="t">'+esc(c.t)+'</span><span class="d">'+esc(c.k)+' '+esc(fmtShort(c.d))+'</span></div>').join('')+'</div>';
  h+='</div>';

  $('#page').innerHTML=h;
  document.querySelectorAll('[data-continue]').forEach(b=>b.onclick=()=>{VIEW='track';setHash('track');draw();});
  document.querySelectorAll('[data-art]').forEach(el=>el.onclick=e=>{e.stopPropagation();openRead(el.getAttribute('data-art'),'home');});
}
function drawTrack(){
  const mods=buildTrack();
  let h='<button class="backlnk" id="backHome">‹ Training</button>'+ '<div class="hd">'+ic('grad',24)+'<h1>My Onboarding</h1></div><div class="sub"></div>';
  if(!mods.length){
    h+='<div class="zero"><span class="tile">'+ic('grad',19)+'</span><div class="ttl">Nothing assigned yet</div>'
      +'<div class="bd">Your manager hasn’t assigned onboarding. Browse the Knowledge Base in the meantime.</div>'
      +'<a class="cta" href="knowledge.html">Browse all articles ›</a></div>';
  }
  mods.forEach(mx=>{
    const pct=mx.total?Math.round(mx.done/mx.total*100):0;
    h+='<div class="tcard"><div class="tcard-hd"><span class="nm">'+esc(mx.mod.name)+'</span>'
      +dueChip(mx.due,mx.pastDue)
      +'<span class="pbar"><i class="'+(mx.pastDue?'red':(pct===100?'green':''))+'" style="width:'+pct+'%"></i></span>'
      +'<span class="pcount">'+mx.done+' / '+mx.total+'</span></div>';
    if(mx.lockedModule){
      h+='<div class="lockbanner">'+ic('lock',12)+' Unlocks when the modules before it are complete.</div></div>';
      return;
    }
    mx.rows.forEach(r=>{
      if(r.type==='section'){
        h+='<div class="secthd"><span class="nm">'+esc(r.sec.name)+'</span><span class="rule"></span><span class="ct">'+r.done+' / '+r.total+'</span></div>';
        return;
      }
      const it=r.it,st=r.state;
      const kindIc=it.kind==='a'?'book':(it.s.who==='manager'?'user':'task');
      const icon=st==='done'?ic('check',12):(st==='lock'?ic('lock',12):ic(kindIc,13));
      let title,meta,chips='',act='';
      if(it.kind==='a'){
        title=it.a.title;meta=readMins(it.a.body)+' min · article';
        if(st==='next')act='<button class="btn" data-open="'+esc(it.a.slug)+'">Start reading</button>';
      }else{
        title=it.s.title;
        meta='task · '+(it.s.who==='manager'?'with your manager':'you');
        if(st==='next'&&it.s.who==='manager')chips='<span class="chip">Waiting on your manager</span>';
        if(st==='next'&&it.s.who!=='manager')act='<button class="btn" data-step="'+it.s.id+'">Mark done ✓</button>'
          +(it.s.link_url?' <button class="btn alt" data-go="'+esc(it.s.link_url)+'">Open</button>':'');
      }
      h+='<div class="irow '+st+'"><span class="ic">'+icon+'</span>'
        +'<div class="t"><div class="ttl">'+esc(title)+'</div><div class="meta">'+esc(meta)+'</div></div>'
        +chips+act+'</div>';
    });
    h+='</div>';
  });
  if(mods.length)h+='<div class="foot">Sections are presentation only — unlock stays sequential through them. Past-due turns the chip and bar red; nothing locks.</div>';
  $('#page').innerHTML=h;
  $('#backHome').onclick=()=>{VIEW='home';setHash('');draw();};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{openRead(b.getAttribute('data-open'),'track');});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.href=b.getAttribute('data-go');});
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r=await sb.from('onboarding_step_done').insert({step_id:+b.getAttribute('data-step'),staff_id:AUTH.id,done_by:AUTH.id});
    if(r.error){toast(r.error.message,true);b.disabled=false;return;}
    toast('Done ✓');await loadAll();draw();
  });
}
function setHash(h){try{if(location.hash.replace('#','')!==h)history.replaceState(null,'',h?('#'+h):location.pathname+location.search);}catch(e){}}
/* in-page reader — reading never leaves Training */
function openRead(slug,from){BACKVIEW=from||VIEW;VIEW='read';READSLUG=slug;setHash('read='+slug);draw();window.scrollTo(0,0);}
async function drawRead(){
  const a=ARTS.find(x=>x.slug===READSLUG);
  if(!a){VIEW=BACKVIEW;setHash(BACKVIEW==='track'?'track':'');draw();return;}
  const r=READS[a.id],q=QUIZ[a.id];
  const acked=!!(r&&r.acknowledged_at);
  const passed=q&&q.nq?!!(MYATT[q.id]&&MYATT[q.id].passed):null;
  let h='<button class="backlnk" id="rdBack">‹ Back to Training</button>';
  h+='<div class="artcard">'
    +'<h2>'+(a.icon_url?'<img src="'+String(a.icon_url).replace(/"/g,'&quot;')+'" alt="" style="width:26px;height:26px;object-fit:contain;border-radius:5px;vertical-align:-4px"> ':(a.emoji?esc(a.emoji)+' ':''))+esc(a.title)+'</h2>'
    +'<div class="artmeta">'+readMins(a.body)+' min read'+(a.require_ack?' · required reading':'')+'</div>'
    +'<div class="artbody">'+render(a.body||'')+'</div>'
    +'<div class="artfoot">'
    +(acked?'<span class="due" style="background:var(--greenbg);color:var(--greend)">'+ic('check',10)+' Read ✓</span>'
           :'<button class="btn" id="rdAck">✓ Mark as read</button><span class="note">logs your read receipt</span>')
    +(q&&q.nq?('<span style="flex:1"></span><button class="btn'+(passed?' alt':'')+'" id="rdQuiz">'
      +(passed?'Quiz passed ✓ — retake':'Take the quiz')+'</button>'):'')
    +'</div></div>';
  $('#page').innerHTML=h;
  $('#rdBack').onclick=()=>{VIEW=BACKVIEW;setHash(BACKVIEW==='track'?'track':'');draw();};
  const ack=$('#rdAck');if(ack)ack.onclick=async()=>{
    ack.disabled=true;
    const now=new Date().toISOString();
    const res=await sb.from('kb_reads').upsert({article_id:a.id,staff_id:AUTH.id,
      acknowledged_at:now,last_viewed_at:now},{onConflict:'article_id,staff_id'});
    if(res.error){toast(res.error.message,true);ack.disabled=false;return;}
    toast('Marked as read ✓');
    await loadAll();
    if(q&&q.nq&&!(MYATT[q.id]&&MYATT[q.id].passed))draw();   // stay: the quiz still gates this item
    else{VIEW=BACKVIEW;setHash(BACKVIEW==='track'?'track':'');draw();}
  };
  const qz=$('#rdQuiz');if(qz)qz.onclick=()=>{location.href='knowledge.html#quiz='+a.slug;};
  /* opening counts as a view */
  sb.from('kb_reads').upsert({article_id:a.id,staff_id:AUTH.id,last_viewed_at:new Date().toISOString()},{onConflict:'article_id,staff_id'}).then(()=>{});
}
function draw(){ if(VIEW==='read')drawRead(); else if(VIEW==='track')drawTrack(); else drawHome(); }
window.addEventListener('hashchange',()=>{parseHashView();draw();});
async function boot(){ await loadAll(); draw(); }
</script>
</body>
</html>
