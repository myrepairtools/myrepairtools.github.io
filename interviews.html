<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — CPR</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--blue:#4FB0E3;--grey:#B9BDCB;--light-grey:#F3F2F2;
--dark-grey:#4E4E50;--border:#E0E2EA;--green:#2E9E5B;--amber:#C98A00;--white:#fff;
--ring:0 0 0 3px rgba(79,176,227,.15);--shadow:0 1px 3px rgba(45,45,59,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans','Segoe UI',sans-serif;background:var(--light-grey);color:var(--dark)}
main{max-width:1120px;margin:0;padding:24px 28px 80px}
h1{font-family:'Nunito';font-weight:900;font-size:1.45rem;display:flex;align-items:center;gap:10px}
.sub{color:var(--dark-grey);font-size:.85rem;font-weight:700}
.hd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tabrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:nowrap}
.tabrow #newBk{margin-left:auto;white-space:nowrap;flex:none}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tabrow .tabs{margin-bottom:0}
@media (max-width:480px){
  main{padding-left:16px;padding-right:16px}
  .tabs button{padding:9px 10px;font-size:.74rem}
  .tabrow #newBk{padding:8px 11px;font-size:.78rem}
}
@media (max-width:374px){
  .tabs button{padding:8px 8px;font-size:.7rem}
  .tabrow #newBk{padding:8px 9px;font-size:.74rem}
}
.tabs button{font-family:'Nunito';font-weight:800;font-size:.8rem;border:none;background:#fff;color:var(--dark-grey);padding:9px 15px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card .ct{font-family:'Nunito';font-weight:900;font-size:.95rem;margin-bottom:2px}
.card .ch{color:var(--dark-grey);font-size:.8rem;font-weight:700;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Nunito';font-weight:800;
font-size:.85rem;padding:10px 16px;border:1.5px solid var(--border);background:#fff;color:var(--dark);border-radius:10px;cursor:pointer}
.btn.pri{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:7px 12px;font-size:.76rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-family:'Nunito';font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.3px;
color:var(--dark-grey);padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--light-grey);vertical-align:middle}
.pill{display:inline-block;font-family:'Nunito';font-weight:800;font-size:.64rem;text-transform:uppercase;
letter-spacing:.3px;padding:3px 9px;border-radius:999px}
.pill.booked{background:#E9F5FC;color:#2E7CA6}.pill.completed{background:#E7F6EE;color:var(--green)}
.pill.canceled{background:#F3F2F2;color:#8A8A93}.pill.no_show{background:#FDECEC;color:var(--red)}
.pill.paused{background:#FCF3E3;color:var(--amber)}.pill.hosting{background:#E7F6EE;color:var(--green)}
.uppill{display:inline-block;font-family:'Nunito';font-weight:800;font-size:.64rem;text-transform:uppercase;
letter-spacing:.3px;padding:3px 9px;border-radius:999px;background:#E9F5FC;color:#2E7CA6;white-space:nowrap}

/* desktop vs ≤480 mobile variants — .dv renders ≥481, .mv renders ≤480 */
.mv{display:none}

/* month calendar overview */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calwrap{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:#FAFAFB}
.cal-wd span{padding:8px 4px;text-align:center;font-family:'Nunito';font-weight:800;font-size:.64rem;color:var(--dark-grey);text-transform:uppercase;letter-spacing:.4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .d{min-width:0;min-height:96px;border-right:1px solid var(--light-grey);border-bottom:1px solid var(--light-grey);
  padding:6px;cursor:pointer;background:#fff;transition:background .1s;text-align:left;border-top:none;border-left:none;font:inherit;color:inherit}
.cal .d:nth-child(7n){border-right:none}
.cal .d:hover{background:#F7FBFE}
.cal .d.oth{background:#FBFBFC;color:var(--grey)}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--blue);background:#EAF6FD}
.cal .dn{font-family:'Nunito';font-weight:800;font-size:.78rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.cal .dn .today{background:var(--red);color:#fff;border-radius:6px;padding:1px 6px}
.chip{display:block;width:100%;text-align:left;font-family:'Nunito Sans';font-weight:700;font-size:.68rem;
  background:#E9F5FC;color:#20618A;border:none;border-left:3px solid var(--blue);border-radius:5px;
  padding:2px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.done{background:#E7F6EE;color:#1F6B41;border-left-color:var(--green)}
.chip.bad{background:#FDECEC;color:#9E2A2E;border-left-color:var(--red);text-decoration:line-through}
.chip .hst{opacity:.7}
.more{font-size:.64rem;font-weight:800;color:var(--grey)}
/* ≤480: chips become status dots + a legend strip */
.dots{display:none;gap:3px;margin-top:4px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots i.b{background:var(--blue)}.dots i.g{background:var(--green)}.dots i.r{background:var(--red)}
.dots .dmore{font-family:'Nunito';font-weight:800;font-size:.56rem;color:var(--grey)}
.callegend{display:none;gap:14px;align-items:center;padding:9px 12px;border-top:1px solid var(--border);background:#FAFAFB;
font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey)}
.callegend i{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

/* day pane — mobile per-booking blocks */
.dbk{border-top:1px solid var(--light-grey);padding:13px 0 12px}
.dbk .r1{display:flex;align-items:center;gap:8px}
.dbk .tm{font-family:'Nunito';font-weight:900;font-size:.95rem;flex:1}
.dbk .nm{font-family:'Nunito';font-weight:800;font-size:.95rem;margin-top:3px}
.dbk .meta{font-size:.78rem;font-weight:700;color:var(--dark-grey);margin-top:2px}
.dbk .crow{display:flex;gap:8px;margin-top:10px}
.dbk .crow a{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1.5px solid var(--border);
border-radius:10px;font-family:'Nunito';font-weight:800;font-size:.82rem;color:var(--dark);text-decoration:none;padding:0 10px}
.dbk .crow a.ph{flex:1;min-width:0}
.dbk .crow a.em{min-width:52px;flex:none}
.dbk .arow{display:flex;gap:8px;margin-top:10px}
.dbk .arow .btn{flex:1;min-height:44px;font-size:.82rem;padding:8px 6px}

/* hosts list — desktop cards (unchanged) */
.hcard{padding:14px 18px 12px}
.hchead{display:flex;align-items:center;gap:10px}
.hname{flex:1;min-width:0;text-align:left;border:none;background:none;font-family:'Nunito';font-weight:800;
font-size:.95rem;color:var(--dark);cursor:pointer;padding:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hup{font-size:.7rem;color:var(--grey);font-weight:800;white-space:nowrap}
.hx{border:none;background:none;color:var(--grey);font-size:1rem;line-height:1;cursor:pointer;padding:8px}
.hx:hover{color:var(--red)}
.hday{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--light-grey);font-size:.84rem;font-weight:700;flex-wrap:wrap}
.hday .hdw{font-family:'Nunito';font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);width:34px;flex:none}
.hday .hwin{color:var(--dark)}
.hday .hsep{color:var(--grey)}

/* hosts — mobile cards (3b) */
.hm{border-top:3px solid var(--blue);padding:14px 14px 12px}
.hm.noav{border-top-color:var(--grey)}
.hmh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hav{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;
font-family:'Nunito';font-weight:900;font-size:.82rem;flex:none}
.hav.off{background:var(--grey)}
.hmn{flex:1;min-width:0}
.hmn .nm{font-family:'Nunito';font-weight:800;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmn .sb{font-size:.75rem;font-weight:700;color:var(--dark-grey);margin-top:1px}
.nextstrip{background:#F7FBFE;border:1px solid #D6ECF8;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:9px;margin-bottom:8px;min-width:0}
.nextstrip .nl{font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:#2E7CA6;flex:none}
.nextstrip .nv{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wchip{display:inline-flex;align-items:center;background:#F7FBFE;border:1.5px solid #D6ECF8;border-radius:8px;
padding:5px 9px;font-family:'Nunito';font-weight:800;font-size:.75rem;color:var(--dark)}
.hm .hx{width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;flex:none;margin-right:-10px}
.hm .hfoot{display:flex;gap:8px;margin-top:11px}
.hm .hfoot .btn{min-height:44px}
.hm .hfoot .edav{flex:1}
.setav{width:100%;min-height:44px;border:1.5px solid var(--blue);color:#2E7CA6;background:#fff;border-radius:10px;
font-family:'Nunito';font-weight:800;font-size:.85rem;cursor:pointer;margin-top:2px}

/* add-host picker rows */
.ahrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;
font-family:'Nunito';font-weight:800;font-size:.9rem;color:var(--dark);cursor:pointer}
.ahrow:hover{border-color:var(--blue);background:#F7FBFE}
.ahrow .ahst{font-family:'Nunito Sans';font-weight:700;font-size:.72rem;color:var(--grey)}

/* availability editor (per host) */
.wk{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.wk .dn{font-family:'Nunito';font-weight:800;font-size:.85rem;padding-top:9px}
.wins{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.win{display:inline-flex;align-items:center;gap:4px;background:#F7FBFE;border:1.5px solid #D6ECF8;
border-radius:10px;padding:0 0 0 11px;min-height:44px;font-weight:700;font-size:.82rem}
.win b{font-family:'Nunito';font-weight:800}
.win .st{font-size:.7rem;color:var(--grey);font-weight:700;margin-left:5px}
.win .x{border:none;background:none;color:var(--grey);cursor:pointer;font-size:1.05rem;line-height:1;
width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.win .x:hover{color:var(--red)}
.notav{font-size:.76rem;font-weight:700;color:var(--dark-grey);margin-top:8px}
.cfg{display:flex;gap:16px;flex-wrap:wrap}
.cfg label{display:flex;flex-direction:column;gap:5px;font-family:'Nunito';font-weight:800;font-size:.68rem;
text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey)}
.cfg input{width:120px;height:38px;padding:5px 10px;border:1.5px solid var(--border);border-radius:9px;
font-family:'Nunito Sans';font-weight:700;font-size:.88rem;background:#fff;color:var(--dark)}
/* days off — segmented single/range + read-only PTO rows */
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;max-width:340px}
.seg button{flex:1;height:38px;border:none;background:#fff;font-family:'Nunito';font-weight:800;font-size:.78rem;color:var(--dark-grey);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.doform input{height:38px;padding:5px 10px;border:1.5px solid var(--border);border-radius:9px;
font-family:'Nunito Sans';font-weight:700;font-size:.85rem;background:#fff;color:var(--dark);width:100%}
.doform .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doform .row2>div{min-width:0}
.doform .fl{font-family:'Nunito';font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin:9px 0 4px}
.dorow{padding:11px 0;border-bottom:1px solid var(--light-grey);display:flex;align-items:center;gap:10px}
.dorow .dl{flex:1;min-width:0}
.dorow .dl b{font-family:'Nunito';font-weight:800;font-size:.85rem;display:block}
.dorow .dl span{font-size:.74rem;font-weight:700;color:var(--dark-grey)}
.dorow .x44{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--grey);font-size:1.1rem;cursor:pointer}
.dorow .x44:hover{color:var(--red)}

.linkbox{display:flex;gap:9px;align-items:center;background:var(--light-grey);border-radius:11px;padding:11px 14px;
font-size:.85rem;word-break:break-all;font-weight:700}
.empty{color:var(--grey);font-weight:700;font-size:.85rem;padding:22px;text-align:center}
.gate{background:#FFF1F1;border:1px solid #F6C9CA;border-radius:12px;padding:22px;text-align:center;color:var(--red);font-weight:800}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}

/* booking links — mobile (5a) */
.lcard{border-top:3px solid var(--red)}
.urlbox{background:var(--light-grey);border-radius:10px;min-height:44px;display:flex;align-items:center;padding:0 12px;
font-size:.82rem;font-weight:700;overflow:hidden}
.urlbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lact{display:flex;gap:8px;margin-top:10px}
.lact .btn{min-height:38px;padding:7px 12px}
.lact .cp{flex:1}
.lhrow{display:flex;flex-direction:column;gap:8px;padding:12px 0 10px;border-top:1px solid var(--light-grey)}
.lhrow .top{display:flex;align-items:center;gap:9px;min-width:0}
.lhrow .hav{width:34px;height:34px;font-size:.76rem}
.lhrow .nm{font-family:'Nunito';font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhrow .lu{font-size:.74rem;font-weight:700;color:var(--dark-grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhrow .acts{display:flex;gap:8px}
.lhrow .acts .btn{min-height:38px;flex:1;padding:7px 8px}
.lhrow .acts .op{flex:none;text-decoration:none}
.resume{border-color:var(--blue)!important;color:#2E7CA6!important}
.qrwrap{text-align:center;padding:10px 0}
.qrwrap img{width:220px;height:220px;image-rendering:pixelated}

/* modal / bottom sheet */
.mback{position:fixed;inset:0;background:rgba(45,45,59,.5);display:flex;align-items:center;justify-content:center;z-index:1200;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:480px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-family:'Nunito';font-weight:900;font-size:1.12rem;margin-bottom:4px}
.modal .fldl{font-family:'Nunito';font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin:11px 0 5px}
.modal input,.modal select,.modal textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;
font-family:'Nunito Sans';font-weight:700;font-size:.92rem;background:#fff;color:var(--dark)}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .row2>div{min-width:0}
.modal input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;height:48px}
.modal input[type=time]::-webkit-date-and-time-value{text-align:center}
.modal .ft{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.merr{color:var(--red);font-weight:800;font-size:.8rem;margin-top:9px;min-height:1em}
/* sheet skeleton — modals with .sh use header/body/footer; ≤480 they pin to the bottom */
.mback.sh .modal{padding:0;display:flex;flex-direction:column}
.shh{padding:12px 18px 6px;flex:none}
.grab{width:44px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 9px;display:none}
.shb{padding:2px 18px 14px;overflow:auto;flex:1;min-height:0}
.shf{border-top:1px solid var(--border);padding:12px 18px;flex:none}
.shf .shsum{font-size:.8rem;font-weight:700;color:var(--dark-grey);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.1em}
.shf .shbtns{display:flex;gap:10px}
.shf .btn{min-height:46px}
.shf .go{flex:1}

/* new-booking sheet parts (6a) */
.hchips{display:flex;gap:7px;flex-wrap:wrap}
.hchip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;
font-family:'Nunito';font-weight:800;font-size:.8rem;color:var(--dark);cursor:pointer}
.hchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.dtile{flex:none;width:52px;min-height:56px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:'Nunito'}
.dtile .wd{font-weight:800;font-size:.56rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey)}
.dtile .dd{font-weight:900;font-size:1rem;color:var(--dark)}
.dtile .oc{font-weight:800;font-size:.56rem;color:var(--dark-grey)}
.dtile.on{background:var(--blue);border-color:var(--blue)}
.dtile.on .wd,.dtile.on .dd,.dtile.on .oc{color:#fff}
.dtile.full{background:#FBFBFC;cursor:default}
.dtile.full .wd,.dtile.full .dd,.dtile.full .oc{color:var(--grey)}
.slotgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slotgrid button{min-height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
font-family:'Nunito';font-weight:800;font-size:.84rem;color:var(--dark);cursor:pointer;padding:4px 6px}
.slotgrid button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slotgrid button .sh2{display:block;font-size:.62rem;font-weight:800;opacity:.75}
.lblrow{display:flex;align-items:center}
.lblrow .fldl{flex:1}
.anyt{height:32px;padding:0 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito';font-weight:800;font-size:.72rem;color:var(--dark-grey);cursor:pointer;flex:none}

/* add-availability sheet parts (4b) */
.storestrip{background:#F7FBFE;border:1px solid #D6ECF8;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:9px;margin-top:4px}
.storestrip .nl{font-family:'Nunito';font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:#2E7CA6;flex:none}
.storestrip .nv{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qf{display:flex;gap:8px;margin-top:8px}
.qf button{flex:1;min-height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
font-family:'Nunito';font-weight:800;font-size:.74rem;color:var(--dark);cursor:pointer;padding:4px 4px}
.qf button.bl{border-color:var(--blue);background:#F7FBFE;color:#2E7CA6}
.awdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.awday{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--border);border-radius:10px;
padding:6px 0;min-height:52px;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:.7rem;color:var(--dark-grey)}
.awday:has(input:checked){border-color:var(--blue);background:#F7FBFE;color:var(--dark)}
.awday input{accent-color:var(--blue);width:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
padding:12px 18px;border-radius:12px;font-family:'Nunito';font-weight:800;font-size:.85rem;opacity:0;pointer-events:none;transition:.18s;z-index:1300}
.toast.show{opacity:1}.toast.err{background:var(--red)}
.hide{display:none!important}

@media(max-width:480px){
  .dv{display:none!important}
  .mv{display:block}
  .cal .d{min-height:56px;padding:5px 4px;overflow:hidden}

  .dots{display:flex}

  .cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* sheets pin to the bottom, clear the 52px top bar, sit over the tab bar */

    border-radius:16px 16px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.28)}
  .grab{display:block}
  .shf{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}

  <div class="hd">
    <h1><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" /><path d="M8 14h.01" /><path d="M12 14h.01" /><path d="M16 14h.01" /><path d="M8 18h.01" /><path d="M12 18h.01" /><path d="M16 18h.01" /></svg>Bookings</h1>

<script type="module">
import { createClient } from "/assets/supabase-js.js";
/* ============================================================
   Bookings — management side of our own booking service.
   Calendar overview of every upcoming booking · Hosts roster
   (who can take bookings + each host's weekly availability,
   editable centrally by managers) · booking links. Slots are
   computed live by the `interviews` edge function; "+ New
   Booking" books a candidate directly via staff_book.
   ≤480px renders the design-handoff mobile pass (status-dot
   month grid, host cards, bottom sheets); desktop keeps the
   table/chip layouts.
   ============================================================ */
var $=function(s,c){return (c||document).querySelector(s);};
var $all=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
var FN=SB_URL+'/functions/v1/interviews';
var sb=createClient(SB_URL,ANON);
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var TZ='America/Los_Angeles';
var ME=null, TAB='calendar', MON=new Date(), SELDAY=null;
var STAFF=[], STORES=[], SETTINGS=[], WINS=[], BOOKINGS=[], BLACKOUTS=[], PTO=[], HED=null;
var MAIL_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>';
var PHONE_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

function toast(m,err){var t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(function(){t.className='toast';},2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hhmm(min){var h=Math.floor(min/60),m=min%60,ap=h>=12?'PM':'AM',h12=h%12||12;return h12+(m?(':'+String(m).padStart(2,'0')):'')+' '+ap;}
function toMin(v){var p=String(v||'').split(':');return (+p[0])*60+(+p[1]||0);}
function dkey(iso){return new Date(iso).toLocaleDateString('en-CA',{timeZone:TZ});}
function fmtT(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ});}
function fmtWhen(iso){return new Date(iso).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:TZ});}
function fmtD(dateStr){return new Date(dateStr+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function addD(dateStr,n){var d=new Date(dateStr+'T12:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA');}
function spanDays(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)+1;}
function staffById(id){return STAFF.filter(function(s){return Number(s.id)===Number(id);})[0]||null;}
function hostName(id){var s=staffById(id);return s?s.display_name:'?';}
function firstName(n){return String(n||'').split(/\s+/)[0];}
function initials(n){return String(n||'').split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();}
function cfgFor(id){return SETTINGS.filter(function(s){return Number(s.staff_id)===Number(id);})[0]||null;}
function storeLbl(name){return name?((window.CPRLocations&&CPRLocations.display)?CPRLocations.display(name):name):'';}
function nextBookingFor(id){
  var now=Date.now();
  return BOOKINGS.filter(function(b){return Number(b.staff_id)===Number(id)&&b.status==='booked'&&new Date(b.starts_at).getTime()>=now;})[0]||null;
}
function copyTxt(t){navigator.clipboard.writeText(t).then(function(){toast('Link copied');},function(){toast('Copy failed',true);});}
function shareLink(url){
  if(navigator.share){navigator.share({url:url}).catch(function(){});}
  else copyTxt(url);
}
function openQr(link,title){
  var back=document.createElement('div');back.className='mback';
  var img='';
  try{var qr=window.qrcode(0,'M');qr.addData(link);qr.make();img=qr.createImgTag(5,8);}catch(e){img='<div class="empty">Could not render QR</div>';}
  back.innerHTML='<div class="modal"><h3>'+esc(title||'Booking Link')+'</h3>'
    +'<div class="qrwrap">'+img+'</div>'
    +'<div style="font-size:.78rem;font-weight:700;color:var(--dark-grey);text-align:center;word-break:break-all">'+esc(link)+'</div>'
    +'<div class="ft"><button class="btn" data-x>Close</button><button class="btn pri" data-cp>🔗 Copy Link</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener('click',function(e){if(e.target===back)back.remove();});
  back.querySelector('[data-x]').onclick=function(){back.remove();};
  back.querySelector('[data-cp]').onclick=function(){copyTxt(link);};
}
async function setHostActive(id,on){
  var r=await sb.from('interview_settings').update({active:on,updated_at:new Date().toISOString()}).eq('staff_id',id).select();
  if(r.error){toast(r.error.message,true);return;}
  var c=cfgFor(id); if(c)c.active=on;
  toast(on?(firstName(hostName(id))+' is taking bookings again'):(firstName(hostName(id))+' paused — no new bookings'));
  render();
}

async function ensureSession(){
  try{
    var s=(await sb.auth.getSession()).data.session; if(s)return s;
    var raw=localStorage.getItem('sb-xuvsehrevxackuhmbmry-auth-token'); if(!raw)return null;
    var o=JSON.parse(raw);
    var at=o.access_token||(o.currentSession&&o.currentSession.access_token);
    var rt=o.refresh_token||(o.currentSession&&o.currentSession.refresh_token);
    if(at&&rt){await sb.auth.setSession({access_token:at,refresh_token:rt});return (await sb.auth.getSession()).data.session;}
  }catch(e){}
  return null;
}
async function callFn(body){
  var s=await ensureSession();
  var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',
    'Authorization':'Bearer '+((s&&s.access_token)||ANON),'apikey':ANON},body:JSON.stringify(body)});
  return r.json().catch(function(){return {ok:false,error:'bad response'};});
}

(async function boot(){
  var s=await ensureSession();
  var staff=null;
  if(s){try{staff=(await sb.from('staff').select('id,display_name,role,home_store').eq('auth_uid',s.user.id).maybeSingle()).data;}catch(e){}}
  if(!staff||(staff.role!=='admin'&&staff.role!=='owner')){
    $('#gate').classList.remove('hide');
    $('#gate').innerHTML='🔒 Bookings is for managers and the owner.'+(staff?'':'<br><br>Sign in with your PIN first.');
    return;
  }
  ME=staff; $('#app').classList.remove('hide');
  await load();
  $all('#tabs button').forEach(function(b){
    b.onclick=function(){TAB=b.getAttribute('data-t');
      $all('#tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
      HED=null; try{history.replaceState(null,'','#'+TAB);}catch(e){} render();};
  });
  var h=(location.hash||'').replace('#','');
  if(['calendar','hosts','links'].indexOf(h)>-1){TAB=h;
    $all('#tabs button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===h);});}
  window.addEventListener('hashchange',function(){
    var h2=(location.hash||'').replace('#','');
    if(['calendar','hosts','links'].indexOf(h2)>-1&&h2!==TAB){TAB=h2;HED=null;
      $all('#tabs button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===h2);});render();}
  });
  $('#newBk').onclick=openNewBooking;
  render();
})();

async function load(){
  var from=new Date();from.setMonth(from.getMonth()-2);
  var today=new Date().toLocaleDateString('en-CA');
  var [st,so,cfg,wins,books,blk,pto]=await Promise.all([
    sb.from('staff').select('id,display_name,role,home_store,active').eq('active',true).order('display_name'),
    sb.from('stores').select('store,active,display_order,color').order('display_order'),
    sb.from('interview_settings').select('*'),
    sb.from('interview_availability').select('*').order('weekday').order('start_min'),
    sb.from('interview_bookings').select('*').gte('starts_at',from.toISOString()).order('starts_at'),
    sb.from('interview_blackouts').select('*').gte('block_date',new Date(Date.now()-864e5).toISOString().slice(0,10)).order('block_date'),
    sb.from('time_off_requests').select('id,staff_id,type,start_date,end_date,partial_days').eq('status','approved').gte('end_date',today).order('start_date')
  ]);
  STAFF=st.data||[]; STORES=(so.data||[]).filter(function(x){return x.active!==false;});
  SETTINGS=cfg.data||[]; WINS=wins.data||[]; BOOKINGS=books.data||[]; BLACKOUTS=blk.data||[]; PTO=pto.data||[];
}

function render(){
  if(TAB==='calendar')renderCal();
  else if(TAB==='hosts')(HED?renderHostEditor():renderHosts());
  else renderLinks();
}

/* ================= Calendar overview ================= */
function renderCal(){
  var y=MON.getFullYear(), m=MON.getMonth();
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var todayK=dkey(new Date().toISOString());
  var byDay={};
  BOOKINGS.forEach(function(b){var k=dkey(b.starts_at);(byDay[k]=byDay[k]||[]).push(b);});
  var cells='';
  for(var i=0;i<42;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var k=d.toLocaleDateString('en-CA');
    var inMon=d.getMonth()===m;
    var list=(byDay[k]||[]).filter(function(b){return b.status!=='canceled';});
    var chips=list.slice(0,3).map(function(b){
      var cls=b.status==='completed'?' done':(b.status==='no_show'?' bad':'');
      return '<span class="chip'+cls+'">'+esc(fmtT(b.starts_at))+' '+esc(String(b.candidate_name).split(/\s+/)[0])
        +' <span class="hst">· '+esc(initials(hostName(b.staff_id)))+'</span></span>';
    }).join('')+(list.length>3?'<span class="more">+'+(list.length-3)+' more</span>':'');
    var dots='';
    if(list.length){
      dots='<span class="dots">'+list.slice(0,3).map(function(b){
        return '<i class="'+(b.status==='completed'?'g':(b.status==='no_show'?'r':'b'))+'"></i>';
      }).join('')+(list.length>3?'<span class="dmore">+'+(list.length-3)+'</span>':'')+'</span>';
    }
    cells+='<button class="d'+(inMon?'':' oth')+(k===SELDAY?' sel':'')+'" data-day="'+k+'">'
      +'<span class="dn">'+(k===todayK?'<span class="today">'+d.getDate()+'</span>':d.getDate())+'</span>'+chips+dots+'</button>';
  }
  var upN=BOOKINGS.filter(function(b){return b.status==='booked'&&new Date(b.starts_at)>=new Date();}).length;
  $('#view').innerHTML=
    '<div class="calbar">'
      +'<div class="cpr-navbox"><button id="cPrev">‹</button><button class="lbl" id="cLbl" title="Pick a month" style="cursor:pointer">'
        +MON.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</button><button id="cNext">›</button></div>'
      +((m===new Date().getMonth()&&y===new Date().getFullYear())?'':'<button class="cpr-navjump" id="cToday">Today</button>')
      +'<span style="flex:1"></span>'
      +'<span class="sub" style="margin:0">'+upN+' upcoming</span>'
    +'</div>'
    +'<div class="calwrap"><div class="cal-wd"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>'
    +'<div class="cal">'+cells+'</div>'
    +'<div class="callegend"><span><i style="background:var(--blue)"></i>Booked</span>'
      +'<span><i style="background:var(--green)"></i>Done</span>'
      +'<span><i style="background:var(--red)"></i>No-show</span></div></div>'
    +'<div id="dayPane"></div>';
  $('#cPrev').onclick=function(){MON=new Date(y,m-1,1);render();};
  $('#cNext').onclick=function(){MON=new Date(y,m+1,1);render();};
  if($('#cToday'))$('#cToday').onclick=function(){MON=new Date();SELDAY=todayK;render();};
  if(window.CPRPickers&&CPRPickers.month)$('#cLbl').onclick=function(ev){ev.stopPropagation();CPRPickers.month($('#cLbl'),{get:function(){return new Date(MON);},set:function(d){MON=new Date(d.getFullYear(),d.getMonth(),1);render();}});};
  $all('[data-day]').forEach(function(b){b.onclick=function(){SELDAY=b.getAttribute('data-day');render();};});
  if(SELDAY)renderDayPane(byDay[SELDAY]||[]);
}
function renderDayPane(list){
  var d=new Date(SELDAY+'T12:00');
  var title=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var rows=list.length?list.map(function(b){
    return '<tr><td style="white-space:nowrap"><b>'+esc(fmtT(b.starts_at))+'</b></td>'
      +'<td><span style="font-family:Nunito;font-weight:800">'+esc(b.candidate_name)+'</span>'
        +(b.position?'<div style="font-size:.72rem;color:var(--grey);font-weight:700">'+esc(b.position)+'</div>':'')+'</td>'
      +'<td>'+esc(hostName(b.staff_id))+'</td>'
      +'<td>'+(b.candidate_phone?esc(b.candidate_phone):'')+(b.candidate_email?'<div style="font-size:.72rem;color:var(--grey);font-weight:700">'+esc(b.candidate_email)+'</div>':'')+'</td>'
      +'<td>'+esc(b.store||'—')+'</td>'
      +'<td><span class="pill '+esc(b.status)+'">'+esc(b.status.replace('_',' '))+'</span></td>'
      +'<td style="text-align:right;white-space:nowrap">'
        +(b.status==='booked'?'<button class="btn sm" data-done="'+b.id+'">Done</button> '
          +'<button class="btn sm" data-noshow="'+b.id+'">No-show</button> '
          +'<button class="btn sm" data-cxl="'+b.id+'" style="color:var(--red)">Cancel</button>':'')
      +'</td></tr>';
  }).join(''):'<tr><td colspan="7"><div class="empty">Nothing booked this day.</div></td></tr>';
  var mrows=list.length?list.map(function(b){
    var crow='';
    if(b.candidate_phone&&b.candidate_email){
      crow='<div class="crow"><a class="ph" href="tel:'+esc(b.candidate_phone)+'">'+PHONE_SVG+esc(b.candidate_phone)+'</a>'
        +'<a class="em" href="mailto:'+esc(b.candidate_email)+'" aria-label="Email '+esc(b.candidate_name)+'">'+MAIL_SVG+'</a></div>';
    }else if(b.candidate_phone){
      crow='<div class="crow"><a class="ph" href="tel:'+esc(b.candidate_phone)+'">'+PHONE_SVG+esc(b.candidate_phone)+'</a></div>';
    }else if(b.candidate_email){
      crow='<div class="crow"><a class="ph" href="mailto:'+esc(b.candidate_email)+'">'+MAIL_SVG+esc(b.candidate_email)+'</a></div>';
    }
    var acts=b.status==='booked'
      ?'<div class="arow"><button class="btn pri" data-done="'+b.id+'">Done</button>'
        +'<button class="btn" data-noshow="'+b.id+'">No-show</button>'
        +'<button class="btn" data-cxl="'+b.id+'" style="color:var(--red)">Cancel</button></div>':'';
    return '<div class="dbk">'
      +'<div class="r1"><span class="tm">'+esc(fmtT(b.starts_at))+'</span><span class="pill '+esc(b.status)+'">'+esc(b.status.replace('_',' '))+'</span></div>'
      +'<div class="nm">'+esc(b.candidate_name)+'</div>'
      +'<div class="meta">'+(b.position?esc(b.position)+' · ':'')+'with '+esc(hostName(b.staff_id))+'</div>'
      +(b.store?'<div class="meta">'+esc(b.store)+'</div>':'')
      +crow+acts+'</div>';
  }).join(''):'<div class="empty">Nothing booked this day.</div>';
  $('#dayPane').innerHTML=
    '<div class="dv"><div class="card" style="margin-top:14px"><div class="ct" style="margin-bottom:10px">'+title+'</div>'
    +'<table><thead><tr><th>Time</th><th>Candidate</th><th>Host</th><th>Contact</th><th>Where</th><th>Status</th><th></th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div></div>'
    +'<div class="mv"><div class="card" style="margin-top:14px;padding:16px 16px 6px"><div class="ct">'+title+'</div>'
    +'<div class="ch" style="margin-bottom:4px">'+list.length+' booked</div>'+mrows+'</div></div>';
  bindStatus();
}
function bindStatus(){
  var set=async function(id,status){
    var r=await sb.from('interview_bookings').update({status:status,updated_at:new Date().toISOString()}).eq('id',id);
    if(r.error){toast(r.error.message,true);return;}
    var b=BOOKINGS.filter(function(x){return x.id===id;})[0]; if(b)b.status=status;
    toast(status==='completed'?'Marked done':status==='no_show'?'Marked no-show':'Canceled — slot is open again'); render();
  };
  $all('[data-done]').forEach(function(b){b.onclick=function(){set(+b.getAttribute('data-done'),'completed');};});
  $all('[data-noshow]').forEach(function(b){b.onclick=function(){set(+b.getAttribute('data-noshow'),'no_show');};});
  $all('[data-cxl]').forEach(function(b){b.onclick=function(){
    if(confirm('Cancel this booking? The slot opens back up.'))set(+b.getAttribute('data-cxl'),'canceled');};});
}

/* ================= New booking (6a sheet — host chips, day strip, slot grid) ================= */
function openNewBooking(){
  var hosts=SETTINGS.filter(function(s){return s.active!==false&&staffById(s.staff_id);});
  if(!hosts.length){toast('Add a host first (Hosts tab)',true);return;}
  // first names, falling back to full name on a collision
  var fn={}; hosts.forEach(function(h){var f=firstName(hostName(h.staff_id));fn[f]=(fn[f]||0)+1;});
  function chipLbl(id){var f=firstName(hostName(id));return fn[f]>1?hostName(id):f;}
  var back=document.createElement('div');back.className='mback sh';
  back.innerHTML='<div class="modal">'
    +'<div class="shh"><div class="grab"></div><h3>New Booking</h3></div>'
    +'<div class="shb">'
      +'<div class="fldl" style="margin-top:4px">Host</div>'
      +'<div class="hchips"><button class="hchip on" data-h="">Anyone Free</button>'
        +hosts.map(function(h){return '<button class="hchip" data-h="'+h.staff_id+'">'+esc(chipLbl(h.staff_id))+'</button>';}).join('')
      +'</div>'
      +'<div class="fldl">Day</div><div class="daystrip" id="nbDays"><span class="empty" style="padding:10px">Loading…</span></div>'
      +'<div class="lblrow"><div class="fldl">Time</div><button class="anyt hide" id="nbAny">Any time…</button></div>'
      +'<div id="nbTimes"></div>'
      +'<div class="fldl">Full name</div><input id="nbName" autocomplete="off">'
      +'<div class="fldl">Mobile</div><input id="nbPhone" inputmode="tel">'
      +'<div class="fldl">Email (optional)</div><input id="nbEmail" inputmode="email">'
      +'<div class="fldl">Position (optional)</div><input id="nbRole">'
      +'<div class="merr" id="nbErr"></div>'
    +'</div>'
    +'<div class="shf"><div class="shsum" id="nbSum"></div>'

// Pacific-offset suffix for a calendar date ('-07:00' PDT / '-08:00' PST)
function pacOffset(dateStr){
  var probe=new Date(dateStr+'T12:00:00Z');
  var s=new Intl.DateTimeFormat('en-US',{timeZone:TZ,timeZoneName:'shortOffset'}).format(probe);
  var m=s.match(/GMT([+-]\d+)/); var h=m?parseInt(m[1],10):-8;
  return (h<0?'-':'+')+String(Math.abs(h)).padStart(2,'0')+':00';
}

// merge consecutive same-reason blackout dates into display ranges
function coalesceBlks(blks){
  var out=[];
  blks.slice().sort(function(a,b){return a.block_date<b.block_date?-1:1;}).forEach(function(b){
    var last=out[out.length-1];
    if(last&&addD(last.end,1)===b.block_date&&(last.reason||'')===(b.reason||'')){last.end=b.block_date;last.ids.push(b.id);}
    else out.push({start:b.block_date,end:b.block_date,reason:b.reason||'',ids:[b.id]});
  });
  return out;
}

  $all('[data-delblk]').forEach(function(b){b.onclick=async function(){
    var ids=b.getAttribute('data-delblk').split(',').map(Number);
    var r=await sb.from('interview_blackouts').delete().in('id',ids);
    if(r.error){toast(r.error.message,true);return;}
    BLACKOUTS=BLACKOUTS.filter(function(x){return ids.indexOf(x.id)===-1;}); render();
  };});
  // ---- rules + windows ----
  $('#saveCfg').onclick=async function(){
    var row={staff_id:HED,slot_minutes:+$('#cSlot').value||30,buffer_minutes:+$('#cBuf').value||0,
      lead_hours:+$('#cLead').value||0,horizon_days:+$('#cHor').value||21,max_per_day:+$('#cMax').value||4,
      active:cfg.active!==false,updated_at:new Date().toISOString()};
    var r=await sb.from('interview_settings').upsert(row,{onConflict:'staff_id'}).select().single();
    if(r.error){toast(r.error.message,true);return;}
    var i=SETTINGS.indexOf(cfg); SETTINGS[i]=Array.isArray(r.data)?r.data[0]:r.data; toast('Rules saved');
  };
  $('#addWinBtn').onclick=function(){openAddWindow();};
  $all('[data-del]').forEach(function(b){b.onclick=async function(){
    var id=+b.getAttribute('data-del');
    var r=await sb.from('interview_availability').delete().eq('id',id);
    if(r.error){toast(r.error.message,true);return;}
    WINS=WINS.filter(function(w){return w.id!==id;}); toast('Window removed'); render();
  };});
}
/* ---- Add Availability (4b sheet) ---- */
// store open hours for the defaults/quick-fills — 10:00–19:00 is the shop standard
var OPEN_MIN=600, CLOSE_MIN=1140;
function openAddWindow(){
  var st=staffById(HED), defStore=(st&&st.home_store)||(STORES[0]&&STORES[0].store)||'';
  var back=document.createElement('div');back.className='mback sh';
  back.innerHTML='<div class="modal">'
    +'<div class="shh"><div class="grab"></div><h3>Add Availability</h3></div>'
    +'<div class="shb">'
    +'<div class="storestrip"><span class="nl">Store</span><span class="nv" id="awStrip"></span></div>'
    +'<div class="row2" style="margin-top:9px">'
      +'<div><div class="fldl" style="margin-top:0">From</div><input type="time" id="awS" value="10:00"></div>'
      +'<div><div class="fldl" style="margin-top:0">To</div><input type="time" id="awE" value="19:00"></div>'
    +'</div>'
    +'<div class="qf"><button class="bl" data-qf="'+OPEN_MIN+','+CLOSE_MIN+'">All Open Hours</button>'
      +'<button data-qf="'+OPEN_MIN+',840">Mornings</button>'
      +'<button data-qf="840,'+CLOSE_MIN+'">Afternoons</button></div>'
    +'<div class="fldl">Store</div><select id="awStore">'
      +STORES.map(function(x){return '<option value="'+esc(x.store)+'"'+(x.store===defStore?' selected':'')+'>'+esc(x.store)+'</option>';}).join('')
    +'</select>'
    +'<div class="fldl">Days</div>'
    +'<div class="awdays">'+DAYS.map(function(d,i){
        return '<label class="awday"><input type="checkbox" data-awd="'+i+'"><span>'+d.slice(0,3)+'</span></label>';
      }).join('')+'</div>'
    +'</div>'
    +'<div class="shf"><div class="shbtns"><button class="btn" data-x>Cancel</button><button class="btn pri go" id="awGo" disabled>Add Windows</button></div></div>'
    +'</div>';
  document.body.appendChild(back);
  back.addEventListener('click',function(e){if(e.target===back)back.remove();});
  back.querySelector('[data-x]').onclick=function(){back.remove();};
  function m2t(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
  function strip(){
    var s=back.querySelector('#awStore').value;
    back.querySelector('#awStrip').textContent='CPR '+storeLbl(s)+' · open '+hhmm(OPEN_MIN)+' – '+hhmm(CLOSE_MIN);
  }
  back.querySelector('#awStore').onchange=strip; strip();
  $all('[data-qf]',back).forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-qf').split(',');
    back.querySelector('#awS').value=m2t(+p[0]);
    back.querySelector('#awE').value=m2t(+p[1]);
  };});
  function updGo(){
    var n=$all('[data-awd]',back).filter(function(c){return c.checked;}).length;
    var go=back.querySelector('#awGo');
    go.disabled=!n;
    go.textContent=n?('Add '+n+(n===1?' Window':' Windows')):'Add Windows';
  }
  $all('[data-awd]',back).forEach(function(c){c.onchange=updGo;});
  back.querySelector('#awGo').onclick=async function(){
    var sMin=toMin(back.querySelector('#awS').value), eMin=toMin(back.querySelector('#awE').value);
    if(!(eMin>sMin)){toast('End must be after start',true);return;}
    var days=$all('[data-awd]',back).filter(function(c){return c.checked;}).map(function(c){return +c.getAttribute('data-awd');});
    if(!days.length){toast('Check at least one day',true);return;}
    var store=back.querySelector('#awStore').value;
    var go=back.querySelector('#awGo'); go.disabled=true; go.textContent='Adding…';
    var rows=days.map(function(d){return {staff_id:HED,store:store,weekday:d,start_min:sMin,end_min:eMin};});
    var r=await sb.from('interview_availability').insert(rows).select();
    if(r.error){toast(r.error.message,true);go.disabled=false;updGo();return;}
    (Array.isArray(r.data)?r.data:[r.data]).forEach(function(w){WINS.push(w);});
    back.remove();
    toast(days.length+(days.length===1?' window':' windows')+' added');
    render();
  };
}

/* ================= Booking links ================= */
function renderLinks(){
  var any=location.origin+'/interview.html';
  var hostRows=SETTINGS.filter(function(c){return staffById(c.staff_id);});
  // desktop — table (unchanged)
  var rows=hostRows.map(function(c){
    var link=any+'?h='+c.staff_id;
    return '<tr><td><span style="font-family:Nunito;font-weight:800">'+esc(hostName(c.staff_id))+'</span>'
      +(c.active===false?' <span class="pill paused">Paused</span>':'')+'</td>'
      +'<td style="font-size:.76rem;color:var(--dark-grey);font-weight:700;word-break:break-all">'+esc(link)+'</td>'
      +'<td style="text-align:right;white-space:nowrap"><button class="btn sm" data-cp="'+esc(link)+'">🔗 Copy</button> '
      +'<button class="btn sm" data-qr="'+esc(link)+'" data-qn="'+esc(hostName(c.staff_id))+'">QR</button> '
      +'<a class="btn sm" style="text-decoration:none" href="'+esc(link)+'" target="_blank">Preview</a></td></tr>';
  }).join('');
  // mobile — 5a rows
  var mrows=hostRows.map(function(c){
    var link=any+'?h='+c.staff_id, nm=hostName(c.staff_id), paused=c.active===false;
    var st=staffById(c.staff_id);
    var acts=paused
      ?'<button class="btn resume" data-resume="'+c.staff_id+'">Resume Host</button>'
        +'<a class="btn op" href="'+esc(link)+'" target="_blank">Open</a>'
      :'<button class="btn" data-cp="'+esc(link)+'">🔗 Copy</button>'
        +'<button class="btn" data-sh="'+esc(link)+'">Share</button>'
        +'<a class="btn op" href="'+esc(link)+'" target="_blank">Open</a>';
    return '<div class="lhrow"><div class="top"><span class="hav'+(paused?' off':'')+'">'+esc(initials(nm))+'</span>'
      +'<div style="flex:1;min-width:0"><div class="nm">'+esc(nm)+(paused?' <span class="pill paused">Paused</span>':'')+'</div>'
      +'<div class="lu">interview.html?h='+c.staff_id+(st&&st.home_store?' · '+esc(storeLbl(st.home_store)):'')+'</div></div></div>'
      +'<div class="acts">'+acts+'</div></div>';
  }).join('');
  $('#view').innerHTML=
    '<div class="dv"><div class="card"><div class="ct" style="margin-bottom:10px">Shared Link — Anyone Available</div>'
    +'<div class="linkbox"><span style="flex:1">'+esc(any)+'</span></div>'
    +'<div style="margin-top:12px"><button class="btn pri" data-cp="'+esc(any)+'">🔗 Copy Shared Link</button> '
    +'<button class="btn" data-qr="'+esc(any)+'" data-qn="Shared Booking Link">QR</button></div></div>'
    +'<div class="card"><div class="ct" style="margin-bottom:8px">Per-Host Links</div>'
    +'<table><thead><tr><th>Host</th><th>Link</th><th></th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="3"><div class="empty">No hosts yet — add one under Hosts.</div></td></tr>')+'</tbody></table></div></div>'
    +'<div class="mv"><div class="card lcard"><div class="ct" style="margin-bottom:10px">Shared Link</div>'
    +'<div class="urlbox"><span>'+esc(any)+'</span></div>'
    +'<div class="lact"><button class="btn pri cp" data-cp="'+esc(any)+'">🔗 Copy Link</button>'
    +'<button class="btn" data-sh="'+esc(any)+'">Share</button>'
    +'<button class="btn" data-qr="'+esc(any)+'" data-qn="Shared Booking Link">QR</button></div></div>'
    +'<div class="card"><div class="ct">Per-Host Links</div>'
    +(mrows||'<div class="empty">No hosts yet — add one under Hosts.</div>')+'</div></div>';
  $all('[data-cp]').forEach(function(b){b.onclick=function(){copyTxt(b.getAttribute('data-cp'));};});
  $all('[data-sh]').forEach(function(b){b.onclick=function(){shareLink(b.getAttribute('data-sh'));};});
  $all('[data-qr]').forEach(function(b){b.onclick=function(){openQr(b.getAttribute('data-qr'),b.getAttribute('data-qn'));};});
  $all('[data-resume]').forEach(function(b){b.onclick=function(){setHostActive(+b.getAttribute('data-resume'),true);};});
}
