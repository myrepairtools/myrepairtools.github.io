<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#EAF6FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--row:#F0F1F4;--green:#2E9E5B;
--greend:#0f6e56;--greenbg:#E1F5EE;--amberbg:#FBF1DC;--ambert:#7A5B10;--redbg:#FDEBEC;--card:0 1px 3px rgba(45,45,59,.05)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.45rem;letter-spacing:-.3px;margin:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.rolebadge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.55rem;text-transform:uppercase;letter-spacing:.4px;
color:var(--red);border:1px solid #F6C9CA;background:#FFF1F1;border-radius:5px;padding:2px 6px}
.storesel{height:36px;width:180px;padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.92rem;color:var(--dark);cursor:pointer}
.storesel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
/* table */
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--card)}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;
letter-spacing:.8px;color:var(--grey);background:#fafafa;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:.86rem;border-bottom:1px solid rgba(224,226,234,.6);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(79,176,227,.04)}
.pname{font-family:'Nunito',sans-serif;font-weight:800;color:var(--dark)}
.psub{font-size:.72rem;font-weight:700;color:var(--grey);margin-top:1px}
.pbar{width:92px;height:7px;border-radius:999px;background:#ECEDF1;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pbar>i.red{background:var(--red)}.pbar>i.green{background:var(--green)}
.pcount{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--dark-grey);margin-left:8px}
.rednote{font-size:.7rem;font-weight:800;color:var(--red);margin-top:3px}
.tone{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:999px}
.tone.amber{background:var(--amberbg);color:var(--ambert)}
.tone.red{background:var(--redbg);color:var(--red)}
.tone.grey{background:#F0F1F4;color:var(--grey)}
.tone.green{background:var(--greenbg);color:var(--greend)}
.ghost{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;border:1.5px solid var(--border);border-radius:8px;
background:#fff;color:var(--dark);padding:5px 10px;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--blue);color:var(--blued)}
.caption{font-size:.74rem;font-weight:700;color:var(--grey);margin-top:10px}
.empty{color:var(--grey);font-weight:700;font-size:.85rem;padding:20px}
/* slide-over */
.scrim{position:fixed;inset:0;background:rgba(45,45,59,.32);z-index:1100;display:none}
.scrim.show{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;background:#fff;z-index:1101;
box-shadow:-18px 0 44px rgba(45,45,59,.25);display:none;flex-direction:column}
.panel.show{display:flex}
@media(max-width:860px){.panel{width:100vw}}
.p-hd{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1.5px solid var(--border)}
.p-av{width:40px;height:40px;border-radius:50%;background:var(--bluebg);color:var(--blued);display:flex;align-items:center;
justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;flex:none}
.p-nm{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.02rem}
.p-sub{font-size:.74rem;font-weight:700;color:var(--grey2);margin-top:1px}
.p-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--light-grey);color:var(--dark-grey);cursor:pointer;
display:flex;align-items:center;justify-content:center;margin-left:auto;flex:none}
.p-x:hover{background:#ECEDF1}
.p-bd{flex:1;overflow:auto;padding:16px 20px}
.p-ft{display:flex;align-items:center;padding:12px 20px;border-top:1.5px solid var(--border)}
.p-ft a{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--blue);text-decoration:none}
.eyerow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.eyebrow{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.9px;color:var(--grey)}
.countchip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;padding:2px 9px;border-radius:999px}
.sect{margin-bottom:20px}
/* setup checklist */
.cklist{border:1px solid var(--border);border-radius:11px;overflow:hidden}
.ckrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--row)}
.ckrow:last-child{border-bottom:none}
.ckic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ckic.ok{background:var(--greenbg);color:var(--greend)}
.ckic.miss{background:var(--redbg);color:var(--red)}
.ckic.na{background:#F0F1F4;color:var(--grey)}
.ckbox{width:18px;height:18px;border-radius:5px;flex:none;cursor:pointer;border:1.5px solid #C7CAD4;background:#fff;
display:flex;align-items:center;justify-content:center;padding:0}
.ckbox.on{background:var(--green);border-color:var(--green);color:#fff}
.cklbl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark)}
.cklbl.dim{color:var(--grey)}
.cksub{font-size:.68rem;font-weight:700;color:var(--grey);margin-top:1px}
.cksub.red{color:var(--red)}
.ckt{flex:1;min-width:0}
.cklink{font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;color:var(--blue);text-decoration:none;white-space:nowrap}
.ckaudit{font-size:.68rem;font-weight:700;color:var(--grey);white-space:nowrap}
/* assigned modules */
.modcard{border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:8px}
.modnm{font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem}
.modauto{font-size:.66rem;font-weight:700;color:var(--grey);margin-top:1px}
.modpr{font-size:.7rem;font-weight:800;color:var(--grey2);white-space:nowrap}
.due{display:inline-flex;align-items:center;gap:5px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;
padding:4px 9px;border-radius:999px;background:#F3F9FD;color:var(--blued);white-space:nowrap;border:none;cursor:pointer}
.due.past{background:var(--redbg);color:var(--red)}
.asgn{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.asgn.on{background:var(--greenbg);color:var(--greend)}
.asgn.off{background:#fff;border:1.5px solid #C7CAD4;color:transparent}
.asgn.off:hover{border-color:var(--green)}
/* next up */
.nurow{display:flex;align-items:center;gap:9px;border:1px solid var(--row);border-radius:10px;padding:8px 11px;margin-bottom:7px}
.nuic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#F0F1F4;color:var(--grey2)}
.nuic.ok{background:var(--greenbg);color:var(--greend)}
.nuic.wait{background:var(--amberbg);color:var(--ambert)}
.nut{flex:1;min-width:0}
.nuttl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nusub{font-size:.66rem;font-weight:700;color:var(--grey)}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:5px 10px;border:none;border-radius:8px;
background:var(--red);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.toast{position:fixed;bottom:calc(24px + var(--cpr-bb-h,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
padding:12px 18px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;
opacity:0;pointer-events:none;transition:opacity .18s;z-index:1300}
.toast.show{opacity:1}.toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="page"><div class="empty">Loading…</div></div>
<div class="scrim" id="scrim"></div>
<div class="panel" id="panel"></div>
<div class="toast" id="toast"></div>

<script src="assets/pin-gate.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/locations.js"></script>
<script src="assets/pickers.js"></script>
<script src="assets/onboarding-track.js"></script>
<script type="module">
import { createClient } from "/assets/supabase-js.js";
const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
const sb=createClient(SB_URL,ANON);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isMgr=r=>['owner','admin','manager'].indexOf(r)>-1;
function toast(m,err){const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('show');
  clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),4200);}
const LI={
 clip:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
 check:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
 x:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
 minus:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>',
 cal:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>',
 user:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'};
const ic=(n,s)=>LI[n].replace(/\{s\}/g,s||12);

const NEW_HIRE_DAYS=60;
const MANUAL_ITEMS=[
  {key:'i9',        label:'I-9 collected'},
  {key:'qbw_invite',label:'QB Workforce invite sent'},
  {key:'rq_creds',  label:'RepairQ credentials requested'},
  {key:'shirt',     label:'Shirt ordered'},
  {key:'team_chat', label:'Added to team chat'},
];

let AUTH=null,BOOTED=false;
let STAFF=[],PROFILES={},SCHEDROWS={},ROSTERROWS={},TICKS={},MODULES=[],SECTIONS=[],ARTS=[],STEPS=[],ASSIGNS=[],READS=[],ATTEMPTS=[],SDONE=[],QUIZROWS=[],EARNPERMS={};
let STORE='all',SEL=null;

async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){BOOTED=true;AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role};boot();}
}
sb.auth.onAuthStateChange((_e,sess)=>{if(sess)resolveMe(sess);});
(async()=>{try{const s=(await sb.auth.getSession()).data.session;if(s)resolveMe(s);}catch(e){}})();

async function loadAll(){
  const [st,pf,sc,cr,tk,mo,se,ar,sp,as,rd,at,sd,qz,ro,pe,rp]=await Promise.all([
    sb.from('staff').select('id,display_name,role,home_store,authorized_stores,active,birthday,start_date,pin_hash,created_at').eq('active',true),
    sb.from('staff_profiles').select('staff_id,phone,emergency'),
    sb.from('staff_schedule').select('staff_id'),
    sb.from('commission_roster').select('staff_id,accy_goal'),
    sb.from('staff_setup_checklist').select('*'),
    sb.from('onboarding_modules').select('*').eq('active',true).order('sort'),
    sb.from('onboarding_sections').select('*'),
    sb.from('kb_articles').select('id,slug,title,body,status,require_ack,min_role,module_id,section_id,sort_order,published_at,version').eq('status','published'),
    sb.from('onboarding_steps').select('*').eq('active',true),
    sb.from('onboarding_assignments').select('*'),
    sb.from('kb_reads').select('article_id,staff_id,first_read_at,acknowledged_at'),
    sb.from('kb_quiz_attempts').select('quiz_id,staff_id,passed'),
    sb.from('onboarding_step_done').select('*'),
    sb.from('kb_quizzes').select('id,article_id,pass_pct,active,kb_quiz_questions(id)').eq('active',true),
    sb.from('roles').select('id,key'),
    sb.from('permissions').select('id,key').like('key','commission.earn.%'),
    sb.from('role_permissions').select('role_id,permission_id'),
  ]);
  STAFF=(st.data||[]).filter(s=>s.role!=='owner');
  PROFILES={};(pf.data||[]).forEach(p=>{PROFILES[p.staff_id]=p;});
  SCHEDROWS={};(sc.data||[]).forEach(r=>{SCHEDROWS[r.staff_id]=true;});
  ROSTERROWS={};(cr.data||[]).forEach(r=>{ROSTERROWS[r.staff_id]=r;});
  TICKS={};(tk.data||[]).forEach(r=>{TICKS[r.staff_id+':'+r.item]=r;});
  MODULES=mo.data||[];SECTIONS=se.data||[];ARTS=ar.data||[];STEPS=sp.data||[];
  ASSIGNS=(as.data||[]).filter(a=>a.module_id!=null);
  READS=rd.data||[];ATTEMPTS=at.data||[];SDONE=sd.data||[];QUIZROWS=qz.data||[];
  /* which roles earn accessory / device commission (for the n/a rows) */
  EARNPERMS={};
  const permById={};(pe.data||[]).forEach(p=>{permById[p.id]=p.key;});
  const roleById={};(ro.data||[]).forEach(r=>{roleById[r.id]=r.key;});
  (rp.data||[]).forEach(x=>{
    const rk=roleById[x.role_id],pk=permById[x.permission_id];
    if(!rk||!pk)return;
    (EARNPERMS[rk]=EARNPERMS[rk]||{})[pk.replace('commission.earn.','')]=true;
  });
}
const ROLE_ALIAS={owner:'owner',admin:'admin',manager:'admin',employee:'team_member',team_member:'team_member'};
function roleEarns(role,what){const k=ROLE_ALIAS[role]||role;return !!(EARNPERMS[k]&&EARNPERMS[k][what]);}
function shortStore(s){return window.CPRLocations?CPRLocations.display(s):String(s||'').replace(/^CPR\s*/,'');}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtShort(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';return ('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2);}
function fmtDue(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function isNewHire(p){
  const s=p.start_date||String(p.created_at||'').slice(0,10);
  if(!s)return false;
  return (Date.parse(todayISO())-Date.parse(s))/864e5<=NEW_HIRE_DAYS;
}
function personTrack(p){
  const reads={},att={},sdn={};
  READS.filter(r=>r.staff_id===p.id).forEach(r=>{reads[r.article_id]=r;});
  const quiz={};QUIZROWS.forEach(q=>{quiz[q.article_id]={id:q.id,nq:(q.kb_quiz_questions||[]).length};});
  ATTEMPTS.filter(a=>a.staff_id===p.id).forEach(a=>{const c=att[a.quiz_id]||{passed:false};c.passed=c.passed||!!a.passed;att[a.quiz_id]=c;});
  SDONE.filter(r=>r.staff_id===p.id).forEach(r=>{sdn[r.step_id]=r;});
  const arts=ARTS.filter(a=>a.min_role!=='manager'||isMgr(p.role));
  return CPRTrack.build({modules:MODULES,sections:SECTIONS,articles:arts,steps:STEPS,
    assignments:ASSIGNS.filter(a=>a.staff_id===p.id),reads,quizzes:quiz,attempts:att,stepDone:sdn,today:todayISO()});
}
/* ---- new-hire setup checklist rows ---- */
function setupRows(p){
  const prof=PROFILES[p.id]||{};
  const asgn=ASSIGNS.filter(a=>a.staff_id===p.id);
  const rows=[];
  const auto=(ok,label,subOk,subMiss)=>rows.push({kind:ok?'ok':'miss',label,sub:ok?subOk:subMiss});
  auto(!!p.pin_hash,'Staff record & PIN set','verified · staff.pin_hash','no PIN yet');
  auto(!!p.home_store,'Home store + authorized stores',(shortStore(p.home_store)||'')+' · verified','no home store');
  auto(!!SCHEDROWS[p.id],'Recurring schedule exists','staff_schedule · verified','no recurring schedule');
  auto(asgn.length>0,'Onboarding modules assigned',asgn.length+' module'+(asgn.length===1?'':'s')+(asgn.some(a=>a.due_at)?' · due dates set':''),'nothing assigned');
  auto(!!prof.phone,'Phone on file',(prof.phone||'')+' · feeds SMS','nothing on file');
  auto(!!prof.emergency,'Emergency contact','on file','nothing on file');
  auto(!!p.birthday,'Birthday','on file — milestones post','nothing on file — milestones post');
  const earnsA=roleEarns(p.role,'accessories'),earnsD=roleEarns(p.role,'devices');
  if(earnsA)auto(!!ROSTERROWS[p.id],'Accessory commission plan','commission_roster · verified','no commission_roster row');
  else rows.push({kind:'na',label:'Accessory commission plan',sub:'n/a — role doesn’t earn accessory'});
  if(earnsD)auto(!!ROSTERROWS[p.id],'Device commission plan','commission_roster · verified','no commission_roster row');
  else rows.push({kind:'na',label:'Device commission plan',sub:'n/a — role earns '+(earnsA?'accessory only':'neither')});
  MANUAL_ITEMS.forEach(mi=>{
    const t=TICKS[p.id+':'+mi.key];
    rows.push({kind:'manual',key:mi.key,label:mi.label,tick:t||null});
  });
  return rows;
}
function setupCounts(p){
  const rows=setupRows(p);
  const applicable=rows.filter(r=>r.kind!=='na');
  const ready=applicable.filter(r=>r.kind==='ok'||(r.kind==='manual'&&r.tick)).length;
  const gaps=rows.filter(r=>r.kind==='miss').length;
  const todo=rows.filter(r=>r.kind==='manual'&&!r.tick).length;
  return {ready,total:applicable.length,gaps,todo};
}

/* ---------- roster ---------- */
function draw(){
  const people=STAFF.filter(p=>STORE==='all'||p.home_store===STORE)
    .sort((a,b)=>(isNewHire(b)?1:0)-(isNewHire(a)?1:0)||String(a.display_name).localeCompare(b.display_name));
  let h='<div class="hd">'+ic('clip',24)+'<h1>Compliance</h1>'
    +'<span class="rolebadge">'+esc(AUTH.role==='owner'?'Owner':'Manager')+'</span>'
    +'<span style="flex:1"></span>'
    +'<button class="ghost" onclick="location.href=\'onboarding-dashboard.html\'" style="padding:8px 12px">Onboarding Dashboard ›</button>'
    +'<select class="storesel" id="storeSel"><option value="all"'+(STORE==='all'?' selected':'')+'>All stores</option>'
    +(window.CPRLocations?CPRLocations.names():[]).map(s=>'<option value="'+esc(s)+'"'+(STORE===s?' selected':'')+'>CPR '+esc(shortStore(s))+'</option>').join('')
    +'</select></div>';
  h+='<div class="tcard"><table><thead><tr><th>Team member</th><th>Store</th><th>Onboarding</th><th>New-hire setup</th><th></th></tr></thead><tbody>';
  if(!people.length)h+='<tr><td colspan="5"><div class="empty">No one to show.</div></td></tr>';
  people.forEach(p=>{
    const mods=personTrack(p);
    const total=mods.reduce((n,m)=>n+m.total,0),done=mods.reduce((n,m)=>n+m.done,0);
    const pastDue=mods.filter(m=>m.pastDue).length;
    let ob;
    if(!ASSIGNS.some(a=>a.staff_id===p.id))ob='<span style="font-weight:700;color:var(--grey)">Nothing assigned</span>';
    else{
      const pct=total?Math.round(done/total*100):0;
      ob='<span class="pbar"><i class="'+(pastDue?'red':(pct===100?'green':''))+'" style="width:'+pct+'%"></i></span><span class="pcount">'+done+' / '+total+'</span>'
        +(pastDue?'<div class="rednote">⚠ '+pastDue+' module'+(pastDue>1?'s':'')+' past due</div>':'');
    }
    let setup;
    if(!isNewHire(p))setup='<span class="tone grey">—</span>';
    else{
      const c=setupCounts(p);
      if(c.gaps===0&&c.todo===0)setup='<span class="tone green">ready</span>';
      else if(c.gaps>=4)setup='<span class="tone red">'+c.gaps+' gaps</span>';
      else setup='<span class="tone amber">'+(c.gaps?c.gaps+' gap'+(c.gaps>1?'s':''):'')+(c.gaps&&c.todo?' · ':'')+(c.todo?c.todo+' to do':'')+'</span>';
    }
    h+='<tr><td><div class="pname">'+esc(p.display_name)+'</div><div class="psub">'+esc(p.role==='employee'?'Tech':p.role.charAt(0).toUpperCase()+p.role.slice(1))
      +(p.start_date?' · started '+esc(fmtShort(p.start_date)):'')+'</div></td>'
      +'<td style="font-weight:700">CPR '+esc(shortStore(p.home_store||''))+'</td>'
      +'<td>'+ob+'</td><td>'+setup+'</td>'
      +'<td style="text-align:right"><button class="ghost" data-view="'+p.id+'">View ›</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="caption">Setup column runs for new hires only; existing staff show —. Unassigned people read “Nothing assigned”, never 0%.</div>';
  $('#page').innerHTML=h;
  $('#storeSel').onchange=e=>{STORE=e.target.value;draw();};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openPanel(+b.getAttribute('data-view')));
}

/* ---------- slide-over ---------- */
function openPanel(sid){
  SEL=sid;
  const p=STAFF.find(x=>x.id===sid);if(!p)return;
  const initials=String(p.display_name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const newHire=isNewHire(p);
  const rows=setupRows(p),c=setupCounts(p);
  const mods=personTrack(p);
  let h='<div class="p-hd"><span class="p-av">'+esc(initials)+'</span>'
    +'<div><div class="p-nm">'+esc(p.display_name)+'</div><div class="p-sub">'+esc(p.role==='employee'?'Tech':p.role)
    +' · CPR '+esc(shortStore(p.home_store||''))+(p.start_date?' · started '+esc(fmtShort(p.start_date)):'')+'</div></div>'
    +'<button class="p-x" id="pX">'+ic('x',14)+'</button></div>';
  h+='<div class="p-bd">';

  if(newHire){
    h+='<div class="sect"><div class="eyerow"><span class="eyebrow">New-hire setup</span>'
      +'<span class="countchip" style="background:'+(c.gaps?'var(--amberbg)':'var(--greenbg)')+';color:'+(c.gaps?'var(--ambert)':'var(--greend)')+'">'+c.ready+' of '+c.total+' ready</span></div>'
      +'<div class="cklist">'+rows.map(r=>{
        if(r.kind==='manual'){
          const on=!!r.tick;
          const audit=on?esc((r.tick.by_name||'')+(r.tick.by_name?' · ':'')+fmtShort(r.tick.checked_at)):'';
          return '<div class="ckrow"><button class="ckbox'+(on?' on':'')+'" data-tick="'+esc(r.key)+'">'+(on?ic('check',10):'')+'</button>'
            +'<div class="ckt"><div class="cklbl">'+esc(r.label)+'</div></div>'
            +(on?'<span class="ckaudit">'+audit+'</span>':'');
        }
        const icn=r.kind==='ok'?'<span class="ckic ok">'+ic('check',11)+'</span>'
          :r.kind==='miss'?'<span class="ckic miss">'+ic('x',10)+'</span>'
          :'<span class="ckic na">'+ic('minus',10)+'</span>';
        return '<div class="ckrow">'+icn
          +'<div class="ckt"><div class="cklbl'+(r.kind==='na'?' dim':'')+'">'+esc(r.label)+'</div><div class="cksub'+(r.kind==='miss'?' red':'')+'">'+esc(r.sub)+'</div></div>'
          +(r.kind==='miss'?'<a class="cklink" href="employee-records.html#e='+p.id+'">Add in Team Members ›</a>':'')
          +'</div>';
      }).join('')+'</div></div>';
  }

  h+='<div class="sect"><div class="eyerow"><span class="eyebrow">Assigned modules</span></div>';
  MODULES.forEach(m=>{
    const a=ASSIGNS.find(x=>x.staff_id===p.id&&x.module_id===m.id);
    const mx=mods.find(x=>x.mod.id===m.id);
    const auto=(m.auto_assign_role&&m.auto_assign_from)?('auto · '+m.auto_assign_role+' hired ≥ '+fmtDue(m.auto_assign_from)):null;
    h+='<div class="modcard"><div style="flex:1;min-width:0"><div class="modnm">'+esc(m.name)+'</div>'
      +(auto&&a?'<div class="modauto">'+esc(auto)+'</div>':'')+'</div>'
      +(a&&mx?'<span class="modpr">'+mx.done+' / '+mx.total+'</span>':'')
      +(a?'<button class="due'+(a.due_at&&a.due_at<todayISO()?' past':'')+'" data-due="'+m.id+'">'+ic('cal',11)+' '+(a.due_at?('Due '+esc(fmtDue(a.due_at))):'Set due date')+'</button>':'')
      +'<button class="asgn '+(a?'on':'off')+'" data-asgn="'+m.id+'" title="'+(a?'Assigned — click to unassign':'Assign this module')+'">'+ic('check',12)+'</button>'
      +'</div>';
  });
  h+='</div>';

  /* their track — next up: last done + next 2 */
  const flat=[];
  mods.forEach(mx=>mx.rows.forEach(r=>{if(r.type==='item')flat.push(r);}));
  const lastDone=flat.filter(r=>r.state==='done').slice(-1);
  const upcoming=flat.filter(r=>r.state!=='done').slice(0,2);
  const nu=lastDone.concat(upcoming);
  if(nu.length){
    h+='<div class="sect"><div class="eyerow"><span class="eyebrow">Their track — next up</span></div>';
    nu.forEach(r=>{
      const it=r.it;
      const isStep=it.kind==='s';
      const title=isStep?it.s.title:it.a.title;
      let icn,sub,act='';
      if(r.state==='done'){
        icn='<span class="nuic ok">'+ic('check',11)+'</span>';
        sub=isStep?'task · done':'article · read · receipt on file';
      }else if(isStep&&(it.s.who==='manager'||it.s.who==='backoffice')){
        icn='<span class="nuic wait">'+ic('user',12)+'</span>';
        sub=it.s.who==='backoffice'?('task · manager — back office'+(r.state==='next'?' · next up':''))
          :('task · manager + employee'+(r.state==='next'?' · next up':''));
        act='<button class="btn" data-stepdone="'+it.s.id+'">Mark done ✓</button>';
      }else{
        icn='<span class="nuic">'+(isStep?ic('user',12):ic('check',11))+'</span>';
        sub=(isStep?'task · self':'article')+(r.state==='next'?' · next up':'');
      }
      h+='<div class="nurow">'+icn+'<div class="nut"><div class="nuttl">'+esc(title)+'</div><div class="nusub">'+esc(sub)+'</div></div>'+act+'</div>';
    });
    h+='</div>';
  }

  h+='</div><div class="p-ft"><a href="employee-records.html#e='+p.id+'">Open in Team Members ›</a></div>';
  $('#panel').innerHTML=h;
  $('#panel').classList.add('show');$('#scrim').classList.add('show');
  $('#pX').onclick=closePanel;

  document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=async()=>{
    const key=b.getAttribute('data-tick'),ex=TICKS[p.id+':'+key];
    if(ex){const r=await sb.from('staff_setup_checklist').delete().eq('id',ex.id);
      if(r.error)return toast(r.error.message,true);delete TICKS[p.id+':'+key];}
    else{const r=await sb.from('staff_setup_checklist').insert({staff_id:p.id,item:key,checked_by:AUTH.id}).select().single();
      if(r.error)return toast(r.error.message,true);
      r.data.by_name=AUTH.name;TICKS[p.id+':'+key]=r.data;}
    draw();openPanel(p.id);
  });
  document.querySelectorAll('[data-asgn]').forEach(b=>b.onclick=async()=>{
    const mid=+b.getAttribute('data-asgn');
    const ex=ASSIGNS.find(x=>x.staff_id===p.id&&x.module_id===mid);
    if(ex){const r=await sb.from('onboarding_assignments').delete().eq('id',ex.id);
      if(r.error)return toast(r.error.message,true);
      ASSIGNS=ASSIGNS.filter(x=>x.id!==ex.id);}
    else{const r=await sb.from('onboarding_assignments').insert({staff_id:p.id,module_id:mid,assigned_by:AUTH.id}).select().single();
      if(r.error)return toast(r.error.message,true);ASSIGNS.push(r.data);}
    draw();openPanel(p.id);
  });
  document.querySelectorAll('[data-due]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const mid=+b.getAttribute('data-due');
    const a=ASSIGNS.find(x=>x.staff_id===p.id&&x.module_id===mid);if(!a)return;
    const anchor=a.due_at?new Date(a.due_at+'T12:00:00'):new Date();
    if(window.CPRPickers&&CPRPickers.day){
      CPRPickers.day.call(CPRPickers,b,{get:()=>anchor,set:async d=>{
        const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const r=await sb.from('onboarding_assignments').update({due_at:iso}).eq('id',a.id);
        if(r.error)return toast(r.error.message,true);
        a.due_at=iso;draw();openPanel(p.id);
      }});
    }else{
      const v=prompt('Due date (YYYY-MM-DD)',a.due_at||'');
      if(v===null)return;
      sb.from('onboarding_assignments').update({due_at:v||null}).eq('id',a.id).then(r=>{
        if(r.error)return toast(r.error.message,true);
        a.due_at=v||null;draw();openPanel(p.id);});
    }
  });
  document.querySelectorAll('[data-stepdone]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const r=await sb.from('onboarding_step_done').insert({step_id:+b.getAttribute('data-stepdone'),staff_id:p.id,done_by:AUTH.id});
    if(r.error){toast(r.error.message,true);b.disabled=false;return;}
    const sr=await sb.from('onboarding_step_done').select('*').eq('staff_id',p.id);
    SDONE=SDONE.filter(x=>x.staff_id!==p.id).concat(sr.data||[]);
    toast('Done ✓');draw();openPanel(p.id);
  });
}
function closePanel(){$('#panel').classList.remove('show');$('#scrim').classList.remove('show');SEL=null;}
$('#scrim').addEventListener('mousedown',closePanel);

async function loadTickNames(){
  /* resolve checked_by ids -> names for the audit line */
  const ids=[...new Set(Object.values(TICKS).map(t=>t.checked_by).filter(Boolean))];
  if(!ids.length)return;
  const r=await sb.from('staff').select('id,display_name').in('id',ids);
  const by={};(r.data||[]).forEach(s=>{by[s.id]=s.display_name;});
  Object.values(TICKS).forEach(t=>{t.by_name=by[t.checked_by]||'';});
}
async function boot(){
  if(!isMgr(AUTH.role)){$('#page').innerHTML='<div class="empty">Managers only.</div>';return;}
  await loadAll();await loadTickNames();draw();
}
</script>
