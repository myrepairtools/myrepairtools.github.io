<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="700" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">S bracket — tail removed, now in two sizes</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">The second leg is gone; it was getting cut off on the bench every time. With no second leg there is no spring, so the fit is a</text>
  <text x="60" y="104" font-size="15.5" fill="#6b7280">CLEARANCE now — 0.60 mm, it always slips on. A loose one takes a strip of thin tape on the crown underside (amber below).</text>

  <text x="150" y="140" font-size="17" font-weight="bold" fill="#2D2D3B">s-bracket-small</text>
  <text x="150" y="162" font-size="13.5" fill="#6b7280">14 × 17 mm cradle, 20 mm along the bar</text>

  <g>
    <rect x="150" y="200" width="76.5" height="240" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="188" y="462" font-size="13" fill="#6b7280" text-anchor="middle">bar 12.75 × 40</text>

    <path d="M150,176 L248,176 L248,386 L332.1,386 L332.1,284 L296.1,284 L305.7,266
             L350.1,266 L350.1,404 L237.3,404 L230.1,396.8 L230.1,200 L150,200 Z"
          fill="#F3F2F2" stroke="#DC282E" stroke-width="3" stroke-linejoin="round"/>
    <line x1="155" y1="197" x2="225" y2="197" stroke="#E8A33D" stroke-width="4" stroke-dasharray="7 5"/>

    <circle cx="266" cy="368" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="302" cy="368" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="284" cy="336" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="266" cy="304" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="302" cy="304" r="18" fill="#4FB0E3" opacity="0.7"/>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="150" y="500">Mouth 8 mm, 6 mm of overhang. Leg 34 mm — 85 % of the bar.</text>
    <text x="150" y="522">33.4 × 38 × 20 mm, ~5.2 g.</text>
    <text x="150" y="544" fill="#2D2D3B">Same cradle you already proved, just without the tail.</text>
  </g>

  <text x="620" y="140" font-size="17" font-weight="bold" fill="#2D2D3B">s-bracket-large</text>
  <text x="620" y="162" font-size="13.5" fill="#6b7280">20 × 24 mm cradle, 24 mm along the bar</text>

  <g>
    <rect x="620" y="200" width="76.5" height="240" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="658" y="462" font-size="13" fill="#6b7280" text-anchor="middle">bar 12.75 × 40</text>

    <path d="M620,176 L718,176 L718,410 L838.1,410 L838.1,266 L790.1,266 L799.7,248
             L856.1,248 L856.1,428 L707.3,428 L700.1,420.8 L700.1,200 L620,200 Z"
          fill="#F3F2F2" stroke="#DC282E" stroke-width="3" stroke-linejoin="round"/>
    <line x1="625" y1="197" x2="695" y2="197" stroke="#E8A33D" stroke-width="4" stroke-dasharray="7 5"/>

    <circle cx="736" cy="392" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="772" cy="392" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="808" cy="392" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="754" cy="360" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="790" cy="360" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="736" cy="328" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="772" cy="328" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="808" cy="328" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="754" cy="296" r="18" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="790" cy="296" r="18" fill="#4FB0E3" opacity="0.7"/>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="620" y="500">Sticks out 6 mm further, wall 7 mm taller, 4 mm wider along the bar.</text>
    <text x="620" y="522">Mouth 12 mm, 8 mm of overhang. Leg 38 mm — 95 % of the bar.</text>
    <text x="620" y="544" fill="#2D2D3B">39.4 × 42 × 24 mm, ~7.4 g. Twice the cable area.</text>
  </g>

  <g transform="translate(60,600)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#2D2D3B">Where the load goes now that there is only one leg</text>
    <text x="0" y="28" font-size="14.5" fill="#6b7280">Cables hang forward of the bar, so the bracket wants to rotate nose-down about the bar's top front corner. The one leg</text>
    <text x="0" y="50" font-size="14.5" fill="#6b7280">resists that by bearing on the bar's near face — which is why it runs 85–95 % of the way down rather than being a stub.</text>
  </g>
</svg>
