<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="DejaVu Sans, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="bold" fill="#2D2D3B">S bracket — section through the cross bar</text>
  <text x="40" y="72" font-size="15.5" fill="#6b7280">Hangs over the top of the bar. The cradle closes back over itself, so a full one cannot spill.</text>

  <g>
    <rect x="351" y="110" width="89.25" height="280" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="396" y="414" font-size="14" fill="#2D2D3B" text-anchor="middle">cross bar</text>
    <text x="396" y="433" font-size="14" fill="#6b7280" text-anchor="middle">12.75 × 40</text>

    <path d="M330,82 L458.8,82 L458.8,327 L556.8,327 L556.8,208 L514.8,208 L526,187
             L577.8,187 L577.8,348 L446.2,348 L437.8,339.6 L437.8,110
             L351,110 L351,213.6 L342.6,222 L330,222 Z"
          fill="#F3F2F2" stroke="#DC282E" stroke-width="3" stroke-linejoin="round"/>

    <circle cx="479.8" cy="306" r="21" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="521.8" cy="306" r="21" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="500.8" cy="269.6" r="21" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="479.8" cy="233.2" r="21" fill="#4FB0E3" opacity="0.7"/>
    <circle cx="521.8" cy="233.2" r="21" fill="#4FB0E3" opacity="0.7"/>
  </g>

  <g stroke="#6b7280" stroke-width="1.3" fill="none">
    <path d="M328,88 L306,88"/>
    <path d="M349,164 L306,164"/>
    <path d="M328,200 L312,200 L312,238"/>
    <path d="M460,150 L592,150"/>
    <path d="M579,197 L592,197"/>
    <path d="M507,352 L592,352"/>
  </g>

  <g fill="#2D2D3B" text-anchor="end">
    <text x="298" y="84" font-size="15" font-weight="bold">crown, 4 mm</text>
    <text x="298" y="104" font-size="13.5" fill="#6b7280">sits on the bar's top face —</text>
    <text x="298" y="122" font-size="13.5" fill="#6b7280">the bar carries the load, not friction</text>

    <text x="298" y="160" font-size="15" font-weight="bold">jaws — 12.40 mm gap</text>
    <text x="298" y="180" font-size="13.5" fill="#6b7280">0.35 mm interference on a 12.75 bar</text>
    <text x="298" y="198" font-size="13.5" fill="#6b7280">0.31 % strain — nowhere near cracking</text>

    <text x="298" y="242" font-size="15" font-weight="bold">back jaw, 16 mm</text>
    <text x="298" y="262" font-size="13.5" fill="#6b7280">short, so it clears the frame</text>
  </g>

  <g fill="#2D2D3B">
    <text x="600" y="146" font-size="15" font-weight="bold">spine</text>
    <text x="600" y="166" font-size="13.5" fill="#6b7280">the front jaw runs straight on into the cradle</text>

    <text x="600" y="212" font-size="15" font-weight="bold">return lip — 8 mm mouth</text>
    <text x="600" y="232" font-size="13.5" fill="#6b7280">6 mm of overhang closing back over the</text>
    <text x="600" y="250" font-size="13.5" fill="#6b7280">cables. Flared tip, so they feed in from</text>
    <text x="600" y="268" font-size="13.5" fill="#6b7280">above and then cannot roll back out.</text>

    <text x="600" y="348" font-size="15" font-weight="bold">cradle, 14 × 17 mm</text>
    <text x="600" y="368" font-size="13.5" fill="#6b7280">a fistful of charge cables</text>
  </g>

  <g>
    <line x1="250" y1="330" x2="250" y2="292" stroke="#1a7f4b" stroke-width="3"/>
    <path d="M250,284 L242,300 L258,300 Z" fill="#1a7f4b"/>
    <text x="250" y="352" font-size="14" font-weight="bold" fill="#1a7f4b" text-anchor="middle">push up</text>
    <text x="250" y="370" font-size="13" fill="#1a7f4b" text-anchor="middle">until the crown seats</text>
    <text x="250" y="388" font-size="13" fill="#1a7f4b" text-anchor="middle">(or slide on from the end)</text>
  </g>

  <g transform="translate(40,486)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2D2D3B">Both halves are closed now</text>
    <text x="0" y="24" font-size="14.5" fill="#6b7280">The bar's top face holds the bracket up, so friction is not doing the work. The lip holds the cables in, so the pile is not.</text>
    <text x="0" y="46" font-size="14.5" fill="#6b7280">Mouth 8 mm, cradle 14 mm: same proportions as the screw hook, which is the shape that already works.</text>
  </g>
</svg>
