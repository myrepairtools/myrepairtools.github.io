<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="720" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">T-slot clip — one tie, straight through the middle</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">The tie runs UNDER the head, not through it. The old slots went straight through, so the rail sealed them off on install.</text>
  <text x="60" y="104" font-size="15.5" fill="#6b7280">The tunnel is relieved out of the inner face instead — the aluminium is the far wall now, not a plug.</text>

  <text x="60" y="160" font-size="17" font-weight="bold" fill="#2D2D3B">Through the tie tunnel</text>
  <text x="60" y="182" font-size="13.5" fill="#6b7280">y = 0, the centre line</text>

  <g>
    <path d="M60,340 L220.3,340 L220.3,357.5 L197.5,357.5 L197.5,410 L60,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <path d="M440,340 L279.7,340 L279.7,357.5 L302.5,357.5 L302.5,410 L440,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="100" y="332" font-size="13" fill="#6b7280">rail</text>

    <rect x="166" y="302.2" width="168" height="37.8" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="166" y="323.2" width="168" height="16.8" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>

    <rect x="222" y="340" width="11.2" height="49" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="243" y="340" width="14" height="49" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="266.8" y="340" width="11.2" height="49" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.6"/>
    <text x="250" y="430" font-size="12.5" fill="#1a7f4b" text-anchor="middle">stem bridges the tunnel over 7 mm</text>

    <circle cx="250" cy="276" r="25" fill="#4FB0E3" opacity="0.75"/>
    <text x="250" y="281" font-size="12" fill="#2D2D3B" text-anchor="middle">cable</text>

    <path d="M180,334 L320,334 C340,334 344,310 338,300
             C316,255 288,230 250,230 C212,230 184,255 162,300
             C156,310 160,334 180,334"
          fill="none" stroke="#DC282E" stroke-width="4.5" stroke-linejoin="round"/>
    <text x="360" y="238" font-size="14" font-weight="bold" fill="#DC282E">zip tie</text>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="60" y="452">3.0 mm skin over a 7 × 2.4 mm tunnel, open at both ends.</text>
    <text x="60" y="474">Tie goes through, round both edges, over the cable, cinch.</text>
    <text x="60" y="496" fill="#2D2D3B">Its loop is square to the cable — the only way it holds one</text>
    <text x="60" y="516" fill="#2D2D3B">that runs along the head.</text>
  </g>

  <text x="660" y="160" font-size="17" font-weight="bold" fill="#2D2D3B">Through the catch</text>
  <text x="660" y="182" font-size="13.5" fill="#6b7280">y = −7 mm, head solid here</text>

  <g>
    <path d="M660,340 L800.3,340 L800.3,357.5 L777.5,357.5 L777.5,410 L660,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <path d="M1000,340 L859.7,340 L859.7,357.5 L882.5,357.5 L882.5,410 L1000,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="700" y="332" font-size="13" fill="#6b7280">lip</text>

    <rect x="746" y="302.2" width="168" height="37.8" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="2"/>

    <path d="M802,340 L802,354 L795.7,368 L802,382 L802,389 L813.2,389 L813.2,340 Z"
          fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>
    <path d="M858,340 L858,354 L864.3,368 L858,382 L858,389 L846.8,389 L846.8,340 Z"
          fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>
    <rect x="823" y="340" width="14" height="49" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>

    <text x="830" y="434" font-size="12.5" fill="#1a7f4b" text-anchor="middle">catch sprung behind the lip · 1.40 mm flexure gaps</text>

    <line x1="920" y1="302.2" x2="960" y2="302.2" stroke="#6b7280" stroke-width="1.2"/>
    <line x1="920" y1="340" x2="960" y2="340" stroke="#6b7280" stroke-width="1.2"/>
    <text x="966" y="326" font-size="13.5" fill="#2D2D3B">5.4 mm head</text>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="660" y="452">The catch springs 0.66 mm behind the lip on each side.</text>
    <text x="660" y="474">Getting there asks each leaf for 0.66 mm of travel into a</text>
    <text x="660" y="496" fill="#2D2D3B">1.40 mm gap — 47 % used, 0.32 % strain. Thumb push.</text>
  </g>

  <g transform="translate(60,580)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#2D2D3B">One tie means the tunnel sits under the stem. That is fine, deliberately.</text>
    <text x="0" y="28" font-size="14.5" fill="#6b7280">The leaves are cantilevers anchored at the <tspan font-weight="bold">far</tspan> end of the stem — the flexure gaps open at −Y, so the anchor is at</text>
    <text x="0" y="50" font-size="14.5" fill="#6b7280">y = +8.5…+13 mm, well clear of a tunnel at ±3.5. Nothing that holds the spring is cut, and an assert enforces it.</text>
    <text x="0" y="78" font-size="14.5" fill="#2D2D3B">In print terms the stem's first layer over the tunnel is a <tspan font-weight="bold">7 mm bridge supported on both sides</tspan>, not a cantilever —</text>
    <text x="0" y="100" font-size="14.5" fill="#2D2D3B">so it comes out clean, and it is inside the slot where a little roughness does not matter anyway.</text>
  </g>
</svg>
