<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="700" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">T-slot clip — the tie runs UNDER the head, not through it</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">The old version put the slots straight through the head, so the rail sealed them off the moment it was installed.</text>
  <text x="60" y="104" font-size="15.5" fill="#6b7280">The tunnels are relieved out of the inner face instead — the aluminium is the far wall now, not a plug.</text>

  <text x="60" y="160" font-size="17" font-weight="bold" fill="#2D2D3B">Through a tie tunnel</text>
  <text x="60" y="182" font-size="13.5" fill="#6b7280">y = ±17.5 mm, outboard of the stem</text>

  <g>
    <rect x="60" y="340" width="160" height="60" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="280" y="340" width="160" height="60" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="120" y="420" font-size="13" fill="#6b7280">rail</text>
    <text x="250" y="420" font-size="13" fill="#6b7280" text-anchor="middle">slot opening</text>

    <rect x="166" y="305" width="168" height="35" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="166" y="319.6" width="168" height="20.4" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>

    <circle cx="250" cy="275" r="25" fill="#4FB0E3" opacity="0.75"/>
    <text x="250" y="280" font-size="12" fill="#2D2D3B" text-anchor="middle">cable</text>

    <path d="M180,335 L320,335 C340,335 344,312 338,303
             C316,258 288,232 250,232 C212,232 184,258 162,303
             C156,312 160,335 180,335"
          fill="none" stroke="#DC282E" stroke-width="4.5" stroke-linejoin="round"/>
    <text x="360" y="240" font-size="14" font-weight="bold" fill="#DC282E">zip tie</text>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="60" y="452">2.8 mm skin over a 2.2 mm tunnel, open at both ends.</text>
    <text x="60" y="474">Tie goes through, round both edges, over the cable, cinch.</text>
    <text x="60" y="496" fill="#2D2D3B">Its loop is square to the cable — the only way it holds one</text>
    <text x="60" y="516" fill="#2D2D3B">that runs along the head.</text>
  </g>

  <text x="660" y="160" font-size="17" font-weight="bold" fill="#2D2D3B">Through the stem</text>
  <text x="660" y="182" font-size="13.5" fill="#6b7280">y = 0, head solid here</text>

  <g>
    <path d="M660,340 L800.3,340 L800.3,357.5 L777.5,357.5 L777.5,410 L660,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <path d="M1000,340 L859.7,340 L859.7,357.5 L882.5,357.5 L882.5,410 L1000,410 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="700" y="332" font-size="13" fill="#6b7280">lip</text>

    <rect x="746" y="305" width="168" height="35" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="2"/>

    <path d="M802,340 L802,354 L795.7,368 L802,382 L802,389 L813.2,389 L813.2,340 Z"
          fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>
    <path d="M858,340 L858,354 L864.3,368 L858,382 L858,389 L846.8,389 L846.8,340 Z"
          fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>
    <rect x="823" y="340" width="14" height="49" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.8"/>

    <text x="830" y="434" font-size="12.5" fill="#1a7f4b" text-anchor="middle">catch sprung behind the lip · 1.40 mm flexure gaps</text>

    <line x1="920" y1="305" x2="960" y2="305" stroke="#6b7280" stroke-width="1.2"/>
    <line x1="920" y1="340" x2="960" y2="340" stroke="#6b7280" stroke-width="1.2"/>
    <text x="966" y="327" font-size="13.5" fill="#2D2D3B">5 mm head</text>
  </g>

  <g fill="#6b7280" font-size="14">
    <text x="660" y="452">The catch springs 0.66 mm behind the lip on each side.</text>
    <text x="660" y="474">Getting there asks each leaf for 0.66 mm of travel into a</text>
    <text x="660" y="496" fill="#2D2D3B">1.40 mm gap — 47 % used, 0.32 % strain. Thumb push.</text>
  </g>

  <g transform="translate(60,570)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#2D2D3B">And it should not need a hammer any more</text>
    <text x="0" y="28" font-size="14.5" fill="#6b7280">That was not a tight fit, it was a fault. The old catch asked each leaf for <tspan font-weight="bold">1.155 mm</tspan> of travel</text>
    <text x="0" y="50" font-size="14.5" fill="#6b7280">into a <tspan font-weight="bold">1.20 mm</tspan> gap. The gap closed, the stem went solid, and the leaf had nowhere left to go.</text>
    <text x="0" y="78" font-size="14.5" fill="#2D2D3B">An assert now fails the build if a leaf ever has to use more than 75 % of its own gap.</text>
  </g>
</svg>
