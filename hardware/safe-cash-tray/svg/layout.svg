<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">Safe cash tray — 6 note slots + 2 coin-roll slots</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">Denominations engraved in the front lip, so a count is read off the tray instead of remembered.</text>
  <text x="60" y="104" font-size="15.5" fill="#6b7280">Front cut down on a slope: the notes lean out toward you and there is something to pinch.</text>

  <text x="60" y="140" font-size="15" font-weight="bold" fill="#2D2D3B">Looking down</text>

  <g>
    <rect x="60" y="150" width="478.7" height="363" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="65.5" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="122.3" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="179.0" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="235.8" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="292.5" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="349.3" y="155.5" width="52.8" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="406.1" y="155.5" width="61.6" height="352" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="471.6" y="155.5" width="61.6" height="352" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.4"/>

    <g font-size="14" font-weight="bold" fill="#2D2D3B" text-anchor="middle">
      <text x="91.9" y="495">$1</text>
      <text x="148.7" y="495">$5</text>
      <text x="205.4" y="495">$10</text>
      <text x="262.2" y="495">$20</text>
      <text x="318.9" y="495">$50</text>
      <text x="375.7" y="495">$100</text>
      <text x="436.9" y="495" font-size="12">COIN</text>
      <text x="502.4" y="495" font-size="12">COIN</text>
    </g>
    <g font-size="12" fill="#6b7280" text-anchor="middle">
      <text x="91.9" y="180">24 mm</text>
      <text x="436.9" y="180">28 mm</text>
      <text x="502.4" y="180">28 mm</text>
    </g>

    <line x1="233.8" y1="170" x2="233.8" y2="513" stroke="#DC282E" stroke-width="2"/>
    <line x1="226" y1="170" x2="242" y2="170" stroke="#DC282E" stroke-width="2"/>
    <line x1="226" y1="513" x2="242" y2="513" stroke="#DC282E" stroke-width="2"/>
    <text x="248" y="334" font-size="13" font-weight="bold" fill="#DC282E">156 mm note</text>
    <text x="248" y="352" font-size="12.5" fill="#DC282E">in 160 mm of slot</text>

    <line x1="60" y1="545" x2="538.7" y2="545" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="60" y1="538" x2="60" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="538.7" y1="538" x2="538.7" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <text x="299" y="566" font-size="14" fill="#2D2D3B" text-anchor="middle">217.6 mm</text>

    <line x1="562" y1="150" x2="562" y2="513" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="555" y1="150" x2="569" y2="150" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="555" y1="513" x2="569" y2="513" stroke="#6b7280" stroke-width="1.4"/>
    <text x="586" y="336" font-size="14" fill="#2D2D3B" text-anchor="middle"
          transform="rotate(-90 586 336)">165.0 mm</text>
  </g>

  <text x="700" y="140" font-size="15" font-weight="bold" fill="#2D2D3B">Section across two slots</text>

  <g>
    <rect x="700" y="511.25" width="187" height="8.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="700" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="790.3" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="880.6" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>

    <line x1="706.3" y1="511.25" x2="790.3" y2="295" stroke="#4FB0E3" stroke-width="9"
          stroke-linecap="round"/>
    <line x1="796.6" y1="511.25" x2="880.6" y2="295" stroke="#4FB0E3" stroke-width="9"
          stroke-linecap="round" opacity="0.55"/>

    <line x1="660" y1="520" x2="660" y2="295" stroke="#DC282E" stroke-width="2"/>
    <line x1="653" y1="520" x2="667" y2="520" stroke="#DC282E" stroke-width="2"/>
    <line x1="653" y1="295" x2="667" y2="295" stroke="#DC282E" stroke-width="2"/>
    <text x="646" y="404" font-size="14" font-weight="bold" fill="#DC282E"
          text-anchor="middle" transform="rotate(-90 646 404)">64 mm</text>

    <line x1="906" y1="520" x2="906" y2="362.5" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="899" y1="520" x2="913" y2="520" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="899" y1="362.5" x2="913" y2="362.5" stroke="#6b7280" stroke-width="1.4"/>
    <text x="922" y="446" font-size="13.5" fill="#2D2D3B">45 mm wall</text>
    <text x="922" y="466" font-size="12.5" fill="#6b7280">at the back</text>

    <line x1="700" y1="545" x2="790.3" y2="545" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="700" y1="538" x2="700" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="790.3" y1="538" x2="790.3" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <text x="745" y="566" font-size="13" fill="#2D2D3B" text-anchor="middle">24 mm</text>

    <text x="922" y="300" font-size="13.5" fill="#2D2D3B">The note leans across</text>
    <text x="922" y="318" font-size="13.5" fill="#2D2D3B">its slot, so it stands</text>
    <text x="922" y="336" font-size="13.5" fill="#2D2D3B">well above the wall.</text>
  </g>

  <g transform="translate(60,630)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#DC282E">Check this against the inside of the safe before printing</text>
    <text x="0" y="28" font-size="14.5" fill="#2D2D3B">Floor needed: <tspan font-weight="bold">218 × 165 mm</tspan>. Height needed: <tspan font-weight="bold">64 mm</tspan> — that is the standing note, not the 45 mm wall.</text>
    <text x="0" y="52" font-size="14.5" fill="#6b7280">Give me the safe's interior width, depth and height and I will resize it; the whole tray is driven off a handful of numbers.</text>
  </g>
</svg>
