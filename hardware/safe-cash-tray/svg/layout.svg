<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">Safe cash tray — 5 slots, $50s and $100s together</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">Merging the two big notes buys a whole slot's width, spent on making every slot 30 mm instead of 24.</text>
  <text x="60" y="104" font-size="15.5" fill="#6b7280">Denominations engraved in the front lip, so a count is read off the tray instead of remembered.</text>

  <text x="60" y="140" font-size="15" font-weight="bold" fill="#2D2D3B">Looking down</text>

  <g>
    <rect x="60" y="150" width="356.8" height="363" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="65.5" y="155.5" width="66" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="135.5" y="155.5" width="66" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="205.4" y="155.5" width="66" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="275.4" y="155.5" width="66" height="352" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.4"/>
    <rect x="345.3" y="155.5" width="66" height="352" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="1.4"/>

    <g font-size="15" font-weight="bold" fill="#2D2D3B" text-anchor="middle">
      <text x="98.5" y="495">$1</text>
      <text x="168.5" y="495">$5</text>
      <text x="238.4" y="495">$10</text>
      <text x="308.4" y="495">$20</text>
      <text x="378.3" y="481">$50</text>
      <text x="378.3" y="501">$100</text>
    </g>
    <text x="98.5" y="180" font-size="12" fill="#6b7280" text-anchor="middle">30 mm</text>

    <line x1="203.5" y1="170" x2="203.5" y2="513" stroke="#DC282E" stroke-width="2"/>
    <line x1="196" y1="170" x2="211" y2="170" stroke="#DC282E" stroke-width="2"/>
    <line x1="196" y1="513" x2="211" y2="513" stroke="#DC282E" stroke-width="2"/>
    <text x="218" y="334" font-size="13" font-weight="bold" fill="#DC282E">156 mm note</text>
    <text x="218" y="352" font-size="12.5" fill="#DC282E">in 160 mm of slot</text>

    <line x1="60" y1="545" x2="416.8" y2="545" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="60" y1="538" x2="60" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="416.8" y1="538" x2="416.8" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <text x="238" y="566" font-size="14" fill="#2D2D3B" text-anchor="middle">162.2 mm</text>

    <line x1="440" y1="150" x2="440" y2="513" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="433" y1="150" x2="447" y2="150" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="433" y1="513" x2="447" y2="513" stroke="#6b7280" stroke-width="1.4"/>
    <text x="464" y="336" font-size="14" fill="#2D2D3B" text-anchor="middle"
          transform="rotate(-90 464 336)">165.0 mm</text>
  </g>

  <text x="640" y="140" font-size="15" font-weight="bold" fill="#2D2D3B">Section across two slots</text>

  <g>
    <rect x="680" y="511.25" width="228.9" height="8.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="680" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="791.3" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="902.6" y="362.5" width="6.3" height="148.75" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="1.6"/>

    <line x1="686.3" y1="511.25" x2="791.3" y2="304.25" stroke="#4FB0E3" stroke-width="9"
          stroke-linecap="round"/>
    <line x1="797.6" y1="511.25" x2="902.6" y2="304.25" stroke="#4FB0E3" stroke-width="9"
          stroke-linecap="round" opacity="0.55"/>

    <line x1="640" y1="520" x2="640" y2="304" stroke="#DC282E" stroke-width="2"/>
    <line x1="633" y1="520" x2="647" y2="520" stroke="#DC282E" stroke-width="2"/>
    <line x1="633" y1="304" x2="647" y2="304" stroke="#DC282E" stroke-width="2"/>
    <text x="626" y="412" font-size="14" font-weight="bold" fill="#DC282E"
          text-anchor="middle" transform="rotate(-90 626 412)">62 mm</text>

    <line x1="928" y1="520" x2="928" y2="362.5" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="921" y1="520" x2="935" y2="520" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="921" y1="362.5" x2="935" y2="362.5" stroke="#6b7280" stroke-width="1.4"/>
    <text x="944" y="446" font-size="13.5" fill="#2D2D3B">45 mm wall</text>
    <text x="944" y="466" font-size="12.5" fill="#6b7280">at the back</text>

    <line x1="680" y1="545" x2="791.3" y2="545" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="680" y1="538" x2="680" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="791.3" y1="538" x2="791.3" y2="552" stroke="#6b7280" stroke-width="1.4"/>
    <text x="735" y="566" font-size="13" fill="#2D2D3B" text-anchor="middle">30 mm</text>

    <text x="944" y="300" font-size="13.5" fill="#2D2D3B">A wider slot lets the</text>
    <text x="944" y="318" font-size="13.5" fill="#2D2D3B">note lean flatter, so it</text>
    <text x="944" y="336" font-size="13.5" fill="#2D2D3B">stands 2 mm lower too.</text>
  </g>

  <g transform="translate(60,630)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#DC282E">Check this against the inside of the safe before printing</text>
    <text x="0" y="28" font-size="14.5" fill="#2D2D3B">Floor needed: <tspan font-weight="bold">162 × 165 mm</tspan>. Height needed: <tspan font-weight="bold">62 mm</tspan> — that is the standing note, not the 45 mm wall.</text>
    <text x="0" y="52" font-size="14.5" fill="#6b7280">Give me the safe's interior width, depth and height and I will resize it; the whole tray is driven off a handful of numbers.</text>
  </g>
</svg>
