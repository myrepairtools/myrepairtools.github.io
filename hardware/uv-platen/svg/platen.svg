<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="DejaVu Sans, sans-serif">
  <rect width="1180" height="700" fill="#ffffff"/>

  <text x="60" y="52" font-size="25" font-weight="bold" fill="#2D2D3B">UV printer riser platen — letter size, 5.00 mm</text>
  <text x="60" y="82" font-size="15.5" fill="#6b7280">Letter is 279.4 mm and the bed is 256, so it prints as two halves. Same file twice — turn one round.</text>

  <text x="60" y="128" font-size="15" font-weight="bold" fill="#2D2D3B">Looking down</text>

  <g>
    <rect x="60" y="150" width="291" height="377" fill="#F3F2F2" stroke="#2D2D3B" stroke-width="2"/>
    <path d="M60,338.6 L86.8,338.6 L86.8,352.1 L120.6,352.1 L120.6,338.6
             L153.8,338.6 L153.8,325.1 L187.6,325.1 L187.6,338.6
             L223.9,338.6 L223.9,352.1 L257.7,352.1 L257.7,338.6
             L290.8,338.6 L290.8,325.1 L324.6,325.1 L324.6,338.6 L351,338.6"
          fill="none" stroke="#DC282E" stroke-width="2.4"/>

    <text x="205" y="248" font-size="15" font-weight="bold" fill="#2D2D3B" text-anchor="middle">half A</text>
    <text x="205" y="446" font-size="15" font-weight="bold" fill="#2D2D3B" text-anchor="middle">half B — same part, turned 180°</text>

    <text x="205" y="298" font-size="13" fill="#6b7280" text-anchor="middle">139.7 mm</text>
    <text x="205" y="396" font-size="13" fill="#6b7280" text-anchor="middle">139.7 mm</text>

    <line x1="60" y1="556" x2="351" y2="556" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="60" y1="549" x2="60" y2="563" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="351" y1="549" x2="351" y2="563" stroke="#6b7280" stroke-width="1.4"/>
    <text x="205" y="578" font-size="14" fill="#2D2D3B" text-anchor="middle">215.9 mm (8.5")</text>

    <line x1="378" y1="150" x2="378" y2="527" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="371" y1="150" x2="385" y2="150" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="371" y1="527" x2="385" y2="527" stroke="#6b7280" stroke-width="1.4"/>
    <text x="402" y="338" font-size="14" fill="#2D2D3B" text-anchor="middle"
          transform="rotate(-90 402 338)">279.4 mm (11")</text>

    <line x1="358" y1="345" x2="440" y2="290" stroke="#DC282E" stroke-width="1.3"/>
    <text x="446" y="286" font-size="13.5" font-weight="bold" fill="#DC282E">the seam</text>
    <text x="446" y="304" font-size="12.5" fill="#6b7280">4 keys, alternating,</text>
    <text x="446" y="321" font-size="12.5" fill="#6b7280">symmetric about the</text>
    <text x="446" y="338" font-size="12.5" fill="#6b7280">middle — so one part</text>
    <text x="446" y="355" font-size="12.5" fill="#6b7280">mates with itself</text>
  </g>

  <text x="640" y="128" font-size="15" font-weight="bold" fill="#2D2D3B">The height that matters</text>

  <g>
    <rect x="620" y="460" width="530" height="42" fill="#B9BDCB" stroke="#2D2D3B" stroke-width="1.6"/>
    <text x="885" y="486" font-size="13" fill="#2D2D3B" text-anchor="middle">printer bed</text>

    <rect x="640" y="399" width="84" height="61" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <text x="682" y="530" font-size="13" fill="#2D2D3B" text-anchor="middle">L bracket</text>
    <text x="682" y="548" font-size="12.5" fill="#6b7280" text-anchor="middle">(your 0,0 — stays put)</text>

    <rect x="724" y="390" width="406" height="70" fill="#F3F2F2" stroke="#DC282E" stroke-width="2.4"/>
    <text x="930" y="430" font-size="14" font-weight="bold" fill="#2D2D3B" text-anchor="middle">platen, 5.00 mm</text>

    <rect x="660" y="386" width="470" height="4" fill="#4FB0E3" stroke="#2D2D3B" stroke-width="1"/>
    <text x="1010" y="374" font-size="13.5" font-weight="bold" fill="#2D2D3B" text-anchor="middle">paper</text>

    <line x1="606" y1="460" x2="606" y2="399" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="599" y1="460" x2="613" y2="460" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="599" y1="399" x2="613" y2="399" stroke="#6b7280" stroke-width="1.4"/>
    <text x="590" y="434" font-size="13.5" fill="#2D2D3B" text-anchor="end">4.33</text>

    <line x1="700" y1="394.5" x2="700" y2="330" stroke="#1a7f4b" stroke-width="1.6"/>
    <path d="M700,396 L695,384 L705,384 Z" fill="#1a7f4b"/>
    <text x="700" y="322" font-size="14" font-weight="bold" fill="#1a7f4b" text-anchor="middle">0.67 mm clear</text>
    <text x="700" y="302" font-size="12.5" fill="#6b7280" text-anchor="middle">the paper passes over the bracket</text>
  </g>

  <g transform="translate(60,618)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#DC282E">Measure the printed thickness before you trust it</text>
    <text x="0" y="28" font-size="14.5" fill="#2D2D3B">This is a height reference for a print head. Calipers on a corner: if it comes out 4.93, run <tspan font-family="monospace" font-size="13.5">MRT_THICK=5.07</tspan> and print again.</text>
    <text x="0" y="52" font-size="14.5" fill="#6b7280">Both halves are printed on the same flat bed, so the seam can be off sideways but it cannot make a step — the one error that would matter.</text>
  </g>
</svg>
