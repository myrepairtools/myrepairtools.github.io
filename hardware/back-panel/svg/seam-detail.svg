<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="DejaVu Sans, sans-serif">
  <rect width="980" height="560" fill="#ffffff"/>

  <text x="40" y="52" font-size="26" font-weight="bold" fill="#2D2D3B">Shiplap seam, looking down from above</text>
  <text x="40" y="80" font-size="16" fill="#6b7280">Every panel is identical. Back rabbeted on the left edge, front on the right.</text>

  <g transform="translate(60,150)">
    <rect x="-20" y="-42" width="760" height="144" fill="none" stroke="#9aa5b5" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="748" y="-48" font-size="14" fill="#6b7280" text-anchor="end">3.8 mm groove in the track</text>

    <path d="M0,0 L240,0 L240,32 L400,32 L400,60 L0,60 Z"
          fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2.5"/>
    <path d="M240,0 L700,0 L700,60 L400,60 L400,28 L240,28 Z"
          fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2.5"/>

    <text x="115" y="36" font-size="16" fill="#2D2D3B" text-anchor="middle">panel A</text>
    <text x="580" y="36" font-size="16" fill="#2D2D3B" text-anchor="middle">panel B</text>

    <line x1="240" y1="-16" x2="400" y2="-16" stroke="#DC282E" stroke-width="2"/>
    <line x1="240" y1="-22" x2="240" y2="-10" stroke="#DC282E" stroke-width="2"/>
    <line x1="400" y1="-22" x2="400" y2="-10" stroke="#DC282E" stroke-width="2"/>
    <text x="320" y="-24" font-size="15" font-weight="bold" fill="#DC282E" text-anchor="middle">8 mm overlap</text>

    <line x1="700" y1="0" x2="740" y2="0" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="700" y1="60" x2="740" y2="60" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="736" y1="0" x2="736" y2="60" stroke="#6b7280" stroke-width="1.4"/>
    <text x="748" y="36" font-size="14" fill="#6b7280">3.0 mm panel</text>

    <line x1="200" y1="90" x2="200" y2="62" stroke="#1a7f4b" stroke-width="2"/>
    <text x="200" y="118" font-size="15" fill="#1a7f4b" text-anchor="middle" font-weight="bold">1.4 mm lap each</text>
    <text x="200" y="142" font-size="14" fill="#6b7280" text-anchor="middle">2.8 mm nested, so the seam</text>
    <text x="200" y="162" font-size="14" fill="#6b7280" text-anchor="middle">is no thicker than the panel</text>

    <line x1="480" y1="90" x2="440" y2="46" stroke="#6b7280" stroke-width="1.4"/>
    <text x="486" y="96" font-size="14" fill="#6b7280">0.2 mm gap here so they</text>
    <text x="486" y="114" font-size="14" fill="#6b7280">slide instead of binding</text>
  </g>

  <g transform="translate(60,400)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#2D2D3B">Sliding in</text>
    <path d="M0,26 L520,26" stroke="#9aa5b5" stroke-width="2"/>
    <rect x="0" y="34" width="150" height="26" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="150" y="34" width="150" height="26" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="330" y="34" width="150" height="26" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <line x1="500" y1="47" x2="340" y2="47" stroke="#DC282E" stroke-width="3"/>
    <path d="M340,47 L354,40 L354,54 Z" fill="#DC282E"/>
    <text x="0" y="86" font-size="14" fill="#6b7280">Each panel's front lap rides over the last one's back lap as it goes in.</text>
    <text x="0" y="106" font-size="14" fill="#6b7280">Five lapped panels span 1067.0 mm &#8212; exactly the bay.</text>
  </g>
</svg>
