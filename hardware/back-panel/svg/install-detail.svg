<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="740" viewBox="0 0 1020 740" font-family="DejaVu Sans, sans-serif">
  <rect width="1020" height="740" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="bold" fill="#2D2D3B">Lift-in, one panel at a time</text>
  <text x="40" y="76" font-size="16" fill="#6b7280">No side clearance needed. Nothing has to be assembled first.</text>

  <g id="s1" transform="translate(60,110)">
    <rect x="0" y="0" width="200" height="44" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="14" width="16" height="30" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="0" y="300" width="200" height="20" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="300" width="16" height="12" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <g transform="rotate(-14 100 40)">
      <rect x="92" y="18" width="16" height="250" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
    </g>
    <text x="100" y="356" font-size="16" font-weight="bold" fill="#2D2D3B" text-anchor="middle">1 &#183; top edge in</text>
    <text x="100" y="378" font-size="13" fill="#6b7280" text-anchor="middle">tilted, pushed up into</text>
    <text x="100" y="396" font-size="13" fill="#6b7280" text-anchor="middle">the deep top groove</text>
  </g>

  <g id="s2" transform="translate(360,110)">
    <rect x="0" y="0" width="200" height="44" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="14" width="16" height="30" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="0" y="300" width="200" height="20" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="300" width="16" height="12" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="92" y="18" width="16" height="250" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
    <line x1="140" y1="272" x2="140" y2="298" stroke="#DC282E" stroke-width="2"/>
    <text x="150" y="292" font-size="13" font-weight="bold" fill="#DC282E">7 mm</text>
    <text x="100" y="356" font-size="16" font-weight="bold" fill="#2D2D3B" text-anchor="middle">2 &#183; swing upright</text>
    <text x="100" y="378" font-size="13" fill="#6b7280" text-anchor="middle">bottom clears the</text>
    <text x="100" y="396" font-size="13" fill="#6b7280" text-anchor="middle">bottom track by 7 mm</text>
  </g>

  <g id="s3" transform="translate(660,110)">
    <rect x="0" y="0" width="200" height="44" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="14" width="16" height="30" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="0" y="300" width="200" height="20" fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
    <rect x="92" y="300" width="16" height="12" fill="#ffffff" stroke="#2D2D3B" stroke-width="1.6"/>
    <rect x="92" y="26" width="16" height="250" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
    <line x1="150" y1="60" x2="150" y2="100" stroke="#1a7f4b" stroke-width="3"/>
    <path d="M150,104 L143,90 L157,90 Z" fill="#1a7f4b"/>
    <text x="100" y="356" font-size="16" font-weight="bold" fill="#2D2D3B" text-anchor="middle">3 &#183; drop</text>
    <text x="100" y="378" font-size="13" fill="#6b7280" text-anchor="middle">8 mm still held at the</text>
    <text x="100" y="396" font-size="13" fill="#6b7280" text-anchor="middle">top, 6 mm at the bottom</text>
  </g>

  <g transform="translate(60,560)">
    <text x="0" y="0" font-size="20" font-weight="bold" fill="#2D2D3B">Then the mullion drops in between</text>
    <text x="0" y="26" font-size="15" fill="#6b7280">Both panel edges slot into it, so the seam closes and the faces are forced flush.</text>

    <g transform="translate(0,50)">
      <rect x="0" y="14" width="180" height="26" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
      <rect x="255" y="14" width="180" height="26" fill="#e3e8ef" stroke="#2D2D3B" stroke-width="2"/>
      <path d="M120,0 L195,0 L195,54 L120,54 L120,40 L165,40 L165,14 L120,14 Z"
            fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
      <path d="M195,0 L270,0 L270,14 L225,14 L225,40 L270,40 L270,54 L195,54 Z"
            fill="#C9D3E0" stroke="#2D2D3B" stroke-width="2"/>
      <text x="60" y="32" font-size="14" fill="#2D2D3B" text-anchor="middle">panel</text>
      <text x="345" y="32" font-size="14" fill="#2D2D3B" text-anchor="middle">panel</text>
      <text x="195" y="-8" font-size="14" font-weight="bold" fill="#2D2D3B" text-anchor="middle">mullion</text>
      <text x="480" y="12" font-size="14" fill="#6b7280">15 mm wide, 6.8 mm thick, 226 mm tall</text>
      <text x="480" y="34" font-size="14" fill="#6b7280">6 mm of each panel edge sits inside it</text>
      <text x="480" y="56" font-size="14" fill="#6b7280">4 per bay, rests on the bottom track</text>
    </g>
  </g>
</svg>
