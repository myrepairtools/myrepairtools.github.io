<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Assets · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--light-red:#F15F5E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--grey:#B9BDCB;--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B;--amber:#C9820B;}
*{box-sizing:border-box}
body{margin:0;background:var(--light-grey);color:var(--dark);font-family:'Nunito Sans',system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
h1{font-family:Nunito,sans-serif;font-weight:900;font-size:1.7rem;margin:0;display:flex;align-items:center;gap:10px}
h1 svg{width:26px;height:26px;color:var(--red)}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head .sp{margin-left:auto}
.btn{font-family:Nunito,sans-serif;font-weight:800;font-size:.92rem;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--dark);border:1.5px solid var(--border);transition:.15s}
.btn:hover{border-color:var(--grey)}
.btn svg{width:16px;height:16px}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.red:hover{background:#c0232a;border-color:#c0232a}
.btn.sm{padding:7px 11px;font-size:.84rem}
.btn.ghost{background:transparent;border-color:transparent}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:Nunito,sans-serif;font-weight:800;font-size:.86rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--dark-grey);cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--grey)}
.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.tab .n{opacity:.6;font-weight:700;margin-left:5px}
.search{position:relative;margin-left:auto}
.search input{font-family:'Nunito Sans';font-size:.9rem;font-weight:600;padding:9px 12px 9px 34px;border:1.5px solid var(--border);border-radius:10px;background:#fff;width:230px;max-width:52vw}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.15s;box-shadow:0 1px 2px rgba(45,45,59,.04)}
.card:hover{box-shadow:0 10px 26px rgba(45,45,59,.12);transform:translateY(-2px)}
.thumb{display:block;aspect-ratio:4/5;background:var(--light-grey) center/cover no-repeat;position:relative;border-bottom:1px solid var(--border);overflow:hidden}
.thumb .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--grey)}
.thumb .ph svg{width:44px;height:44px}
.thumb .ext{position:absolute;top:8px;left:8px;background:rgba(45,45,59,.86);color:#fff;font-family:Nunito,sans-serif;font-weight:900;font-size:.64rem;letter-spacing:.04em;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.card .meta{padding:11px 13px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .ttl{font-family:Nunito,sans-serif;font-weight:800;font-size:.95rem;line-height:1.25;color:var(--dark);word-break:break-word}
.card .sub{font-size:.76rem;color:var(--grey);font-weight:700}
.card .chip{align-self:flex-start;margin-top:5px;font-family:Nunito,sans-serif;font-weight:800;font-size:.68rem;padding:2px 8px;border-radius:999px;background:var(--light-grey);color:var(--dark-grey)}
.card .acts{display:flex;gap:6px;padding:0 11px 11px}
.card .acts .btn{flex:1;justify-content:center}
.iconbtn{border:1.5px solid var(--border);background:#fff;border-radius:9px;width:36px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dark-grey);flex:0 0 auto}
.iconbtn:hover{border-color:var(--grey);color:var(--dark)}
.iconbtn svg{width:16px;height:16px}
.empty{text-align:center;color:var(--grey);font-weight:700;padding:70px 20px}
.empty svg{width:52px;height:52px;opacity:.5;display:block;margin:0 auto 14px}
/* modal */
.back{position:fixed;inset:0;background:rgba(45,45,59,.5);display:none;align-items:center;justify-content:center;z-index:1200;padding:20px}
.back.on{display:flex}
.mdl{width:520px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 22px 60px rgba(45,45,59,.34)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.mhd h3{font-family:Nunito,sans-serif;font-weight:900;font-size:1.15rem;margin:0}
.mbd{padding:20px 22px}
.fld{margin-bottom:15px}
.fld label{display:block;font-family:Nunito,sans-serif;font-weight:800;font-size:.8rem;color:var(--dark-grey);margin-bottom:6px}
.fld input[type=text],.fld select,.fld textarea{width:100%;font-family:'Nunito Sans';font-size:.94rem;font-weight:600;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--dark)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
.fld textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--dark-grey);cursor:pointer;transition:.15s;background:var(--light-grey)}
.drop:hover,.drop.over{border-color:var(--blue);background:#fff}
.drop svg{width:34px;height:34px;color:var(--grey);display:block;margin:0 auto 8px}
.drop .picked{font-family:Nunito,sans-serif;font-weight:800;color:var(--dark)}
.prev{width:100%;max-height:220px;object-fit:contain;border-radius:10px;border:1px solid var(--border);background:var(--light-grey);margin-top:4px;display:none}
.mft{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
.mft .sp{margin-left:auto}
.busy{font-size:.82rem;color:var(--blue);font-weight:800}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;font-weight:800;font-size:.9rem;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:2000;box-shadow:0 10px 30px rgba(45,45,59,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
@media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.search{margin-left:0;width:100%}.search input{width:100%;max-width:none}.toolbar{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>Brand Assets</h1>
    <div class="sp"></div>
    <button class="btn red" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add Asset</button>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="q" placeholder="Search assets…" autocomplete="off">
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- upload / edit modal -->
<div class="back" id="back">
  <div class="mdl">
    <div class="mhd"><h3 id="mTitle">Add Asset</h3><button class="iconbtn" id="mClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="mbd">
      <div class="fld" id="dropFld">
        <div class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20 16.7A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
          <div id="dropTxt">Drop a file here, or click to choose<br><span style="font-size:.78rem;color:var(--grey);font-weight:700">Images or PDF · posters, flyers, sale sheets, cards, logos</span></div>
          <input type="file" id="file" accept="image/*,application/pdf,.svg" style="display:none">
        </div>
        <img class="prev" id="prev" alt="preview">
      </div>
      <div class="fld"><label>Title</label><input type="text" id="fTitle" placeholder="e.g. Summer Screen Sale — Poster"></div>
      <div class="row2">
        <div class="fld"><label>Category</label><select id="fCat"></select></div>
        <div class="fld"><label>Tags <span style="color:var(--grey);font-weight:700">(comma-sep)</span></label><input type="text" id="fTags" placeholder="sale, summer"></div>
      </div>
      <div class="fld"><label>Note <span style="color:var(--grey);font-weight:700">(optional)</span></label><textarea id="fNote" placeholder="Anything staff should know when printing this."></textarea></div>
    </div>
    <div class="mft">
      <button class="btn ghost" id="mRemove" style="color:var(--red);display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Remove</button>
      <span class="busy" id="mBusy" style="display:none"></span>
      <div class="sp"></div>
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn red" id="mSave">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="assets/pin-gate.js"></script>
<script src="assets/nav.js"></script>
<script type="module">
import { createClient } from "/assets/supabase-js.js";
import * as pdfjsLib from '/assets/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/pdfjs/pdf.worker.min.mjs';

const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
const sb=createClient(SB_URL,ANON);
const BUCKET='brand-assets';
const pub=p=>SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+p;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m,err){ const t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),3800); }
function fmtSize(b){ if(!b)return ''; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

const CATS=[
  {k:'poster',label:'Posters'},{k:'flyer',label:'Flyers'},{k:'sale_sheet',label:'Sale Sheets'},
  {k:'business_card',label:'Business Cards'},{k:'logo',label:'Logos'},{k:'other',label:'Other'}
];
const catLabel=k=>{ const c=CATS.find(x=>x.k===k); return c?c.label.replace(/s$/,''):'Other'; };

/* ---------- auth (shared pin session) ---------- */
let AUTH=null, BOOTED=false;
async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){ BOOTED=true; AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role}; boot(); }
}
sb.auth.onAuthStateChange((_e,sess)=>{ if(sess) resolveMe(sess); });
(async()=>{ try{ const s=(await sb.auth.getSession()).data.session; if(s) resolveMe(s); }catch(e){} })();

/* ---------- state ---------- */
let ROWS=[];
let CAT=(function(){ const h=(location.hash||'').replace('#',''); if(h&&(h==='all'||CATS.some(c=>c.k===h)))return h;
  try{return localStorage.getItem('cprBrandCat')||'all';}catch(e){return 'all';} })();
let SEARCHQ='';
let EDIT=null;          // row being edited, or null for new upload
let PENDING=null;       // {file, thumbBlob, ext, mime, w, h} for a new upload

function setCat(c){ CAT=c; try{localStorage.setItem('cprBrandCat',c);}catch(e){}
  history.replaceState(null,'','#'+c); draw(); }
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace('#','')||'all';
  if((h==='all'||CATS.some(c=>c.k===h))&&h!==CAT){ CAT=h; try{localStorage.setItem('cprBrandCat',h);}catch(e){} draw(); } });

async function boot(){ await load(); }
async function load(){
  const r=await sb.from('brand_assets').select('*').eq('active',true).order('created_at',{ascending:false});
  if(r.error){ toast('Load failed: '+r.error.message,true); return; }
  ROWS=r.data||[]; drawTabs(); draw();
}

function counts(){ const m={all:ROWS.length}; CATS.forEach(c=>m[c.k]=0);
  ROWS.forEach(x=>{ m[x.category]=(m[x.category]||0)+1; }); return m; }
function drawTabs(){
  const m=counts();
  const mk=(k,label)=>'<button class="tab'+(CAT===k?' on':'')+'" data-cat="'+k+'">'+label+(m[k]?'<span class="n">'+m[k]+'</span>':'')+'</button>';
  $('#tabs').innerHTML=mk('all','All')+CATS.map(c=>mk(c.k,c.label)).join('');
  document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
}
function visible(){
  let list=ROWS.slice();
  if(CAT!=='all') list=list.filter(x=>x.category===CAT);
  if(SEARCHQ){ const q=SEARCHQ.toLowerCase();
    list=list.filter(x=>(x.title||'').toLowerCase().includes(q)
      || (x.note||'').toLowerCase().includes(q)
      || (Array.isArray(x.tags)&&x.tags.join(' ').toLowerCase().includes(q))); }
  return list;
}
function draw(){
  drawTabs();
  const list=visible();
  const g=$('#grid');
  if(!ROWS.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="6" y="2" rx="2"/><path d="M18 22H4a2 2 0 0 1-2-2V6"/><circle cx="12" cy="8" r="2"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/></svg>No brand assets yet.<br><span style="font-weight:700;font-size:.9rem">Tap “Add Asset” to upload your first poster, flyer, or logo.</span></div>'; return; }
  if(!list.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">Nothing here'+(SEARCHQ?' matches “'+esc(SEARCHQ)+'”':' in this category')+' yet.</div>'; return; }
  g.innerHTML=list.map(cardHtml).join('');
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{ e.preventDefault(); openEdit(b.dataset.edit); });
}
function cardHtml(x){
  const url=pub(x.file_path);
  const thumb=x.thumb_path?pub(x.thumb_path):(/(png|jpe?g|webp|gif|svg)$/i.test(x.file_ext||'')?url:'');
  const ext=(x.file_ext||'').toUpperCase();
  const inner=thumb
    ? '<span class="thumb" style="background-image:url('+JSON.stringify(thumb).slice(1,-1)+')"><span class="ext">'+esc(ext)+'</span></span>'
    : '<span class="thumb"><span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg><span style="font-family:Nunito,sans-serif;font-weight:900;font-size:.8rem">'+esc(ext||'FILE')+'</span></span><span class="ext">'+esc(ext)+'</span></span>';
  return '<div class="card">'
    + '<a class="thumblink" href="'+esc(url)+'" target="_blank" rel="noopener" title="Open / print">'+inner+'</a>'
    + '<div class="meta"><div class="ttl">'+esc(x.title)+'</div>'
    + '<div class="sub">'+esc(fmtSize(x.file_size))+(x.uploaded_by_name?' · '+esc(x.uploaded_by_name):'')+'</div>'
    + '<span class="chip">'+esc(catLabel(x.category))+'</span></div>'
    + '<div class="acts">'
    + '<a class="btn sm" href="'+esc(url)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Print</a>'
    + '<a class="iconbtn" href="'+esc(url)+'?download='+encodeURIComponent(x.file_name||x.title||'download')+'" title="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></a>'
    + '<button class="iconbtn" data-edit="'+x.id+'" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
    + '</div></div>';
}

/* ---------- thumbnail generation ---------- */
const THUMB_MAX=720;
function blobFromCanvas(cv,q){ return new Promise(res=>cv.toBlob(res,'image/jpeg',q||0.82)); }
async function thumbForImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const w0=img.naturalWidth||img.width, h0=img.naturalHeight||img.height;
    const s=Math.min(1,THUMB_MAX/Math.max(w0,h0));
    const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(w0*s)); cv.height=Math.max(1,Math.round(h0*s));
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    return { blob:await blobFromCanvas(cv), w:w0, h:h0 };
  } finally { URL.revokeObjectURL(url); }
}
async function thumbForPdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  let vp=page.getViewport({scale:1});
  const s=Math.min(2,THUMB_MAX/Math.max(vp.width,vp.height));
  vp=page.getViewport({scale:s});
  const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return { blob:await blobFromCanvas(cv), w:Math.round(vp.width/s), h:Math.round(vp.height/s) };
}

/* ---------- modal ---------- */
function fillCats(){ $('#fCat').innerHTML=CATS.map(c=>'<option value="'+c.k+'">'+c.label+'</option>').join(''); }
function openAdd(){
  EDIT=null; PENDING=null;
  $('#mTitle').textContent='Add Asset';
  $('#dropFld').style.display='';
  $('#drop').style.display=''; $('#dropTxt').innerHTML='Drop a file here, or click to choose<br><span style="font-size:.78rem;color:var(--grey);font-weight:700">Images or PDF · posters, flyers, sale sheets, cards, logos</span>';
  $('#prev').style.display='none'; $('#prev').src='';
  $('#file').value='';
  $('#fTitle').value=''; fillCats(); $('#fCat').value=CAT!=='all'?CAT:'poster'; $('#fTags').value=''; $('#fNote').value='';
  $('#mRemove').style.display='none'; $('#mSave').textContent='Upload';
  $('#back').classList.add('on');
}
function openEdit(id){
  const x=ROWS.find(r=>r.id===id); if(!x)return;
  EDIT=x; PENDING=null;
  $('#mTitle').textContent='Edit Asset';
  $('#dropFld').style.display='none';   // file is fixed on edit
  $('#fTitle').value=x.title||''; fillCats(); $('#fCat').value=x.category||'other';
  $('#fTags').value=Array.isArray(x.tags)?x.tags.join(', '):''; $('#fNote').value=x.note||'';
  $('#mRemove').style.display=''; $('#mSave').textContent='Save';
  $('#back').classList.add('on');
}
function closeModal(){ $('#back').classList.remove('on'); EDIT=null; PENDING=null; }

async function pickFile(file){
  if(!file)return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const isImg=/^image\//.test(file.type)||/(png|jpe?g|webp|gif|svg)$/i.test(ext);
  const isPdf=file.type==='application/pdf'||ext==='pdf';
  $('#dropTxt').innerHTML='<span class="picked">'+esc(file.name)+'</span><br><span style="font-size:.78rem;color:var(--grey);font-weight:700">'+fmtSize(file.size)+' · click to change</span>';
  if(!$('#fTitle').value.trim()){ $('#fTitle').value=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim(); }
  PENDING={ file, ext, mime:file.type||'', thumbBlob:null, w:null, h:null };
  // preview + thumbnail
  try{
    let t=null;
    if(isPdf) t=await thumbForPdf(file);
    else if(isImg) t=await thumbForImage(file);
    if(t){ PENDING.thumbBlob=t.blob; PENDING.w=t.w; PENDING.h=t.h;
      const purl=URL.createObjectURL(t.blob); const pv=$('#prev'); pv.src=purl; pv.style.display='block'; }
  }catch(e){ /* non-fatal — card falls back to a type badge */ }
}

async function save(){
  const title=$('#fTitle').value.trim();
  if(!title){ toast('Give it a title.',true); return; }
  const category=$('#fCat').value;
  const tags=$('#fTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const note=$('#fNote').value.trim()||null;
  const busy=$('#mBusy'); $('#mSave').disabled=true;

  if(EDIT){
    busy.style.display=''; busy.textContent='Saving…';
    const r=await sb.from('brand_assets').update({title,category,tags,note}).eq('id',EDIT.id).select().single();
    $('#mSave').disabled=false; busy.style.display='none';
    if(r.error){ toast('Save failed: '+r.error.message,true); return; }
    const i=ROWS.findIndex(x=>x.id===EDIT.id); if(i>-1)ROWS[i]=r.data;
    closeModal(); draw(); toast('Saved.'); return;
  }

  if(!PENDING){ toast('Choose a file first.',true); $('#mSave').disabled=false; return; }
  busy.style.display=''; busy.textContent='Uploading…';
  const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
  const ext=PENDING.ext||'bin';
  const filePath='files/'+id+'.'+ext;
  const up=await sb.storage.from(BUCKET).upload(filePath,PENDING.file,{contentType:PENDING.mime||undefined,upsert:false});
  if(up.error){ toast('Upload failed: '+up.error.message,true); $('#mSave').disabled=false; busy.style.display='none'; return; }
  let thumbPath=null;
  if(PENDING.thumbBlob){
    thumbPath='thumbs/'+id+'.jpg';
    const tu=await sb.storage.from(BUCKET).upload(thumbPath,PENDING.thumbBlob,{contentType:'image/jpeg',upsert:false});
    if(tu.error) thumbPath=null;   // non-fatal
  }
  const row={ title, category, file_path:filePath, file_name:PENDING.file.name,
    file_ext:ext, mime:PENDING.mime||null, file_size:PENDING.file.size,
    thumb_path:thumbPath, width:PENDING.w, height:PENDING.h, tags, note,
    uploaded_by:AUTH.id, uploaded_by_name:AUTH.name };
  const r=await sb.from('brand_assets').insert(row).select().single();
  $('#mSave').disabled=false; busy.style.display='none';
  if(r.error){ toast('Saved file but record failed: '+r.error.message,true); return; }
  ROWS.unshift(r.data); closeModal(); draw(); toast('Added “'+title+'”.');
}

async function removeAsset(){
  if(!EDIT)return;
  if(!confirm('Remove “'+EDIT.title+'” from Brand Assets? Staff will no longer see it.'))return;
  const r=await sb.from('brand_assets').update({active:false}).eq('id',EDIT.id);
  if(r.error){ toast('Remove failed: '+r.error.message,true); return; }
  ROWS=ROWS.filter(x=>x.id!==EDIT.id); closeModal(); draw(); toast('Removed.');
}

/* ---------- wire up ---------- */
$('#addBtn').onclick=openAdd;
$('#mClose').onclick=closeModal; $('#mCancel').onclick=closeModal;
$('#back').addEventListener('click',e=>{ if(e.target===$('#back'))closeModal(); });
$('#mSave').onclick=save;
$('#mRemove').onclick=removeAsset;
$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=()=>pickFile($('#file').files[0]);
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{ e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{ e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop',e=>{ const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)pickFile(f); });
let st=null;
$('#q').addEventListener('input',()=>{ clearTimeout(st); st=setTimeout(()=>{ SEARCHQ=$('#q').value.trim(); draw(); },160); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#back').classList.contains('on'))closeModal(); });
</script>
