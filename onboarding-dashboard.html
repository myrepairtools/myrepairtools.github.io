<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#EAF6FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--row:#F0F1F4;--green:#2E9E5B;
--greend:#0f6e56;--greenbg:#E1F5EE;--amberbg:#FBF1DC;--ambert:#7A5B10;--redbg:#FDEBEC;--card:0 1px 3px rgba(45,45,59,.05)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:-.3px;margin:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.rolebadge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.55rem;text-transform:uppercase;letter-spacing:.4px;
color:var(--red);border:1px solid #F6C9CA;background:#FFF1F1;border-radius:5px;padding:2px 6px}
.storesel{height:36px;width:170px;padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.92rem;color:var(--dark);cursor:pointer}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;padding:8px 14px;border:none;border-radius:9px;
background:var(--red);color:#fff;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:170px;max-width:250px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--blue);
border-radius:12px;padding:10px 14px;box-shadow:var(--card)}
.stat .l{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;color:var(--dark-grey)}
.stat .v{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.15rem;color:var(--dark);margin-top:2px}
.stat.red{border-left-color:var(--red);background:#FFF7F7}
.stat.red .v{color:var(--red)}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--card)}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;
letter-spacing:.8px;color:var(--grey);background:#fafafa;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:.86rem;border-bottom:1px solid rgba(224,226,234,.6);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(79,176,227,.04)}
.pname{font-family:'Nunito',sans-serif;font-weight:800;color:var(--dark)}
.psub{font-size:.72rem;font-weight:700;color:var(--grey);margin-top:1px}
.stage{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:999px}
.stage.train{background:var(--bluebg);color:var(--blued)}
.stage.review{background:var(--amberbg);color:var(--ambert)}
.stage.wait{background:#F0F1F4;color:var(--grey2)}
.stage.dec{background:var(--redbg);color:var(--red)}
.stage.ready{background:var(--greenbg);color:var(--greend)}
.dchip{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;border-radius:6px;
padding:2px 7px;margin:1px 4px 1px 0;background:#F0F1F4;color:var(--grey2);white-space:nowrap}
.dchip.on{background:var(--greenbg);color:var(--greend)}
.mdl textarea{width:100%;min-height:180px;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.82rem;line-height:1.55;resize:vertical}
.sigthumb{border:1px solid var(--border);border-radius:8px;background:#fff;max-width:170px;max-height:60px;display:block}
.pbar{width:88px;height:7px;border-radius:999px;background:#ECEDF1;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pbar>i.red{background:var(--red)}
.pcount{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--dark-grey);margin-left:8px}
.rednote{font-size:.7rem;font-weight:800;color:var(--red);margin-top:3px}
.ghost{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;border:1.5px solid var(--border);border-radius:8px;
background:#fff;color:var(--dark);padding:5px 10px;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--blue);color:var(--blued)}
.caption{font-size:.74rem;font-weight:700;color:var(--grey);margin-top:10px}
.empty{color:var(--grey);font-weight:700;font-size:.85rem;padding:20px}
/* modal (new hire + intake review) */
.mask{position:fixed;inset:0;background:rgba(45,45,59,.5);display:none;align-items:center;justify-content:center;z-index:1200;padding:16px}
.mask.show{display:flex}
.mdl{background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.mdl h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;margin:0 0 12px}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mhead h2{flex:1}
.mx{border:none;background:none;font-size:1.5rem;line-height:1;color:var(--grey);cursor:pointer;padding:0 2px;margin-top:-2px}
.mx:hover{color:var(--dark)}
.qbsec{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;text-transform:uppercase;
letter-spacing:.5px;color:var(--grey);margin:14px 0 6px}
.qbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);
border-radius:10px;margin-bottom:8px}
.qbwarn{background:var(--amberbg);color:var(--ambert);border-radius:9px;padding:10px 12px;
font-size:.78rem;font-weight:700;line-height:1.5;margin-top:4px}
.f label{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin:10px 0 3px}
.f input,.f select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.88rem}
/* a picker button that reads as one of the fields around it */
.f .daypick{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.88rem;color:var(--dark);text-align:left;cursor:pointer}
.f .daypick:hover{border-color:var(--blue)}
.f .daypick.none{color:var(--grey)}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.wchips{display:flex;gap:6px;margin:2px 0 12px}
.wchip{flex:1;text-align:center;font-family:'Nunito',sans-serif;font-size:.6rem;font-weight:800;text-transform:uppercase;
letter-spacing:.4px;padding:7px 3px;border-radius:8px;color:var(--grey);background:#fafafa}
.wchip.done{background:var(--light-grey);color:var(--dark)}
.wchip.on{background:var(--dark);color:#fff}
/* seven chips don't fit a phone — the candidate page's track reads better */
.wbar{display:none;align-items:center;gap:10px;margin:2px 0 14px}
.wbar .ptrack{flex:1;height:5px;border-radius:999px;background:#ECEDF1;overflow:hidden}
.wbar .ptrack>i{display:block;height:100%;border-radius:999px;background:var(--red);transition:width .2s}
.wbar .plabel{font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;color:var(--dark);white-space:nowrap}
@media(max-width:620px){
  .wgrid{grid-template-columns:1fr}
  .wchips{display:none}
  .wbar{display:flex}
  .mdl{padding:18px 16px}
}
.btn.alt{background:#fff;color:var(--dark);border:1.5px solid var(--border)}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-family:ui-monospace,monospace}
.rvrow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #F7F7F9;font-size:.8rem}
.rvrow .k{width:100px;flex:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.64rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);padding-top:2px}
.rvrow .v{font-weight:700}
/* ---------- roster: identity cell + menus ---------- */
.wrap{max-width:none;padding:24px 28px 46px}
.prow{display:flex;align-items:center;gap:10px}
.pav{width:34px;height:34px;border-radius:50%;background:var(--bluebg);color:var(--blued);flex:none;
display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:.72rem;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.stage.amber{background:var(--amberbg);color:var(--ambert)}
.nextline{font-size:.7rem;font-weight:800;margin-top:3px;color:var(--grey2)}
.nextline.you{color:var(--blued)}
.nextline.past{color:var(--red)}
.rowhl td:first-child{box-shadow:inset 3px 0 0 #C9820B}
.rowhl{background:#FCFBFA}
.dots{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;color:var(--dark-grey);vertical-align:middle}
.dots:hover{border-color:var(--blue);color:var(--blued)}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:32px;width:210px;background:#fff;border:1px solid var(--border);border-radius:12px;
box-shadow:0 16px 38px rgba(45,45,59,.24);z-index:900;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);padding:9px 12px}
.menu button:hover{background:var(--light-grey)}
.menu button.red{color:var(--red)}
.menu button.red:hover{background:#FFF1F1}
.ghost.red{background:var(--red);border-color:var(--red);color:#fff}
.ghost.red:hover{filter:brightness(1.07);color:#fff}
/* ---------- profile ---------- */
.phd{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:14px 20px 16px;margin-bottom:14px}
.backlink{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:none;padding:0}
.pid{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.pav.big{width:56px;height:56px;font-size:1.05rem}
.pnm{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:-.3px;color:var(--dark);text-decoration:none}
a.pnm:hover{color:var(--blued);text-decoration:underline}
.psub2{font-size:.86rem;font-weight:700;color:var(--dark-grey);margin-top:2px}
.eyebrow{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.58rem;text-transform:uppercase;letter-spacing:.8px;color:var(--grey);margin-bottom:3px}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.prog .n{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--dark-grey);white-space:nowrap}
.bigbar{flex:1;min-width:160px;height:8px;border-radius:999px;background:#ECEDF1;overflow:hidden}
.bigbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.bigbar>i.green{background:var(--green)}
.setupchip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:999px;background:var(--amberbg);color:var(--ambert);white-space:nowrap}
.setupchip.ok{background:var(--greenbg);color:var(--greend)}
/* board */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:24px}
.col{flex:none;width:330px;background:#fff;border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:12px;box-shadow:var(--card)}
.col.hiring{border-top-color:var(--dark)}
.col.setup{border-top-color:var(--red)}
.col.emptymod{border-top-color:var(--grey)}
.col.donecol{border-top-color:var(--green)}
.colhd{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--row)}
.colnm{flex:1;min-width:0;font-family:'Nunito',sans-serif;font-weight:900;font-size:.88rem}
.duechip{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;
padding:3px 9px;border-radius:999px;background:#F3F9FD;color:var(--blued);border:none;cursor:pointer;white-space:nowrap}
.duechip.past{background:var(--redbg);color:var(--red)}
.cnt{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;padding:2px 8px;border-radius:999px;background:#F0F1F4;color:var(--dark-grey);white-space:nowrap}
.cnt.ok{background:var(--greenbg);color:var(--greend)}
.fold{width:22px;height:22px;border:none;border-radius:6px;background:var(--light-grey);color:var(--dark-grey);cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;flex:none}
.irow{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-bottom:1px solid var(--row)}
.irow:last-child{border-bottom:none}
.irow.hl{margin:6px 8px;padding:9px 10px;border:1.5px solid var(--blue);background:#F3F9FD;border-radius:10px;border-bottom:1.5px solid var(--blue)}
.stc{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stc.ok{background:var(--greenbg);color:var(--greend)}
.stc.miss{background:var(--redbg);color:var(--red)}
.stc.na{background:#F0F1F4;color:var(--grey)}
.stc.lock{background:#F0F1F4;color:var(--grey)}
.stc.nxt{background:var(--bluebg);color:var(--blued)}
.stc.who{background:#F0F1F4;color:var(--grey2)}
.ckb{width:18px;height:18px;border-radius:5px;flex:none;cursor:pointer;border:1.5px solid #C7CAD4;background:#fff;
display:flex;align-items:center;justify-content:center;padding:0;margin-top:2px;color:transparent}
.ckb.on{background:var(--green);border-color:var(--green);color:#fff}
.ckb:disabled{cursor:default;opacity:.55}
.itxt{flex:1;min-width:0}
.ittl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);line-height:1.35}
.ittl.done{text-decoration:line-through;color:var(--grey2)}
.ittl.lock{color:var(--grey)}
.isub{font-size:.66rem;font-weight:700;color:var(--grey2);margin-top:1px}
.isub.nx{font-weight:800;color:var(--blued)}
.isub.blocked{color:var(--ambert)}
.ownchip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.56rem;text-transform:uppercase;letter-spacing:.4px;
padding:2px 6px;border-radius:5px;flex:none;margin-top:2px}
.ownchip.mgr{background:var(--bluebg);color:var(--blued)}
.ownchip.bo{background:#F0F1F4;color:var(--dark-grey)}
.iact{font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px 0;white-space:nowrap}
.iact:hover{color:var(--blued);text-decoration:underline}
.sechd{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;font-family:'Nunito',sans-serif;font-weight:800;
font-size:.6rem;text-transform:uppercase;letter-spacing:.8px;color:var(--grey)}
.sechd .sc{margin-left:auto;font-size:.62rem}
.dashbox{margin:12px;border:1.5px dashed #D2D5DF;border-radius:10px;padding:18px 12px;text-align:center;
font-size:.8rem;font-weight:700;color:var(--grey2)}
.stub{margin:0;padding:22px 14px;text-align:center}
.stubpill{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:4px 12px;
border-radius:999px;background:#F0F1F4;color:var(--grey2)}
.stubsub{font-size:.72rem;font-weight:700;color:var(--grey);margin-top:8px}
.strip{flex:none;width:54px;min-height:220px;background:#fff;border:1px solid var(--border);border-top:3px solid var(--green);
border-radius:12px;box-shadow:var(--card);display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer}
.strip .stc{margin:0 0 8px}
.striplbl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Nunito',sans-serif;font-weight:800;font-size:.76rem;color:var(--greend);flex:1;display:flex;align-items:center}
.mentorsel{height:36px;width:170px;padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.88rem;color:var(--dark);cursor:pointer}
.asgn2{width:26px;height:26px;border-radius:50%;border:1.5px solid #C7CAD4;cursor:pointer;flex:none;background:#fff;color:transparent;
display:flex;align-items:center;justify-content:center;margin-top:0}
.asgn2.on{background:var(--greenbg);border-color:var(--greenbg);color:var(--greend)}
.asgn2:hover{border-color:var(--green)}
@media(max-width:860px){
  .wrap{padding:18px 12px 40px}
  .board{flex-direction:column}
  .col{width:100%}
  .strip{width:100%;min-height:0;flex-direction:row;padding:0 12px;height:44px;gap:9px}
  .strip .stc{margin:0}
  .striplbl{writing-mode:horizontal-tb;transform:none}
  .hidemob{display:none}
  .pid{gap:10px}
  .pnm{font-size:1.2rem}
}
.toast{position:fixed;bottom:calc(24px + var(--cpr-bb-h,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
padding:12px 18px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;
opacity:0;pointer-events:none;transition:opacity .18s;z-index:1300}
.toast.show{opacity:1}.toast.err{background:var(--red)}
</style>
</head>

 dots:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>'};

let VIEW={mode:'roster'};
let STAFF=[],ALLSTAFF=[],OWNER=null,STORES=[],INTAKES=[],PENDING=[],IK_BYSTAFF={},MODULES=[],SECTIONS=[],ARTS=[],STEPS=[],
    ASSIGNS=[],READS=[],SIGROWS=[],ATTEMPTS=[],SDONE=[],QUIZROWS=[],TICKS={},PROFILES={},SCHEDROWS={},QBTIME={},ROSTERROWS={},EARNPERMS={};
let OFFER_TPL='';
async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){BOOTED=true;AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role};boot();}
}
sb.auth.onAuthStateChange((_e,sess)=>{if(sess)resolveMe(sess);});
(async()=>{try{const s=(await sb.auth.getSession()).data.session;if(s)resolveMe(s);}catch(e){}})();
async function jwt(){return (await sb.auth.getSession()).data.session.access_token;}

async function loadAll(){
  const [st,ik,mo,se,ar,sp,as,rd,at,sd,qz,tk,tpl,sr,pf,sc,cr,ro,pe,rp,sg,qt]=await Promise.all([
    sb.from('staff').select('id,display_name,role,role_on_start,home_store,authorized_stores,active,start_date,created_at,pin_hash,birthday,title,mentor_staff_id,onboarding_completed_at,onboarding_canceled_at').eq('active',true),
    sb.from('staff_intake').select('*').order('created_at',{ascending:false}),
    sb.from('onboarding_modules').select('*').eq('active',true).order('sort'),
    sb.from('onboarding_sections').select('*'),
    sb.from('kb_articles').select('id,slug,title,status,require_ack,require_signature,signature_version,min_role,module_id,section_id,sort_order').eq('status','published'),
    sb.from('onboarding_steps').select('*').eq('active',true),
    sb.from('onboarding_assignments').select('*'),
    sb.from('kb_reads').select('article_id,staff_id,acknowledged_at'),
    sb.from('kb_quiz_attempts').select('quiz_id,staff_id,passed'),
    sb.from('onboarding_step_done').select('*'),
    sb.from('kb_quizzes').select('id,article_id,active,kb_quiz_questions(id)').eq('active',true),
    sb.from('staff_setup_checklist').select('*'),
    sb.from('app_settings').select('value').eq('key','hiring.offer_template').maybeSingle(),
    sb.from('stores').select('store,manager_staff_id,active'),
    sb.from('staff_profiles').select('staff_id,phone,emergency,shirt_size,photo_path'),
    sb.from('staff_schedule').select('staff_id'),
    sb.from('commission_roster').select('staff_id'),
    sb.from('roles').select('id,key'),
    sb.from('permissions').select('id,key').like('key','commission.earn.%'),
    sb.from('role_permissions').select('role_id,permission_id'),
    sb.from('kb_signatures').select('article_id,staff_id,signature_epoch'),
    sb.from('qbtime_users').select('staff_id,active'),
  ]);
  OFFER_TPL=(tpl.data&&tpl.data.value&&tpl.data.value.body)||'';
  STORES=sr.data||[];
  OWNER=(st.data||[]).filter(x=>x.role==='owner')[0]||null;
  ALLSTAFF=st.data||[];
  STAFF=(st.data||[]).filter(x=>x.role!=='owner');
  INTAKES=ik.data||[];
  PENDING=INTAKES.filter(i=>i.status!=='promoted');
  IK_BYSTAFF={};INTAKES.forEach(i=>{if(i.promoted_staff_id&&!IK_BYSTAFF[i.promoted_staff_id])IK_BYSTAFF[i.promoted_staff_id]=i;});
  MODULES=mo.data||[];SECTIONS=se.data||[];ARTS=ar.data||[];STEPS=sp.data||[];
  ASSIGNS=(as.data||[]).filter(a=>a.module_id!=null);
  READS=rd.data||[];SIGROWS=sg.data||[];ATTEMPTS=at.data||[];SDONE=sd.data||[];QUIZROWS=qz.data||[];
  TICKS={};(tk.data||[]).forEach(r=>{TICKS[r.staff_id+':'+r.item]=r;});
  PROFILES={};(pf.data||[]).forEach(x=>{PROFILES[x.staff_id]=x;});
  SCHEDROWS={};(sc.data||[]).forEach(r=>{SCHEDROWS[r.staff_id]=true;});
  QBTIME={};(qt.data||[]).forEach(r=>{if(r.staff_id!=null)QBTIME[r.staff_id]=true;});
  ROSTERROWS={};(cr.data||[]).forEach(r=>{ROSTERROWS[r.staff_id]=r;});
  EARNPERMS={};
  const permById={};(pe.data||[]).forEach(x=>{permById[x.id]=x.key;});
  const roleById={};(ro.data||[]).forEach(x=>{roleById[x.id]=x.key;});
  (rp.data||[]).forEach(x=>{
    const rk=roleById[x.role_id],pk=permById[x.permission_id];
    if(!rk||!pk)return;
    (EARNPERMS[rk]=EARNPERMS[rk]||{})[pk.replace('commission.earn.','')]=true;

}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dchips(i){
  const c=(l,on)=>'<span class="dchip'+(on?' on':'')+'">'+(on?'✓ ':'○ ')+l+'</span>';
  return c('Offer',!!i.offer_signed_at)+c('Handbook',!!i.handbook_signed_at)+c('Form',!!i.submitted_at);
}
function shortStore(s){return window.CPRLocations?CPRLocations.display(s):String(s||'').replace(/^CPR\s*/,'');}
const nameKey=s=>String(s||'').toLowerCase().replace(/[^a-z]+/g,'');
const roleName=r=>({owner:'Owner',admin:'Manager',manager:'Manager',team_member:'Team Member',employee:'Team Member',candidate:'Candidate'})[r]||r||'';
const sameName=(a,b)=>!!nameKey(a)&&nameKey(a)===nameKey(b);
function fmtShort(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';return (d.getMonth()+1)+'/'+d.getDate();}
function fmtDue(iso){const d=new Date(String(iso).slice(0,10)+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function isNewHire(p){const s=p.start_date||String(p.created_at||'').slice(0,10);
  return s&&(Date.parse(todayISO())-Date.parse(s))/864e5<=NEW_HIRE_DAYS;}
function initialsOf(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();}
function photoUrl(pid){const pr=PROFILES[pid];return pr&&pr.photo_path?(SB_URL+'/storage/v1/object/public/avatars/'+pr.photo_path):'';}
function avatarHtml(pid,name,big){
  const u=photoUrl(pid);
  return '<span class="pav'+(big?' big':'')+'">'+(u?'<img src="'+esc(u)+'" alt="">':esc(initialsOf(name)))+'</span>';
}
const ROLE_ALIAS={owner:'owner',admin:'admin',manager:'admin',employee:'team_member',team_member:'team_member'};
function roleEarns(role,what){const k=ROLE_ALIAS[role]||role;return !!(EARNPERMS[k]&&EARNPERMS[k][what]);}
function effRole(p){return p.role==='candidate'&&p.role_on_start?p.role_on_start:p.role;}
/* the one track call — employee-facing surfaces hide back-office work
   entirely (same rule as training.html); the manager board shows it all */
function personTrack(p,empView){
  const reads={},att={},sdn={},sgs={};
  READS.filter(r=>r.staff_id===p.id).forEach(r=>{reads[r.article_id]=r;});
  const quiz={};QUIZROWS.forEach(q=>{quiz[q.article_id]={id:q.id,nq:(q.kb_quiz_questions||[]).length};});
  ATTEMPTS.filter(a=>a.staff_id===p.id).forEach(a=>{const c=att[a.quiz_id]||{passed:false};c.passed=c.passed||!!a.passed;att[a.quiz_id]=c;});
  SDONE.filter(r=>r.staff_id===p.id).forEach(r=>{sdn[r.step_id]=r;});
  SIGROWS.filter(r=>r.staff_id===p.id).forEach(r=>{const c=sgs[r.article_id];
    if(!c||r.signature_epoch>c.signature_epoch)sgs[r.article_id]=r;});
  const arts=ARTS.filter(a=>a.min_role!=='manager'||isMgr(effRole(p)));
  return CPRTrack.build({modules:MODULES,sections:SECTIONS,articles:arts,
    steps:empView?STEPS.filter(x=>x.who!=='backoffice'):STEPS,
    assignments:ASSIGNS.filter(a=>a.staff_id===p.id),reads,quizzes:quiz,attempts:att,stepDone:sdn,
    signatures:sgs,today:todayISO()});
}
/* ---- new-hire setup rows (mirrors kb-compliance — keep the two in step) ---- */
const MANUAL_ITEMS=[
  {key:'i9',label:'I-9 collected'},
  {key:'rq_creds',label:'RepairQ credentials requested'},
  {key:'shirt',label:'Shirt ordered'},
  {key:'shirt_issued',label:'Shirt issued'},
  {key:'team_chat',label:'Added to team chat'},
];
function setupRows(p){
  const prof=PROFILES[p.id]||{};
  const asgn=ASSIGNS.filter(a=>a.staff_id===p.id);
  const rows=[];
  const auto=(ok,label,subOk,subMiss)=>rows.push({kind:ok?'ok':'miss',label,sub:ok?subOk:subMiss});
  auto(!!p.pin_hash,'Staff record & PIN set','verified','no PIN yet');
  auto(!!p.home_store,'Home store + authorized stores',(shortStore(p.home_store)||'')+' · verified','no home store');
  auto(!!SCHEDROWS[p.id],'Recurring schedule exists','verified','no recurring schedule');
  auto(!!QBTIME[p.id],'Can clock in — QuickBooks Time','linked','not linked to QuickBooks Time');
  auto(asgn.length>0,'Onboarding modules assigned',asgn.length+' module'+(asgn.length===1?'':'s'),'nothing assigned');
  auto(!!prof.phone,'Phone on file',(prof.phone||''),'nothing on file');
  auto(!!prof.emergency,'Emergency contact','on file','nothing on file');
  auto(!!p.birthday,'Birthday','on file','nothing on file');
  const earnsA=roleEarns(effRole(p),'accessories'),earnsD=roleEarns(effRole(p),'devices');
  if(earnsA)auto(!!ROSTERROWS[p.id],'Accessory commission plan','verified','no commission_roster row');
  else rows.push({kind:'na',label:'Accessory commission plan',sub:'n/a'});
  if(earnsD)auto(!!ROSTERROWS[p.id],'Device commission plan','verified','no commission_roster row');
  else rows.push({kind:'na',label:'Device commission plan',sub:'n/a'});
  MANUAL_ITEMS.forEach(mi=>{
    const t=TICKS[p.id+':'+mi.key];
    const sub=/^shirt/.test(mi.key)?(prof.shirt_size?('size '+prof.shirt_size):'no size on file'):'';
    rows.push({kind:'manual',key:mi.key,label:mi.label,sub,tick:t||null});
  });
  return rows;
}
function setupCounts(p){
  const rows=setupRows(p);
  const applicable=rows.filter(r=>r.kind!=='na');
  const ready=applicable.filter(r=>r.kind==='ok'||(r.kind==='manual'&&r.tick)).length;
  return {ready,total:applicable.length,
    gaps:rows.filter(r=>r.kind==='miss').length,
    todo:rows.filter(r=>r.kind==='manual'&&!r.tick).length};
}
/* ---- Hiring column (intake-derived; the removed roster buttons live here) ---- */
function hiringRows(i){
  if(!i)return[];
  const rows=[],docs=!!i.offer_body;
  const auto=(k,l,at)=>rows.push({k,label:l,auto:true,done:!!at,date:at});
  if(docs){auto('offer','Offer signed',i.offer_signed_at);auto('handbook','Handbook signed',i.handbook_signed_at);}
  auto('form','New-hire form submitted',i.submitted_at);
  rows.push({k:'review',label:'Review intake form',done:!!i.reviewed_at,date:i.reviewed_at,tick:'review',act:'Open form ›'});
  rows.push({k:'qbo',label:'Create in QuickBooks Payroll',done:!!i.qbo_created_at,date:i.qbo_created_at,tick:'qbo',act:'Open QuickBooks ›'});
  rows.push({k:'convert',label:'Match QBO record & convert',auto:!!i.promoted_at,done:!!i.promoted_at,date:i.promoted_at,
    act:i.promoted_at?null:'Match & convert ›'});
  return rows;
}
/* progress = hiring steps + assigned module items; roster and profile must
   count from this same function or the two disagree */
function personProgress(p){
  const i=IK_BYSTAFF[p.id]||null;
  const h=hiringRows(i);
  const mods=personTrack(p,false);
  return {i,h,mods,
    done:h.filter(r=>r.done).length+mods.reduce((n,m)=>n+m.done,0),
    total:h.length+mods.reduce((n,m)=>n+m.total,0)};
}
function nextThing(p,pr){
  const pd=pr.mods.find(m=>m.pastDue);
  if(pd)return {label:pd.mod.name+' past due',past:true};
  const hn=pr.h.find(r=>!r.done);
  if(hn)return {label:hn.label,you:true};
  for(const m of pr.mods){
    const r=m.rows.find(x=>x.type==='item'&&x.state==='next');
    if(r){const it=r.it;
      const you=it.kind==='s'&&(it.s.who==='manager'||it.s.who==='backoffice');
      return {label:(it.kind==='s'?it.s.title:it.a.title),you};}
  }
  return null;
}
function onRoster(p){
  return !p.onboarding_completed_at&&!p.onboarding_canceled_at
    &&(p.role==='candidate'||isNewHire(p));
}

/* ---------- roster ---------- */
function draw(){
  if(VIEW.mode==='profile'){drawProfile(VIEW.sid);return;}
  if(VIEW.mode==='cand'){drawCand(VIEW.iid);return;}
  drawRoster();
}
function drawRoster(){
  const hires=STAFF.filter(onRoster).filter(p=>STORE==='all'||p.home_store===STORE);
  const intakes=PENDING.filter(i=>STORE==='all'||!i.invited_store||i.invited_store===STORE);
  let waitingItems=0,pastDueN=0;
  const rows=[];
  hires.forEach(p=>{
    const pr=personProgress(p);
    const c=setupCounts(p);
    const asg=ASSIGNS.some(a=>a.staff_id===p.id);
    pastDueN+=pr.mods.filter(m=>m.pastDue).length;
    const nx=nextThing(p,pr);
    if(nx&&nx.you&&!nx.past)waitingItems++;
    if(c.todo)waitingItems++;
    const stage=!asg?'<span class="stage amber">Needs training assigned</span>'
      :(pr.total&&pr.done===pr.total&&c.gaps===0&&c.todo===0)?'<span class="stage ready">Ready</span>'
      :'<span class="stage train">In training</span>';
    const setup=c.gaps>=4?'<span class="dchip" style="background:var(--redbg);color:var(--red)">Setup '+c.gaps+' gaps</span>'
      :(c.gaps===0&&c.todo===0)?'<span class="dchip on">Setup ready</span>'
      :'<span class="dchip" style="background:var(--amberbg);color:var(--ambert)">Setup '+c.ready+'/'+c.total+'</span>';
    const pct=pr.total?Math.round(pr.done/pr.total*100):0;
    const mentor=p.mentor_staff_id?(ALLSTAFF.find(x=>x.id===p.mentor_staff_id)||{}).display_name||'—':'—';
    const nline=!nx?'':nx.past
      ?'<div class="nextline past">⚠ '+esc(nx.label)+'</div>'
      :'<div class="nextline'+(nx.you?' you':'')+'">Next: '+esc(nx.label)+' — '+(nx.you?'you':'them')+'</div>';
    rows.push('<tr><td><div class="prow">'+avatarHtml(p.id,p.display_name)
      +'<div><div class="pname">'+esc(p.display_name)+'</div><div class="psub">'
      +esc([roleName(effRole(p)),'CPR '+shortStore(p.home_store||''),
        p.start_date?((p.start_date>todayISO()?'starts ':'started ')+fmtShort(p.start_date)):''].filter(Boolean).join(' · '))
      +'</div></div></div></td>'
      +'<td>'+stage+'</td>'
      +'<td class="hidemob"><span class="dchip on">✓ Hired</span> '+setup+'</td>'
      +'<td>'+(asg||pr.h.length
        ?'<span class="pbar"><i class="'+(pr.mods.some(m=>m.pastDue)?'red':(pct===100?'green':''))+'" style="width:'+pct+'%"></i></span><span class="pcount">'+pr.done+' / '+pr.total+'</span>'+nline
        :'<span style="font-weight:700;color:var(--grey2)">No modules assigned</span>')+'</td>'
      +'<td class="hidemob" style="font-weight:700">'+esc(mentor)+'</td>'
      +'<td style="text-align:right;white-space:nowrap">'
        +'<button class="ghost'+(nx&&nx.you&&!nx.past?' red':'')+'" data-open="'+p.id+'">'+(asg?'View ›':'Assign training ›')+'</button> '
        +'<span class="menuwrap"><button class="dots" data-menu="s'+p.id+'">'+ic('dots',14)+'</button>'
        +'<span class="menu" data-menufor="s'+p.id+'" style="display:none">'
        +'<button data-mact="complete" data-sid="'+p.id+'">Mark completed</button>'
        +'<button data-mact="team" data-sid="'+p.id+'">Open in Team Members ›</button>'
        +'<button class="red" data-mact="cancel" data-sid="'+p.id+'">Cancel onboarding</button>'
        +'</span></span></td></tr>');
  });
  intakes.forEach(i=>{
    const submitted=!!i.submitted_at, declined=!!i.offer_declined_at, docs=!!i.offer_body;
    const nm=i.invited_name||[i.legal_first,i.legal_last].filter(Boolean).join(' ')||'(link sent)';
    if(submitted&&!declined)waitingItems++;
    const h=hiringRows(i);
    const hd=h.filter(r=>r.done).length;
    const pct=h.length?Math.round(hd/h.length*100):0;
    const stage=declined?'<span class="stage dec">Declined</span>'
      :submitted?'<span class="stage review">Ready to convert</span>'
      :docs?'<span class="stage wait">'+(i.offer_signed_at?'Candidate — signing docs':'Offer out')+'</span>'
      :'<span class="stage wait">Waiting on them</span>';
    rows.push('<tr'+(submitted&&!declined?' class="rowhl"':'')+'><td><div class="prow"><span class="pav">'+esc(initialsOf(nm))+'</span>'
      +'<div><div class="pname">'+esc(nm)+'</div><div class="psub">'
      +esc([i.position||'',i.invited_store?('CPR '+shortStore(i.invited_store)):'',
        i.start_date?('starts '+fmtShort(i.start_date)):''].filter(Boolean).join(' · '))+'</div></div></div></td>'
      +'<td>'+stage+'</td>'
      +'<td class="hidemob">'+(docs?dchips(i):'<span class="dchip">form only</span>')+'</td>'
      +'<td>'+(declined?'<span style="font-weight:700;color:var(--grey2)">'
          +(i.decline_note?'“'+esc(i.decline_note)+'”':'declined '+esc(fmtShort(i.offer_declined_at)))+'</span>'
        :'<span class="pbar"><i style="width:'+pct+'%"></i></span><span class="pcount">'+hd+' / '+h.length+'</span>')+'</td>'
      +'<td class="hidemob" style="font-weight:700;color:var(--grey)">—</td>'
      +'<td style="text-align:right;white-space:nowrap">'
        +(declined?'':'<button class="ghost'+(submitted?' red':'')+'" data-openi="'+i.id+'">View ›</button> ')
        +'<span class="menuwrap"><button class="dots" data-menu="i'+i.id+'">'+ic('dots',14)+'</button>'
        +'<span class="menu" data-menufor="i'+i.id+'" style="display:none">'
        +'<button data-mact="copy" data-tok="'+esc(i.token)+'">Copy signing link</button>'
        +(docs&&i.personal_email&&!i.offer_signed_at?'<button data-mact="send" data-iid="'+i.id+'">'+(i.offer_sent_at?'Resend offer':'Send offer')+'</button>':'')
        +'<button class="red" data-mact="del" data-iid="'+i.id+'">Delete intake</button>'
        +'</span></span></td></tr>');
  });

  let h='<div class="hd">'+ic('clip',24)+'<h1>Onboarding</h1>'
    +'<span class="rolebadge">'+esc(AUTH.role==='owner'?'Owner':'Manager')+'</span>'
    +'<span style="flex:1"></span>'
    +'<select class="storesel" id="storeSel"><option value="all"'+(STORE==='all'?' selected':'')+'>All stores</option>'
    +(window.CPRLocations?CPRLocations.names():[]).map(x=>'<option value="'+esc(x)+'"'+(STORE===x?' selected':'')+'>CPR '+esc(shortStore(x))+'</option>').join('')
    +'</select><button class="ghost" onclick="location.href=\'onboarding-setup.html\'" style="padding:8px 12px">Module Setup ›</button>'
    +'<button class="ghost" onclick="location.href=\'kb-compliance.html\'" style="padding:8px 12px">Compliance ›</button>'
    +'<button class="btn" id="newHire">'+ic('plus',11)+' New candidate</button></div>';
  const cands=intakes.filter(i=>!i.offer_declined_at);
  h+='<div class="stats">'
    +'<div class="stat"><div class="l">Candidates &amp; new hires</div><div class="v">'+(hires.length+cands.length)+'</div></div>'
    +'<div class="stat"><div class="l">Waiting on a manager</div><div class="v">'+waitingItems+' item'+(waitingItems===1?'':'s')+'</div></div>'
    +'<div class="stat'+(pastDueN?' red':'')+'"><div class="l">Past due</div><div class="v">'+pastDueN+' module'+(pastDueN===1?'':'s')+'</div></div></div>';
  h+='<div class="tcard"><table><thead><tr><th>New hire</th><th>Stage</th><th class="hidemob">Paperwork</th><th>Progress</th><th class="hidemob">Mentor</th><th></th></tr></thead><tbody>'
    +(rows.length?rows.join(''):'<tr><td colspan="6"><div class="empty">No candidates or new hires right now — “New candidate” starts one.</div></td></tr>')
    +'</tbody></table></div>';
  h+='<div class="caption">Finished hires stay on the list until marked completed from the ⋯ menu.</div>';
  $('#page').innerHTML=h;
  $('#storeSel').onchange=e=>{STORE=e.target.value;localStorage.setItem('cprObStore',STORE);draw();};
  $('#newHire').onclick=openNewHire;
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{location.hash='#e='+b.getAttribute('data-open');});
  document.querySelectorAll('[data-openi]').forEach(b=>b.onclick=()=>{location.hash='#i='+b.getAttribute('data-openi');});
  wireMenus();
}
/* one ⋯ menu open at a time; outside click / Esc closes */
function wireMenus(){
  document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const id=b.getAttribute('data-menu');
    document.querySelectorAll('.menu').forEach(m=>{m.style.display=m.getAttribute('data-menufor')===id&&m.style.display==='none'?'block':'none';});
  });
  document.querySelectorAll('[data-mact]').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    document.querySelectorAll('.menu').forEach(m=>{m.style.display='none';});
    const act=b.getAttribute('data-mact');
    if(act==='team'){location.href='employee-records.html#e='+b.getAttribute('data-sid');return;}
    if(act==='copy'){copyLink(b.getAttribute('data-tok'));return;}
    if(act==='send'){
      const id=+b.getAttribute('data-iid'), i=INTAKES.find(x=>x.id===id); if(!i)return;
      const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
        body:JSON.stringify({action:'send_offer',intake_id:id})});
      const j=await r.json().catch(()=>({}));
      if(r.status===200&&j.ok){toast('Offer emailed to '+i.personal_email);await loadAll();draw();}
      else toast('Email failed — '+(j.error||'error'),true);
      return;
    }
    if(act==='del'){
      const i=INTAKES.find(x=>x.id===+b.getAttribute('data-iid'));if(!i)return;
      if(!confirm('Delete this intake'+(i.invited_name?(' for '+i.invited_name):'')+'? Their link stops working.'))return;
      const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
        body:JSON.stringify({action:'cancel',intake_id:i.id})});
      const j=await r.json().catch(()=>({}));
      if(!(r.status===200&&j.ok)){toast(j.error||'Failed',true);return;}
      toast('Intake deleted');await loadAll();draw();
      return;
    }
    if(act==='complete'||act==='cancel'){
      const sid=+b.getAttribute('data-sid'), p=ALLSTAFF.find(x=>x.id===sid);if(!p)return;
      if(!confirm((act==='complete'?'Mark onboarding completed for ':'Cancel onboarding for ')+p.display_name+'?'))return;
      await stampOnboarding(p,act);
      return;
    }
  });
  if(!wireMenus._doc){
    wireMenus._doc=true;
    document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>{m.style.display='none';}));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.menu').forEach(m=>{m.style.display='none';});});
  }
}
async function stampOnboarding(p,act){
  const now=new Date().toISOString();
  const field=act==='complete'?'onboarding_completed_at':'onboarding_canceled_at';
  const r=await fetch(SB_URL+'/functions/v1/cpr-auth',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+await jwt()},
    body:JSON.stringify({action:'update_staff',staff_id:p.id,[field]:now})});
  const j=await r.json().catch(()=>({}));
  if(!(r.status===200&&!j.error)){toast(j.error||'Failed',true);return;}
  const i=IK_BYSTAFF[p.id];
  if(i)await sb.from('staff_intake').update({[field]:now,[field.replace('_at','_by')]:AUTH.id}).eq('id',i.id);
  toast(act==='complete'?'Onboarding completed':'Onboarding canceled');
  location.hash='';await loadAll();draw();
}

function moduleColHtml(p,m,a,mx,mode){

      +'<a class="iact" href="onboarding-setup.html">Build it in Module Setup ›</a></div>',p.id,false,'');

    if(r.type==='section')
      return '<div class="sechd">'+esc(r.sec.name)+'<span class="sc">'+r.done+' / '+r.total+'</span></div>';
    const it=r.it,isStep=it.kind==='s';
    const who=isStep?it.s.who:'emp';
    const title=isStep?it.s.title:it.a.title;
    const mgrOwned=isStep&&(who==='manager'||who==='backoffice');
    const canTick=(mode==='mgr'&&mgrOwned)||(mode==='mentor'&&who==='manager')
      ||(mode==='emp'&&isStep&&who==='employee'&&r.state!=='lock');
    const blocked=mx.blockers[it.id];
    const hl=r.state==='next';
    let lead;
    if(canTick)lead='<button class="ckb'+(r.state==='done'?' on':'')+'" data-tickstep="'+it.s.id+'">'+(r.state==='done'?ic('check',10):'')+'</button>';
    else if(r.state==='done')lead=stC('ok','check');
    else if(blocked)lead=stC('lock','lock',10);
    else if(hl)lead=stC('nxt','chev',12);
    else if(mgrOwned&&mode!=='mgr')lead=stC('who','user2',12);
    else lead=stC('lock','lock',10);
    let sub='';
    if(blocked&&r.state!=='done')sub='<div class="isub blocked">Waiting on '+esc(reqTitle(mx,blocked))+'</div>';
    else if(hl)sub='<div class="isub nx">Next up · '+((mode==='emp')?(mgrOwned?'their move':'your move'):(mgrOwned?'your move':'their move'))+'</div>';
    else if(isStep&&it.s.note&&r.state!=='done'&&mode==='mgr')sub='<div class="isub">'+esc(it.s.note)+'</div>';

      +'<div class="itxt"><div class="ittl'+(r.state==='done'?' done':r.state==='lock'?' lock':'')+'">'+esc(title)+'</div>'+sub+'</div>'
      +(mode==='mgr'||mgrOwned?ownChip(who):'')+act+'</div>';

      +(a.due_at?('Due '+esc(fmtDue(a.due_at))):'Set due')+'</button>';
  }
  chips+='<span class="cnt'+(mx.complete?' ok':'')+'">'+mx.done+' / '+mx.total+'</span>';

function wireHiring(i){
  document.querySelectorAll('[data-htick]').forEach(b=>b.onclick=async()=>{
    const k=b.getAttribute('data-htick');
    const on=b.classList.contains('on');
    const patch=k==='review'
      ?{reviewed_at:on?null:new Date().toISOString(),reviewed_by:on?null:AUTH.id}
      :{qbo_created_at:on?null:new Date().toISOString(),qbo_created_by:on?null:AUTH.id};
    const r=await sb.from('staff_intake').update(patch).eq('id',i.id);
    if(r.error)return toast(r.error.message,true);
    await loadAll();draw();
  });
  document.querySelectorAll('[data-hact]').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-hact');
    if(k==='review')openReview(i.id);
    else if(k==='qbo')window.open('https://qbo.intuit.com/app/employees','_blank','noopener');
    else if(k==='convert')openQboCheck(i.id);
  });
}

      body:JSON.stringify({action:'update_staff',staff_id:p.id,mentor_staff_id:ms.value||''})});

    const stepId=+b.getAttribute('data-tickstep');
    const ex=SDONE.find(x=>x.staff_id===p.id&&x.step_id===stepId);
    if(ex){const r=await sb.from('onboarding_step_done').delete().eq('id',ex.id);
      if(r.error)return toast(r.error.message,true);
      SDONE=SDONE.filter(x=>x.id!==ex.id);}
    else{const r=await sb.from('onboarding_step_done').insert({step_id:stepId,staff_id:p.id,done_by:AUTH.id}).select().single();
      if(r.error)return toast(r.error.message,true);
      SDONE.push(r.data);}
    /* the Activate step promotes via trigger — pick the role change up */
    const st=STEPS.find(x=>x.id===stepId);
    if(st&&st.action==='activate'){await loadAll();}
    drawProfile(p.id);
  });
  document.querySelectorAll('[data-asgn2]').forEach(b=>b.onclick=async()=>{
    const mid=+b.getAttribute('data-asgn2');
    const ex=ASSIGNS.find(x=>x.staff_id===p.id&&x.module_id===mid);
    if(ex){const r=await sb.from('onboarding_assignments').delete().eq('id',ex.id);
      if(r.error)return toast(r.error.message,true);
      ASSIGNS=ASSIGNS.filter(x=>x.id!==ex.id);}
    else{const r=await sb.from('onboarding_assignments').insert({staff_id:p.id,module_id:mid,assigned_by:AUTH.id}).select().single();
      if(r.error)return toast(r.error.message,true);ASSIGNS.push(r.data);}
    drawProfile(p.id);
  });
  document.querySelectorAll('[data-duecol]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const mid=+b.getAttribute('data-duecol');
    const a=ASSIGNS.find(x=>x.staff_id===p.id&&x.module_id===mid);if(!a)return;
    if(!(window.CPRPickers&&CPRPickers.day))return;
    CPRPickers.day.call(CPRPickers,b,{
      get:()=>a.due_at?new Date(a.due_at+'T12:00:00'):new Date(),
      set:async d=>{
        const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const r=await sb.from('onboarding_assignments').update({due_at:iso}).eq('id',a.id);
        if(r.error)return toast(r.error.message,true);
        a.due_at=iso;drawProfile(p.id);
      }});
  });
}

function route(){

  const mgrV=canPage('onboarding.manage',AUTH.role);
  if(m2&&mgrV)VIEW={mode:'cand',iid:+m2[1]};
  else if(m1)VIEW={mode:'profile',sid:+m1[1]};
  else VIEW=mgrV?{mode:'roster'}:{mode:'profile',sid:AUTH.id};

}

function intakeUrl(token){return location.origin+location.pathname.replace(/[^/]*$/,'')+'intake.html?t='+token;}
function copyLink(token){
  const url=intakeUrl(token);
  function legacy(){const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
    toast(ok?'Link copied':'Copy failed — long-press the link to copy',!ok);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>toast('Link copied'),legacy);
  else legacy();
}
function e164ish(v){const d=String(v||'').replace(/\D/g,'');
  if(d.length===10)return '+1'+d;if(d.length===11&&d[0]==='1')return '+'+d;
  const t=String(v||'').trim();return t.startsWith('+')&&d.length>=11?t:null;}
/* ---- New Candidate wizard (workflow-style, like the Checklist Template wizard) ---- */

   {pay}/{commission}, so it can't be written until pay is settled. */
const WSTEPS=['Candidate','Pay','Access','Training','Offer','Preview','Send'];

   every branch in here */

   folds 'manager' into 'admin' and 'employee' into 'team_member', so offering a
   separate Manager tier would have been a third choice that granted nothing
   different from Admin. Permissions themselves are edited per ROLE in
   Settings -> Roles & Permissions; there is no per-person override anywhere. */
const MRT_ROLES=[{v:'team_member',t:'Team Member'},{v:'admin',t:'Manager'}];

function money(n){ return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* CD.start is an ISO date from the picker; startLabel() is the line the offer
   letter reads ("Monday, August 24") — same split as pay/payLabel(). */
const isoDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function startLabel(){
  if(!CD.start)return '';
  return new Date(CD.start+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
/* The rendered pay line. This string is what lands in the offer letter and is
   frozen into offer_body — the structured columns are for us, not the PDF. */
function payLabel(){
  const n=parseFloat(CD.payAmt);
  if(!(n>0))return '';
  return money(n)+(CD.payType==='salary'?' per month':' per hour');
}
/* Who the hire reports to, from the store they're being hired into. The letter
   used to name one person for every store — see stores.manager_staff_id. */
function managerLine(){
  const st=(STORES||[]).filter(x=>x.store===CD.store)[0];
  const mgr=st&&st.manager_staff_id
    ? (ALLSTAFF||[]).filter(p=>String(p.id)===String(st.manager_staff_id))[0] : null;
  const ownerLine=OWNER?(OWNER.display_name+' (Owner)'):'the Owner';
  return mgr ? (mgr.display_name+' (Store Manager) and '+ownerLine) : ownerLine;

function commLabel(){
  if(!CD.comm)return 'No commission';
  const on=Object.keys(EARN_LABELS).filter(k=>CD.earns[k]);
  if(!on.length)return 'No commission';
  return 'Commission on '+on.map(k=>EARN_LABELS[k].toLowerCase()).join(', ');
}
/* What {commission} renders as IN THE LETTER — a full sentence naming only the
   streams that were actually ticked, keeping the wording the template already
   used. commLabel() stays the short form for the wizard's own screens. */
const EARN_PHRASE={accessory:'accessory sales',device:'device sales',
  services:'add-on services including malware removal, charging port cleanings, and express repairs'};
function commSentence(){
  const on=CD.comm?Object.keys(EARN_PHRASE).filter(k=>CD.earns[k]):[];
  if(!on.length)return 'This position does not include commission.';
  const list=on.map(k=>EARN_PHRASE[k]);
  const joined=list.length===1?list[0]
    :list.length===2?(list[0]+' and '+list[1])
    :(list.slice(0,-1).join(', ')+', and '+list[list.length-1]);
  return 'In addition to your base rate, you are eligible to earn commission on '+joined
    +'. Commission is paid in accordance with the current commission schedule, which may be modified by the Company at its discretion.';
}
function buildOffer(){
  const v={name:CD.name,position:CD.pos,pay:payLabel(),commission:commSentence(),
    store:'CPR '+shortStore(CD.store),start:startLabel(),manager:managerLine()};
  let b=OFFER_TPL||'';
  Object.keys(v).forEach(k=>{if(v[k])b=b.split('{'+k+'}').join(v[k]);});
  return b;
}

function wireWiz(){
  const sd=$('#wStart');
  if(sd)sd.onclick=()=>{
    if(!(window.CPRPickers&&CPRPickers.day))return;
    grabWiz();
    /* CPRPickers.day OPENS immediately — call it from the click, never at render */
    CPRPickers.day.call(CPRPickers,sd,{
      get:()=>CD.start?new Date(CD.start+'T12:00:00'):new Date(),
      set:d=>{CD.start=isoDay(d);drawWiz();}});
  };
  if(ST()==='Pay'){
    /* pay type and the commission Yes/No both change what the step shows, so
       they redraw; grabWiz() first so nothing typed above is lost */
    $('#wPayType').onchange=()=>{grabWiz();drawWiz();};
    $('#wComm').onchange=()=>{grabWiz();drawWiz();};
    const pa=$('#wPayAmt');if(pa)pa.oninput=()=>{CD.payAmt=pa.value.trim();};
  }
  if(ST()==='Access'){
    const rl=$('#wRole');
    if(rl)rl.onchange=()=>{CD.role=rl.value;drawWiz();};
    document.querySelectorAll('[data-store]').forEach(b=>b.onchange=()=>{
      const st=b.getAttribute('data-store');
      CD.stores=CD.stores.filter(x=>x!==st);
      if(b.checked)CD.stores.push(st);
    });
  }
  if(ST()==='Training'){
    document.querySelectorAll('[data-mod]').forEach(b=>b.onchange=()=>{
      const id=+b.getAttribute('data-mod');
      CD.modules=CD.modules.filter(x=>x!==id);
      if(b.checked)CD.modules.push(id);
    });
  }
  if(ST()==='Offer'){
    $('#wDocs').onchange=e=>{grabWiz();CD.docs=e.target.checked;drawWiz();};
    const ta=$('#wTpl');
    if(ta){
      ta.value=CD.tplDirty?CD.body:buildOffer();
      CD.body=ta.value;
      ta.oninput=()=>{CD.tplDirty=true;CD.body=ta.value;};
    }
  }
  if(ST()==='Preview'&&CD.docs)buildPdfPreview();
  const bk=$('#wBack');if(bk)bk.onclick=()=>{grabWiz();CD.step--;drawWiz();};
  const closeWiz=async()=>{
    $('#mask').classList.remove('show');$('#mdl').style.maxWidth='';
    if(CD.created){await loadAll();draw();}
  };
  const cl=$('#wClose');if(cl)cl.onclick=closeWiz;
  /* leave from any step, not only the first one */
  const xb=$('#wX');if(xb)xb.onclick=()=>{
    if(CD.created||!CD.name||confirm('Discard this candidate?'))closeWiz();
  };
  const nx=$('#wNext');if(nx)nx.onclick=()=>{
    grabWiz();
    if(ST()==='Candidate'&&!CD.name){toast('Give the candidate a name.',true);return;}
    if(ST()==='Pay'){
      if(!(parseFloat(CD.payAmt)>0)){toast('Enter the pay amount.',true);return;}
      if(CD.comm&&!Object.keys(EARN_LABELS).some(k=>CD.earns[k])){
        toast('Pick at least one thing they earn commission on — or set Commission to No.',true);return;}
    }
    if(ST()==='Offer'&&CD.docs&&!CD.body.trim()){toast('The offer letter is empty.',true);return;}
    if(ST()==='Offer'&&!CD.tplDirty)CD.body=buildOffer();
    CD.step++;drawWiz();
  };
  const se=$('#wSendEmail');if(se)se.onchange=()=>{CD.sendEmail=se.checked;drawWiz();};
  const st=$('#wSendText'); if(st)st.onchange=()=>{CD.sendText=st.checked;drawWiz();};
  const cr=$('#wCreate');if(cr)cr.onclick=createCandidate;
  const cp=$('#wCopy');if(cp)cp.onclick=()=>copyLink(CD.created.token);
  const eg=$('#wEmailGo');if(eg)eg.onclick=emailOffer;
  const tg=$('#wTextGo');if(tg)tg.onclick=textLink;
  const pf=$('#wPdfFull');if(pf)pf.onclick=()=>{if(CD.pdfUrl)window.open(CD.pdfUrl,'_blank');};
}
async function buildPdfPreview(){
  const box=$('#wPdfBox');if(!box)return;
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
      body:JSON.stringify({action:'offer_pdf',offer_body:CD.body,store:CD.store})});
    const j=await r.json().catch(()=>({}));
    if(!(r.status===200&&j.ok&&j.pdf))throw new Error(j.error||'preview failed');
    const bytes=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));
    if(CD.pdfUrl)URL.revokeObjectURL(CD.pdfUrl);
    CD.pdfUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    box.innerHTML='<iframe src="'+CD.pdfUrl+'" style="width:100%;height:100%;border:none"></iframe>';
  }catch(e){
    box.innerHTML='<div style="padding:16px;text-align:center">Preview failed — '+esc(e.message||'error')+'.<br>You can still create and send; the letter renders on their signing page.</div>';
  }
}
/* The step is called Send, so it sends. Creating used to be the whole action
   and the actual delivery needed a second click on a button below the fold —
   easy to miss, and a candidate never heard from us. */
/* Which channels are POSSIBLE (we have an address / a number) versus which are
   CHOSEN on the Send step. Both are ticked by default — the common case is
   send it every way we can. */
function sendable(){
  return {email:!!(CD.docs&&CD.email), text:!!e164ish(CD.phone)};
}
function sendTargets(){
  const can=sendable(), t=[];
  if(can.email&&CD.sendEmail)t.push('email');
  if(can.text&&CD.sendText)t.push('text');
  return t;
}
function deliveryHtml(){
  const can=sendable();
  if(!can.email&&!can.text)
    return '<div style="font-size:.78rem;font-weight:700;color:var(--grey2);padding:2px 0 10px">'
      +'No email or mobile on file.</div>';
  const row=(id,on,label,dest)=>'<label style="display:flex;gap:9px;align-items:center;padding:9px 0;cursor:pointer">'
    +'<input type="checkbox" id="'+id+'"'+(on?' checked':'')+' style="width:16px;height:16px;accent-color:var(--red)">'
    +'<span style="font-family:Nunito,sans-serif;font-weight:800;font-size:.85rem">'+label
    +' <span style="font-weight:700;color:var(--grey2)">'+esc(dest)+'</span></span></label>';
  return '<div style="border:1.5px solid var(--border);border-radius:10px;padding:4px 14px;margin-bottom:12px">'
    +'<div style="font-family:Nunito,sans-serif;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);padding-top:10px">Send by</div>'
    +(can.email?row('wSendEmail',CD.sendEmail,'Email',CD.email):'')
    +(can.text?row('wSendText',CD.sendText,'Text',CD.phone):'')
    +'</div>';
}
function createLabel(){
  return sendTargets().length?'Create and Send':'Create Candidate';
}
async function createCandidate(){
  const b=$('#wCreate');b.disabled=true;b.textContent='Creating…';
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
    body:JSON.stringify({action:'create',invited_name:CD.name,invited_store:CD.store,
      position:CD.pos,pay:payLabel(),start_hint:startLabel(),start_date:CD.start||null,
      pay_type:CD.payType,pay_amount:parseFloat(CD.payAmt)||null,
      commission:CD.comm,commission_earns:CD.comm?CD.earns:null,
      mrt_role:CD.role,authorized_stores:CD.stores.filter(x=>x!==CD.store),modules:CD.modules,
      offer_body:CD.docs?CD.body:null,
      phone:e164ish(CD.phone)||CD.phone||null,
      personal_email:CD.email||null})});
  const j=await r.json().catch(()=>({}));
  if(!(r.status===200&&j.ok)){b.disabled=false;b.textContent=createLabel();toast(j.error||'Failed',true);return;}
  CD.created={id:j.id,token:j.token};
  drawWiz();
  const t=sendTargets();
  if(t.indexOf('email')>-1)await emailOffer();
  if(t.indexOf('text')>-1)await textLink();
}
async function emailOffer(){
  const out=$('#wSendOut');
  const b=$('#wEmailGo')||{style:{}};
  b.disabled=true;b.textContent='Emailing…';
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
    body:JSON.stringify({action:'send_offer',intake_id:CD.created.id})});
  const j=await r.json().catch(()=>({}));
  if(r.status===200&&j.ok){b.textContent='Emailed ✓';out.innerHTML+='<div>Offer PDF emailed to '+esc(CD.email)+'.</div>';}
  else{b.disabled=false;b.textContent='Email the offer — PDF attached';
    out.innerHTML+='<div style="color:var(--red)">Email failed — '+esc(j.error||'error')+'</div>';}
}
async function textLink(){
  const out=$('#wSendOut');
  const b=$('#wTextGo')||{style:{}};
  b.disabled=true;b.textContent='Texting…';
  const first=(CD.name.split(/\s+/)[0])||'there';
  const msg='Hi '+first+', '+(CD.docs
    ?'here’s your job offer from CPR Cell Phone Repair — review, sign, and finish your new-hire paperwork here: '
    :'here’s your CPR new-hire form: ')+intakeUrl(CD.created.token);
  try{
    const mr=await fetch(SB_URL+'/functions/v1/messaging',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+await jwt()},
      body:JSON.stringify({action:'send',to:e164ish(CD.phone),body:msg,store:CD.store,
        template_key:'candidate_link',agent_name:AUTH.name})});
    const md=await mr.json().catch(()=>({}));
    if(mr.ok&&md.ok!==false){b.textContent='Texted ✓';out.innerHTML+='<div>Signing link texted to '+esc(CD.phone)+'.</div>';}
    else{b.disabled=false;b.textContent='Text the signing link';toast(md.error||'Text failed — copy the link instead',true);}
  }catch(e){b.disabled=false;b.textContent='Text the signing link';toast('Text failed — copy the link instead',true);}
}
/* access is a granted permission; the role test stays as the fallback for the
   moment before nav.js publishes the permission list */
function canPage(k,role){ var p=window.CPRPerms;
  return p ? p.indexOf(k)>-1 : ['owner','admin','manager'].indexOf(role)>-1; }

/* ----- "Check for QBO Records" -----
   Payroll setup happens in QuickBooks by hand, so before a candidate becomes
   an employee here we ask QuickBooks whether they exist yet — and show the MRT
   row the QB Time sync will have stubbed from that same record. Confirming
   merges the two and moves them from a bare stub to a Team Member Candidate. */
function qbTile(m){
  const pill=(t,bg,fg)=>'<span class="tbadge" style="background:'+bg+';color:'+fg+'">'+t+'</span>';
  return '<div class="qbrow">'
    +'<div style="flex:1;min-width:0"><div style="font-family:Nunito,sans-serif;font-weight:800">'+esc(m.name)+'</div>'
    +'<div class="rl" style="margin-top:2px">id '+esc(m.id)
      +(m.hire_date?' · hired '+esc(m.hire_date):'')+(m.email?' · '+esc(m.email):'')+'</div></div>'
    +(m.payroll?pill('Payroll','var(--greenbg)','var(--greend)')
              :pill('Contact only','var(--amberbg)','var(--ambert)'))
    +(m.active?'':pill('Inactive','var(--redbg)','var(--red)'))
    +'</div>';
}
async function openQboCheck(id){
  const i=INTAKES.find(x=>x.id===id);if(!i)return;
  const first=i.legal_first||String(i.invited_name||'').split(/\s+/)[0]||'';
  const last=i.legal_last||String(i.invited_name||'').split(/\s+/).slice(-1)[0]||'';
  const nm=[first,last].filter(Boolean).join(' ');
  /* the row the QB Time sync makes from the QuickBooks employee */
  const stub=STAFF.filter(p=>sameName(p.display_name,nm))[0]||null;
  $('#mdl').style.maxWidth='560px';
  const head='<div class="mhead"><h2>'+esc(nm)+'</h2><button class="mx" id="qbX" aria-label="Close">×</button></div>';
  $('#mdl').innerHTML=head+'<div id="qbBody" class="empty">Checking QuickBooks…</div>';
  $('#mask').classList.add('show');
  $('#qbX').onclick=()=>{$('#mask').classList.remove('show');$('#mdl').style.maxWidth='';};
  let matches=[],err='';
  try{
    const r=await fetch(SB_URL+'/functions/v1/qbo',{method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+await jwt()},
      body:JSON.stringify({action:'find_employee',first_name:first,last_name:last})});
    const j=await r.json().catch(()=>({}));
    if(r.status===200&&j.matches)matches=j.matches;else err=j.detail||j.error||('http '+r.status);
  }catch(e){err=e.message||'failed';}
  const body=$('#qbBody');body.className='';
  /* The MRT row this would merge ONTO — not a QuickBooks result. Its pill
     says what state that row is in, rather than guessing where it came from:
     a row with no store and no PIN is a shell nobody has set up. */
  const bare=stub&&!stub.home_store&&!stub.pin_hash;
  const mrtTile=stub?'<div class="qbrow">'
    +'<div style="flex:1;min-width:0"><div style="font-family:Nunito,sans-serif;font-weight:800">'+esc(stub.display_name)+'</div>'
    +'<div class="rl" style="margin-top:2px">id '+esc(stub.id)+' · '
    +esc([stub.home_store?('CPR '+shortStore(stub.home_store)):'no store',
          stub.pin_hash?'PIN set':'no PIN'].join(' · '))+'</div></div>'
    +'<span class="tbadge" style="background:'+(bare?'var(--amberbg);color:var(--ambert)':'var(--greenbg);color:var(--greend)')+'">'
    +(bare?'Needs setup':'Set up')+'</span></div>':'';
  const mrt=stub?'<div class="qbsec">Merge onto</div>'+mrtTile:'';
  if(err){
    body.innerHTML='<div class="qbsec">QuickBooks</div><div class="empty">Couldn’t reach QuickBooks — '+esc(err)+'</div>'+mrt
      +'<div class="mact"><button class="btn alt" id="qbClose">Close</button></div>';
  }else if(!matches.length){
    body.innerHTML='<div class="qbsec">QuickBooks</div>'
      +'<div class="empty">No employee named '+esc(nm)+' yet.</div>'+mrt
      +(stub&&bare?'<div class="qbwarn">This myRepairTools record has no QuickBooks employee behind it — '
        +'it was synced from one that has since been deleted. Create them in QuickBooks, then check again.</div>':'')
      +'<div class="mact"><button class="btn alt" id="qbClose">Close</button>'
      +'<button class="btn" id="qbOpen">Create in QuickBooks</button></div>';
  }else{
    body.innerHTML='<div class="qbsec">Found in QuickBooks</div>'+matches.map(qbTile).join('')+mrt
      +'<div class="mact"><button class="btn alt" id="qbClose">Close</button>'
      +'<button class="btn" id="qbGo">'+(stub?'Merge &amp; make Candidate':'Create their record')+'</button></div>';
  }
  const cl=$('#qbClose');if(cl)cl.onclick=()=>{$('#mask').classList.remove('show');$('#mdl').style.maxWidth='';};
  const op=$('#qbOpen');if(op)op.onclick=()=>window.open('https://qbo.intuit.com/app/employees','_blank','noopener');
  const go=$('#qbGo');if(go)go.onclick=()=>convertIntake(i,stub?stub.id:0,go);
}
/* the one place a candidate becomes staff — shared by the modal and Review */
async function convertIntake(i,staffId,btn){
  btn.disabled=true;btn.textContent='Working…';
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
    body:JSON.stringify(staffId?{action:'promote',intake_id:i.id,staff_id:staffId}:{action:'promote',intake_id:i.id})});
  const j=await r.json().catch(()=>({}));
  btn.disabled=false;
  if(!(r.status===200&&j.ok)){toast(j.detail||j.error||'Failed',true);return;}
  $('#mask').classList.remove('show');$('#mdl').style.maxWidth='';
  toast(j.note||('Converted — '+(j.assigned||0)+' module'+(j.assigned===1?'':'s')+' assigned'),!!j.note);
  await loadAll();draw();
}

function openReview(id){
  const i=INTAKES.find(x=>x.id===id);if(!i)return;
  const rv=(k,v)=>v?'<div class="rvrow"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>':'';
  const name=[i.legal_first,i.legal_middle,i.legal_last].filter(Boolean).join(' ');
  const addr=i.address?[i.address.street,i.address.city,i.address.zip].filter(Boolean).join(', '):'';
  const av=(i.availability||[]).map(a=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][a.day]+' '
    +(a.mode==='all'?'All day':a.mode==='off'?'Off':(a.from+' – '+a.to))).join(' · ');
  const declined=!!i.offer_declined_at||!!i.promoted_at, docs=!!i.offer_body;
  const sig=(label,img,who,at)=>img
    ?'<div class="rvrow"><span class="k">'+label+'</span><span class="v"><img class="sigthumb" src="'+img+'" alt="signature">'
      +'<div style="font-size:.68rem;color:var(--grey);margin-top:2px">'+esc(who||'')+' · '+esc(fmtShort(at))+'</div></span></div>'
    :'<div class="rvrow"><span class="k">'+label+'</span><span class="v" style="color:var(--grey2)">not signed yet</span></div>';
  /* candidates for promotion: sync-created / recently added staff without intake */
  const cands=STAFF.filter(p=>isNewHire(p));
  $('#mdl').innerHTML='<h2>'+esc(name||i.invited_name||'Intake')+(declined?' — declined':' — candidate')+'</h2>'
    +(declined?'<div style="background:var(--redbg);border-radius:9px;padding:9px 12px;font-size:.8rem;font-weight:700;color:var(--red);margin-bottom:10px">'
      +'Declined the offer '+esc(fmtShort(i.offer_declined_at))+(i.decline_note?' — “'+esc(i.decline_note)+'”':'')+'</div>':'')
    +rv('Position',i.position)+rv('Pay',i.pay)
    +rv('Commission',i.commission
      ?('Yes — '+Object.keys(EARN_LABELS).filter(k=>(i.commission_earns||{})[k]).map(k=>EARN_LABELS[k].toLowerCase()).join(', ')||'Yes')
      :(i.pay_type?'No':''))
    +rv('Start',i.start_hint)
    +(docs?sig('Offer',i.offer_signature,i.offer_signed_name,i.offer_signed_at)
      +sig('Handbook',i.handbook_signature,i.handbook_signed_name,i.handbook_signed_at)
      +(i.offer_signed_at?'<div style="margin:8px 0 4px"><button class="ghost" id="rvPdf">⬇ Signed offer (PDF)</button></div>':''):'')
    +rv('Name',name)+rv('Preferred',i.preferred_name)+rv('DOB',i.dob)+rv('Phone',i.phone)+rv('Email',i.personal_email)
    +rv('Address',addr)+rv('Shirt',i.shirt_size)+rv('I-9 plan',i.i9_docs)
    +[i.emergency,i.emergency2].filter(e=>e&&e.name).map((e,n)=>
        rv('Emergency'+(i.emergency2&&i.emergency2.name?' '+(n+1):''),
           [e.name,e.relationship,e.phone].filter(Boolean).join(' · '))).join('')
    +(av?rv('Availability',av):'')
    +(declined?'<div class="mact"><button class="btn alt" id="rvClose">Close</button></div>'
      :'<div style="border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;margin:14px 0 4px">'
        +[['Role',(MRT_ROLES.filter(r=>r.v===i.mrt_role)[0]||{}).t||'Team Member'],
          ['Stores',[i.invited_store].concat(i.authorized_stores||[]).filter((v,x,a)=>v&&a.indexOf(v)===x)
            .map(s=>'CPR '+shortStore(s)).join(', ')],
          ['PIN',i.suggested_pin?'Theirs from the form':'Set one on Team Members'],
          ['Commission',i.commission?'On':'Off']]
          .map(r=>'<div class="rvrow"><span class="k">'+r[0]+'</span><span class="v">'+esc(r[1])+'</span></div>').join('')
        +'</div>'
      +'<div class="f"><label>Staff record</label><select id="rvStaff">'
      +'<option value="">Create a new one</option>'
      +cands.map(p=>'<option value="'+p.id+'"'+(sameName(p.display_name,name||i.invited_name)?' selected':'')+'>'
        +'Use '+esc(p.display_name)+' · CPR '+esc(shortStore(p.home_store||''))+'</option>').join('')+'</select></div>'
      +'<div class="mact"><button class="btn alt" id="rvClose">Close</button><button class="btn" id="rvGo">Convert to New Employee ›</button></div>');
  $('#mask').classList.add('show');
  $('#rvClose').onclick=()=>{$('#mask').classList.remove('show');};
  const pb=$('#rvPdf');if(pb)pb.onclick=async()=>{
    pb.disabled=true;pb.textContent='Building…';
    try{
      const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'signed_pdf',token:i.token})});
      const j=await r.json().catch(()=>({}));
      if(!(r.status===200&&j.ok&&j.pdf))throw new Error(j.error||'failed');
      const bytes=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      const a=document.createElement('a');a.href=url;a.download=j.filename||'CPR Offer — signed.pdf';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      pb.disabled=false;pb.textContent='⬇ Signed offer (PDF)';
    }catch(e){pb.disabled=false;pb.textContent='⬇ Signed offer (PDF)';toast('PDF failed — '+(e.message||'error'),true);}
  };
  const go=$('#rvGo');if(go)go.onclick=async()=>{
    const sid=+$('#rvStaff').value||0;
    const missing=[];
    if(docs&&!i.offer_signed_at)missing.push('offer signature');
    if(docs&&!i.handbook_signed_at)missing.push('handbook signature');
    if(!i.submitted_at)missing.push('new-hire form');
    if(missing.length&&!confirm('Still missing: '+missing.join(', ')+'. Convert anyway (e.g. done on paper)?'))return;
    await convertIntake(i,sid,go);
  };
}
async function boot(){
  /* managers get the roster; everyone else gets their own board (or their
     mentee's) — the banner on training.html lands here */
  await loadAll();route();
}
