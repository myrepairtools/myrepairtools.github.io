<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#EAF6FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--row:#F0F1F4;--green:#2E9E5B;
--greend:#0f6e56;--greenbg:#E1F5EE;--amberbg:#FBF1DC;--ambert:#7A5B10;--redbg:#FDEBEC;--card:0 1px 3px rgba(45,45,59,.05)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:-.3px;margin:0}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.rolebadge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.55rem;text-transform:uppercase;letter-spacing:.4px;
color:var(--red);border:1px solid #F6C9CA;background:#FFF1F1;border-radius:5px;padding:2px 6px}
.storesel{height:36px;width:170px;padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.92rem;color:var(--dark);cursor:pointer}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;padding:8px 14px;border:none;border-radius:9px;
background:var(--red);color:#fff;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:170px;max-width:250px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--blue);
border-radius:12px;padding:10px 14px;box-shadow:var(--card)}
.stat .l{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;color:var(--dark-grey)}
.stat .v{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.15rem;color:var(--dark);margin-top:2px}
.stat.red{border-left-color:var(--red);background:#FFF7F7}
.stat.red .v{color:var(--red)}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--card)}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;
letter-spacing:.8px;color:var(--grey);background:#fafafa;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:.86rem;border-bottom:1px solid rgba(224,226,234,.6);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(79,176,227,.04)}
.pname{font-family:'Nunito',sans-serif;font-weight:800;color:var(--dark)}
.psub{font-size:.72rem;font-weight:700;color:var(--grey);margin-top:1px}
.stage{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:999px}
.stage.train{background:var(--bluebg);color:var(--blued)}
.stage.review{background:var(--amberbg);color:var(--ambert)}
.stage.wait{background:#F0F1F4;color:var(--grey2)}
.stage.dec{background:var(--redbg);color:var(--red)}
.stage.ready{background:var(--greenbg);color:var(--greend)}
.dchip{display:inline-block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;border-radius:6px;
padding:2px 7px;margin:1px 4px 1px 0;background:#F0F1F4;color:var(--grey2);white-space:nowrap}
.dchip.on{background:var(--greenbg);color:var(--greend)}
.mdl textarea{width:100%;min-height:180px;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.82rem;line-height:1.55;resize:vertical}
.sigthumb{border:1px solid var(--border);border-radius:8px;background:#fff;max-width:170px;max-height:60px;display:block}
.pbar{width:88px;height:7px;border-radius:999px;background:#ECEDF1;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pbar>i.red{background:var(--red)}
.pcount{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--dark-grey);margin-left:8px}
.rednote{font-size:.7rem;font-weight:800;color:var(--red);margin-top:3px}
.ghost{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;border:1.5px solid var(--border);border-radius:8px;
background:#fff;color:var(--dark);padding:5px 10px;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--blue);color:var(--blued)}
.caption{font-size:.74rem;font-weight:700;color:var(--grey);margin-top:10px}
.empty{color:var(--grey);font-weight:700;font-size:.85rem;padding:20px}
/* modal (new hire + intake review) */
.mask{position:fixed;inset:0;background:rgba(45,45,59,.5);display:none;align-items:center;justify-content:center;z-index:1200;padding:16px}
.mask.show{display:flex}
.mdl{background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.mdl h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;margin:0 0 12px}
.f label{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin:10px 0 3px}
.f input,.f select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.88rem}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn.alt{background:#fff;color:var(--dark);border:1.5px solid var(--border)}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-family:ui-monospace,monospace}
.rvrow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #F7F7F9;font-size:.8rem}
.rvrow .k{width:100px;flex:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.64rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);padding-top:2px}
.rvrow .v{font-weight:700}
.toast{position:fixed;bottom:calc(24px + var(--cpr-bb-h,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;
padding:12px 18px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;
opacity:0;pointer-events:none;transition:opacity .18s;z-index:1300}
.toast.show{opacity:1}.toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="page"><div class="empty">Loading…</div></div>
<div class="mask" id="mask"><div class="mdl" id="mdl"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/pin-gate.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/locations.js"></script>
<script src="assets/onboarding-track.js"></script>
<script type="module">
import { createClient } from "/assets/supabase-js.js";
const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
const FN=SB_URL+'/functions/v1/intake';
const sb=createClient(SB_URL,ANON);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isMgr=r=>['owner','admin','manager'].indexOf(r)>-1;
function toast(m,err){const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('show');
  clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),4200);}
const LI={
 clip:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
 plus:'<svg width="{s}" height="{s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>'};
const ic=(n,s)=>LI[n].replace(/\{s\}/g,s||14);
const NEW_HIRE_DAYS=60;

let AUTH=null,BOOTED=false,STORE='all';
let STAFF=[],INTAKES=[],MODULES=[],SECTIONS=[],ARTS=[],STEPS=[],ASSIGNS=[],READS=[],ATTEMPTS=[],SDONE=[],QUIZROWS=[],TICKS={};
let OFFER_TPL='';
async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){BOOTED=true;AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role};boot();}
}
sb.auth.onAuthStateChange((_e,sess)=>{if(sess)resolveMe(sess);});
(async()=>{try{const s=(await sb.auth.getSession()).data.session;if(s)resolveMe(s);}catch(e){}})();
async function jwt(){return (await sb.auth.getSession()).data.session.access_token;}

async function loadAll(){
  const [st,ik,mo,se,ar,sp,as,rd,at,sd,qz,tk,tpl]=await Promise.all([
    sb.from('staff').select('id,display_name,role,home_store,active,start_date,created_at,pin_hash,birthday').eq('active',true),
    sb.from('staff_intake').select('*').neq('status','promoted').order('created_at',{ascending:false}),
    sb.from('onboarding_modules').select('*').eq('active',true).order('sort'),
    sb.from('onboarding_sections').select('*'),
    sb.from('kb_articles').select('id,title,body,status,min_role,module_id,section_id,sort_order').eq('status','published'),
    sb.from('onboarding_steps').select('*').eq('active',true),
    sb.from('onboarding_assignments').select('*'),
    sb.from('kb_reads').select('article_id,staff_id,acknowledged_at'),
    sb.from('kb_quiz_attempts').select('quiz_id,staff_id,passed'),
    sb.from('onboarding_step_done').select('step_id,staff_id'),
    sb.from('kb_quizzes').select('id,article_id,active,kb_quiz_questions(id)').eq('active',true),
    sb.from('staff_setup_checklist').select('*'),
    sb.from('app_settings').select('value').eq('key','hiring.offer_template').maybeSingle(),
  ]);
  OFFER_TPL=(tpl.data&&tpl.data.value&&tpl.data.value.body)||'';
  STAFF=(st.data||[]).filter(s=>s.role!=='owner');
  INTAKES=ik.data||[];MODULES=mo.data||[];SECTIONS=se.data||[];ARTS=ar.data||[];STEPS=sp.data||[];
  ASSIGNS=(as.data||[]).filter(a=>a.module_id!=null);
  READS=rd.data||[];ATTEMPTS=at.data||[];SDONE=sd.data||[];QUIZROWS=qz.data||[];
  TICKS={};(tk.data||[]).forEach(r=>{(TICKS[r.staff_id]=TICKS[r.staff_id]||[]).push(r);});
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dchips(i){
  const c=(l,on)=>'<span class="dchip'+(on?' on':'')+'">'+(on?'✓ ':'○ ')+l+'</span>';
  return c('Offer',!!i.offer_signed_at)+c('Handbook',!!i.handbook_signed_at)+c('Form',!!i.submitted_at);
}
function shortStore(s){return window.CPRLocations?CPRLocations.display(s):String(s||'').replace(/^CPR\s*/,'');}
function fmtShort(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';return (d.getMonth()+1)+'/'+d.getDate();}
function isNewHire(p){const s=p.start_date||String(p.created_at||'').slice(0,10);
  return s&&(Date.parse(todayISO())-Date.parse(s))/864e5<=NEW_HIRE_DAYS;}
function personTrack(p){
  const reads={},att={},sdn={};
  READS.filter(r=>r.staff_id===p.id).forEach(r=>{reads[r.article_id]=r;});
  const quiz={};QUIZROWS.forEach(q=>{quiz[q.article_id]={id:q.id,nq:(q.kb_quiz_questions||[]).length};});
  ATTEMPTS.filter(a=>a.staff_id===p.id).forEach(a=>{const c=att[a.quiz_id]||{passed:false};c.passed=c.passed||!!a.passed;att[a.quiz_id]=c;});
  SDONE.filter(r=>r.staff_id===p.id).forEach(r=>{sdn[r.step_id]=r;});
  const arts=ARTS.filter(a=>a.min_role!=='manager'||isMgr(p.role));
  return CPRTrack.build({modules:MODULES,sections:SECTIONS,articles:arts,steps:STEPS,
    assignments:ASSIGNS.filter(a=>a.staff_id===p.id),reads,quizzes:quiz,attempts:att,stepDone:sdn,today:todayISO()});
}
function gapsFor(p){
  /* mirror of the compliance setup counts, compact: auto gaps + manual to-dos */
  let gaps=0;
  if(!p.pin_hash)gaps++;
  if(!p.home_store)gaps++;
  if(!p.birthday)gaps++;
  if(!ASSIGNS.some(a=>a.staff_id===p.id))gaps++;
  const ticked=(TICKS[p.id]||[]).length;
  const todo=5-ticked;
  return {gaps,todo:Math.max(0,todo)};
}

function draw(){
  const hires=STAFF.filter(p=>isNewHire(p)).filter(p=>STORE==='all'||p.home_store===STORE);
  const intakes=INTAKES.filter(i=>STORE==='all'||!i.invited_store||i.invited_store===STORE);
  let waitingItems=0,pastDueN=0;
  const rows=[];
  /* EVERY new hire gets a row — including one with no module assigned yet.
     They used to be filtered out here while still counting toward the tiles,
     so a hire nobody had assigned training to showed up as a number with no
     one in the list, which is exactly the person you most need to see. */
  hires.forEach(p=>{
    const g0=gapsFor(p);
    if(!ASSIGNS.some(a=>a.staff_id===p.id)){
      const setup0=(g0.gaps?g0.gaps+' gap'+(g0.gaps>1?'s':''):'')+(g0.gaps&&g0.todo?' · ':'')+(g0.todo?g0.todo+' to do':'')||'ready';
      rows.push('<tr><td><div class="pname">'+esc(p.display_name)+'</div><div class="psub">'
        +esc(p.role==='employee'?'Tech':p.role)+' · CPR '+esc(shortStore(p.home_store||''))+'</div></td>'
        +'<td><span class="stage review">Needs training assigned</span></td>'
        +'<td style="font-weight:700">'+esc(setup0)+'</td>'
        +'<td style="font-weight:700;color:var(--grey2)">No modules assigned</td>'
        +'<td style="text-align:right"><button class="ghost" data-panel="'+p.id+'">Assign training ›</button></td></tr>');
      return;
    }
    const mods=personTrack(p);
    const total=mods.reduce((n,m)=>n+m.total,0),done=mods.reduce((n,m)=>n+m.done,0);
    const pd=mods.filter(m=>m.pastDue);
    pastDueN+=pd.length;
    /* waiting-on-manager: next item is a manager step */
    mods.forEach(m=>m.rows.forEach(r=>{
      if(r.type==='item'&&r.state==='next'&&r.it.kind==='s'&&r.it.s.who==='manager')waitingItems++;
    }));
    const g=gapsFor(p);
    const setup=(g.gaps?g.gaps+' gap'+(g.gaps>1?'s':''):'')+(g.gaps&&g.todo?' · ':'')+(g.todo?g.todo+' to do':'')||'ready';
    const pct=total?Math.round(done/total*100):0;
    rows.push('<tr><td><div class="pname">'+esc(p.display_name)+'</div><div class="psub">'
      +esc(p.role==='employee'?'Tech':p.role)+' · CPR '+esc(shortStore(p.home_store||''))+'</div></td>'
      +'<td><span class="stage train">In training</span></td>'
      +'<td style="font-weight:700">'+esc(setup)+'</td>'
      +'<td><span class="pbar"><i class="'+(pd.length?'red':'')+'" style="width:'+pct+'%"></i></span><span class="pcount">'+done+' / '+total+'</span>'
      +(pd.length?'<div class="rednote">⚠ '+esc(pd[0].mod.name)+' past due</div>':'')+'</td>'
      +'<td style="text-align:right"><button class="ghost" data-panel="'+p.id+'">Open panel ›</button></td></tr>');
  });
  intakes.forEach(i=>{
    const submitted=!!i.submitted_at, declined=!!i.offer_declined_at, docs=!!i.offer_body;
    const nm=i.invited_name||[i.legal_first,i.legal_last].filter(Boolean).join(' ')||'(link sent)';
    let stage,setup;
    if(declined){
      stage='<span class="stage dec">Declined</span>';
      setup='declined '+esc(fmtShort(i.offer_declined_at))+(i.decline_note?' · “'+esc(i.decline_note)+'”':'');
    }else if(submitted){
      stage='<span class="stage ready">Ready to convert</span>';
      setup=(docs?dchips(i)+' ':'')+'submitted '+esc(fmtShort(i.submitted_at));
    }else if(docs){
      stage='<span class="stage wait">'+(i.offer_signed_at?'Candidate — signing docs':'Candidate — offer out')+'</span>';
      setup=dchips(i)+' sent '+esc(fmtShort(i.created_at));
    }else{
      stage='<span class="stage wait">Waiting on them</span>';
      setup='intake link sent '+esc(fmtShort(i.created_at));
    }
    rows.push('<tr><td><div class="pname">'+esc(nm)+'</div>'
      +'<div class="psub">'+esc([i.invited_store?('CPR '+shortStore(i.invited_store)):'',i.position||''].filter(Boolean).join(' · '))+'</div></td>'
      +'<td>'+stage+'</td>'
      +'<td style="font-weight:700">'+setup+'</td>'
      +'<td></td>'
      +'<td style="text-align:right;white-space:nowrap">'
        +(submitted?'<button class="ghost" data-review="'+i.id+'">Review &amp; convert ›</button>'
          :declined?'<button class="ghost" data-review="'+i.id+'">View ›</button>'
          :'<button class="ghost" data-copy="'+esc(i.token)+'">Copy link</button>'
            +(docs?' <button class="ghost" data-review="'+i.id+'">View ›</button>':''))
        +' <button class="ghost" data-del="'+i.id+'" title="Delete this intake" style="color:var(--red);border-color:#F6C9CA">✕</button></td></tr>');
  });
  waitingItems+=Object.keys(
    hires.reduce((m,p)=>{const g=gapsFor(p);if(g.todo)m[p.id]=1;return m;},{})).length;

  let h='<div class="hd">'+ic('clip',24)+'<h1>Onboarding</h1>'
    +'<span class="rolebadge">'+esc(AUTH.role==='owner'?'Owner':'Manager')+'</span>'
    +'<span style="flex:1"></span>'
    +'<select class="storesel" id="storeSel"><option value="all"'+(STORE==='all'?' selected':'')+'>All stores</option>'
    +(window.CPRLocations?CPRLocations.names():[]).map(s=>'<option value="'+esc(s)+'"'+(STORE===s?' selected':'')+'>CPR '+esc(shortStore(s))+'</option>').join('')
    +'</select><button class="ghost" onclick="location.href=\'onboarding-setup.html\'" style="padding:8px 12px">Module Setup ›</button>'
    +'<button class="ghost" onclick="location.href=\'kb-compliance.html\'" style="padding:8px 12px">Compliance ›</button>'
    +'<button class="btn" id="newHire">'+ic('plus',11)+' New candidate</button></div>'
    +'<div style="font-size:.82rem;font-weight:700;color:var(--dark-grey);margin:-8px 0 14px">The hiring pipeline: send a candidate their offer — they sign it, sign the handbook, and fill out the new-hire form on one link → when it\'s all back, convert them to a New Employee (kicks off your back-office steps + their training). Day-to-day tracking after that lives on <a href="kb-compliance.html" style="color:var(--blued)">Compliance</a>.</div>';
  const cands=intakes.filter(i=>!i.offer_declined_at);
  h+='<div class="stats">'
    +'<div class="stat"><div class="l">Candidates &amp; new hires</div><div class="v">'+(hires.length+cands.length)+'</div></div>'
    +'<div class="stat"><div class="l">Waiting on a manager</div><div class="v">'+waitingItems+' item'+(waitingItems===1?'':'s')+'</div></div>'
    +'<div class="stat'+(pastDueN?' red':'')+'"><div class="l">Past due</div><div class="v">'+pastDueN+' module'+(pastDueN===1?'':'s')+'</div></div></div>';
  h+='<div class="tcard"><table><thead><tr><th>New hire</th><th>Stage</th><th>Setup</th><th>Training</th><th></th></tr></thead><tbody>'
    +(rows.length?rows.join(''):'<tr><td colspan="5"><div class="empty">No candidates or new hires right now — “New candidate” starts one.</div></td></tr>')
    +'</tbody></table></div>';
  h+='<div class="caption">People drop off this list when setup is complete and all modules finish — ongoing compliance stays on the Compliance page.</div>';
  $('#page').innerHTML=h;
  $('#storeSel').onchange=e=>{STORE=e.target.value;draw();};
  $('#newHire').onclick=openNewHire;
  document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{location.href='kb-compliance.html';});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyLink(b.getAttribute('data-copy')));
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReview(+b.getAttribute('data-review')));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const i=INTAKES.find(x=>x.id===+b.getAttribute('data-del'));if(!i)return;
    if(!confirm('Delete this intake'+(i.invited_name?(' for '+i.invited_name):'')+'? Their link stops working.'))return;
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
      body:JSON.stringify({action:'cancel',intake_id:i.id})});
    const j=await r.json().catch(()=>({}));
    if(!(r.status===200&&j.ok)){toast(j.error||'Failed',true);return;}
    toast('Intake deleted');await loadAll();draw();
  });
}
function intakeUrl(token){return location.origin+location.pathname.replace(/[^/]*$/,'')+'intake.html?t='+token;}
function copyLink(token){
  const url=intakeUrl(token);
  function legacy(){const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();
    toast(ok?'Link copied':'Copy failed — long-press the link to copy',!ok);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>toast('Link copied'),legacy);
  else legacy();
}
function e164ish(v){const d=String(v||'').replace(/\D/g,'');
  if(d.length===10)return '+1'+d;if(d.length===11&&d[0]==='1')return '+'+d;
  const t=String(v||'').trim();return t.startsWith('+')&&d.length>=11?t:null;}
/* ---- New Candidate wizard (workflow-style, like the Checklist Template wizard) ---- */
/* Pay sits BEFORE the offer letter on purpose — the letter interpolates
   {pay}/{commission}, so it can't be written until pay is settled. */
const WSTEPS=[['Candidate','Who you\'re hiring'],['Pay','Rate & commission'],['Offer Letter','What they sign'],['Preview','The PDF they get'],['Send','Create & deliver']];
const EARN_LABELS={accessory:'Accessories',device:'Devices',services:'Services'};
let CD=null;
function openNewHire(){
  CD={step:1,name:'',store:(window.CPRLocations?CPRLocations.names():[''])[0]||'',pos:'',start:'',
    payType:'hourly',payAmt:'',comm:false,earns:{accessory:true,device:true,services:true},
    phone:'',email:'',docs:true,body:'',tplDirty:false,created:null,pdfUrl:null};
  drawWiz();
  $('#mask').classList.add('show');

function money(n){ return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* The rendered pay line. This string is what lands in the offer letter and is
   frozen into offer_body — the structured columns are for us, not the PDF. */
function payLabel(){
  const n=parseFloat(CD.payAmt);
  if(!(n>0))return '';
  return money(n)+(CD.payType==='salary'?' per month':' per hour');
}
function commLabel(){
  if(!CD.comm)return 'No commission';
  const on=Object.keys(EARN_LABELS).filter(k=>CD.earns[k]);
  if(!on.length)return 'No commission';
  return 'Commission on '+on.map(k=>EARN_LABELS[k].toLowerCase()).join(', ');
}
function buildOffer(){
  const v={name:CD.name,position:CD.pos,pay:payLabel(),commission:commLabel(),
    store:'CPR '+shortStore(CD.store),start:CD.start};
  let b=OFFER_TPL||'';
  Object.keys(v).forEach(k=>{if(v[k])b=b.split('{'+k+'}').join(v[k]);});
  return b;
}
function grabWiz(){

    CD.store=($('#wStore')||{value:CD.store}).value;
    CD.pos=($('#wPos')||{value:CD.pos}).value.trim();
    CD.start=($('#wStart')||{value:CD.start}).value.trim();
    CD.phone=($('#wPhone')||{value:CD.phone}).value.trim();
    CD.email=($('#wEmail')||{value:CD.email}).value.trim();
  }
  if(CD.step===2){
    const pt=$('#wPayType');if(pt)CD.payType=pt.value;
    const pa=$('#wPayAmt');if(pa)CD.payAmt=pa.value.trim();
    const cm=$('#wComm');if(cm)CD.comm=cm.value==='yes';
    Object.keys(EARN_LABELS).forEach(k=>{const b=$('#wEarn_'+k);if(b)CD.earns[k]=b.checked;});
  }

}

function wireWiz(){
  if(CD.step===2){
    /* pay type and the commission Yes/No both change what the step shows, so
       they redraw; grabWiz() first so nothing typed above is lost */
    $('#wPayType').onchange=()=>{grabWiz();drawWiz();};
    $('#wComm').onchange=()=>{grabWiz();drawWiz();};
    const pa=$('#wPayAmt');if(pa)pa.oninput=()=>{CD.payAmt=pa.value.trim();};
  }
  if(CD.step===3){
    $('#wDocs').onchange=e=>{grabWiz();CD.docs=e.target.checked;drawWiz();};
    const ta=$('#wTpl');
    if(ta){
      ta.value=CD.tplDirty?CD.body:buildOffer();
      CD.body=ta.value;
      ta.oninput=()=>{CD.tplDirty=true;CD.body=ta.value;};
    }
  }
  if(CD.step===4&&CD.docs)buildPdfPreview();
  const bk=$('#wBack');if(bk)bk.onclick=()=>{grabWiz();CD.step--;drawWiz();};
  const cl=$('#wClose');if(cl)cl.onclick=async()=>{
    $('#mask').classList.remove('show');$('#mdl').style.maxWidth='';
    if(CD.created){await loadAll();draw();}
  };
  const nx=$('#wNext');if(nx)nx.onclick=()=>{
    grabWiz();
    if(CD.step===1&&!CD.name){toast('Give the candidate a name.',true);return;}
    if(CD.step===2){
      if(!(parseFloat(CD.payAmt)>0)){toast('Enter the pay amount.',true);return;}
      if(CD.comm&&!Object.keys(EARN_LABELS).some(k=>CD.earns[k])){
        toast('Pick at least one thing they earn commission on — or set Commission to No.',true);return;}
    }
    if(CD.step===3&&CD.docs&&!CD.body.trim()){toast('The offer letter is empty.',true);return;}
    if(CD.step===3&&!CD.tplDirty)CD.body=buildOffer();
    CD.step++;drawWiz();
  };
  const cr=$('#wCreate');if(cr)cr.onclick=createCandidate;
  const cp=$('#wCopy');if(cp)cp.onclick=()=>copyLink(CD.created.token);
  const eg=$('#wEmailGo');if(eg)eg.onclick=emailOffer;
  const tg=$('#wTextGo');if(tg)tg.onclick=textLink;
}
async function buildPdfPreview(){
  const box=$('#wPdfBox');if(!box)return;
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
      body:JSON.stringify({action:'offer_pdf',offer_body:CD.body,store:CD.store})});
    const j=await r.json().catch(()=>({}));
    if(!(r.status===200&&j.ok&&j.pdf))throw new Error(j.error||'preview failed');
    const bytes=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));
    if(CD.pdfUrl)URL.revokeObjectURL(CD.pdfUrl);
    CD.pdfUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    box.innerHTML='<iframe src="'+CD.pdfUrl+'" style="width:100%;height:100%;border:none"></iframe>';
  }catch(e){
    box.innerHTML='<div style="padding:16px;text-align:center">Preview failed — '+esc(e.message||'error')+'.<br>You can still create and send; the letter renders on their signing page.</div>';
  }
}
async function createCandidate(){
  const b=$('#wCreate');b.disabled=true;b.textContent='Creating…';

    body:JSON.stringify({action:'create',invited_name:CD.name,invited_store:CD.store,
      position:CD.pos,pay:payLabel(),start_hint:CD.start,
      pay_type:CD.payType,pay_amount:parseFloat(CD.payAmt)||null,
      commission:CD.comm,commission_earns:CD.comm?CD.earns:null,
      offer_body:CD.docs?CD.body:null,
      phone:e164ish(CD.phone)||CD.phone||null,
      personal_email:CD.email||null})});
  const j=await r.json().catch(()=>({}));
  if(!(r.status===200&&j.ok)){b.disabled=false;b.textContent='Create candidate & link';toast(j.error||'Failed',true);return;}
  CD.created={id:j.id,token:j.token};

}
async function emailOffer(){

function openReview(id){

    }catch(e){pb.disabled=false;pb.textContent='⬇ Signed offer (PDF)';toast('PDF failed — '+(e.message||'error'),true);}
  };
  const go=$('#rvGo');if(go)go.onclick=async()=>{
    const sid=+$('#rvStaff').value;
    if(!sid){toast('Pick their staff row first',true);return;}
    const missing=[];
    if(docs&&!i.offer_signed_at)missing.push('offer signature');
    if(docs&&!i.handbook_signed_at)missing.push('handbook signature');
    if(!i.submitted_at)missing.push('new-hire form');
    if(missing.length&&!confirm('Still missing: '+missing.join(', ')+'. Convert anyway (e.g. done on paper)?'))return;
    go.disabled=true;
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await jwt(),'apikey':ANON},
      body:JSON.stringify({action:'promote',intake_id:i.id,staff_id:sid})});
    const j=await r.json().catch(()=>({}));
    go.disabled=false;
    if(!(r.status===200&&j.ok)){toast(j.error||'Failed',true);return;}
    $('#mask').classList.remove('show');
    toast('Converted — '+(j.assigned||0)+' module'+(j.assigned===1?'':'s')+' auto-assigned');
    await loadAll();draw();
  };
}
$('#mask').addEventListener('mousedown',e=>{if(e.target===$('#mask'))$('#mask').classList.remove('show');});
async function boot(){
  if(!isMgr(AUTH.role)){$('#page').innerHTML='<div class="empty">Managers only.</div>';return;}
  await loadAll();draw();
}
</script>
</body>
</html>
