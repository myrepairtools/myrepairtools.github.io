<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Interview · CPR Cell Phone Repair</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--grey:#B9BDCB;
--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B;--ring:0 0 0 3px rgba(79,176,227,.16)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--dark);background:var(--light-grey);
  padding:0 0 60px;-webkit-text-size-adjust:100%}
.top{background:var(--dark);color:#fff;padding:16px 20px;text-align:center}
.top img{height:34px;display:block;margin:0 auto;max-width:84%}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px}
h1{font-family:'Nunito';font-weight:900;font-size:1.5rem;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--dark-grey);font-weight:700;font-size:.9rem;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(45,45,59,.05)}
input{width:100%;font-family:'Nunito Sans';font-weight:600;font-size:1rem;color:var(--dark);
  height:48px;padding:5px 13px;border:1.5px solid var(--border);border-radius:11px;background:#fff}
input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
input.bad{border-color:var(--red)}
.flbl{font-family:'Nunito';font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;
  color:var(--dark-grey);margin:13px 0 5px}
.flbl:first-child{margin-top:0}
.ferr{color:var(--red);font-weight:800;font-size:.78rem;margin-top:5px}
/* progress segments — Location / Time / Details */
.segs{display:flex;align-items:flex-start;gap:6px;margin-bottom:16px}
.segs>div{flex:1;display:flex;flex-direction:column;gap:5px}
.segs .bar{height:5px;border-radius:999px;background:var(--border)}
.segs .on .bar{background:var(--red)}
.segs .lb{font-family:'Nunito';font-weight:800;font-size:.64rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey)}
/* numbered step title (step 1 card) */
.stept{display:flex;align-items:center;gap:9px;font-family:'Nunito';font-weight:900;font-size:.95rem;margin-bottom:12px}
.stept .stepn{width:22px;height:22px;border-radius:50%;background:var(--dark);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:.7rem;flex:none}
/* store option cards (step 1) */
.stcard{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);
  border-radius:13px;padding:14px;margin-bottom:9px;cursor:pointer;font:inherit;color:var(--dark)}
.stcard:last-child{margin-bottom:0}
.stcard.sel{background:#F7FBFE;border:2px solid var(--blue);padding:13.5px}
.stcard .strow{display:flex;align-items:flex-start;gap:11px}
.stcard .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:#fff;flex:none;margin-top:2px}
.stcard.sel .radio{border:6px solid var(--blue)}
.stcard .stb{flex:1;min-width:0}
.stcard .stb b{font-family:'Nunito';font-weight:900;font-size:.95rem;display:block;color:var(--dark)}
.stcard .staddr{display:block;font-size:.84rem;font-weight:700;color:var(--dark-grey);margin-top:2px}
.stcard .stnext{display:block;font-size:.8rem;font-weight:800;color:#2E7CA6;margin-top:6px}
.stcard .stnext.none{font-weight:700;color:var(--dark-grey)}
/* location bar (steps 2 & 3) */
.locbar{background:#F7FBFE;border:1px solid #D6ECF8;border-radius:13px;padding:13px 15px;margin-bottom:14px}
.locbar .lrow{display:flex;align-items:flex-start;gap:10px}
.locbar .lb1{flex:1;min-width:0}
.locbar .lnm{font-family:'Nunito';font-weight:900;font-size:.95rem;margin-bottom:2px}
.locbar .lad{font-size:.85rem;font-weight:700;color:var(--dark-grey)}
.locbar .chg{flex:none;min-height:36px;padding:0 12px;font-family:'Nunito';font-weight:800;font-size:.78rem;
  border:1.5px solid #D6ECF8;background:#fff;color:#2E7CA6;border-radius:9px;cursor:pointer}
.locbar .llinks{display:flex;gap:14px;margin-top:8px;font-size:.84rem;font-weight:700}
.locbar .llinks a{color:#2E7CA6;text-decoration:none}
.locbar .lsum{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #D6ECF8}
.locbar .lsum svg{color:#2E7CA6;flex:none}
.locbar .lsum b{font-family:'Nunito';font-weight:900;font-size:.88rem}
/* month calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhd span{font-family:'Nunito';font-weight:900;font-size:1.02rem}
.calhd .nav{width:38px;height:38px;border:1.5px solid var(--border);background:#fff;border-radius:10px;
  font-size:1.15rem;font-weight:800;color:var(--dark);cursor:pointer;line-height:1}
.calhd .nav:disabled{opacity:.3;cursor:not-allowed}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-wd span{text-align:center;font-family:'Nunito';font-weight:800;font-size:.66rem;color:var(--dark-grey);
  text-transform:uppercase;letter-spacing:.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-x{aspect-ratio:1}
.cal-d{position:relative;aspect-ratio:1;border:1.5px solid transparent;border-radius:11px;background:#FAFAFB;
  font-family:'Nunito';font-weight:800;font-size:.92rem;color:var(--grey);cursor:default;padding:0}
.cal-d.has{background:#fff;border-color:var(--border);color:var(--dark);cursor:pointer}
.cal-d.has:hover{border-color:var(--blue)}
.cal-d.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cal-d .dot{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:5px;height:5px;
  border-radius:50%;background:var(--blue)}
.cal-d.on .dot{display:none}
/* day's times — 2-up, tap advances */
.dayhd{font-family:'Nunito';font-weight:900;font-size:.92rem;margin-bottom:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.slot{min-height:52px;font-family:'Nunito';font-weight:800;font-size:.9rem;padding:6px 8px;border:1.5px solid var(--border);
  border-radius:11px;background:#fff;color:var(--dark);cursor:pointer;transition:.12s;text-align:center}
.slot:hover{border-color:var(--blue)}
.slot .who{display:block;font-family:'Nunito Sans';font-weight:700;font-size:.68rem;color:var(--dark-grey);margin-top:2px}
.noslots{font-size:.85rem;font-weight:700;color:var(--dark-grey);padding:6px 0 2px}
.btn{display:block;width:100%;font-family:'Nunito';font-weight:800;font-size:1rem;min-height:52px;padding:12px;border:none;
  border-radius:12px;background:var(--red);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--dark);border:1.5px solid var(--border)}
.btn.ghost{background:transparent;color:var(--dark-grey);border:none;font-size:.85rem;padding:10px;min-height:0}
/* confirmation / booking view */
.okhead{text-align:center;padding:4px 0 2px}
.okhead .okc{width:56px;height:56px;border-radius:50%;background:#E7F6EE;color:var(--green);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.okhead .okc.bad{background:#FDECEC;color:var(--red)}
.okhead h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:0}
.okhead .oksub{color:var(--dark-grey);font-weight:700;font-size:.86rem}
.det{background:#F7FBFE;border:1px solid #D6ECF8;border-radius:13px;padding:14px;margin:16px 0;text-align:left}
.det .row{display:flex;gap:10px;padding:5px 0;font-size:.9rem}
.det .row b{font-family:'Nunito';font-weight:800;min-width:58px;flex:none}
.calmain{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;
  font-family:'Nunito';font-weight:800;font-size:.95rem;border:1.5px solid var(--dark);border-radius:12px;
  background:var(--dark);color:#fff;cursor:pointer}
.calrow{display:flex;gap:8px;margin-top:8px}
.calrow .cb{flex:1;min-height:42px;display:inline-flex;align-items:center;justify-content:center;
  font-family:'Nunito';font-weight:800;font-size:.82rem;border:1.5px solid var(--border);background:#fff;
  color:var(--dark);border-radius:10px;cursor:pointer;text-decoration:none;padding:6px 4px}
.mgrow{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--light-grey)}
.mgrow .cb{min-height:42px;display:inline-flex;align-items:center;justify-content:center;font-family:'Nunito';
  font-weight:800;font-size:.82rem;border:1.5px solid var(--border);background:#fff;border-radius:10px;cursor:pointer;padding:0 14px}
.mgrow .re{flex:1;color:var(--dark)}
.mgrow .cx{flex:none;color:var(--red)}
.muted{color:var(--grey);font-weight:700;font-size:.82rem;text-align:center;padding:22px}
.err{color:var(--red);font-weight:800;font-size:.85rem;margin-top:9px;min-height:1em}
.pill{display:inline-block;font-family:'Nunito';font-weight:800;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.4px;padding:4px 10px;border-radius:999px;background:#E7F6EE;color:var(--green)}
.pill.off{background:#FBE9EA;color:var(--red)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><img src="assets/images/CPRLogo_NoAssurant_White.svg" alt="CPR Cell Phone Repair"></div>
<div class="wrap">
  <div id="view"><div class="muted">Loading…</div></div>
</div>

<script>
/* ============================================================
   Public interview booking — no sign-in, no gates. Design 8a:
   a stepped widget (Location → Time → Details → Confirmed) with
   a progress bar; picking a time advances automatically. ?h=
   links (or a single bookable store) skip the location step.
   ?t=<token> shows an existing booking with reschedule/cancel.
   Everything is computed server-side by the `interviews` function.
   ============================================================ */
var FN='https://xuvsehrevxackuhmbmry.supabase.co/functions/v1/interviews';
var $=function(s,c){return (c||document).querySelector(s);};
var qs=new URLSearchParams(location.search);
var TOKEN=qs.get('t')||'', HOST=qs.get('h')||'', STORE=qs.get('store')||'';
var SLOTS=[], PICK=null, STOREINFO={};
var STEP=1, STORESEL=null, DAY=null, MON=null, TRIED=false;
var FNAME='', FPHONE='', FEMAIL='';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDay(iso){return new Date(iso).toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric',timeZone:'America/Los_Angeles'});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-US',
  {hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});}
function fmtFull(iso){return fmtDay(iso)+' at '+fmtTime(iso);}
var CAL_SVG='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>';
var CHECK_SVG='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
// every active store, Settings display order
function storeList(){
  return Object.keys(STOREINFO).sort(function(a,b){
    return (STOREINFO[a].order||0)-(STOREINFO[b].order||0);});
}
// stores that can actually produce a time (have open slots)
function bookableStores(){
  var m={};SLOTS.forEach(function(s){if(s.store)m[s.store]=1;});
  return storeList().filter(function(st){return m[st];}).concat(
    Object.keys(m).filter(function(st){return !STOREINFO[st];}));
}
function stOptions(){var o=HOST?bookableStores():storeList();return o.length?o:bookableStores();}
function nextOpenLine(store){
  var s=SLOTS.filter(function(x){return x.store===store;})[0];
  if(!s)return null;
  return new Date(s.starts_at).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Los_Angeles'})
    +' · '+fmtTime(s.starts_at);
}
function mapsHrefFor(store,addr){
  return 'https://maps.google.com/?q='+encodeURIComponent((store||'')+(addr?' '+addr:''));
}
/* ---------- add to calendar ---------- */
function icsStamp(iso){return new Date(iso).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c;}).replace(/\n/g,'\\n');}
function calEvent(b){
  var si=(b.store&&STOREINFO[b.store])||{address:b.address||'',phone:b.phone||''};
  var det='Interview with '+(b.host||'us')+'.'
    +(si.phone?'\nStore phone: '+si.phone:'')
    +'\nChange or cancel: https://myrepairtools.com/interview.html?t='+(b.token||TOKEN);
  return {start:b.starts_at,end:b.ends_at||new Date(new Date(b.starts_at).getTime()+18e5).toISOString(),
    title:'Interview at '+(b.store||'CPR Cell Phone Repair'),loc:si.address||'',det:det,
    uid:(b.token||TOKEN)+'@myrepairtools.com'};
}
function bindCalBtns(b){
  var ev=calEvent(b);
  var g=$('#calG');
  if(g)g.href='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(ev.title)+'&dates='+icsStamp(ev.start)+'/'+icsStamp(ev.end)
    +'&location='+encodeURIComponent(ev.loc)+'&details='+encodeURIComponent(ev.det);
  var i=$('#calIcs');
  if(i)i.onclick=function(){
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CPR Cell Phone Repair//Interview//EN',
      'BEGIN:VEVENT','UID:'+ev.uid,'DTSTAMP:'+icsStamp(new Date().toISOString()),
      'DTSTART:'+icsStamp(ev.start),'DTEND:'+icsStamp(ev.end),
      'SUMMARY:'+icsEsc(ev.title),'LOCATION:'+icsEsc(ev.loc),'DESCRIPTION:'+icsEsc(ev.det),
      'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
    a.download='cpr-interview.ics';
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ---------- shared pieces ---------- */
function segsHtml(){
  return '<div class="segs">'
    +'<div class="on"><div class="bar"></div><div class="lb">Location</div></div>'
    +'<div'+(STEP>=2?' class="on"':'')+'><div class="bar"></div><div class="lb">Time</div></div>'
    +'<div'+(STEP>=3?' class="on"':'')+'><div class="bar"></div><div class="lb">Details</div></div>'
    +'</div>';
}
function locBarHtml(withSummary){
  var si=STOREINFO[STORESEL]||{};
  var multi=stOptions().length>1;
  return '<div class="locbar"><div class="lrow"><div class="lb1">'
      +'<div class="lnm">'+esc(STORESEL)+'</div>'
      +(si.address?'<div class="lad">'+esc(si.address)+'</div>':'')
    +'</div>'
    +(multi?'<button class="chg" id="chg">Change</button>':'')
    +'</div>'
    +((si.phone||si.address)?'<div class="llinks">'
      +(si.phone?'<a href="tel:'+esc(String(si.phone).replace(/[^+\d]/g,''))+'">'+esc(si.phone)+'</a>':'')
      +(si.address?'<a href="'+esc(mapsHrefFor(STORESEL,si.address))+'" target="_blank" rel="noopener">Directions</a>':'')
    +'</div>':'')
    +(withSummary&&PICK?'<div class="lsum">'+CAL_SVG+'<b>'+esc(fmtFull(PICK.starts_at))+'</b></div>':'')
    +'</div>';
}
function bindChg(toStep){
  var c=$('#chg');
  if(c)c.onclick=function(){
    if(toStep===1){STORESEL=null;DAY=null;MON=null;PICK=null;STEP=1;}
    else {STEP=2;PICK=null;}
    renderPicker();
  };
}

/* ---------- existing booking (?t=) ---------- */
async function showBooking(){
  var r=await fetch(FN+'?action=view&t='+encodeURIComponent(TOKEN)).then(x=>x.json()).catch(()=>({}));
  if(!r.ok){$('#view').innerHTML='<div class="card"><div class="muted">We couldn’t find that booking. '
    +'Check the link, or contact the store.</div></div>';return;}
  var b=r.booking, live=b.status==='booked';
  if(live){renderDone(b,null);return;}
  $('#view').innerHTML='<div class="card"><div class="okhead">'
    +'<span class="okc bad">✕</span>'
    +'<h1>This interview was '+esc(b.status)+'</h1>'
    +'<span class="pill off">'+esc(b.status)+'</span></div>'
    +'<div class="det">'
      +'<div class="row"><b>When</b><span>'+esc(fmtFull(b.starts_at))+'</span></div>'
      +'<div class="row"><b>Where</b><span>'+esc(b.store||'')+(b.address?'<br>'+esc(b.address):'')+'</span></div>'
    +'</div>'
    +'<button class="btn" id="rebook">Book a New Time</button></div>';
  $('#rebook').onclick=function(){ TOKEN=''; startPicker(''); };
}
// design 8a "done" card — used for a fresh confirmation AND the ?t= view of a live booking
function renderDone(b,sent){
  var sub=sent===null?'':(sent&&sent.length
    ?'Confirmation sent by '+sent.join(' and ')+'.'
    :'Save this page — it’s your change-or-cancel link.');
  $('#view').innerHTML='<div class="card">'
    +'<div class="okhead"><span class="okc">'+CHECK_SVG+'</span>'
    +'<h1>You’re booked</h1>'
    +(sub?'<div class="oksub">'+esc(sub)+'</div>':'')
    +'</div>'
    +'<div class="det">'
      +'<div class="row"><b>When</b><span>'+esc(fmtFull(b.starts_at))+'</span></div>'
      +(b.store?'<div class="row"><b>Where</b><span>'+esc(b.store)+(b.address?'<br>'+esc(b.address):'')+'</span></div>':'')
      +'<div class="row"><b>Who</b><span>'+esc(b.host||'')+'</span></div>'
      +(b.candidate_name?'<div class="row"><b>You</b><span>'+esc(b.candidate_name)+'</span></div>':'')
    +'</div>'
    +'<button class="calmain" id="calIcs">'+CAL_SVG+' Add to Calendar</button>'
    +'<div class="calrow">'
      +'<a class="cb" id="calG" target="_blank" rel="noopener">Google Calendar</a>'
      +(b.address?'<a class="cb" href="'+esc(mapsHrefFor(b.store,b.address))+'" target="_blank" rel="noopener">Directions</a>':'')
    +'</div>'
    +'<div class="mgrow">'
      +'<button class="cb re" id="resch">Reschedule</button>'
      +'<button class="cb cx" id="cancel">Cancel</button>'
    +'</div>'
    +'<div class="err" id="err"></div></div>';
  bindCalBtns(b);
  $('#resch').onclick=function(){ startPicker(b.token||TOKEN); };
  $('#cancel').onclick=async function(){
    if(!confirm('Cancel your interview on '+fmtFull(b.starts_at)+'?'))return;
    this.disabled=true;
    var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'cancel',t:b.token||TOKEN})}).then(x=>x.json()).catch(()=>({}));
    if(d.ok)showBooking(); else {$('#err').textContent='Could not cancel — please call the store.';this.disabled=false;}
  };
}

/* ---------- stepped picker (8a) ---------- */
var RESCH='';
async function startPicker(reschToken){
  RESCH=reschToken||'';
  $('#view').innerHTML='<div class="muted">Finding open times…</div>';
  var u=FN+'?action=slots'+(HOST?'&host='+encodeURIComponent(HOST):'')+(STORE?'&store='+encodeURIComponent(STORE):'');
  var r=await fetch(u).then(x=>x.json()).catch(()=>({slots:[]}));
  SLOTS=r.slots||[]; STOREINFO=r.stores||{}; PICK=null; DAY=null; MON=null; TRIED=false;
  var opts=stOptions();
  // a pinned link (or a lone store) skips the location step
  if(opts.length<=1){STORESEL=opts[0]||null;STEP=2;}
  else if(!STORESEL){STEP=1;}
  renderPicker();
}
function localKey(iso){   // 'YYYY-MM-DD' of a slot in store time
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
}
function renderPicker(){
  var opts=stOptions();
  if(!SLOTS.length&&!opts.length){
    $('#view').innerHTML='<h1>Book an interview</h1>'
      +'<div class="card"><div class="muted">No times are open right now.<br>'
      +'Please check back soon, or contact the store directly.</div></div>';
    return;
  }
  if(STORESEL&&opts.indexOf(STORESEL)===-1){STORESEL=null;STEP=1;}
  if(STEP===1)return renderStep1(opts);
  if(!STORESEL){STEP=1;return renderStep1(opts);}
  if(STEP===3&&PICK)return renderStep3();
  STEP=2; renderStep2(opts);
}
function renderStep1(opts){
  var cards=opts.map(function(st){
    var si=STOREINFO[st]||{};
    var nx=nextOpenLine(st);
    return '<button class="stcard'+(st===STORESEL?' sel':'')+'" data-st="'+esc(st)+'"><span class="strow">'
      +'<span class="radio"></span><span class="stb"><b>'+esc(st)+'</b>'
      +(si.address?'<span class="staddr">'+esc(si.address)+'</span>':'')
      +(nx?'<span class="stnext">Next opening '+esc(nx)+'</span>'
          :'<span class="stnext none">No openings in the next 3 weeks</span>')
      +'</span></span></button>';
  }).join('');
  $('#view').innerHTML=segsHtml()
    +'<h1>'+(RESCH?'Pick a new time':'Book an interview')+'</h1>'
    +'<div class="sub">Pick the store you’re applying to, then a time.</div>'
    +'<div class="card"><div class="stept"><span class="stepn">1</span>Choose a location</div>'+cards+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'),function(b){
    b.onclick=function(){STORESEL=b.getAttribute('data-st');DAY=null;MON=null;PICK=null;STEP=2;renderPicker();};
  });
}
function renderStep2(opts){
  var F=SLOTS.filter(function(s){return s.store===STORESEL;});
  var h1='<h1 style="margin-bottom:14px">'+(RESCH?'Pick a new time':'Pick a time')+'</h1>';
  if(!F.length){
    $('#view').innerHTML=segsHtml()+locBarHtml(false)+h1
      +'<div class="card"><div class="noslots">No openings at '+esc(STORESEL)+' in the next 3 weeks.'
      +(opts.length>1?'<br>Tap Change to try another location, or check back soon.':'<br>Please check back soon, or contact the store directly.')
      +'</div></div>';
    bindChg(1); return;
  }
  var byDay={};
  F.forEach(function(s){var k=localKey(s.starts_at);(byDay[k]=byDay[k]||[]).push(s);});
  var keys=Object.keys(byDay).sort();
  if(!DAY||!byDay[DAY])DAY=keys[0];
  if(!MON)MON=new Date(DAY+'T12:00');
  var y=MON.getFullYear(), m=MON.getMonth();
  var first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  var firstKey=keys[0], lastKey=keys[keys.length-1];
  var canPrev=firstKey.slice(0,7) < (y+'-'+String(m+1).padStart(2,'0'));
  var canNext=lastKey.slice(0,7) > (y+'-'+String(m+1).padStart(2,'0'));
  var cells='';
  for(var i=0;i<first;i++)cells+='<div class="cal-x"></div>';
  for(var d=1;d<=dim;d++){
    var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var open=byDay[key];
    cells+='<button class="cal-d'+(open?' has':'')+(key===DAY?' on':'')+'"'
      +(open?' data-day="'+key+'"':' disabled')+'>'+d
      +(open?'<span class="dot"></span>':'')+'</button>';
  }
  var list=byDay[DAY]||[];
  $('#view').innerHTML=segsHtml()+locBarHtml(false)+h1
    +'<div class="card" style="padding:16px;margin-bottom:12px">'
      +'<div class="calhd">'
        +'<button class="nav" id="pv"'+(canPrev?'':' disabled')+'>‹</button>'
        +'<span>'+MON.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>'
        +'<button class="nav" id="nx"'+(canNext?'':' disabled')+'>›</button>'
      +'</div>'
      +'<div class="cal-wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>'
      +'<div class="cal">'+cells+'</div>'
    +'</div>'
    +'<div class="card" style="padding:16px">'
      +'<div class="dayhd">'+(list.length?esc(fmtDay(list[0].starts_at)):'Pick a day')+'</div>'
      +(list.length
        ?'<div class="slots">'+list.map(function(s){
            return '<button class="slot" data-i="'+SLOTS.indexOf(s)+'">'+esc(fmtTime(s.starts_at))
              +'<span class="who">'+esc(String(s.name).split(/\s+/)[0])+'</span></button>';
          }).join('')+'</div>'
        :'<div class="noslots">Nothing open that day — try one of the highlighted dates.</div>')
    +'</div>';
  bindChg(1);
  var pv=$('#pv'), nx=$('#nx');
  if(pv&&canPrev)pv.onclick=function(){MON=new Date(y,m-1,1);renderPicker();};
  if(nx&&canNext)nx.onclick=function(){MON=new Date(y,m+1,1);renderPicker();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-day]'),function(b){
    b.onclick=function(){DAY=b.getAttribute('data-day');PICK=null;renderPicker();};
  });
  Array.prototype.forEach.call(document.querySelectorAll('.slot'),function(b){
    b.onclick=function(){
      PICK=SLOTS[+b.getAttribute('data-i')];
      if(RESCH){doReschedule();return;}
      STEP=3; TRIED=false; renderPicker();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}
function fieldErrs(){
  return {
    name: FNAME.trim().length<2?'Enter your full name.':'',
    phone: FPHONE.replace(/\D/g,'').length<10?'Enter a 10-digit mobile number.':'',
    email: /^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(FEMAIL.trim())?'':'Enter a valid email address.'
  };
}
function renderStep3(){
  var e=fieldErrs(), show=TRIED;
  $('#view').innerHTML=segsHtml()+locBarHtml(true)
    +'<h1>Your details</h1>'
    +'<div class="sub" style="margin-bottom:14px">All three are required — we send confirmations to both.</div>'
    +'<div class="card" style="padding:16px">'
      +'<div class="flbl">Full name</div><input id="fName" value="'+esc(FNAME)+'" placeholder="Jordan Avery" autocomplete="name"'+(show&&e.name?' class="bad"':'')+'>'
      +(show&&e.name?'<div class="ferr">'+esc(e.name)+'</div>':'')
      +'<div class="flbl">Mobile number</div><input id="fPhone" value="'+esc(FPHONE)+'" placeholder="(541) 555-0142" inputmode="tel" autocomplete="tel"'+(show&&e.phone?' class="bad"':'')+'>'
      +(show&&e.phone?'<div class="ferr">'+esc(e.phone)+'</div>':'')
      +'<div class="flbl">Email</div><input id="fEmail" value="'+esc(FEMAIL)+'" placeholder="you@example.com" inputmode="email" autocomplete="email"'+(show&&e.email?' class="bad"':'')+'>'
      +(show&&e.email?'<div class="ferr">'+esc(e.email)+'</div>':'')
      +'<button class="btn" id="go" style="margin-top:16px">Book '+esc(fmtTime(PICK.starts_at))+'</button>'
      +'<div class="err" id="err"></div>'
    +'</div>';
  bindChg(2);
  $('#fName').oninput=function(){FNAME=this.value;};
  $('#fPhone').oninput=function(){FPHONE=this.value;};
  $('#fEmail').oninput=function(){FEMAIL=this.value;};
  $('#go').onclick=submit;
}
async function submit(){
  FNAME=$('#fName').value; FPHONE=$('#fPhone').value; FEMAIL=$('#fEmail').value;
  var e=fieldErrs();
  if(e.name||e.phone||e.email){TRIED=true;renderStep3();return;}
  var go=$('#go'); go.disabled=true; go.textContent='Booking…';
  var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'book',staff_id:PICK.staff_id,starts_at:PICK.starts_at,
      candidate_name:FNAME.trim(),candidate_phone:FPHONE.trim(),candidate_email:FEMAIL.trim()})})
    .then(x=>x.json()).catch(()=>({}));
  if(!d.ok){
    go.disabled=false; go.textContent='Try again';
    if(d.error==='slot_taken'){
      $('#err').textContent='Sorry — someone just took that time. Pick another.';
      setTimeout(function(){STEP=2;PICK=null;startPicker(RESCH);},1400);
    }else $('#err').textContent='Could not book that time. Please try again.';
    return;
  }
  var sent=[];
  if(d.confirm&&d.confirm.sms)sent.push('text');
  if(d.confirm&&d.confirm.email)sent.push('email');
  try{history.replaceState(null,'','interview.html?t='+d.token);}catch(e2){}
  TOKEN=d.token;
  renderDone({token:d.token,starts_at:d.starts_at,ends_at:d.ends_at,host:d.host,store:d.store,
    address:d.address,phone:d.phone,candidate_name:FNAME.trim()},sent);
}
async function doReschedule(){
  var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'reschedule',t:RESCH,starts_at:PICK.starts_at})})
    .then(x=>x.json()).catch(()=>({}));
  if(!d.ok){ alert(d.error==='slot_taken'?'Someone just took that time — pick another.':'Could not move it.');
    startPicker(RESCH); return; }
  TOKEN=RESCH; RESCH=''; showBooking();
}

TOKEN?showBooking():startPicker('');
</script>
</body>
</html>
