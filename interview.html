<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Interview · CPR Cell Phone Repair</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--grey:#B9BDCB;
--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B;--ring:0 0 0 3px rgba(79,176,227,.16)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--dark);background:var(--light-grey);
  padding:0 0 60px;-webkit-text-size-adjust:100%}
.top{background:var(--dark);color:#fff;padding:16px 20px;text-align:center}
.top img{height:34px;display:block;margin:0 auto;max-width:84%}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px}
h1{font-family:'Nunito';font-weight:900;font-size:1.5rem;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--dark-grey);font-weight:700;font-size:.9rem;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(45,45,59,.05)}
.lbl{font-family:'Nunito';font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;
  color:var(--dark-grey);margin-bottom:7px}
select,input,textarea{width:100%;font-family:'Nunito Sans';font-weight:600;font-size:1rem;color:var(--dark);
  padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;background:#fff}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.field{margin-bottom:13px}
.daygrp{margin-bottom:16px}
/* month calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhd span{font-family:'Nunito';font-weight:900;font-size:1.02rem}
.calhd .nav{width:38px;height:38px;border:1.5px solid var(--border);background:#fff;border-radius:10px;
  font-size:1.15rem;font-weight:800;color:var(--dark);cursor:pointer;line-height:1}
.calhd .nav:disabled{opacity:.3;cursor:not-allowed}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-wd span{text-align:center;font-family:'Nunito';font-weight:800;font-size:.66rem;color:var(--grey);
  text-transform:uppercase;letter-spacing:.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-x{aspect-ratio:1}
.cal-d{position:relative;aspect-ratio:1;border:1.5px solid transparent;border-radius:11px;background:#FAFAFB;
  font-family:'Nunito';font-weight:800;font-size:.92rem;color:var(--grey);cursor:default;padding:0}
.cal-d.has{background:#fff;border-color:var(--border);color:var(--dark);cursor:pointer}
.cal-d.has:hover{border-color:var(--blue)}
.cal-d.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cal-d .dot{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:5px;height:5px;
  border-radius:50%;background:var(--blue)}
.cal-d.on .dot{background:#fff}
.dayhd{font-family:'Nunito';font-weight:900;font-size:.9rem;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.dayhd .cnt{font-family:'Nunito Sans';font-weight:700;font-size:.72rem;color:var(--grey)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.slot{font-family:'Nunito';font-weight:800;font-size:.88rem;padding:13px 8px;border:1.5px solid var(--border);
  border-radius:11px;background:#fff;color:var(--dark);cursor:pointer;transition:.12s;text-align:center}
.slot:hover{border-color:var(--blue)}
.slot.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slot .who{display:block;font-family:'Nunito Sans';font-weight:700;font-size:.66rem;opacity:.75;margin-top:2px}
.btn{display:block;width:100%;font-family:'Nunito';font-weight:800;font-size:1rem;padding:15px;border:none;
  border-radius:12px;background:var(--red);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--dark);border:1.5px solid var(--border)}
.btn.ghost{background:transparent;color:var(--dark-grey);border:none;font-size:.85rem;padding:10px}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:2.6rem;margin-bottom:6px}
.ok h2{font-family:'Nunito';font-weight:900;font-size:1.3rem;margin:0 0 6px}
.det{background:#F7FBFE;border:1px solid #D6ECF8;border-radius:13px;padding:15px;margin:16px 0;text-align:left}
.det .row{display:flex;gap:10px;padding:6px 0;font-size:.92rem}
.det .row b{font-family:'Nunito';font-weight:800;min-width:64px;flex:none}
.det a{color:#2E7CA6;font-weight:700;text-decoration:none}
/* numbered step titles (7a — location is step 1) */
.stept{display:flex;align-items:center;gap:9px;font-family:'Nunito';font-weight:900;font-size:.95rem;margin-bottom:11px}
.stept .stepn{width:22px;height:22px;border-radius:50%;background:var(--dark);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:.7rem;flex:none}
.stept .sttag{margin-left:auto;font-size:.78rem;font-weight:800;color:#2E7CA6}
/* store option cards */
.stcard{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--border);border-radius:13px;padding:14px;margin-bottom:9px;cursor:pointer;font-family:'Nunito Sans'}
.stcard.sel{background:#F7FBFE;border:2px solid var(--blue);padding:13.5px}
.stcard .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:#fff;flex:none;margin-top:2px}
.stcard.sel .radio{border:6px solid var(--blue)}
.stcard .stb{flex:1;min-width:0}
.stcard .stb b{font-family:'Nunito';font-weight:900;font-size:.95rem;display:block;color:var(--dark)}
.stcard .staddr{display:block;font-size:.84rem;font-weight:700;color:var(--dark-grey);margin-top:2px}
.stcard .stnext{display:block;font-size:.8rem;font-weight:800;color:var(--dark-grey);margin-top:5px}
.stcard.sel .stnext.nx{color:#2E7CA6}
.stcard .stnext.none{font-weight:700}
/* standing store card (7b — pinned links) */
.stpin{border-left:4px solid var(--red);padding:16px 18px}
.stpin .pinrow{display:flex;gap:12px;align-items:flex-start}
.stpin .pinicon{width:34px;height:34px;border-radius:9px;background:#F7FBFE;border:1px solid #D6ECF8;color:#2E7CA6;
  display:flex;align-items:center;justify-content:center;flex:none}
.stpin .pinlbl{display:block;font-family:'Nunito';font-weight:800;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.5px;color:var(--dark-grey)}
.stpin .pinname{font-family:'Nunito';font-weight:900;font-size:1.02rem;margin:1px 0 2px}
.stpin .pinaddr{font-size:.85rem;font-weight:700;color:var(--dark-grey);line-height:1.45}
.stpin .pinacts{display:flex;gap:8px;margin-top:12px}
.stpin .pinacts .pa{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:40px;
  border:1.5px solid var(--border);border-radius:10px;background:#fff;font-family:'Nunito';font-weight:800;
  font-size:.8rem;color:var(--dark);text-decoration:none;cursor:pointer;padding:6px 4px}
.calbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.calbtns .btn{margin:0;font-size:.88rem;padding:13px 8px;text-align:center;text-decoration:none}
.muted{color:var(--grey);font-weight:700;font-size:.82rem;text-align:center;padding:22px}
.err{color:var(--red);font-weight:800;font-size:.85rem;margin-top:9px;min-height:1em}
.pill{display:inline-block;font-family:'Nunito';font-weight:800;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.4px;padding:4px 10px;border-radius:999px;background:#E7F6EE;color:var(--green)}
.pill.off{background:#FBE9EA;color:var(--red)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><img src="assets/images/CPRLogo_NoAssurant_White.svg" alt="CPR Cell Phone Repair"></div>
<div class="wrap">
  <div id="view"><div class="muted">Loading…</div></div>
</div>

<script>
/* ============================================================
   Public interview booking — no sign-in, no gates. The candidate
   picks from live slots; ?t=<token> shows an existing booking so
   they can reschedule or cancel it themselves.
   Everything is computed server-side by the `interviews` function.
   ============================================================ */
var FN='https://xuvsehrevxackuhmbmry.supabase.co/functions/v1/interviews';
var $=function(s,c){return (c||document).querySelector(s);};
var qs=new URLSearchParams(location.search);
var TOKEN=qs.get('t')||'', HOST=qs.get('h')||'', STORE=qs.get('store')||'';
var SLOTS=[], PICK=null, HOSTS=[], STOREINFO={};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDay(iso){return new Date(iso).toLocaleDateString('en-US',
  {weekday:'long',month:'long',day:'numeric',timeZone:'America/Los_Angeles'});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-US',
  {hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});}
function fmtFull(iso){return fmtDay(iso)+' at '+fmtTime(iso);}
function shortStore(s){return String(s||'').replace(/^CPR\s+/i,'');}
var PIN_SVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
// every active store, Settings display order
function storeList(){
  return Object.keys(STOREINFO).sort(function(a,b){
    return (STOREINFO[a].order||0)-(STOREINFO[b].order||0);});
}
// stores that can actually produce a time (have open slots)
function bookableStores(){
  var m={};SLOTS.forEach(function(s){if(s.store)m[s.store]=1;});
  return storeList().filter(function(st){return m[st];}).concat(
    Object.keys(m).filter(function(st){return !STOREINFO[st];}));
}
function nextOpenLine(store){
  var s=SLOTS.filter(function(x){return x.store===store;})[0];
  if(!s)return null;
  return new Date(s.starts_at).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Los_Angeles'})
    +' · '+fmtTime(s.starts_at);
}
// "1090 Lancaster Dr NE" / "Salem, OR 97301"
function addrLines(addr){
  var p=String(addr||'').split(', ');
  if(p.length<3)return [addr||'',''];
  return [p.slice(0,-2).join(', '),p.slice(-2).join(', ')];
}
function mapsHref(store){
  var si=STOREINFO[store]||{};
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(store+(si.address?', '+si.address:''));
}
/* ---------- add to calendar ---------- */
function icsStamp(iso){return new Date(iso).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c;}).replace(/\n/g,'\\n');}
function calEvent(b){
  var si=(b.store&&STOREINFO[b.store])||{address:b.address||'',phone:b.phone||'',email:b.email||''};
  var loc=(b.store||'')+(si.address?', '+si.address:'');
  var det='Interview with '+(b.host||'us')+'.'
    +(si.phone?'\nStore phone: '+si.phone:'')
    +(si.email?'\nStore email: '+si.email:'')
    +'\nChange or cancel: https://myrepairtools.com/interview.html?t='+(b.token||TOKEN);
  return {start:b.starts_at,end:b.ends_at||new Date(new Date(b.starts_at).getTime()+18e5).toISOString(),
    title:'Interview — CPR Cell Phone Repair',loc:loc,det:det,uid:(b.token||TOKEN)+'@myrepairtools.com'};
}
function calBtnsHtml(){return '<div class="calbtns"><button class="btn alt" id="calIcs">Add to Calendar</button>'
  +'<a class="btn alt" id="calG" target="_blank" rel="noopener">Google Calendar</a></div>';}
function bindCalBtns(b){
  var ev=calEvent(b);
  $('#calG').href='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(ev.title)+'&dates='+icsStamp(ev.start)+'/'+icsStamp(ev.end)
    +'&location='+encodeURIComponent(ev.loc)+'&details='+encodeURIComponent(ev.det);
  $('#calIcs').onclick=function(){
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CPR Cell Phone Repair//Interview//EN',
      'BEGIN:VEVENT','UID:'+ev.uid,'DTSTAMP:'+icsStamp(new Date().toISOString()),
      'DTSTART:'+icsStamp(ev.start),'DTEND:'+icsStamp(ev.end),
      'SUMMARY:'+icsEsc(ev.title),'LOCATION:'+icsEsc(ev.loc),'DESCRIPTION:'+icsEsc(ev.det),
      'END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
    a.download='cpr-interview.ics';
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ---------- existing booking (?t=) ---------- */
async function showBooking(){
  var r=await fetch(FN+'?action=view&t='+encodeURIComponent(TOKEN)).then(x=>x.json()).catch(()=>({}));
  if(!r.ok){$('#view').innerHTML='<div class="card"><div class="muted">We couldn’t find that booking. '
    +'Check the link, or contact the store.</div></div>';return;}
  var b=r.booking, live=b.status==='booked';
  $('#view').innerHTML='<div class="card"><div class="ok">'
    +'<div class="big">'+(live?'✅':'🚫')+'</div>'
    +'<h2>'+(live?'You’re booked':'This interview was '+esc(b.status))+'</h2>'
    +(live?'<span class="pill">Confirmed</span>':'<span class="pill off">'+esc(b.status)+'</span>')
    +'</div>'
    +'<div class="det">'
      +'<div class="row"><b>When</b><span>'+esc(fmtFull(b.starts_at))+'</span></div>'
      +'<div class="row"><b>Who</b><span>'+esc(b.host)+'</span></div>'
      +(b.store?'<div class="row"><b>Where</b><span>'+esc(b.store)+(b.address?'<br>'+esc(b.address):'')+'</span></div>':'')
      +(b.phone?'<div class="row"><b>Phone</b><span><a href="tel:'+esc(String(b.phone).replace(/[^+\d]/g,''))+'">'+esc(b.phone)+'</a></span></div>':'')
      +(b.email?'<div class="row"><b>Email</b><span><a href="mailto:'+esc(b.email)+'">'+esc(b.email)+'</a></span></div>':'')
      +(b.position?'<div class="row"><b>Role</b><span>'+esc(b.position)+'</span></div>':'')
    +'</div>'
    +(live?calBtnsHtml()
          +'<button class="btn alt" id="resch">Pick a different time</button>'
          +'<button class="btn ghost" id="cancel">Cancel this interview</button>'
      :'<button class="btn" id="rebook">Book a new time</button>')
    +'<div class="err" id="err"></div></div>';
  if(live){
    bindCalBtns(b);
    $('#resch').onclick=function(){ startPicker(b.token); };
    $('#cancel').onclick=async function(){
      if(!confirm('Cancel your interview on '+fmtFull(b.starts_at)+'?'))return;
      this.disabled=true;
      var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'cancel',t:b.token})}).then(x=>x.json()).catch(()=>({}));
      if(d.ok)showBooking(); else {$('#err').textContent='Could not cancel — please call the store.';this.disabled=false;}
    };
  } else if($('#rebook')) $('#rebook').onclick=function(){ TOKEN=''; startPicker(''); };
}

/* ---------- slot picker ---------- */
var RESCH='';
async function startPicker(reschToken){
  RESCH=reschToken||'';
  $('#view').innerHTML='<div class="muted">Finding open times…</div>';
  var u=FN+'?action=slots'+(HOST?'&host='+encodeURIComponent(HOST):'')+(STORE?'&store='+encodeURIComponent(STORE):'');
  var r=await fetch(u).then(x=>x.json()).catch(()=>({slots:[]}));
  SLOTS=r.slots||[]; STOREINFO=r.stores||{}; PICK=null;
  renderPicker();
}
/* Location first (7a/7b), then a month calendar — pick a DAY, then that day's
   times appear. Shared links start on "Choose a location"; per-host or
   single-store links pin the store as a standing card instead. */
var MON=null, DAY=null, STORESEL=null;
function localKey(iso){   // 'YYYY-MM-DD' of a slot in store time
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
}
var CHOOSING=false;   // pinned link, "Change" tapped — show the store list once
function isStepFlow(){return !HOST&&storeList().length>1;}
function renderPicker(){
  if(!SLOTS.length&&!storeList().length){
    $('#view').innerHTML='<h1>Book an interview</h1>'
      +'<div class="card"><div class="muted">No times are open right now.<br>'
      +'Please check back soon, or contact the store directly.</div></div>';
    return;
  }
  var options=HOST?bookableStores():storeList();
  if(!options.length)options=bookableStores();
  var multi=options.length>1;
  var stepFlow=!HOST&&multi;                       // 7a — location is step 1
  var pinned=!stepFlow;                            // 7b — the link (or a lone store) pins it
  if(STORESEL&&options.indexOf(STORESEL)===-1){STORESEL=null;}
  if(pinned&&!STORESEL&&!CHOOSING)STORESEL=bookableStores()[0]||options[0]||null;
  if(!SLOTS.length&&pinned&&!STORESEL){
    $('#view').innerHTML='<h1>Book an interview</h1>'
      +'<div class="card"><div class="muted">No times are open right now.<br>'
      +'Please check back soon, or contact the store directly.</div></div>';
    return;
  }
  var h1='<h1>'+(RESCH?'Pick a new time':'Book an interview')+'</h1>';
  var subhead=stepFlow?'<div class="sub">Pick the store you’re applying to, then a time.</div>':'';

  // step-1 store option cards (7a; also the pinned link's Change list)
  function storeCards(){
    return options.map(function(st){
      var si=STOREINFO[st]||{};
      var nx=nextOpenLine(st);
      return '<button class="stcard'+(st===STORESEL?' sel':'')+'" data-st="'+esc(st)+'">'
        +'<span class="radio"></span><span class="stb"><b>'+esc(st)+'</b>'
        +(si.address?'<span class="staddr">'+esc(si.address)+'</span>':'')
        +(nx?'<span class="stnext nx">Next opening '+esc(nx)+'</span>'
            :'<span class="stnext none">No openings in the next 3 weeks</span>')
        +'</span></button>';
    }).join('');
  }
  var step1=(stepFlow||CHOOSING)
    ?'<div class="card"><div class="stept"><span class="stepn">1</span>Choose a Location</div>'+storeCards()+'</div>':'';

  function bindStoreCards(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-st]'),function(b){
      b.onclick=function(){STORESEL=b.getAttribute('data-st');CHOOSING=false;DAY=null;MON=null;PICK=null;renderPicker();};
    });
  }

  // nothing below step 1 until a store is chosen
  if(!STORESEL){
    $('#view').innerHTML=h1+subhead+step1;
    bindStoreCards(); return;
  }

  // standing store card (7b)
  var pinCard='';
  if(pinned&&!CHOOSING){
    var si=STOREINFO[STORESEL]||{}, al=addrLines(si.address);
    pinCard='<div class="card stpin"><div class="pinrow">'
      +'<span class="pinicon">'+PIN_SVG+'</span>'
      +'<div style="flex:1;min-width:0"><span class="pinlbl">Your interview is at</span>'
      +'<div class="pinname">'+esc(STORESEL)+'</div>'
      +(si.address?'<div class="pinaddr">'+esc(al[0])+(al[1]?'<br>'+esc(al[1]):'')+'</div>':'')
      +'</div></div>'
      +'<div class="pinacts">'
        +'<a class="pa" target="_blank" rel="noopener" href="'+esc(mapsHref(STORESEL))+'">Directions</a>'
        +(si.phone?'<a class="pa" href="tel:'+esc(si.phone.replace(/[^+\d]/g,''))+'">'+esc(si.phone)+'</a>':'')
        +(multi?'<button class="pa" id="stChange">Change</button>':'')
      +'</div></div>';
  }
  function bindChange(){
    var c=$('#stChange');
    if(c)c.onclick=function(){CHOOSING=true;STORESEL=null;DAY=null;MON=null;PICK=null;renderPicker();};
  }
  var step2Head=stepFlow
    ?'<div class="stept"><span class="stepn">2</span>Pick a Time<span class="sttag">'+esc(shortStore(STORESEL))+'</span></div>':'';

  var F=SLOTS.filter(function(s){return s.store===STORESEL;});
  // a chosen store with nothing open — keep the choice visible, say so plainly
  if(!F.length){
    $('#view').innerHTML=h1+subhead+step1+pinCard
      +'<div class="card">'+step2Head
      +'<div class="muted">No openings at '+esc(STORESEL)+' in the next 3 weeks.<br>'
      +(multi?'Pick another location, or check back soon.':'Please check back soon, or contact the store directly.')
      +'</div></div>';
    bindStoreCards(); bindChange(); return;
  }

  var byDay={};
  F.forEach(function(s){var k=localKey(s.starts_at);(byDay[k]=byDay[k]||[]).push(s);});
  var keys=Object.keys(byDay).sort();
  if(!DAY||!byDay[DAY])DAY=keys[0];
  if(!MON)MON=new Date(DAY+'T12:00');
  var y=MON.getFullYear(), m=MON.getMonth();
  var first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  var firstKey=keys[0], lastKey=keys[keys.length-1];
  var canPrev=firstKey.slice(0,7) < (y+'-'+String(m+1).padStart(2,'0'));
  var canNext=lastKey.slice(0,7) > (y+'-'+String(m+1).padStart(2,'0'));

  var cells='';
  for(var i=0;i<first;i++)cells+='<div class="cal-x"></div>';
  for(var d=1;d<=dim;d++){
    var key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var open=byDay[key];
    cells+='<button class="cal-d'+(open?' has':'')+(key===DAY?' on':'')+'"'
      +(open?' data-day="'+key+'"':' disabled')+'>'+d
      +(open?'<span class="dot"></span>':'')+'</button>';
  }
  var list=byDay[DAY]||[];
  var multiHost=Object.keys(F.reduce(function(a,s){a[s.staff_id]=1;return a;},{})).length>1;

  $('#view').innerHTML=h1+subhead+step1+pinCard
    +'<div class="card">'+step2Head
      +'<div class="calhd">'
        +'<button class="nav" id="pv"'+(canPrev?'':' disabled')+'>‹</button>'
        +'<span>'+MON.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>'
        +'<button class="nav" id="nx"'+(canNext?'':' disabled')+'>›</button>'
      +'</div>'
      +'<div class="cal-wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>'
      +'<div class="cal">'+cells+'</div>'
    +'</div>'
    +'<div class="card"><div class="dayhd">'+esc(fmtDay(list[0].starts_at))
      +'<span class="cnt">'+list.length+' time'+(list.length===1?'':'s')+' open</span></div>'
      +'<div class="slots">'+list.map(function(s){
        return '<button class="slot" data-i="'+SLOTS.indexOf(s)+'">'+esc(fmtTime(s.starts_at))
          +(multiHost?'<span class="who">'+esc(String(s.name).split(/\s+/)[0])+'</span>':'')+'</button>';
      }).join('')+'</div></div>'
    +'<div id="form"></div>';

  var pv=$('#pv'), nx=$('#nx');
  if(pv&&canPrev)pv.onclick=function(){MON=new Date(y,m-1,1);renderPicker();};
  if(nx&&canNext)nx.onclick=function(){MON=new Date(y,m+1,1);renderPicker();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-day]'),function(b){
    b.onclick=function(){DAY=b.getAttribute('data-day');PICK=null;renderPicker();};
  });
  Array.prototype.forEach.call(document.querySelectorAll('.slot'),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.slot'),function(x){x.classList.remove('on');});
      b.classList.add('on'); PICK=SLOTS[+b.getAttribute('data-i')];
      RESCH?doReschedule():renderForm();
    };
  });
  bindStoreCards(); bindChange();
}
function renderForm(){
  var stepFlow=isStepFlow();
  $('#form').innerHTML='<div class="card">'
    +(stepFlow?'<div class="stept"><span class="stepn">3</span>Your Details</div>':'<div class="lbl">Your details</div>')
    +'<div class="field"><input id="fName" placeholder="Full name" autocomplete="name"></div>'
    +'<div class="field"><input id="fPhone" placeholder="Mobile number" inputmode="tel" autocomplete="tel"></div>'
    +'<div class="field"><input id="fEmail" placeholder="Email (optional)" inputmode="email" autocomplete="email"></div>'
    +'<div class="field"><input id="fRole" placeholder="Position you’re applying for (optional)"></div>'
    +'<button class="btn" id="go">Book '+esc(fmtTime(PICK.starts_at))
      +(stepFlow&&PICK.store?' at '+esc(shortStore(PICK.store)):' on '+esc(fmtDay(PICK.starts_at)))+'</button>'
    +'<div class="err" id="err"></div></div>';
  $('#form').scrollIntoView({behavior:'smooth',block:'nearest'});
  $('#go').onclick=submit;
}
async function submit(){
  var name=$('#fName').value.trim(), phone=$('#fPhone').value.trim(),
      email=$('#fEmail').value.trim(), role=$('#fRole').value.trim();
  if(!name){$('#err').textContent='Please enter your name.';return;}
  if(!phone&&!email){$('#err').textContent='Add a mobile number or email so we can confirm.';return;}
  var go=$('#go'); go.disabled=true; go.textContent='Booking…';
  var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'book',staff_id:PICK.staff_id,starts_at:PICK.starts_at,
      candidate_name:name,candidate_phone:phone,candidate_email:email,position:role})})
    .then(x=>x.json()).catch(()=>({}));
  if(!d.ok){
    go.disabled=false; go.textContent='Try again';
    $('#err').textContent = d.error==='slot_taken'
      ? 'Sorry — someone just took that time. Pick another below.'
      : 'Could not book that time. Please try again.';
    if(d.error==='slot_taken') setTimeout(function(){ startPicker(''); },1400);
    return;
  }
  confirmed(d);
}
function confirmed(d){
  var sent=[];
  if(d.confirm&&d.confirm.sms)sent.push('texted');
  if(d.confirm&&d.confirm.email)sent.push('emailed');
  $('#view').innerHTML='<div class="card"><div class="ok">'
    +'<div class="big">🎉</div><h2>You’re booked!</h2>'
    +'<span class="pill">Confirmed</span></div>'
    +'<div class="det">'
      +'<div class="row"><b>When</b><span>'+esc(fmtFull(d.starts_at))+'</span></div>'
      +'<div class="row"><b>Who</b><span>'+esc(d.host)+'</span></div>'
      +(d.store?'<div class="row"><b>Where</b><span>'+esc(d.store)+(d.address?'<br>'+esc(d.address):'')+'</span></div>':'')
      +(d.phone?'<div class="row"><b>Phone</b><span><a href="tel:'+esc(String(d.phone).replace(/[^+\d]/g,''))+'">'+esc(d.phone)+'</a></span></div>':'')
      +(d.email?'<div class="row"><b>Email</b><span><a href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a></span></div>':'')
    +'</div>'
    +calBtnsHtml()
    +'<div class="sub" style="text-align:center;margin:0">'
      +(sent.length?('We '+sent.join(' and ')+' you the details. '):'')
      +'Save this page to change or cancel your time.</div>'
    +'</div>';
  try{history.replaceState(null,'','interview.html?t='+d.token);}catch(e){}
  TOKEN=d.token;
  bindCalBtns(d);
}
async function doReschedule(){
  var d=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'reschedule',t:RESCH,starts_at:PICK.starts_at})})
    .then(x=>x.json()).catch(()=>({}));
  if(!d.ok){ alert(d.error==='slot_taken'?'Someone just took that time — pick another.':'Could not move it.');
    startPicker(RESCH); return; }
  TOKEN=RESCH; RESCH=''; showBooking();
}

TOKEN?showBooking():startPicker('');
</script>
</body>
</html>
