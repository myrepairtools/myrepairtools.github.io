[mcp_servers.supabase]
command = "npx"
args = [
    "-y",
    "@supabase/mcp-server-supabase@latest",
    "--project-ref=xuvsehrevxackuhmbmry",
    "--features=database,debugging,development,functions,storage",
]
env_vars = ["SUPABASE_ACCESS_TOKEN"]

[mcp_servers.supabase-readonly]
command = "npx"
args = [
    "-y",
    "@supabase/mcp-server-supabase@latest",
    "--project-ref=xuvsehrevxackuhmbmry",
    "--read-only",
    "--features=database,debugging,development,functions,storage",
]
env_vars = ["SUPABASE_ACCESS_TOKEN"]
