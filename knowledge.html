<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base · CPR Oregon</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--grey:#B9BDCB;--light-grey:#F3F2F2;--border:#E0E2EA;--row:#F0F1F4;--green:#2E9E5B;--greend:#0f6e56;--greenbg:#E1F5EE;--amber:#B87A00;--card:0 1px 3px rgba(45,45,59,.05)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey)}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.45rem;letter-spacing:-.3px;margin:0}
.sub{color:var(--dark-grey);font-size:.85rem;font-weight:700;margin-top:2px}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;padding:9px 16px;border:1.5px solid var(--border);background:#fff;color:var(--dark);border-radius:10px;cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.dk{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.sm{padding:7px 13px;font-size:.76rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{width:100%;font-family:'Nunito Sans',sans-serif;font-size:.98rem;padding:13px 16px 13px 44px;border:1.5px solid var(--border);border-radius:12px;background:#fff;box-shadow:var(--card);color:var(--dark)}
.searchbox input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
.searchbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.5}
/* two-col shell */
.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.sidecard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:6px 0 8px}
.sgh{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.9px;color:var(--grey);padding:10px 15px 5px}
.srowbtn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 15px 8px 12px;border:none;border-left:3px solid transparent;background:transparent;color:var(--dark-grey);font-family:'Nunito',sans-serif;font-weight:700;font-size:.84rem;cursor:pointer;text-align:left}
.srowbtn:hover{background:var(--light-grey)}
.srowbtn.on{background:#EAF6FD;border-left-color:var(--blue);color:#1E7AA8;font-weight:800}
.srowbtn .sic{width:18px;text-align:center;flex:none}
.srowbtn .slb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srowbtn .sbadge{min-width:18px;text-align:center;background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;padding:1px 6px}
.srowbtn .scount{font-size:.68rem;font-weight:800;color:var(--grey)}
.sdiv{height:1px;background:var(--border);margin:8px 15px}
/* required banner */
.reqbanner{display:flex;align-items:center;gap:12px;background:#FDF6E7;border:1.5px solid #F2DFAE;border-radius:12px;padding:11px 16px;margin-bottom:12px;flex-wrap:wrap}
.reqbanner .t{flex:1;font-size:.84rem;font-weight:700;color:#7A5A08;min-width:200px}
/* article rows */
.listcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);overflow:hidden}
.arow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--row);cursor:pointer}
.arow:hover{background:#F8FAFD}
.arow:last-child{border-bottom:none}
.atile{width:34px;height:34px;border-radius:9px;background:#F3F6FA;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
.amain{flex:1;min-width:0}
.atitlerow{display:flex;align-items:center;gap:8px}
.adot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.atitle{font-family:'Nunito',sans-serif;font-weight:700;font-size:.92rem;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atitle.unread{font-weight:900}
.achip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.achip.req{background:#FDEBEC;color:var(--red)}
.achip.ack{background:var(--greenbg);color:var(--greend)}
.achip.new{background:#EAF6FD;color:#1E7AA8}
.achip.draft{background:#FBF1DC;color:#7A5B10}
.asum{font-size:.78rem;color:#8A8FA0;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ameta{text-align:right;flex:none;width:110px}
.ameta .c1,.aviewed .c1{font-family:'Nunito',sans-serif;font-size:.62rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.ameta .c2,.aviewed .c2{font-size:.7rem;font-weight:700;color:var(--grey);margin-top:2px}
.aviewed{text-align:right;flex:none;width:78px}
@media(max-width:700px){.aviewed,.ameta{display:none}}
/* ---- portal home (13c/14a) ---- */
.wrap.bleed{max-width:none;padding:0 0 60px}
.hero{position:relative;background:#1E7AA8;margin:0;padding:34px 28px 44px;text-align:center}
.hero .hlogo{display:inline-flex;align-items:center;gap:10px;color:#fff}
.hero .hlogo b{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem}
.hero .hsub{font-size:.82rem;font-weight:700;color:rgba(255,255,255,.65);margin-top:4px}
.hero .hnew{position:absolute;top:16px;right:20px}
.herosearch{position:relative;max-width:560px;margin:16px auto 0;text-align:left}
.herosearch input{width:100%;font-family:'Nunito Sans',sans-serif;font-size:.98rem;padding:14px 18px 14px 46px;border:none;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);color:var(--dark)}
.herosearch input:focus{outline:none;box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 3px rgba(79,176,227,.5)}
.herosearch .hsic{position:absolute;left:17px;top:24px;transform:translateY(-50%);display:inline-flex;color:var(--grey);pointer-events:none}
.spanel{background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;text-align:left}
.spanel .sptop{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--row)}
.spanel .sptop input{flex:1;border:none;padding:14px 0;font-family:'Nunito Sans',sans-serif;font-size:.98rem;font-weight:600;color:var(--dark);background:none}
.spanel .sptop input:focus{outline:none}
.spanel .esc{font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;color:var(--grey);border:1px solid var(--border);border-radius:5px;padding:2px 6px;flex:none}
.sprow{display:flex;gap:12px;width:100%;padding:11px 18px;border:none;border-bottom:1px solid #F7F7F9;background:none;cursor:pointer;text-align:left}
.sprow:hover,.sprow.sel{background:#F3F9FD}
.sprow .rtile{width:32px;height:32px;border-radius:9px;background:#F3F6FA;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
.sprow .rtitle{font-family:'Nunito',sans-serif;font-weight:900;font-size:.88rem;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprow .rsnip{display:block;font-size:.76rem;font-weight:600;color:var(--dark-grey);margin-top:2px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sprow .rsnip b{background:#FFF3C4;border-radius:3px;padding:0 2px}
.sprow .rcat{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);margin-top:3px}
.spfoot{display:flex;align-items:center;gap:10px;padding:9px 18px;background:#FAFAFB}
.spfoot .k{font-size:.68rem;font-weight:700;color:var(--grey)}
.spfoot a{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;color:var(--blue);text-decoration:none;cursor:pointer;margin-left:auto}
.homebody{position:relative;z-index:2;max-width:1000px;margin:-22px auto 0;padding:0 20px;transition:opacity .15s}
.homebody.dim{opacity:.35;pointer-events:none}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cattile{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:16px 12px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cattile:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(45,45,59,.1)}
.cattile .ctic{width:38px;height:38px;border-radius:11px;background:#EAF6FD;color:#1E7AA8;display:flex;align-items:center;justify-content:center}
.cattile .ctn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);line-height:1.3}
.cattile .ctc{font-size:.66rem;font-weight:800;color:var(--grey)}
/* manager-only categories read RED — the site's privileged signal (Manager
   badge, admin rail) — so gated shelves are obvious at a glance */
.cattile.gated .ctic{background:#FDEBEC;color:var(--red)}
.cattile.gated:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(220,40,46,.14)}
.cattile .mgrflag{font-family:'Nunito',sans-serif;font-weight:800;font-size:.58rem;text-transform:uppercase;letter-spacing:.4px;color:var(--red)}
.mgrchip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;
background:rgba(255,255,255,.92);color:var(--red);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cattiles.mgr .cattile{cursor:grab}
.cattile.dragging{opacity:.45}
.cardgrid.mgr .acard{cursor:grab}
.acard.dragging{opacity:.45}
.mostread{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);overflow:hidden;margin-top:14px}
.mostread .mrh{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;text-transform:uppercase;letter-spacing:.7px;color:#8A8FA0;padding:11px 16px;border-bottom:1px solid var(--row)}
.mrrow{display:flex;align-items:center;gap:11px;width:100%;padding:8px 16px;border:none;border-bottom:1px solid #F7F7F9;background:none;cursor:pointer;text-align:left}
.mrrow:hover{background:#F8FAFD}
.mrrow:last-child{border-bottom:none}
.mrrow .mre{font-size:.95rem;flex:none}
.mrrow .mrt{flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:.84rem;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrrow .mrn{font-size:.68rem;font-weight:700;color:var(--grey);white-space:nowrap}
/* ---- topic view (17a) ---- */
.tband{background:#1E7AA8;margin:0;padding:18px 20px 22px}
.tbin{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbin .bc{display:inline-flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:rgba(255,255,255,.7);text-decoration:none;cursor:pointer;background:none;border:none}
.tbin .bc:hover{color:#fff}
.tbin .bsep{color:rgba(255,255,255,.3);font-size:.78rem}
.tbin .bname{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;color:#fff}
.tbin .bsum{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.5)}
.tsearch{position:relative;width:260px;margin-left:auto}
.tsearch input{width:100%;font-family:'Nunito Sans',sans-serif;font-size:.82rem;font-weight:600;padding:8px 12px 8px 34px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.08);color:#fff}
.tsearch input::placeholder{color:rgba(255,255,255,.45)}
.tsearch input:focus{outline:none;background:#fff;color:var(--dark);border-color:#fff}
.tsearch .tsic{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:inline-flex;color:var(--grey);pointer-events:none}
.pillrow{max-width:1200px;margin:14px auto 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pillrow .plab{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.45);margin-right:2px}
.fpill{font-family:'Nunito',sans-serif;font-weight:800;font-size:.76rem;padding:6px 14px;border:none;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);cursor:pointer;white-space:nowrap}
.fpill:hover{background:rgba(255,255,255,.25)}
.fpill.on{background:#fff;color:#1E7AA8}
.fpill .n{opacity:.6;font-size:.66rem}
.chiprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chiprow .clab{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.7px;color:var(--grey);margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.74rem;padding:5px 12px;border:1.5px solid var(--border);border-radius:999px;background:#fff;color:var(--dark-grey);cursor:pointer}
.fchip:hover{border-color:var(--blue)}
.fchip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.fchip .n{font-size:.64rem;opacity:.6}
.topicbody{max-width:1200px;margin:0 auto;padding:16px 20px 0}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.acard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:14px 15px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.acard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(45,45,59,.1)}
.acard .actop{display:flex;align-items:center;gap:8px}
.acard .actile{width:36px;height:36px;border-radius:10px;background:#F3F6FA;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none}
.acard .acbadge{font-family:'Nunito',sans-serif;font-weight:800;font-size:.58rem;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:999px;background:#EAF6FD;color:#1E7AA8;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acard .acbadge.grey{background:#F0F1F4;color:var(--dark-grey)}
.acard .actitle{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;line-height:1.35;color:var(--dark)}
.acard .acfoot{display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;color:var(--grey);border-top:1px solid var(--row);padding-top:8px;margin-top:auto}
/* ---- category settings (20a) ---- */
.catgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
@media(max-width:900px){.catgrid{grid-template-columns:1fr}}
.catlist{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:6px 0 8px}
.catrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 15px 10px 12px;border:none;border-left:3px solid transparent;background:none;cursor:pointer;text-align:left}
.catrow:hover{background:var(--light-grey)}
.catrow.on{border-left-color:var(--blue);background:#EAF6FD}
.catrow .cric{width:32px;height:32px;border-radius:9px;background:#F3F6FA;color:#8A8FA0;display:flex;align-items:center;justify-content:center;flex:none}
.catrow.on .cric{background:#fff;color:#1E7AA8}
.catrow .crn{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.84rem;color:var(--dark)}
.catrow.on .crn{font-weight:900;color:#1E7AA8}
.catrow .crs{display:block;font-size:.66rem;font-weight:700;color:var(--grey);margin-top:1px}
.catrow .crfac{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;padding:2px 8px;border-radius:999px;background:#F0F1F4;color:var(--dark-grey);white-space:nowrap;flex:none}
.catrow.on .crfac{background:#fff;color:#1E7AA8}
.catrow .crnone{font-size:.66rem;font-weight:800;color:#C7CAD4;flex:none}
.catdetail{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);padding:18px 22px}
.facpanel{border:1px solid var(--row);border-radius:11px;padding:14px 16px}
.facpanel .fph{font-family:'Nunito',sans-serif;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.9px;color:var(--grey);margin-bottom:8px}
.facpanel .fl{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin-bottom:4px}
.facpanel input.glbl{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Nunito Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--dark);margin-bottom:10px}
.facpanel input.glbl:focus{outline:none;border-color:var(--blue)}
.subrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--row);border-radius:8px;background:#fff}
.subrow.dragging{opacity:.45}
.subrow .grip{color:#C7CAD4;cursor:grab;display:inline-flex;flex:none}
.subrow .sn{flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem}
.subrow .sc{font-size:.66rem;font-weight:800;color:var(--grey)}
.subrow .sx,.tagpill .sx{width:16px;height:16px;border:none;border-radius:50%;background:#F3F2F2;color:#8A8FA0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;line-height:1;flex:none}
.subrow .sx:hover,.tagpill .sx:hover{background:#FDEBEC;color:var(--red)}
.adddash{font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;border:1.5px dashed #C7CAD4;border-radius:8px;background:none;color:var(--dark-grey);padding:6px;cursor:pointer}
.adddash:hover{border-color:var(--blue);color:var(--blue)}
.adddash.pill{border-radius:999px;padding:4px 11px}
.tagpill{display:inline-flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.74rem;padding:4px 6px 4px 11px;border:1.5px solid var(--border);border-radius:999px;background:#fff}
.tagpill .tc{font-size:.62rem;font-weight:800;color:var(--grey)}
/* + menu (replaces the retired KB nav pane's Manage rows) */
.pmrow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;border:none;border-bottom:1px solid #F7F7F9;background:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);cursor:pointer;text-align:left}
.pmrow:hover{background:#F8FAFD}
.pmrow:last-child{border-bottom:none}
.pmrow .pmc{margin-left:auto;font-size:.68rem;font-weight:800;color:var(--grey)}
/* search results */
.sres{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--card);overflow:hidden;margin-bottom:12px}
.sresrow{padding:12px 17px;border-bottom:1px solid var(--row);cursor:pointer}
.sresrow:hover{background:#F8FAFD}
.sresrow:last-child{border-bottom:none}
.sresrow .st{font-family:'Nunito',sans-serif;font-weight:900;font-size:.92rem}
.sresrow .sn{font-size:.8rem;color:var(--dark-grey);margin-top:3px}
.sresrow .sn b{background:#FFF3C4;border-radius:3px;padding:0 2px}
/* breadcrumb */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.crumb a{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--dark-grey);text-decoration:none;cursor:pointer}
.crumb .sep{color:#C7CAD4;font-size:.78rem}
.crumb .cat{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;color:var(--grey)}
/* reading card */
.artcard{background:#fff;border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:12px;box-shadow:var(--card);overflow:hidden}
.artcard .ahd{padding:30px 38px 0}
@media(max-width:700px){.artcard .ahd{padding:22px 20px 0}}
.artcard h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.55rem;line-height:1.3;margin:0;text-wrap:pretty;letter-spacing:0}
.artmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;font-size:.76rem;font-weight:700;color:var(--grey)}
.artbody{padding:24px 38px 8px;font-family:'Nunito Sans',sans-serif;font-size:.95rem;line-height:1.75;color:#3A3A45}
@media(max-width:700px){.artbody{padding:18px 20px 8px}}
.artbody h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;color:var(--dark);margin:22px 0 10px}
.artbody h4{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;color:var(--dark);margin:18px 0 8px}

function fmtD(x){ if(!x)return ''; const d=new Date(x); if(isNaN(d))return '';

/* ---------- light markup → safe HTML (house renderer + !> amber callouts) ---------- */
function render(text){
  let s=esc(text);
  s=s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/__([^_\n]+)__/g,'<u>$1</u>');
  s=s.replace(/(^|[\s(>])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const lines=s.split('\n'); let out='',ul=false,ol=false;
  const close=()=>{ if(ul){out+='</ul>';ul=false;} if(ol){out+='</ol>';ol=false;} };
  for(const ln of lines){
    let m;
    if(/^\s*---+\s*$/.test(ln)){ close(); out+='<hr>'; }
    else if((m=/^!&gt;\s+(.*)$/.exec(ln))){ close(); out+='<div class="callout"><span class="ci">⚠️</span><div class="ct">'+m[1]+'</div></div>'; }
    else if((m=/^##\s+(.*)$/.exec(ln))){ close(); out+='<h4>'+m[1]+'</h4>'; }
    else if((m=/^#\s+(.*)$/.exec(ln))){ close(); out+='<h3>'+m[1]+'</h3>'; }
    else if((m=/^\s*[-•]\s+(.*)$/.exec(ln))){ if(ol){out+='</ol>';ol=false;} if(!ul){out+='<ul>';ul=true;} out+='<li>'+m[1]+'</li>'; }
    else if((m=/^\s*\d+[.)]\s+(.*)$/.exec(ln))){ if(ul){out+='</ul>';ul=false;} if(!ol){out+='<ol>';ol=true;} out+='<li>'+m[1]+'</li>'; }
    else if(ln.trim()===''){ close(); out+='<div style="height:8px"></div>'; }
    else { close(); out+=ln+'<br>'; }
  }
  close();
  return out;
}

/* ---------- auth ---------- */
let AUTH=null, BOOTED=false;
async function resolveMe(sess){
  if(!sess||BOOTED)return;
  const sr=await sb.from('staff').select('id,display_name,role').eq('auth_uid',sess.user.id).maybeSingle();
  if(sr.data){ BOOTED=true; AUTH={id:sr.data.id,name:sr.data.display_name,role:sr.data.role}; boot(); }
}
sb.auth.onAuthStateChange((_e,sess)=>{ if(sess) resolveMe(sess); });
(async()=>{ try{ const s=(await sb.auth.getSession()).data.session; if(s) resolveMe(s); }catch(e){} })();

/* ---------- state ---------- */
let CATS=[],ARTS=[],READS={},MODULES=[],SECTIONS=[],ASSIGN=null,QUIZ={},MYATT={},STAFF=[],SBN={},STEPS=[],SDONE={};

let CAT='all';   // fresh visits land on the portal home; deep links + browser
                 // history do the remembering (owner call 2026-08-12 — the KB
                 // browses like a site, not a tabbed tool)
let FACET={s:null,t:null};       // topic-view facet selection (subcategory id / tag id)
let TQ='';                       // topic-scoped search text (client-side filter)
let CATSEL=null;                 // selected category in the Categories manage view
let OPEN=null;                   // article being viewed/edited

let SEARCHQ='',SRES=null,SEARCH_T=null,SELIDX=-1,SEXPAND=false;
let PREVIEW=(function(){try{return localStorage.getItem('cprKbPreview')==='1';}catch(e){return false;}})();

async function loadAll(){
  const [c,a,r,m,asn,qz,att,st,sp,sd,sec,sub,tg,atg,mr]=await Promise.all([
    sb.from('kb_categories').select('*').order('sort'),
    sb.from('kb_articles').select('*').order('updated_at',{ascending:false}),
    sb.from('kb_reads').select('article_id,first_read_at,acknowledged_at,last_viewed_at').eq('staff_id',AUTH.id),
    sb.from('onboarding_modules').select('*').eq('active',true).order('sort'),
    sb.from('onboarding_assignments').select('*').eq('staff_id',AUTH.id),
    sb.from('kb_quizzes').select('id,article_id,pass_pct,active,kb_quiz_questions(id)').eq('active',true),
    sb.from('kb_quiz_attempts').select('quiz_id,score_pct,passed,attempt_no').eq('staff_id',AUTH.id),
    sb.from('staff').select('id,display_name').eq('active',true),

    sb.from('onboarding_sections').select('*'),
    sb.from('kb_subcategories').select('*').order('sort'),
    sb.from('kb_tags').select('*').order('sort'),
    sb.from('kb_article_tags').select('article_id,tag_id'),
    sb.rpc('kb_most_read',{days:30})
  ]);
  SUBCATS=sub.data||[]; TAGS=tg.data||[];
  ARTTAGS={}; (atg.data||[]).forEach(x=>{(ARTTAGS[x.article_id]=ARTTAGS[x.article_id]||[]).push(x.tag_id);});
  MOSTREAD=mr.data||[];
  CATS=c.data||[]; ARTS=a.data||[]; MODULES=m.data||[];
  ASSIGN=(asn.data||[]).filter(x=>x.module_id!=null);   // per-module assignment rows (Training model)
  STEPS=sp.data||[]; SDONE={}; (sd.data||[]).forEach(x=>SDONE[x.step_id]=x);
  SECTIONS=(sec&&sec.data)||[];
  READS={}; (r.data||[]).forEach(x=>READS[x.article_id]=x);
  QUIZ={}; (qz.data||[]).forEach(q=>{ QUIZ[q.article_id]={id:q.id,pass_pct:q.pass_pct,nq:(q.kb_quiz_questions||[]).length}; });
  MYATT={}; (att.data||[]).forEach(x=>{ const cur=MYATT[x.quiz_id]||{best:0,passed:false,attempts:0};
    cur.best=Math.max(cur.best,x.score_pct); cur.passed=cur.passed||x.passed;

/* ---------- derived ---------- */
function catById(id){ return CATS.find(x=>x.id===id); }
/* manager-only categories (kb_categories.min_role) hide from employees at the
   UI level; article RLS remains the real enforcement */
function catVisible(c){ return !c||c.min_role!=='manager'||isMgr(AUTH.role); }
function catName(id){ const c=catById(id); return c?c.name:'—'; }
function artIcon(a){ return a.emoji||((catById(a.category_id)||{}).icon)||'📄'; }
function acked(a){ const r=READS[a.id]; return r&&r.acknowledged_at; }
function viewedAt(a){ const r=READS[a.id]; return r?(r.last_viewed_at||r.first_read_at):null; }
/* preview mode: managers see drafts placed exactly where they'll publish —
   the sandbox. Every browse surface flows from here; draft cards keep their
   amber chip so live vs not-yet is always visible. */
function previewOn(){ return PREVIEW&&isMgr(AUTH.role); }
function pubArts(){ return ARTS.filter(a=>a.status==='published'||(previewOn()&&a.status==='draft')); }
function reqOutstanding(){ return pubArts().filter(a=>a.require_ack&&!acked(a)); }
/* onboarding items: a module's track = its ARTICLES (kb_articles.module_id)
   merged with its TASK STEPS (onboarding_steps — HR paperwork, account setups),
   ordered together by sort_order. */
function moduleItems(modId){
  const items=pubArts().filter(a=>a.module_id===modId).map(a=>({kind:'a',a,sort:a.sort_order||0,id:'a'+a.id}))
    .concat(STEPS.filter(s=>s.module_id===modId&&s.who!=='backoffice').map(s=>({kind:'s',s,sort:s.sort_order||0,id:'s'+s.id})));
  return items.sort(itemCmp);
}
/* canonical order for mixed module items: sort_order, then articles before
   steps, then numeric id — IDENTICAL in Setup, My Onboarding & Compliance */
function itemCmp(x,y){ return (x.sort-y.sort)
  || (x.kind===y.kind?0:(x.kind==='a'?-1:1))
  || (x.kind==='a'?(x.a.id-y.a.id):(x.s.id-y.s.id)); }
function articleDone(a){ const q=QUIZ[a.id]; return !!acked(a)&&(!q||!q.nq||(MYATT[q.id]&&MYATT[q.id].passed)); }
function itemDone(it){ return it.kind==='a'?articleDone(it.a):!!SDONE[it.s.id]; }
/* full track: modules with their merged items; global sequential unlock */
function track(){
  const aset=new Set((ASSIGN||[]).map(x=>x.module_id));
  const mods=MODULES.filter(m=>aset.has(m.id)).map(mod=>({mod,items:moduleItems(mod.id)})).filter(x=>x.items.length);
  let nextFound=false;
  mods.forEach((mx,mi)=>{
    mx.done=mx.items.filter(itemDone).length;
    mx.total=mx.items.length;
    mx.quizzes=mx.items.filter(it=>it.kind==='a'&&QUIZ[it.a.id]&&QUIZ[it.a.id].nq).length;
    mx.states=mx.items.map(it=>{
      if(itemDone(it))return 'done';
      if(!nextFound){ nextFound=true; return 'next'; }
      return 'lock';
    });
    mx.complete=mx.done===mx.total;
    mx.lockedModule=mi>0&&!mods.slice(0,mi).every(p=>p.complete)&&mx.done===0;
  });
  return mods;
}
function obOutstanding(){ const t=track(); return t.reduce((n,mx)=>n+(mx.total-mx.done),0); }

/* ---------- hash routing: #a=slug · #c=cat · #onboarding · #quiz=slug · #edit=id · #new ---------- */
function applyHash(){
  const h=location.hash.replace('#','');
  let m;
  if((m=h.match(/^a=([\w-]+)/))){ const art=ARTS.find(x=>x.slug===m[1]); if(art){ openArticle(art.id); return true; } }
  if(h==='onboarding'){ location.replace('training.html#track'); return true; }   // the employee track lives in Training (My Hub) now
  if(h==='modules'){ location.replace('onboarding-setup.html'); return true; }   // Module Setup is its own management page now
  if((m=h.match(/^quiz=([\w-]+)/))){ const art=ARTS.find(x=>x.slug===m[1]); if(art&&QUIZ[art.id]){ startQuiz(art); return true; } }
  if((m=h.match(/^edit=(\d+)/))&&isMgr(AUTH.role)){ const art=ARTS.find(x=>x.id===+m[1]); if(art){ OPEN=art; MODE='edit'; draw(); return true; } }
  if(h==='new'&&isMgr(AUTH.role)){ OPEN=null; MODE='edit'; draw(); return true; }
  if(h==='cats'&&isMgr(AUTH.role)){ MODE='cats'; draw(); return true; }
  if((m=h.match(/^c=([\w-]+)(?:&s=([\w-]+))?(?:&t=([\w-]+))?$/))){
    const v=m[1];
    if(['all','req','drafts','archived'].indexOf(v)>-1){ if((v==='drafts'||v==='archived')&&!isMgr(AUTH.role))return false;
      CAT=v; FACET={s:null,t:null}; save(); MODE='list'; draw(); return true; }
    const cc=CATS.find(x=>String(x.id)===v||slugify(x.name)===v);
    if(cc&&!catVisible(cc))return false;
    if(cc){ CAT=String(cc.id); MODE='list';
      const ss=m[2]?SUBCATS.find(x=>x.category_id===cc.id&&slugify(x.name)===m[2]):null;
      const tt=m[3]?TAGS.find(x=>x.category_id===cc.id&&slugify(x.name)===m[3]):null;
      FACET={s:ss?ss.id:null,t:tt?tt.id:null};
      save(); draw(); return true; }
  }
  return false;
  function save(){ }
}
function setHash(h){ try{ if(location.hash.replace('#','')!==h) history.replaceState(null,'','#'+h); }catch(e){} }
/* level transitions (portal -> category -> article -> editor/quiz) PUSH a
   history entry so the browser Back button walks back up; facet pills, scoped
   search and save flows stay replaceState (refinements, not levels) */
function goHash(h){ try{ if(location.hash.replace('#','')!==h) history.pushState(null,'','#'+h); }catch(e){} }
function catHash(){ if(['all','req','drafts','archived'].indexOf(String(CAT))>-1)return 'c='+CAT;
  const c=catById(+CAT); let h='c='+(c?slugify(c.name):CAT);
  const ss=FACET.s&&SUBCATS.find(x=>x.id===FACET.s), tt=FACET.t&&TAGS.find(x=>x.id===FACET.t);
  if(ss)h+='&s='+slugify(ss.name);
  if(tt)h+='&t='+slugify(tt.name);
  return h; }
window.addEventListener('hashchange',()=>{ if(!AUTH)return;
  if(!applyHash()&&!location.hash){
    /* Back landed on the original no-hash entry = the portal home. Reset the
       in-memory browse state or the old category just redraws itself. */
    MODE='list'; OPEN=null; CAT='all'; FACET={s:null,t:null}; TQ=''; draw();
  } });

function listRows(){
  let rows;
  if(CAT==='drafts')rows=ARTS.filter(a=>a.status==='draft');
  else if(CAT==='archived')rows=ARTS.filter(a=>a.status==='archived');
  else{
    rows=pubArts();
    if(CAT==='req')rows=rows.filter(a=>a.require_ack);
    else if(CAT!=='all')rows=rows.filter(a=>String(a.category_id)===String(CAT));
  }
  return rows;
}
function chipFor(a){
  if(a.status==='draft')return '<span class="achip draft">Draft</span>';
  if(a.status==='archived')return '<span class="achip">Archived</span>';
  if(a.require_ack)return acked(a)?'<span class="achip ack">✓ Acknowledged</span>':'<span class="achip req">Required</span>';
  const fresh=a.published_at&&(Date.now()-new Date(a.published_at))<10*86400000;
  return (fresh&&!viewedAt(a))?'<span class="achip new">New</span>':'';
}
function cardChip(a){
  const base=chipFor(a); if(base)return base;
  const v=viewedAt(a);
  if(v&&a.updated_at&&new Date(a.updated_at)>new Date(v)&&(Date.now()-new Date(a.updated_at))<10*86400000)
    return '<span class="achip draft">Updated</span>';
  return '';
}
function drawList(){
  if(String(CAT)==='all')return drawHome();
  if(['req','drafts','archived'].indexOf(String(CAT))>-1)return drawSimpleList();
  return drawTopic();
}

function wireTileDnD(){
  const grid=$('#catTiles'); if(!grid)return;
  let dragging=null;
  grid.querySelectorAll('.cattile').forEach(t=>{
    t.addEventListener('dragstart',()=>{ dragging=t; t.classList.add('dragging'); });
    t.addEventListener('dragend',async()=>{
      t.classList.remove('dragging'); dragging=null;
      const ids=[...grid.querySelectorAll('.cattile')].map(x=>+x.dataset.cat);
      for(let i=0;i<ids.length;i++){
        const c=CATS.find(x=>x.id===ids[i]);
        if(c)c.sort=(i+1)*10;
        await sb.from('kb_categories').update({sort:(i+1)*10}).eq('id',ids[i]);
      }
      CATS.sort((a,b)=>(a.sort||0)-(b.sort||0));
      toast('Order saved ✔');
    });
  });
  grid.addEventListener('dragover',e=>{
    e.preventDefault(); if(!dragging)return;
    const others=[...grid.querySelectorAll('.cattile:not(.dragging)')];
    const after=others.find(o=>{const r=o.getBoundingClientRect();
      return e.clientY<r.top+r.height/2||(e.clientY<r.bottom&&e.clientX<r.left+r.width/2);});
    if(after)grid.insertBefore(dragging,after); else grid.appendChild(dragging);
  });
}

/* ---------- topic view (17a): sub-category pills × tag chips ---------- */
function allLbl(cat){ return cat.subcat_label?('All '+cat.subcat_label.toLowerCase()+'s'):'All'; }
function drawTopic(){
  const cat=catById(+CAT);
  if(!cat||!catVisible(cat)){ CAT='all'; return drawHome(); }
  const subs=SUBCATS.filter(s=>s.category_id===cat.id);
  const tags=TAGS.filter(t=>t.category_id===cat.id);
  if(FACET.s&&!subs.some(s=>s.id===FACET.s))FACET.s=null;
  if(FACET.t&&!tags.some(t=>t.id===FACET.t))FACET.t=null;
  const catArts=pubArts().filter(a=>a.category_id===cat.id)
    .sort((a,b)=>((a.browse_order??1e9)-(b.browse_order??1e9))
      ||(new Date(b.updated_at)-new Date(a.updated_at)));
  const tagOk=a=>!FACET.t||(ARTTAGS[a.id]||[]).indexOf(FACET.t)>-1;
  const subOk=a=>!FACET.s||a.subcategory_id===FACET.s;
  const rows=catArts.filter(a=>subOk(a)&&tagOk(a));
  const sName=FACET.s?(subs.find(x=>x.id===FACET.s)||{}).name:null;
  const tName=FACET.t?(tags.find(x=>x.id===FACET.t)||{}).name:null;
  const shown=TQ?rows.filter(a=>(a.title+' '+(a.summary||'')).toLowerCase().indexOf(TQ.toLowerCase())>-1):rows;
  const summary=(tName?tName+' · ':'')+(subs.length?((sName||allLbl(cat).toLowerCase())+' · '):'')
    +shown.length+' article'+(shown.length===1?'':'s');
  let band='<div class="tband"><div class="tbin">'
    +'<button class="bc" id="bcHome">'+(window.CPRNavIcon?CPRNavIcon('book-open',14):'')+'Knowledge Base</button>'
    +'<span class="bsep">/</span><span class="bname">'+esc(cat.name)+'</span>'
    +(cat.min_role==='manager'?'<span class="mgrchip">Managers only</span>':'')
    +'<span class="bsum" id="tSum">'+esc(summary)+'</span>'
    +'<div class="tsearch"><span class="tsic">'+(window.CPRNavIcon?CPRNavIcon('search',14):'')+'</span>'
    +'<input id="tq" value="'+esc(TQ)+'" placeholder="Search '+esc(cat.name)+'…" autocomplete="off"></div>'
    +(/handbook/i.test(cat.name)?'<button class="btn dk sm" id="hbFullPdf" style="border-color:rgba(255,255,255,.3)" title="The whole handbook, assembled as one PDF">⬇ Full PDF</button>':'')
    +previewPill()
    +plusMenu()
  +'</div>';
  if(subs.length){
    const allN=catArts.filter(tagOk).length;
    band+='<div class="pillrow">'
      +(cat.subcat_label?'<span class="plab">'+esc(cat.subcat_label)+'</span>':'')
      +'<button class="fpill'+(FACET.s?'':' on')+'" data-sub="">'+esc(allLbl(cat))+' <span class="n">'+allN+'</span></button>'
      +subs.map(s=>{const n=catArts.filter(a=>a.subcategory_id===s.id&&tagOk(a)).length;

      +tags.map(t=>{const n=catArts.filter(a=>subOk(a)&&(ARTTAGS[a.id]||[]).indexOf(t.id)>-1).length;

    goHash('c=all'); draw(); });
  const tq=$('#tq'); tq.addEventListener('input',()=>{ TQ=tq.value.trim();
    const shown2=TQ?rows.filter(a=>(a.title+' '+(a.summary||'')).toLowerCase().indexOf(TQ.toLowerCase())>-1):rows;
    $('#tGrid').innerHTML=topicGrid(shown2,cat,subs);
    $('#tSum').textContent=(tName?tName+' · ':'')+(subs.length?((sName||allLbl(cat).toLowerCase())+' · '):'')
      +shown2.length+' article'+(shown2.length===1?'':'s');
    wireGrid(); });
  document.querySelectorAll('[data-sub]').forEach(el=>el.addEventListener('click',()=>{
    FACET.s=el.dataset.sub?+el.dataset.sub:null; setHash(catHash()); draw(); }));
  document.querySelectorAll('[data-tag]').forEach(el=>el.addEventListener('click',()=>{
    FACET.t=el.dataset.tag?+el.dataset.tag:null; setHash(catHash()); draw(); }));
  wireGrid();
  wirePreviewPill();
  if(canDrag)wireCardDnD();
  const hp=$('#hbFullPdf'); if(hp)hp.addEventListener('click',async()=>{
    hp.disabled=true;hp.textContent='Building…';
    try{
      const jwt=(await sb.auth.getSession()).data.session.access_token;
      const r=await fetch(SB_URL+'/functions/v1/intake',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+jwt,'apikey':ANON},
        body:JSON.stringify({action:'handbook_pdf'})});
      const j=await r.json().catch(()=>({}));
      if(!(r.status===200&&j.ok&&j.pdf))throw new Error(j.error||'failed');
      const bytes=Uint8Array.from(atob(j.pdf),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      const a=document.createElement('a');a.href=url;a.download=j.filename||'CPR Employee Handbook.pdf';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    }catch(e){toast('PDF failed — '+(e.message||'error'),true);}
    hp.disabled=false;hp.textContent='⬇ Full PDF';
  });

}
function wireCardDnD(){
  const grid=document.querySelector('#tGrid .cardgrid'); if(!grid)return;
  let dragging=null;
  grid.querySelectorAll('.acard').forEach(c=>{
    c.addEventListener('dragstart',()=>{ dragging=c; c.classList.add('dragging'); });
    c.addEventListener('dragend',async()=>{
      c.classList.remove('dragging'); dragging=null;
      const ids=[...grid.querySelectorAll('.acard')].map(x=>+x.dataset.open);
      for(let i=0;i<ids.length;i++){
        const a=ARTS.find(x=>x.id===ids[i]);
        if(a)a.browse_order=(i+1)*10;
        await sb.from('kb_articles').update({browse_order:(i+1)*10}).eq('id',ids[i]);
      }
      toast('Order saved ✔');
    });
  });
  grid.addEventListener('dragover',e=>{
    e.preventDefault(); if(!dragging)return;
    const others=[...grid.querySelectorAll('.acard:not(.dragging)')];
    const after=others.find(o=>{const r=o.getBoundingClientRect();
      return e.clientY<r.top+r.height/2||(e.clientY<r.bottom&&e.clientX<r.left+r.width/2);});
    if(after)grid.insertBefore(dragging,after); else grid.appendChild(dragging);
  });
}
function topicGrid(list,cat,subs,canDrag){
  if(!list.length){
    const t=FACET.t?(TAGS.find(x=>x.id===FACET.t)||{}).name:null;
    const s=FACET.s?(SUBCATS.find(x=>x.id===FACET.s)||{}).name:null;
    return '<div class="empty">No articles'+(t?' tagged '+esc(t):'')+(s?(t?' under ':' under ')+esc(s):'')+(TQ?' matching “'+esc(TQ)+'”':'')+' yet.</div>';
  }
  return '<div class="cardgrid'+(canDrag?' mgr':'')+'">'+list.map(a=>{
    const v=viewedAt(a), never=!v;
    const vCol=never?(a.require_ack&&!acked(a)?'var(--red)':'var(--amber)'):'#8A8FA0';
    let badge='';
    if(subs.length&&!FACET.s){
      const s=a.subcategory_id?subs.find(x=>x.id===a.subcategory_id):null;
      badge=s?'<span class="acbadge">'+esc(s.name)+'</span>'
        :'<span class="acbadge grey">'+esc(allLbl(cat))+'</span>';
    }
    return '<div class="acard" data-open="'+a.id+'"'+(canDrag?' draggable="true" title="Drag to organize"':'')+'>'
      +'<div class="actop"><span class="actile">'+esc(artIcon(a))+'</span><span style="flex:1"></span>'
        +badge+cardChip(a)+'</div>'
      +'<div class="actitle">'+esc(a.title)+'</div>'
      +'<div class="acfoot"><span>'+readMins(a.body)+' min</span><span>·</span><span>upd '+fmtD(a.updated_at)+'</span>'
        +'<span style="flex:1"></span>'
        +'<span style="color:'+vCol+';font-weight:'+(never?'800':'700')+'">'+(never?'Never':fmtD(v))+'</span></div>'
    +'</div>';
  }).join('')+'</div>';
}

/* ---------- article reading view ---------- */
async function openArticle(id){
  const a=ARTS.find(x=>x.id===id); if(!a)return;
  OPEN=a; MODE='article'; SRES=null; SEARCHQ='';
  goHash('a='+(a.slug||''));
  // record the view (Viewed column); first_read_at fills on first insert
  if(a.status==='published'){
    const now=new Date().toISOString();
    const r=await sb.from('kb_reads').upsert({article_id:a.id,staff_id:AUTH.id,last_viewed_at:now},{onConflict:'article_id,staff_id'}).select().single();
    if(r.data)READS[a.id]=r.data;
  }
  draw();
}
function moduleOf(a){ return MODULES.find(m=>m.id===a.module_id)||null; }
function weekLabel(mod){ if(!mod)return ''; const m=/week\s*(\d+)/i.exec(mod.name); return m?('Week '+m[1]):mod.name; }
function drawArticle(){
  const a=OPEN;
  const mod=moduleOf(a);
  const q=QUIZ[a.id];
  const isAcked=acked(a);
  const author=SBN[a.updated_by]||SBN[a.created_by]||'';
  // next step in the same module
  let next=null;
  if(mod){ const items=moduleItems(mod.id); const i=items.findIndex(x=>x.kind==='a'&&x.a.id===a.id);
    if(i>-1&&items[i+1])next=items[i+1].kind==='a'?items[i+1].a:null; }
  const inner=''
  +'<div class="crumb"><a data-nav="list">‹ Knowledge Base</a><span class="sep">/</span><span class="cat">'+esc(catName(a.category_id))+'</span>'
    +'<span style="flex:1"></span>'
    +(isMgr(AUTH.role)?'<a data-nav="edit" style="color:var(--blue)"'+(window.CPRNavIcon?CPRNavIcon('pen-line',12):'')+' Edit</a>':'')
    +(a.require_ack?'<span class="achip req">Required'+(mod?' · '+esc(weekLabel(mod)):'')+'</span>':'')
  +'</div>'
  +'<div class="artcard">'
    +'<div class="ahd"><h2>'+esc(artIcon(a))+' '+esc(a.title)+'</h2>'
    +'<div class="artmeta"><span>'+readMins(a.body)+' min read</span><span>·</span><span>updated '+fmtD(a.updated_at)+'</span>'
      +(author?'<span>·</span><span>by '+esc(author)+'</span>':'')+'<span>·</span><span style="color:#8A8FA0">Applies to: all stores</span></div>'
    +'<div style="height:1px;background:var(--row);margin:20px 0 0"></div></div>'
    +'<div class="artbody">'+render(a.body)+'</div>'
    +'<div class="artfoot">'
      +(isAcked
        ?'<button class="readbtn done">✓ Read '+fmtD(READS[a.id].acknowledged_at)+'</button>'
        :'<button class="readbtn" id="markRead">✓ Mark as read</button>')
      +'<span class="footnote">logs your read receipt — required for onboarding</span>'
      +'<span style="flex:1"></span>'

/* ---------- quiz ---------- */
async function startQuiz(a){
  const q=QUIZ[a.id]; if(!q||!q.nq){ toast('No quiz on this article.',true); return; }
  const {data,error}=await sb.from('kb_quiz_questions').select('id,sort,question,options,section_hint').eq('quiz_id',q.id).order('sort').order('id');
  if(error||!data||!data.length){ toast('Could not load the quiz.',true); return; }
  QZ={art:a,quiz:q,questions:data,idx:0,answers:new Array(data.length).fill(null),result:null};
  MODE='quiz'; goHash('quiz='+(a.slug||'')); draw();
}
function drawQuiz(){
  const z=QZ; const n=z.questions.length; const cur=z.questions[z.idx];
  const dots=z.questions.map((_,i)=>{
    if(i===z.idx)return '<span class="qdot" style="background:var(--blue);border:2px solid var(--blue)"></span>';
    if(z.answers[i]!=null)return '<span class="qdot" style="background:var(--green);border:2px solid var(--green)"></span>';
    return '<span class="qdot" style="background:#fff;border:2px solid #C7CAD4"></span>';
  }).join('');
  const opts=(cur.options||[]).map((o,i)=>'<button class="qopt'+(z.answers[z.idx]===i?' sel':'')+'" data-opt="'+i+'"><span class="qoptdot"></span>'+esc(o)+'</button>').join('');
  const last=z.idx===n-1;
  $('#page').innerHTML='<div class="qwrap">'
    +'<div class="crumb"><a data-nav="back">‹ Back to article</a><span style="flex:1"></span>'+(z.art.require_ack?'<span class="achip req">Required</span>':'')+'</div>'
    +'<div class="qcard">'
    +'<div class="qk">Quiz — '+esc(z.art.title)+'</div>'
    +'<div class="qdots">'+dots+'<span style="font-size:.72rem;font-weight:800;color:var(--grey);margin-left:4px">Question '+(z.idx+1)+' of '+n+'</span></div>'
    +'<div class="qq">'+esc(cur.question)+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:9px;margin-top:18px">'+opts+'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;margin-top:22px">'
      +'<button class="btn sm" id="qPrev"'+(z.idx===0?' disabled':'')+'>‹ Previous</button>'
      +'<span style="flex:1"></span><span class="footnote">Pass mark '+z.quiz.pass_pct+'% · retake anytime</span>'
      +'<button class="btn pri sm" id="qNext"'+(z.answers[z.idx]==null?' disabled':'')+'>'+(last?'Finish quiz ›':'Next question ›')+'</button>'
    +'</div></div></div>';
  document.querySelector('[data-nav="back"]').addEventListener('click',()=>{ openArticle(z.art.id); });
  document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{ z.answers[z.idx]=+b.dataset.opt; draw(); }));
  $('#qPrev').addEventListener('click',()=>{ if(z.idx>0){z.idx--;draw();} });
  $('#qNext').addEventListener('click',async()=>{
    if(z.answers[z.idx]==null)return;
    if(!last){ z.idx++; draw(); return; }
    const {data,error}=await sb.rpc('kb_quiz_grade',{p_quiz_id:z.quiz.id,p_answers:z.answers});
    if(error){ toast('Grading failed: '+error.message,true); return; }
    z.result=data; MODE='quizresult';
    // refresh attempts so best/pass state is current everywhere
    const att=await sb.from('kb_quiz_attempts').select('quiz_id,score_pct,passed,attempt_no').eq('staff_id',AUTH.id);
    MYATT={}; (att.data||[]).forEach(x=>{ const c=MYATT[x.quiz_id]||{best:0,passed:false,attempts:0};
      c.best=Math.max(c.best,x.score_pct); c.passed=c.passed||x.passed; c.attempts=Math.max(c.attempts,x.attempt_no); MYATT[x.quiz_id]=c; });
    draw();
  });
}
function drawQuizResult(){
  const z=QZ,r=z.result; const pass=r.passed;
  const rows=z.questions.map((q,i)=>{
    const res=(r.results||[])[i]||{};
    if(res.ok)return '<div class="qrevok"><span class="qrevic" style="background:var(--greenbg);color:var(--greend)">✓</span>'
      +'<span style="font-size:.84rem;font-weight:700;color:#8A8FA0;line-height:1.45"><b style="color:var(--grey)">Q'+(i+1)+'.</b> '+esc(q.question)+'</span></div>';
    return '<div class="qrevmiss"><span class="qrevic" style="background:#FDEBEC;color:var(--red)">✕</span>'
      +'<div style="min-width:0"><div style="font-size:.84rem;font-weight:700;color:var(--dark);line-height:1.45"><b style="color:var(--red)">Q'+(i+1)+'.</b> '+esc(q.question)+'</div>'
      +(res.hint?'<div style="font-size:.78rem;font-weight:700;color:#8A8FA0;margin-top:3px">Covered in: <a data-nav="back" style="color:var(--blue);text-decoration:none;font-weight:800;cursor:pointer">'+esc(res.hint)+'</a></div>':'')
      +'</div></div>';
  }).join('');
  $('#page').innerHTML='<div class="qwrap">'
    +'<div class="crumb"><a data-nav="back">‹ Back to article</a><span style="flex:1"></span>'+(z.art.require_ack?'<span class="achip req">Required</span>':'')+'</div>'
    +'<div class="qcard '+(pass?'pass':'fail')+'">'
    +'<div class="qk">Quiz — '+esc(z.art.title)+'</div>'
    +'<div style="display:flex;align-items:center;gap:16px;margin:14px 0 4px">'
      +'<div class="scorecircle" style="background:'+(pass?'var(--greenbg)':'#FDEBEC')+';color:'+(pass?'var(--greend)':'var(--red)')+'">'+r.score+'%</div>'
      +'<div><div style="font-family:Nunito,sans-serif;font-weight:900;font-size:1.15rem">'+(pass?'Nice — '+r.right+' of '+r.total+' correct':'Not quite — '+r.right+' of '+r.total+' correct')+'</div>'
      +'<div style="font-size:.8rem;font-weight:700;color:#8A8FA0;margin-top:2px">'+(pass?'You passed — this step is checked off your track.':'Pass mark is '+r.pass_pct+'%. Review the ones you missed, then retake — attempts are unlimited.')+'</div></div>'
    +'</div>'
    +'<div class="qrev">'+rows+'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap">'
      +(pass
        ?'<span class="footnote">Attempt '+r.attempt+' · best score kept</span><span style="flex:1"></span><button class="btn pri sm" id="qDone">Back to My Onboarding</button>'
        :'<button class="btn sm" id="qReread">↩ Re-read the article</button><span style="flex:1"></span><span class="footnote">Attempt '+r.attempt+' · best score kept</span><button class="btn pri sm" id="qRetake">Retake quiz ›</button>')
    +'</div></div></div>';
  document.querySelectorAll('[data-nav="back"]').forEach(el=>el.addEventListener('click',()=>openArticle(z.art.id)));
  const rr=$('#qReread'); if(rr)rr.addEventListener('click',()=>openArticle(z.art.id));
  const rt=$('#qRetake'); if(rt)rt.addEventListener('click',()=>startQuiz(z.art));
  const dn=$('#qDone'); if(dn)dn.addEventListener('click',()=>{ MODE='onboarding'; setHash('onboarding'); draw(); });
}

    const k=b.dataset.md;
    if(k==='b')wrap('**','**','bold text'); else if(k==='i')wrap('*','*','italic text');
    else if(k==='h2')linePrefix('# '); else if(k==='ul')linePrefix('- '); else if(k==='ol')linePrefix('1. ');
    else if(k==='callout')linePrefix('!> ');
    else if(k==='link'){ const u=prompt('Link URL:','https://'); if(u)wrap('[',']('+u+')','link text'); }
  }));
  $('#edImg').addEventListener('click',()=>$('#edImgFile').click());
  $('#edImgFile').addEventListener('change',async()=>{
    const f=$('#edImgFile').files[0]; if(!f)return;
    toast('Uploading image…');
    const path=Date.now()+'-'+f.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-');
    const {error}=await sb.storage.from('kb-media').upload(path,f,{contentType:f.type});
    if(error){ toast('Upload failed: '+error.message,true); return; }
    wrap('\n![image]('+SB_URL+'/storage/v1/object/public/kb-media/'+path+')\n','','');
    toast('Image added.');
  });
  $('#edPrev').addEventListener('click',()=>{
    const box=$('#edPrevBox');
    if(box.style.display==='none'){ box.innerHTML=render(ta.value); box.style.display='block'; }
    else box.style.display='none';
  });
  async function save(status){
    grab();
    if(!ED.title.trim()){ toast('Give it a title.',true); return; }
    /* an article filed into a managers-only category can never be
       employee-visible — the category gate is UI, this is the enforcement */
    const catGated=(catById(ED.category_id)||{}).min_role==='manager';
    const row={title:ED.title.trim(),summary:ED.summary.trim()||null,category_id:ED.category_id,
      body:ED.body,status,min_role:catGated?'manager':ED.min_role,require_ack:ED.require_ack,emoji:ED.emoji||null,
      module_id:ED.module_id,sort_order:ED.sort_order,updated_by:AUTH.id,
      subcategory_id:ED.subcategory_id};
    if(status==='published'&&!(a&&a.published_at))row.published_at=new Date().toISOString();
    let saved;
    if(a){
      row.version=(a.version||1)+1;
      const res=await sb.from('kb_articles').update(row).eq('id',a.id).select().single();
      if(res.error){ toast('Save failed: '+res.error.message,true); return; }
      saved=res.data;
    }else{
      row.slug=slugify(ED.title); row.created_by=AUTH.id;
      let res=await sb.from('kb_articles').insert(row).select().single();
      if(res.error&&/duplicate/.test(res.error.message)){ row.slug=row.slug+'-'+Date.now()%1000;
        res=await sb.from('kb_articles').insert(row).select().single(); }
      if(res.error){ toast('Save failed: '+res.error.message,true); return; }
      saved=res.data;
    }
    await sb.from('kb_article_versions').insert({article_id:saved.id,version:saved.version,
      title:saved.title,summary:saved.summary,body:saved.body,tags:saved.tags,edited_by:AUTH.id});
    /* replace the article's tag set (category-scoped, picked above) */
    await sb.from('kb_article_tags').delete().eq('article_id',saved.id);
    if(ED.tag_ids.length)await sb.from('kb_article_tags').insert(ED.tag_ids.map(t=>({article_id:saved.id,tag_id:t})));
    if(status==='published'&&!(a&&a.published_at)&&ED.announce)announcePublish(saved,true);
    /* "Require re-read" on publish: reset receipts so the article resurfaces in
       Training → Assigned training for everyone. Never fires on ordinary edits —
       only when the author checks the box. */
    const rrEl=$('#edReread');
    if(status==='published'&&rrEl&&rrEl.checked){
      const rr=await sb.from('kb_reads').update({acknowledged_at:null}).eq('article_id',saved.id);
      if(rr.error)toast('Saved, but the re-read reset failed: '+rr.error.message,true);
      else announcePublish(saved,false);
    }
    toast(status==='published'?'Published ✔':'Draft saved.');
    ED=null; OPEN=saved; MODE=status==='published'?'article':'edit';
    await refresh();
    if(MODE==='article')setHash('a='+saved.slug);
    else{ OPEN=ARTS.find(x=>x.id===saved.id)||saved; setHash('edit='+saved.id); draw(); }
  }
  $('#edDraft').addEventListener('click',()=>save(a&&a.status==='published'?'published':'draft'));
  $('#edPub').addEventListener('click',()=>save('published'));
  const up=$('#eUnpub'); if(up)up.addEventListener('click',()=>save('draft'));
  const rec=$('#eRecert'); if(rec)rec.addEventListener('click',async()=>{
    if(!confirm('Reset acknowledgments? Everyone must re-read and re-acknowledge. (Read history is kept.)'))return;
    const {error}=await sb.from('kb_reads').update({acknowledged_at:null}).eq('article_id',a.id);
    if(error){ toast('Reset failed: '+error.message,true); return; }
    announcePublish(a,false);
    toast('Acknowledgments reset — re-certification announced.'); refresh();
  });
  const arch=$('#eArchive'); if(arch)arch.addEventListener('click',async()=>{
    if(!confirm('Archive this article? It disappears from the library (restorable from Manage → Archived).'))return;
    await sb.from('kb_articles').update({status:'archived',updated_by:AUTH.id}).eq('id',a.id);
    toast('Archived.'); ED=null; OPEN=null; MODE='list'; refresh();
  });
  const rest=$('#eRestore'); if(rest)rest.addEventListener('click',async()=>{
    await sb.from('kb_articles').update({status:'draft',updated_by:AUTH.id}).eq('id',a.id);
    toast('Restored to draft.'); ED=null; refresh();
  });
  const eq=$('#eQuiz'); if(eq)eq.addEventListener('click',()=>openQuizEditor(a));
  // readers card
  if(a){(async()=>{
    const el=$('#edReaders'); if(!el)return;
    const [{count:ackN},att]=await Promise.all([
      sb.from('kb_reads').select('id',{count:'exact',head:true}).eq('article_id',a.id).not('acknowledged_at','is',null),
      q?sb.from('kb_quiz_attempts').select('staff_id,passed').eq('quiz_id',q.id):Promise.resolve({data:null})
    ]);
    let quizLine='';
    if(att&&att.data){
      const by={}; att.data.forEach(x=>{ by[x.staff_id]=by[x.staff_id]||x.passed; });
      const tried=Object.keys(by).length, passed=Object.values(by).filter(Boolean).length;
      quizLine='<br>Quiz pass rate <b>'+(tried?Math.round(passed/tried*100)+'%':'—')+'</b>';
    }
    el.innerHTML='<div class="k">Readers</div><div style="font-size:.8rem;font-weight:700;color:var(--dark-grey);line-height:1.6">Read by <b>'+(ackN||0)+' of '+STAFF.length+'</b> staff'+quizLine+'</div>'
      +'<a class="linkbtn" href="kb-compliance.html" style="display:inline-block;margin-top:6px">View in Compliance ›</a>';
  })();}
}

/* ---------- quiz editor (managers, modal) ---------- */
async function openQuizEditor(a){
  let quiz=QUIZ[a.id];
  if(!quiz){
    const r=await sb.from('kb_quizzes').insert({article_id:a.id}).select().single();
    if(r.error){ toast('Could not create quiz: '+r.error.message,true); return; }
    quiz={id:r.data.id,pass_pct:r.data.pass_pct,nq:0}; QUIZ[a.id]=quiz;
  }
  const [{data:qs},ans]=await Promise.all([
    sb.from('kb_quiz_questions').select('*').eq('quiz_id',quiz.id).order('sort').order('id'),
    sb.rpc('kb_quiz_get_answers',{p_quiz_id:quiz.id})
  ]);
  const correct={}; (ans.data||[]).forEach(x=>correct[x.question_id]=x.correct_idx);
  let list=(qs||[]).map(x=>({id:x.id,question:x.question,options:(x.options||[]).slice(),hint:x.section_hint||'',correct:correct[x.id]!=null?correct[x.id]:0}));
  if(!list.length)list.push({id:null,question:'',options:['',''],hint:'',correct:0});
  const wrapEl=$('#mdlWrap');
  function paint(){
    wrapEl.innerHTML='<div class="ovl"><div class="mdl">'
      +'<div class="mdl-hd"><div style="font-family:Nunito,sans-serif;font-weight:900;font-size:1.05rem">❓ Quiz — '+esc(a.title)+'</div><button class="mdl-x" data-close>✕</button></div>'
      +'<div class="mdl-bd">'
      +list.map((qq,qi)=>'<div class="qed" data-qi="'+qi+'">'
        +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b style="font-family:Nunito,sans-serif;font-size:.8rem">Q'+(qi+1)+'</b><span style="flex:1"></span><button class="linkdel" data-delq="'+qi+'">remove</button></div>'
        +'<textarea data-q="'+qi+'" placeholder="Question…">'+esc(qq.question)+'</textarea>'
        +qq.options.map((o,oi)=>'<div class="optrow"><input type="radio" name="cq'+qi+'" data-cor="'+qi+':'+oi+'"'+(qq.correct===oi?' checked':'')+' title="Correct answer"><input type="text" data-opt="'+qi+':'+oi+'" value="'+esc(o)+'" placeholder="Option '+(oi+1)+'">'
          +(qq.options.length>2?'<button class="linkdel" data-delopt="'+qi+':'+oi+'">✕</button>':'')+'</div>').join('')
        +'<div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap">'
          +'<button class="linkbtn" data-addopt="'+qi+'">＋ option</button>'
          +'<input type="text" data-hint="'+qi+'" value="'+esc(qq.hint)+'" placeholder="Covered in… (section hint shown on a miss)" style="flex:1;min-width:180px;height:30px;padding:4px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-weight:600;font-family:\'Nunito Sans\',sans-serif">'
        +'</div></div>').join('')
      +'<button class="linkbtn" id="qAdd">＋ Add a question</button>'
      +'<div class="footnote" style="margin-top:10px">Pass mark 80% · the correct answers never leave the server — employees only ever see “covered in” hints.</div>'
      +'</div>'
      +'<div class="mdl-ft"><button class="btn sm" data-close>Cancel</button><button class="btn pri sm" id="qSave">Save quiz</button></div>'
      +'</div></div>';
    const grabQ=()=>{ list.forEach((qq,qi)=>{
      const t=wrapEl.querySelector('[data-q="'+qi+'"]'); if(t)qq.question=t.value;
      qq.options.forEach((_,oi)=>{ const o=wrapEl.querySelector('[data-opt="'+qi+':'+oi+'"]'); if(o)qq.options[oi]=o.value; });
      const h=wrapEl.querySelector('[data-hint="'+qi+'"]'); if(h)qq.hint=h.value;
      const c=wrapEl.querySelector('input[name="cq'+qi+'"]:checked'); if(c)qq.correct=+c.dataset.cor.split(':')[1];
    });};
    wrapEl.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ wrapEl.innerHTML=''; });
    wrapEl.querySelectorAll('[data-delq]').forEach(b=>b.onclick=()=>{ grabQ(); list.splice(+b.dataset.delq,1); if(!list.length)list.push({id:null,question:'',options:['',''],hint:'',correct:0}); paint(); });
    wrapEl.querySelectorAll('[data-addopt]').forEach(b=>b.onclick=()=>{ grabQ(); list[+b.dataset.addopt].options.push(''); paint(); });
    wrapEl.querySelectorAll('[data-delopt]').forEach(b=>b.onclick=()=>{ grabQ(); const [qi,oi]=b.dataset.delopt.split(':').map(Number);
      list[qi].options.splice(oi,1); if(list[qi].correct>=list[qi].options.length)list[qi].correct=0; paint(); });
    $('#qAdd').onclick=()=>{ grabQ(); list.push({id:null,question:'',options:['',''],hint:'',correct:0}); paint(); };
    $('#qSave').onclick=async()=>{
      grabQ();
      const clean=list.filter(qq=>qq.question.trim()&&qq.options.filter(o=>o.trim()).length>=2);
      if(!clean.length){ toast('Add at least one question with two options.',true); return; }
      try{
        const keep=[];
        for(let i=0;i<clean.length;i++){
          const qq=clean[i];
          const row={quiz_id:quiz.id,sort:i,question:qq.question.trim(),options:qq.options.map(o=>o.trim()).filter(Boolean),section_hint:qq.hint.trim()||null};
          let qid=qq.id;
          if(qid){ const r=await sb.from('kb_quiz_questions').update(row).eq('id',qid); if(r.error)throw r.error; }
          else{ const r=await sb.from('kb_quiz_questions').insert(row).select().single(); if(r.error)throw r.error; qid=r.data.id; }
          keep.push(qid);
          const ra=await sb.rpc('kb_quiz_set_answer',{p_question_id:qid,p_correct:Math.min(qq.correct,row.options.length-1)});
          if(ra.error)throw ra.error;
        }
        // remove deleted questions
        const {data:allq}=await sb.from('kb_quiz_questions').select('id').eq('quiz_id',quiz.id);
        for(const x of (allq||[]))if(keep.indexOf(x.id)<0)await sb.from('kb_quiz_questions').delete().eq('id',x.id);
        QUIZ[a.id]={id:quiz.id,pass_pct:quiz.pass_pct||80,nq:keep.length};
        wrapEl.innerHTML=''; toast('Quiz saved · '+keep.length+' question'+(keep.length===1?'':'s'));
        if(MODE==='edit')drawEditor();
      }catch(e){ toast('Save failed: '+(e.message||e),true); }
    };
  }
  paint();
}

/* ---------- publish → Communications + alerts (unchanged behavior) ---------- */
async function announcePublish(a,isNew){
  try{
    const req=a.require_ack;
    await sb.from('communications').insert({
      kind:req?'training':'announcement',
      title:(req?'🎓 Required reading: ':'📚 New in the Knowledge Base: ')+a.title,
      body:(a.summary?a.summary+'\n\n':'')
        +(req?'This one needs a read **and** an acknowledgment — it\'s tracked.\n\n':'')
        +'Read it here: https://myrepairtools.com/knowledge.html#a='+(a.slug||''),
      source_key:'kb:'+a.id+':'+(isNew?'publish':'recert-'+a.version),
      created_by:AUTH.id
    });
    if(req){
      const s=(await sb.auth.getSession()).data.session;
      if(s)fetch(SB_URL+'/functions/v1/alerts',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':ANON},
        body:JSON.stringify({action:'send',kind:'kb',all_active:true,
          title:'Required reading: '+a.title,
          body:(a.summary||'New policy article — read and acknowledge it.').slice(0,300),
          link:'knowledge.html#a='+(a.slug||'')})}).catch(()=>{});
    }
  }catch(e){ /* best-effort */ }
}

/* ---------- draw ---------- */
function draw(){
  const wrapEl=document.getElementById('page');
  if(wrapEl)wrapEl.classList.toggle('bleed',
    MODE==='list'&&['req','drafts','archived'].indexOf(String(CAT))===-1);
  if(MODE==='article'&&OPEN)drawArticle();
  else if(MODE==='onboarding')drawOnboarding();
  else if(MODE==='quiz'&&QZ)drawQuiz();
  else if(MODE==='quizresult'&&QZ&&QZ.result)drawQuizResult();
  else if(MODE==='edit'&&isMgr(AUTH.role))drawEditor();
  else if(MODE==='cats'&&isMgr(AUTH.role))drawCats();
  else{ MODE='list'; drawList(); }
}
</script>
