<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Digest">
<title>Daily Digest — CPR</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="apple-touch-icon" href="/assets/images/app-icons/dailydigest-180.png">
<link rel="manifest" href="/assets/manifests/daily-digest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--blue:#4FB0E3;--grey:#B9BDCB;--light-grey:#F3F2F2;
--dark-grey:#4E4E50;--border:#E0E2EA;--green:#2E9E5B;--amber:#C9820B;
--ring:0 0 0 3px rgba(79,176,227,.15);--shadow:0 1px 3px rgba(45,45,59,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito Sans','Segoe UI',sans-serif;background:var(--light-grey);color:var(--dark)}
main{max-width:680px;margin:0 auto;padding:16px 16px calc(28px + var(--cpr-bb-h,0px))}
a{color:var(--blue)}a:hover{color:var(--red)}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.45rem}
.meta{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--grey);white-space:nowrap}
.dateline{font-size:.8rem;font-weight:700;color:var(--dark-grey);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stale{display:inline-flex;align-items:center;gap:6px;background:#FBF3E4;border:1px solid #EBDDBD;color:var(--amber);
border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:800;margin-left:6px}
.forcebtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--border);color:var(--dark-grey);
border-radius:8px;padding:5px 11px;font-family:Nunito;font-weight:800;font-size:.76rem;cursor:pointer;transition:.15s}
.forcebtn:hover{border-color:var(--grey);color:var(--dark)}
.forcebtn:disabled{opacity:.6;cursor:default}
.forcebtn svg{width:14px;height:14px}
.forcebtn.spin svg{animation:fspin .8s linear infinite}
@keyframes fspin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;
font-weight:800;font-size:.88rem;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.25s;z-index:3000;
box-shadow:0 10px 30px rgba(45,45,59,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:nowrap}
.tabs{display:flex;background:#fff;border:1.5px solid var(--border);border-radius:9px;overflow:hidden}
.tab{border:none;background:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;color:var(--dark-grey);
padding:8px 15px;cursor:pointer}
.tab.on{background:var(--dark);color:#fff}
.storesel{width:196px;height:36px;padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.92rem;color:var(--dark);cursor:pointer}
.storesel:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.toolbar .storesel{margin-left:auto}
@media(max-width:480px){
  .tab{padding:8px 11px;font-size:.82rem}
  .toolbar .storesel{width:auto;flex:1;min-width:104px;max-width:196px}
}
.sect{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.02rem;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sect .cnt{margin-left:auto;background:#EAF6FD;color:#1E7AA8;font-family:'Nunito',sans-serif;font-weight:900;
font-size:.72rem;padding:3px 10px;border-radius:99px;white-space:nowrap}
.subnote{font-size:.72rem;font-weight:700;color:var(--grey);margin:-4px 0 8px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.scard{background:#fff;border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:14px;
padding:13px 14px;box-shadow:var(--shadow)}
.schead{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:0;
font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.schead b{font-family:'Nunito',sans-serif;font-weight:900;font-size:.98rem}
.rankchip{background:rgba(220,40,46,.09);color:var(--red);font-family:'Nunito',sans-serif;
font-weight:900;font-size:.76rem;padding:4px 10px;border-radius:99px;white-space:nowrap}
.glance{margin-left:auto;display:flex;align-items:baseline;gap:7px}
.glance .gt{font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem}
.glance .gg{color:var(--green);font-weight:800;font-size:.76rem}
.chev{flex:none;width:16px;height:16px;color:var(--grey);transition:transform .15s}
.scard:not(.closed) .glance{display:none}
.scard:not(.closed) .chev{margin-left:auto;transform:rotate(180deg)}
.scard.closed .sc-body{display:none}
.hero{display:flex;gap:18px;margin-top:9px;align-items:baseline}
.hero .hv{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.7rem;line-height:1}
.hero .hv.sm{font-size:1.25rem}
.hero .hl{font-size:.62rem;font-weight:800;color:var(--grey);letter-spacing:.05em;margin-top:3px;text-transform:uppercase}
.hero .gpp{color:var(--green);font-size:.85rem}
.hero .last{margin-left:auto;text-align:right}
.accy{margin-top:11px;background:#F7F8FA;border-radius:10px;padding:8px 11px}
.accy .row{display:flex;align-items:baseline;font-size:.76rem;font-weight:800;gap:8px}
.accy .row .lead{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accy .row .goal{margin-left:auto;white-space:nowrap;flex:none}
.accy .track{margin-top:6px;height:7px;background:#E7E9EF;border-radius:99px;position:relative}
.accy .fill{height:7px;border-radius:99px;background:var(--blue)}
.accy .tick{position:absolute;right:0;top:-2.5px;width:2.5px;height:12px;background:var(--dark);border-radius:2px}
.chips{display:flex;gap:6px;margin-top:9px;font-size:.68rem;font-weight:800;color:var(--dark-grey);flex-wrap:wrap}
.chips span{background:#F7F8FA;border-radius:99px;padding:4px 9px;white-space:nowrap}
.chips span.mtd{background:#EAF6FD;color:#1E7AA8}
.minis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.mini{background:#F7F8FA;border-radius:9px;padding:7px 10px;min-width:0}
.mini .ml{font-size:.6rem;font-weight:800;color:var(--grey);letter-spacing:.05em;text-transform:uppercase}
.mini .mv{font-family:'Nunito',sans-serif;font-weight:900;font-size:.88rem;margin-top:2px;white-space:nowrap}
.mini .mv .gpp{color:var(--green);font-size:.72rem}
.sc-c{display:none}
.lrow{display:flex;align-items:baseline;font-size:.78rem;font-weight:700;padding:7px 0;border-bottom:1px solid #F3F4F8}
.lrow:last-child{border-bottom:none;padding-bottom:2px}
.lrow .ll{color:var(--dark-grey)}
.lrow .lv{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:900;font-size:.92rem;white-space:nowrap}
.lrow .lx{font-size:.72rem;font-weight:800;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 70px 64px 76px;gap:8px;align-items:center;
background:#F7F8FA;border-radius:9px;padding:8px 10px;font-size:.8rem;font-weight:700;min-width:0}
.r .main{min-width:0}
.r .main .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .main .s{font-size:.68rem;color:var(--grey);font-weight:800;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .amt{font-family:'Nunito',sans-serif;font-weight:900;white-space:nowrap;text-align:right}
.r .gp{color:var(--green);font-weight:800;font-size:.74rem;white-space:nowrap;text-align:right}
.r .tkt{color:var(--grey);font-weight:800;font-size:.72rem;white-space:nowrap;text-align:right}
.r .loc{font-size:.7rem;font-weight:800;color:var(--dark-grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Claims are grouped by store, so the location column is replaced by a store
   sub-head carrying that store's claim count, net and GP. The ticket number
   moves down into the subtitle line: at >=1000px .duo puts this card in a half
   column (~345px), and a third fixed column left the device name only ~91px,
   which clipped every real model name. */
.rows.cl .r{grid-template-columns:minmax(0,1fr) 74px 74px}
.gh{display:grid;grid-template-columns:minmax(0,1fr) 74px 74px;gap:8px;align-items:baseline;
padding:7px 10px 5px;margin-top:4px;border-bottom:1.5px solid var(--border);
font-family:'Nunito',sans-serif;font-weight:900;font-size:.78rem}
.gh:first-child{margin-top:0}
.gh .gc{font-size:.68rem;font-weight:800;color:var(--grey);white-space:nowrap;margin-left:6px}
.gh .gv{text-align:right;white-space:nowrap}
.gh .gg{color:var(--green);text-align:right;white-space:nowrap}
.gh .u{font-size:.6rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.quiet{padding:14px 4px;font-size:.8rem;font-weight:700;color:var(--grey)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.lbr .top{display:flex;gap:9px;align-items:center;font-size:.86rem;font-weight:700}
.lbr .pos{font-family:'Nunito',sans-serif;font-weight:900;color:var(--dark-grey);min-width:16px}
.lbr:first-child .pos{color:var(--red)}
.lbr .who{flex:1;font-family:'Nunito',sans-serif;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .amt{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem}
.lbr .chips{margin-top:7px}
.gate{background:#fff;border:1px solid var(--border);border-radius:16px;padding:44px 24px;text-align:center;
box-shadow:var(--shadow);margin-top:18px}
.gate svg{width:34px;height:34px;color:var(--grey);margin-bottom:10px}
.gate .gt{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem}
.gate .gs{font-size:.82rem;font-weight:700;color:var(--dark-grey);margin-top:6px;line-height:1.55}
.duo{display:grid;grid-template-columns:1fr;gap:10px}
.selmini{height:32px;padding:4px 9px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.78rem;color:var(--dark);cursor:pointer;margin-left:auto}
.selmini:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
@media(max-width:480px){
  .r{grid-template-columns:minmax(0,1fr) 54px 52px 56px;gap:6px;padding:8px 8px}
  .r .amt{font-size:.74rem}
  .r .gp{font-size:.68rem}
  .r .tkt{font-size:.66rem}
  .r .loc{font-size:.64rem}
  .rows.cl .r,.gh{grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px}
  .gh{font-size:.72rem;padding:6px 8px 4px}
}
.demo{display:inline-flex;background:#EAF6FD;color:#1E7AA8;border-radius:99px;padding:3px 10px;
font-size:.72rem;font-weight:800;margin-left:6px}
@media(min-width:1000px){
  main{max-width:1080px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .duo{grid-template-columns:1fr 1fr}
  .duo>div{display:flex;flex-direction:column}
  .duo>div .card{flex:1}
  .lb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sc-a{display:none}
  .sc-c{display:block}
  .schead{padding-bottom:8px;border-bottom:1px solid #EFF1F5;cursor:default}
  .glance,.chev{display:none}
  .scard.closed .sc-body{display:block}
}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>Daily Digest</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="dateline" id="dateline">Loading…</div>
  <div id="toast"></div>
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="today">Today</button>
      <button class="tab" data-tab="month">Month</button>
      <button class="tab" data-tab="team">Team</button>
    </div>
    <select class="storesel" id="storeSel" aria-label="Store"></select>
  </div>
  <div id="view"></div>
</main>

<script src="assets/locations.js"></script>
<script src="assets/pickers.js"></script>
<script src="assets/pin-gate.js"></script>
<script src="assets/nav.js"></script>
<script type="module">
/* Daily Digest — the owner's morning scorecard (RepairQ Looker dashboard 2273)
   rendered from digest_raw (read-only; the daily-digest-sync pg_cron fills it
   every 4h). RLS is manager/owner (is_admin()) — non-managers get zero rows and
   the Managers Only state. Derived metrics (GP %, attach rate, accy %) are
   computed here from raw fields; Looker's own table calcs come back null. */
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var SB_REF='xuvsehrevxackuhmbmry';
var SB_URL='https://'+SB_REF+'.supabase.co';
var REPAIRQ_FN=SB_URL+'/functions/v1/repairq-query';   // manager force-update
var FORCING=false;
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dnNlaHJldnhhY2t1aG1ibXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2OTY4NjEsImV4cCI6MjA5NzI3Mjg2MX0.pURipAPZoVKFe3wdMQHBsw4Bd2mgG8OdzxaCJKGIqyY';
var LOC=window.CPRLocations;
var TZ='America/Los_Angeles';
var ACCY_GOAL=0.10;            // store goal: accessories as a share of revenue (make data later)
var DEMO=/[?&]demo=1/.test(location.search);

/* ---------- state ---------- */
var TABS=['today','month','team'];
var TAB=null, STORE=localStorage.getItem('cprDigestStore')||'', SORT=localStorage.getItem('cprDigestSort')||'sales';
var BY={}, SNAP_DATE=null, CAPTURED=null, LOADED=false;
/* date navigation: captures accumulate per day since the epoch; picking a past
   day re-reads that day's snapshot (cached per date, fetched on demand) */
var DATA_EPOCH='2026-07-21', SBC=null, ROWS_BY_DATE={}, NEWEST_DATE=null;

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function N(v){ if(v==null||v==='')return null; if(typeof v==='number')return isFinite(v)?v:null;
  var n=parseFloat(String(v).replace(/[$,%\s]/g,'')); return isFinite(n)?n:null; }
function G(row,key){ if(!row)return null; if(key in row)return row[key];
  var o=row,p=key.split('.'); for(var i=0;i<p.length;i++){ if(o&&typeof o==='object'&&p[i] in o)o=o[p[i]]; else return null; } return o; }
function GN(row,key){ return N(G(row,key)); }
function pick(row,res,type){ var keys=Object.keys(row||{});
  for(var i=0;i<res.length;i++)for(var j=0;j<keys.length;j++){
    if(res[i].test(keys[j])){ var v=row[keys[j]];
      if(type==='num'){ v=N(v); if(v!=null)return v; }
      else if(type==='str'){ if(typeof v==='string'&&v.trim())return v; }
      else if(v!=null&&v!=='')return v; } }
  return null; }
function div(a,b){ return (a==null||!b)?null:a/b; }
function money(v,cents){ if(v==null)return '—';
  var neg=v<0, a=Math.abs(v);
  var s='$'+a.toLocaleString('en-US',{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0});
  return neg?'−'+s:s; }
function pct(v,dp){ return v==null?'—':(v*100).toFixed(dp==null?1:dp)+'%'; }
function todayPT(){ return new Date().toLocaleDateString('en-CA',{timeZone:TZ}); }
function dateLabel(iso){ var p=String(iso).split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }
function shortDate(iso){ var p=String(iso).split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function timePT(iso){ return iso?new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ}):''; }
function storeOf(row){
  var c=G(row,'location.short_name')||G(row,'location.name')||G(row,'store.name');
  if(!c){ var keys=Object.keys(row||{}); for(var i=0;i<keys.length;i++){
    if(/location|store/i.test(keys[i])&&typeof row[keys[i]]==='string'&&row[keys[i]].trim()){c=row[keys[i]];break;} } }
  return c?LOC.normalize(c):''; }
function nameKey(s){ return String(s||'').trim().toLowerCase(); }
function shortLoc(s){ return LOC.display(s).replace('Northeast','NE'); }
function storeOrd(s){ var f=LOC.find(s); return f?f.order:99; }
var ICO={
  lock:'<path d="M7 11V7a5 5 0 0 1 10 0v4"/><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'};
function icon(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[n]+'</svg>'; }

/* ---------- derived metrics ---------- */
function digestMetrics(r){
  var total=GN(r,'ticket_item.all_net_sale_total'), gp=GN(r,'ticket_item.all_net_sale_after_cogs_total'),
      accy=GN(r,'ticket_item.all_net_accessory_sales_total'), accyGp=GN(r,'ticket_item.all_net_accessory_sales_after_cogs_total'),
      tix=GN(r,'ticket.count_all'), accyN=GN(r,'ticket_item.all_sale_accessory_count');
  return { store:storeOf(r), rank:GN(r,'ranked_net_sales_mtd.rank'),
    total:total, gp:gp, gpPct:div(gp,total), accy:accy, accyPct:div(accy,total), accyGpPct:div(accyGp,accy),
    tix:tix, attach:div(accyN,tix), accyPerTkt:div(accy,tix) };
}

/* ---------- rendering ---------- */
/* ---------- store cards (collapsible; 2a on phone, 2c ledger on desktop) ---------- */
var OPEN=null;
function openSet(){ if(OPEN)return OPEN;
  try{ OPEN=JSON.parse(localStorage.getItem('cprDigestOpen')||'null'); }catch(e){ OPEN=null; }
  if(!OPEN||typeof OPEN!=='object'||Array.isArray(OPEN)){ OPEN={}; OPEN[LOC.names()[0]]=true; }
  return OPEN; }
function saveOpen(){ try{ localStorage.setItem('cprDigestOpen',JSON.stringify(OPEN)); }catch(e){} }
function storeCard(m,isOpen){
  var accyPct=m.accyPct, atGoal=accyPct!=null&&accyPct>=ACCY_GOAL;
  var fill=accyPct==null?0:Math.min(100,accyPct/ACCY_GOAL*100);
  var goalColor=atGoal?'var(--green)':'var(--amber)';
  /* 2a — phone: hero numbers, accessory goal bar, boxed coaching stats */
  var a='<div class="hero">'
      +'<div><div class="hv">'+money(m.total,true)+'</div><div class="hl">Total Sales</div></div>'
      +'<div class="last"><div class="hv sm">'+(m.tix==null?'—':Math.round(m.tix))+'</div><div class="hl">Tickets</div></div>'
    +'</div>'
    +'<div class="accy">'
      +'<div class="row"><span class="lead">Accessories '+money(m.accy,true)+(m.accyGpPct!=null?' · GP '+pct(m.accyGpPct,0):'')+'</span>'
      +'<span class="goal" style="color:'+goalColor+'">'+pct(accyPct)+' · goal '+pct(ACCY_GOAL,0)+'</span></div>'
      +'<div class="track"><div class="fill" style="width:'+fill+'%'+(atGoal?';background:var(--green)':'')+'"></div><div class="tick"></div></div>'
    +'</div>'
    +'<div class="minis">'
      +'<div class="mini"><div class="ml">GP</div><div class="mv">'+money(m.gp)+' <span class="gpp">'+pct(m.gpPct)+'</span></div></div>'
      +'<div class="mini"><div class="ml">Attach</div><div class="mv">'+pct(m.attach,0)+'</div></div>'
      +'<div class="mini"><div class="ml">Accy/Tkt</div><div class="mv">'+money(m.accyPerTkt,true)+'</div></div>'
    +'</div>';
  /* 2c — desktop: dense ledger rows */

function devicesHtml(){
  var raw=(BY.device_sales_today||[]).filter(function(r){ var s=storeOf(r); return !STORE||!s||s===STORE; });
  var units=0,total=0;
  var list=raw.map(function(r){
    /* real capture keys pinned 2026-07-26 (see docs/daily-digest-design-handoff.md):
       qty=ticket_item.all_sale_count, price=ticket_item.all_net_sale_total */
    var qty=pick(r,[/^ticket_item\.all_sale_count$/i,/units.*sold|sold.*units|quantity/i,/\.count(_all)?$/i],'num'); if(qty==null)qty=1;
    return { store:storeOf(r),
      name:G(r,'device.name')||G(r,'catalog_item.name')||pick(r,[/^(?!location)(?!user)(?!sold_by).*\bname$/i,/device/i],'str')||'Device',
      qty:qty,

      gp:pick(r,[/after_cogs/i,/gross_profit/i,/(^|[._])gp([._]|$)/i],'num'),
      tkt:pick(r,[/ticket.*(no|num|id)/i,/^ticket\./i],null) };
  });
  list.sort(function(a,b){ return storeOrd(a.store)-storeOrd(b.store)||String(a.name).localeCompare(String(b.name)); });
  var items=list.map(function(d){
    units+=d.qty; total+=(d.price||0)*d.qty;

    +(items.length?'<span class="cnt">'+units+' unit'+(units===1?'':'s')+' · '+money(total)+'</span>':'')+'</div>'

function claimsHtml(){
  var keys=['claims_completed_eugene','claims_completed_salem','claims_completed_clackamas'];
  var fallback={claims_completed_eugene:'CPR Eugene',claims_completed_salem:'CPR Salem Northeast',claims_completed_clackamas:'CPR Clackamas OR'};
  var rows=[];
  keys.forEach(function(k){ (BY[k]||[]).forEach(function(r){ rows.push({r:r,store:storeOf(r)||fallback[k]}); }); });
  rows=rows.filter(function(x){ return !STORE||x.store===STORE; });
  var list=rows.map(function(x){
    var r=x.r;
    /* real capture keys pinned 2026-07-26: device_catalog_item.name is the model
       (device.description carries the COLOR — never the name), the program name
       is the most useful subtitle, and the bare /total/ regex was landing on
       all_net_cogs_total — pin the repair-sale total. */
    return { store:x.store,
      dev:G(r,'device_catalog_item.name')||G(r,'ticket_device.claim_model')||pick(r,[/device.*name/i,/claim_model/i,/^(?!.*description)device/i],'str')||'Claim',
      desc:G(r,'service_program.name')||pick(r,[/claim.*description/i,/^claim\.description$/i,/description/i],'str'),
      tkt:pick(r,[/ticket.*(no|num|id)/i,/rq.*ticket/i,/^ticket\./i],null),
      gp:pick(r,[/after_cogs/i,/gross_profit/i,/(^|[._])gp(?![._]?percent)([._]|$)/i],'num'),
      total:pick(r,[/^ticket_item\.all_net_repair_sale_total$/i,/payment_amount/i,/(^|[._])(?!.*cogs)total([._]|$)/i],'num') };
  });
  /* grouped per store, each with its own net + GP subtotal. Net is the repair
     sale total and GP is net-after-COGS — both come off the raw row, since
     Looker's own gross_profit table calc arrives null (same as every other
     derived metric on this page). */
  var groups={},order=[];
  list.forEach(function(c){
    var k=c.store||'—';
    if(!groups[k]){groups[k]={items:[],net:0,gp:0,netAny:false,gpAny:false};order.push(k);}
    var g=groups[k];g.items.push(c);
    if(c.total!=null){g.net+=c.total;g.netAny=true;}
    if(c.gp!=null){g.gp+=c.gp;g.gpAny=true;}
  });
  order.sort(function(a,b){ return storeOrd(a)-storeOrd(b)||String(a).localeCompare(String(b)); });
  var n=0,netSum=0,gpSum=0,netAny=false,gpAny=false;
  var items=order.map(function(k){
    var g=groups[k];
    n+=g.items.length;
    if(g.netAny){netSum+=g.net;netAny=true;}
    if(g.gpAny){gpSum+=g.gp;gpAny=true;}
    g.items.sort(function(a,b){ return String(a.tkt||'').localeCompare(String(b.tkt||'')); });
    return '<div class="gh"><span>'+esc(shortLoc(k))+'<span class="gc">'+g.items.length+'</span></span>'
      +'<span class="gv">'+(g.netAny?money(g.net):'—')+' <span class="u">net</span></span>'
      +'<span class="gg">'+(g.gpAny?money(g.gp):'—')+' <span class="u">gp</span></span></div>'
      +g.items.map(function(c){
        // ticket rides in the subtitle so the model name keeps the full column
        var sub=[c.desc,c.tkt!=null?'#'+c.tkt:''].filter(Boolean).join(' · ');
        return '<div class="r"><div class="main"><div class="t">'+esc(c.dev)+'</div>'
          +(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>'
          +'<span class="amt">'+(c.total!=null?money(c.total,true):'—')+'</span>'
          +'<span class="gp">'+(c.gp!=null?money(c.gp,true):'—')+'</span></div>';
      }).join('');
  });
  var payout=(BY.claim_payout_weekly||[]).map(function(r){
    var s=storeOf(r), amt=GN(r,'transaction.payment_amount_total');
    return s&&amt!=null?'<span>'+esc(LOC.display(s))+' '+money(amt)+'</span>':'';
  }).join('');
  return '<div class="sect">Claims Fulfilled Today'
    +(n?'<span class="cnt">'+n+' claim'+(n===1?'':'s')
      +(netAny?' · '+money(netSum)+' net':'')+(gpAny?' · '+money(gpSum)+' GP':'')+'</span>':'')+'</div>'
    +'<div class="card">'+(n?'<div class="rows cl">'+items.join('')+'</div>'
      :'<div class="quiet">No claims fulfilled yet today.</div>')
    +(payout?'<div class="chips" style="margin-top:10px"><span style="background:none;padding-left:0;color:var(--grey)">Paid Last 7 Days</span>'+payout+'</div>':'')
    +'</div>';
}

      +'<option value="gp"'+(SORT==='gp'?' selected':'')+'>Sort: Gross Profit</option>'
      +'<option value="attach"'+(SORT==='attach'?' selected':'')+'>Sort: Attach Rate</option>'
      +'<option value="accytkt"'+(SORT==='accytkt'?' selected':'')+'>Sort: Accy / Ticket</option>'
    +'</select></div>'
    +(rows.length?'<div class="lb">'+rows.join('')+'</div>'

function headerMeta(){
  var today=todayPT(), d=SNAP_DATE||today;
  var chip='';
  if(!DEMO&&SNAP_DATE){
    if(NEWEST_DATE&&SNAP_DATE<NEWEST_DATE)chip='<span class="stale">Viewing history</span>';
    else if(SNAP_DATE!==today)chip='<span class="stale">Last capture '+esc(shortDate(SNAP_DATE))+' — nothing today yet</span>';
  }
  $('#dateline').innerHTML=(DEMO
    ?esc(dateLabel(d))
    :'<div class="cpr-navbox">'
      +'<button id="dPrev"'+(d<=DATA_EPOCH?' disabled':'')+'>‹</button>'
      +'<button class="lbl" id="dLbl" title="Pick a day">'+esc(dateLabel(d))+'</button>'
      +'<button id="dNext"'+(d>=today?' disabled':'')+'>›</button>'
      +'</div>'
      +(d!==today?'<button class="cpr-navjump" id="dToday">Today</button>':''))
    +chip+(DEMO?'<span class="demo">Demo Data</span>':'')
    // managers can force a fresh pull from RepairQ, but only for today (the tiles
    // are "today"-relative — forcing while viewing history would overwrite today,
    // not the past day, so it's hidden off-today)
    +((!DEMO&&roleRank()>=2&&d===today)?'<button class="forcebtn" id="dForce" title="Pull the latest numbers from RepairQ now">'+icon('refresh')+'Force update</button>':'');
  $('#meta').textContent=CAPTURED?('Updated '+timePT(CAPTURED)):'';
  if(DEMO)return;
  var fb=$('#dForce'); if(fb)fb.onclick=function(){ forceUpdate(fb); };
  function stepTo(n){
    var p=d.split('-').map(Number), x=new Date(p[0],p[1]-1,p[2]+n);
    showDate(x.toLocaleDateString('en-CA'));
  }
  var pb=$('#dPrev'),nb=$('#dNext'),lb=$('#dLbl'),tb=$('#dToday');
  if(pb)pb.onclick=function(){ if(d>DATA_EPOCH)stepTo(-1); };
  if(nb)nb.onclick=function(){ if(d<today)stepTo(1); };
  if(tb)tb.onclick=function(){ showDate(today); };
  if(lb&&window.CPRPickers&&CPRPickers.day)lb.onclick=function(ev){
    ev.stopPropagation();
    var p=d.split('-').map(Number), tp=today.split('-').map(Number), ep=DATA_EPOCH.split('-').map(Number);
    CPRPickers.day(lb,{
      get:function(){ return new Date(p[0],p[1]-1,p[2]); },
      set:function(x){ showDate(x.toLocaleDateString('en-CA')); },
      min:new Date(ep[0],ep[1]-1,ep[2]), max:new Date(tp[0],tp[1]-1,tp[2])
    });
  };
}

function toast(m,err){ var t=$('#toast'); if(!t)return; t.textContent=m; t.classList.toggle('err',!!err);
  t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},3600); }

/* Manager force-update: kick a fresh RepairQ pull server-side (repairq-query's
   digest_refresh, gated by the manager's own JWT), then reload today and repaint. */
async function forceUpdate(btn){
  if(FORCING||!SBC)return; FORCING=true;
  btn.disabled=true; btn.classList.add('spin');
  try{
    var tok=((await SBC.auth.getSession()).data.session||{}).access_token;
    if(!tok){ toast('Sign in first',true); return; }
    var r=await fetch(REPAIRQ_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':ANON},
      body:JSON.stringify({action:'digest_refresh'})});
    var dd={}; try{ dd=await r.json(); }catch(e){}
    if(!r.ok||!dd.ok){ toast(dd&&dd.error?dd.error:'Update failed — try again',true); return; }
    // re-pull the recent window so today's fresh rows (and NEWEST_DATE) update
    var since=new Date(Date.now()-8*864e5).toLocaleDateString('en-CA',{timeZone:TZ});
    var q=await SBC.from('digest_raw').select('capture_date,tile_key,rows,row_count,captured_at')
      .gte('capture_date',since).order('capture_date',{ascending:false}).limit(60);
    if(q.data){ ROWS_BY_DATE={}; q.data.forEach(function(row){ (ROWS_BY_DATE[row.capture_date]=ROWS_BY_DATE[row.capture_date]||[]).push(row); });
      NEWEST_DATE=Object.keys(ROWS_BY_DATE).sort().pop()||NEWEST_DATE; }
    await showDate(todayPT());
    toast(dd.debounced?'Already up to date':'Updated with the latest numbers');
  }catch(e){ toast('Update failed — try again',true); }
  finally{ FORCING=false; }   // headerMeta() re-renders the button fresh (not disabled)
}

/* switch the whole digest to a day's snapshot (cache first, fetch on miss) */
async function showDate(d){
  var today=todayPT(); if(d>today)d=today; if(d<DATA_EPOCH)d=DATA_EPOCH;
  var rows=ROWS_BY_DATE[d];
  if(!rows&&SBC){
    $('#dateline').innerHTML='Loading '+esc(shortDate(d))+'…';
    var q=await SBC.from('digest_raw').select('capture_date,tile_key,rows,row_count,captured_at').eq('capture_date',d);
    rows=ROWS_BY_DATE[d]=(q.data||[]);
  }
  rows=rows||[];
  BY={}; CAPTURED=null; SNAP_DATE=d;
  rows.forEach(function(r){
    BY[r.tile_key]=Array.isArray(r.rows)?r.rows:[];
    if(!CAPTURED||r.captured_at>CAPTURED)CAPTURED=r.captured_at;
  });
  headerMeta();
  if(!rows.length){
    $('#view').innerHTML='<div class="gate">'+icon('inbox')+'<div class="gt">No Capture For '+esc(shortDate(d))+'</div><div class="gs">The sync wasn’t running that day — pick another date.</div></div>';
    return;
  }
  paint();
}

async function boot(){
  if(DEMO){ ready(demoRows()); return; }
  var sb=null;
  try{
    var mod=await import('/assets/supabase-js.js');
    sb=mod.createClient(SB_URL,ANON);
    SBC=sb;   // day navigation fetches older snapshots on demand
  }catch(e){ gate('inbox','Couldn\u2019t Load','Refresh to retry.'); return; }
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){
    try{
      var raw=localStorage.getItem('sb-'+SB_REF+'-auth-token');
      if(raw){ var o=JSON.parse(raw);
        var at=o.access_token||(o.currentSession&&o.currentSession.access_token);
        var rt=o.refresh_token||(o.currentSession&&o.currentSession.refresh_token);
        if(at&&rt){ await sb.auth.setSession({access_token:at,refresh_token:rt}); sess=(await sb.auth.getSession()).data.session; } }
    }catch(e){}
  }
  if(!sess){ gate('user','Sign In First','Sign in with your PIN from any page, then reload.'); return; }
  var since=new Date(Date.now()-8*864e5).toLocaleDateString('en-CA',{timeZone:TZ});
  var q=await sb.from('digest_raw').select('capture_date,tile_key,rows,row_count,captured_at')
    .gte('capture_date',since).order('capture_date',{ascending:false}).limit(60);
  if(q.error){ gate('inbox','Couldn\u2019t Load The Digest','Refresh to retry.'); return; }
  if(!q.data||!q.data.length){
    var check=function(){
      if(roleRank()>=2)gate('inbox','No Capture Yet','The sync runs every four hours \u2014 the first snapshot of the day lands early morning.');
      else gate('lock','Managers Only','The Daily Digest is the management scorecard. Ask an owner if you think you should have access.');
    };
    check();
    window.addEventListener('cprnav:auth',check);
    return;
  }
  ready(q.data);
}
