<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome · CPR Cell Phone Repair</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#F3F9FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey);
display:flex;justify-content:center;padding:18px 12px 40px;min-height:100vh}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:16px;
box-shadow:0 8px 28px rgba(45,45,59,.1);overflow:hidden;height:fit-content}
.card.wide{max-width:560px}
.chd{background:var(--dark);padding:14px 18px}
.logo{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;color:#fff}
.logo b{color:var(--red)}
.chd h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;color:#fff;margin:10px 0 0}
.cbd{padding:14px 18px 18px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ptrack{flex:1;height:5px;border-radius:999px;background:#ECEDF1;overflow:hidden}
.ptrack>i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .2s}
.ptrack>i.done{background:var(--green)}
.plabel{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;color:var(--grey2);white-space:nowrap}
h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.02rem;margin:0 0 10px}
.hint{font-size:.76rem;font-weight:700;color:var(--grey2);margin:-6px 0 10px}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.f{flex:1 1 40%}.f.full{flex:1 1 100%}
.f label{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;
letter-spacing:.4px;color:var(--dark-grey);margin-bottom:3px}
.f input,.f select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.85rem;color:var(--dark);background:#fff}
.f input:focus,.f select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
.f .err{border-color:var(--red)!important}
.ftr{display:flex;gap:8px;margin-top:14px}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;padding:12px;border:none;border-radius:9px;cursor:pointer}
.btn.pri{flex:2;background:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.pri:disabled{opacity:.6;cursor:default}
.btn.alt{flex:1;background:#fff;color:var(--dark);border:1.5px solid var(--border)}
/* offer letter */
.offerbox{border:1.5px solid var(--border);border-radius:12px;background:#FDFDFE;padding:14px 16px;
font-size:.86rem;font-weight:600;line-height:1.6;white-space:pre-line;margin-bottom:14px}
.declink{display:block;text-align:center;margin-top:12px;font-family:'Nunito',sans-serif;font-weight:800;
font-size:.76rem;color:var(--grey2);background:none;border:none;cursor:pointer;width:100%;text-decoration:underline}
.decbox{border:1.5px solid #F6C9CA;background:#FDEBEC;border-radius:12px;padding:12px 14px;margin-top:12px}
.decbox .t{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--red);margin-bottom:8px}
.decbox textarea{width:100%;min-height:56px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:.83rem;resize:vertical}
/* signature */
.siglabel{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;
letter-spacing:.4px;color:var(--dark-grey);margin:12px 0 4px}
.sigwrap{position:relative;border:1.5px dashed var(--grey);border-radius:11px;background:#fff;height:140px;touch-action:none}
.sigwrap canvas{width:100%;height:100%;display:block;border-radius:11px}
.sigwrap .sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--grey);
font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;pointer-events:none}
.sigline{position:absolute;left:8%;right:8%;bottom:30px;border-bottom:1.5px solid var(--border);pointer-events:none}
.sigclear{position:absolute;top:8px;right:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;
border:1px solid var(--border);background:#fff;color:var(--dark-grey);border-radius:8px;padding:5px 10px;cursor:pointer}
.errline{color:var(--red);font-weight:800;font-size:.78rem;margin-top:8px;min-height:1em}
/* handbook accordion */
.hb{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:4px}
.hbrow{border-bottom:1px solid #F0F1F4}
.hbrow:last-child{border-bottom:none}
.hbbtn{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:none;padding:11px 14px;cursor:pointer;text-align:left}
.hbbtn:hover{background:#F8FAFD}
.hbbtn .t{font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;color:var(--dark);flex:1}
.hbbtn .chev{transition:transform .15s;color:#C7CAD4}
.hbrow.open .hbbtn .chev{transform:rotate(180deg)}
.hbbody{display:none;padding:2px 16px 14px;font-size:.83rem;line-height:1.6}
.hbrow.open .hbbody{display:block}
.hbbody h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;margin:12px 0 4px}
.hbbody h4{font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;margin:10px 0 3px}
.hbbody ul,.hbbody ol{margin:4px 0;padding-left:20px}
.hbbody li{margin:2px 0}
.hbbody code{background:#F3F2F2;border-radius:4px;padding:1px 5px;font-size:.78rem}
.hbbody img{max-width:100%;border-radius:8px}
.hbbody a{color:var(--blued)}
.hbbody .callout{display:flex;gap:8px;background:#FBF1DC;border:1px solid #EBD8AC;border-radius:8px;padding:8px 10px;margin:6px 0}
.hbbody hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.agree{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;cursor:pointer}
.agree input{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.agree span{font-size:.79rem;font-weight:700;line-height:1.5}
/* availability */
.avlist{border:1.5px solid var(--border);border-radius:10px;padding:2px 13px;margin-top:4px}
.avrow{border-bottom:1px solid #F7F7F9}
.avrow:last-child{border-bottom:none}
.avbtn{display:flex;align-items:center;width:100%;gap:8px;background:none;border:none;padding:9px 0;cursor:pointer;text-align:left}
.avbtn:hover{background:#F8FAFD}
.avday{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);flex:1}
.avval{font-size:.78rem;font-weight:700}
.avval.all{color:var(--grey2)}.avval.hours{color:var(--blued)}.avval.off{color:var(--grey)}
.avopen{background:#F8FAFD;margin:0 -13px;padding:10px 13px 12px;border-bottom:1px solid #F7F7F9}
.avopen .avday{color:var(--blued)}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;padding:4px 8px;border:none;background:#fff;
color:var(--dark-grey);cursor:pointer;white-space:nowrap;border-left:1.5px solid var(--border)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--blue);color:#fff}
.seg button.on.off{background:var(--grey2)}
.avhours{display:flex;align-items:center;gap:8px;margin-top:8px}
.avhours select{flex:1;height:28px;padding:2px 8px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.72rem}
.avhours .to{font-size:.7rem;font-weight:700;color:var(--grey)}
/* review */
.rvblock{border:1px solid #F0F1F4;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.rvhd{display:flex;align-items:center;margin-bottom:4px}
.rvhd .ey{font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grey)}
.rvhd a{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--blue);text-decoration:none;cursor:pointer}
.rvrow{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #F7F7F9;font-size:.76rem}
.rvrow:last-child{border-bottom:none}
.rvrow .k{width:88px;flex:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;text-transform:uppercase;
letter-spacing:.4px;color:var(--grey);padding-top:2px}
.rvrow .v{font-weight:700;color:var(--dark)}
.ecrow{display:flex;align-items:center;padding:3px 0;font-size:.76rem}
.ecrow .n{font-family:'Nunito',sans-serif;font-weight:800}
.ecrow .rel{font-weight:700;color:var(--grey);margin-left:6px;font-size:.7rem}
.ecrow .ph{margin-left:auto;font-weight:700;color:var(--blued);font-size:.74rem}
.avgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.avgrid .c{display:flex;gap:6px;font-size:.72rem;padding:1px 0}
.avgrid .d{width:30px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--dark)}
.avgrid .v{font-weight:700}
.shield{display:flex;gap:8px;background:var(--bluebg);border:1.5px solid #CDE8F7;border-radius:10px;padding:10px 12px;margin:12px 0 0}
.shield svg{flex:none;margin-top:1px}
.shield .t{font-size:.7rem;font-weight:700;color:var(--blued);line-height:1.5}
.done{padding:30px 20px;text-align:center}
.done .ck{width:52px;height:52px;border-radius:50%;background:#E1F5EE;color:#0f6e56;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.done .ck.grey{background:#F0F1F4;color:var(--grey2)}
.done h2{margin-bottom:6px}
.done p{font-size:.85rem;font-weight:700;color:var(--grey2);margin:0}
.gone{padding:40px 20px;text-align:center;font-weight:700;color:var(--grey2)}
</style>
</head>
<body>
<div class="card" id="card"><div class="gone">Loading…</div></div>

<script type="module">
const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const FN=SB_URL+'/functions/v1/intake';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SHIELD='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E7AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>';
const CHEV='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#C7CAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const CHEVD='<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const CHECK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

const TOKEN=new URLSearchParams(location.search).get('t')||'';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HOURS=['Open','8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM','7 PM','8 PM','Close'];
let PHASE='form';        // offer | handbook | form | done | declined
let STEP=1, SUBMITTED=false, TRIED=false, OPENDAY=null, DECLINING=false;
const D={first:'',middle:'',last:'',preferred:'',dob:'',phone:'',email:'',
  street:'',city:'',zip:'',shirt:'',i9:'',
  e1name:'',e1phone:'',e2name:'',e2phone:'',
  avail:DAYS.map((d,i)=>({day:i,mode:'all',from:'Open',to:'Close'}))};
let INVITE=null,HANDBOOK=null,ACK=null,HBOPEN=0;

async function call(body){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return {status:r.status,data:await r.json().catch(()=>({}))};
}
/* light markup → safe HTML (same family as training.html's renderer) */
function render(text){
  let s=esc(text);
  s=s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/__([^_\n]+)__/g,'<u>$1</u>');
  s=s.replace(/(^|[\s(>])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const lines=s.split('\n');let out='',ul=false,ol=false;
  const close=()=>{if(ul){out+='</ul>';ul=false;}if(ol){out+='</ol>';ol=false;}};
  for(const ln of lines){let m;
    if(/^\s*---+\s*$/.test(ln)){close();out+='<hr>';}
    else if((m=/^!&gt;\s+(.*)$/.exec(ln))){close();out+='<div class="callout"><span>⚠️</span><div>'+m[1]+'</div></div>';}
    else if((m=/^##\s+(.*)$/.exec(ln))){close();out+='<h4>'+m[1]+'</h4>';}
    else if((m=/^#\s+(.*)$/.exec(ln))){close();out+='<h3>'+m[1]+'</h3>';}
    else if((m=/^\s*[-•]\s+(.*)$/.exec(ln))){if(ol){out+='</ol>';ol=false;}if(!ul){out+='<ul>';ul=true;}out+='<li>'+m[1]+'</li>';}
    else if((m=/^\s*\d+[.)]\s+(.*)$/.exec(ln))){if(ul){out+='</ul>';ul=false;}if(!ol){out+='<ol>';ol=true;}out+='<li>'+m[1]+'</li>';}
    else if(ln.trim()===''){close();out+='<div style="height:8px"></div>';}
    else{close();out+=ln+'<br>';}
  }
  close();return out;
}
function firstName(){return D.preferred||D.first||(INVITE&&INVITE.invited_name?INVITE.invited_name.split(' ')[0]:'');}
function derivePhase(){
  if(INVITE.status==='promoted'||INVITE.submitted_at){PHASE='done';SUBMITTED=true;return;}
  if(INVITE.offer_declined_at){PHASE='declined';return;}
  if(INVITE.offer_body&&!INVITE.offer_signed_at){PHASE='offer';return;}
  if(INVITE.offer_body&&!INVITE.handbook_signed_at){PHASE='handbook';return;}
  PHASE='form';
}
/* ---------- progress (docs flow = 7 stops, form-only = 5) ---------- */
function totSteps(){return INVITE&&INVITE.offer_body?7:5;}
function curStep(){
  if(PHASE==='offer')return 1;
  if(PHASE==='handbook')return 2;
  return (INVITE&&INVITE.offer_body?2:0)+STEP;
}
function prog(){
  const tot=totSteps(),cur=curStep(),pct=Math.round(cur/tot*100);
  return '<div class="prog"><span class="ptrack"><i class="'+(cur===tot?'done':'')+'" style="width:'+pct+'%"></i></span>'
    +'<span class="plabel">Step '+cur+' of '+tot+'</span></div>';
}
function stepTitle(){
  if(PHASE==='offer')return 'You have an offer'+(firstName()?', '+esc(firstName()):'')+' 🎉';
  if(PHASE==='handbook')return 'The Employee Handbook';
  return STEP===1?('Welcome aboard'+(firstName()?', '+esc(firstName()):'')+' 👋')
    :STEP===2?'A few more details'
    :STEP===3?'Who should we call?'
    :STEP===4?'When can you work?'
    :'Look right?';
}
function head(){
  return '<div class="chd"><div class="logo"><b>my</b>Repair<b>Tools</b></div><h1>'+stepTitle()+'</h1></div>';
}
/* ---------- signature canvas (contracts pattern) ---------- */
let sigCanvas=null,sigStrokes=false;
function sigHtml(){
  return '<span class="siglabel">Signature — sign with your finger or mouse</span>'
    +'<div class="sigwrap"><canvas id="sig"></canvas><div class="sigline"></div>'
    +'<div class="sighint" id="sigHint">Sign here</div>'
    +'<button class="sigclear" id="sigClear" type="button">Clear</button></div>';
}
function wireSig(){
  sigCanvas=$('#sig');if(!sigCanvas)return;
  sigStrokes=false;
  const ctx=sigCanvas.getContext('2d');
  const scale=window.devicePixelRatio||1,r=sigCanvas.getBoundingClientRect();
  sigCanvas.width=r.width*scale;sigCanvas.height=r.height*scale;ctx.scale(scale,scale);
  ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2D2D3B';
  let drawing=false,last=null;
  const pos=e=>{const b=sigCanvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  sigCanvas.addEventListener('pointerdown',e=>{e.preventDefault();sigCanvas.setPointerCapture(e.pointerId);drawing=true;last=pos(e);sigStrokes=true;$('#sigHint').style.display='none';});
  sigCanvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>sigCanvas.addEventListener(ev,()=>{drawing=false;}));
  $('#sigClear').onclick=()=>{ctx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigStrokes=false;$('#sigHint').style.display='flex';};
}
/* ---------- offer phase ---------- */
function offerBody(){
  return '<h2>Your offer'+(INVITE.position?' — '+esc(INVITE.position):'')+'</h2>'
    +'<div class="offerbox">'+esc(INVITE.offer_body)+'</div>'
    +'<div class="f full"><label>Your full legal name</label><input id="sigName" autocomplete="name" placeholder="Type your full name" value="'+esc(INVITE.invited_name||'')+'"></div>'
    +sigHtml()
    +'<div class="errline" id="err"></div>'
    +'<div class="ftr"><button class="btn pri" id="acceptGo" style="flex:1">Accept &amp; sign</button></div>'
    +(DECLINING
      ?'<div class="decbox"><div class="t">Decline this offer?</div>'
        +'<textarea id="decNote" placeholder="Anything you want us to know? (optional)"></textarea>'
        +'<div class="ftr" style="margin-top:10px"><button class="btn alt" id="decBack">Keep looking at it</button>'
        +'<button class="btn pri" id="decGo" style="background:#8A8FA0">Yes, decline</button></div></div>'
      :'<button class="declink" id="decOpen">I need to decline this offer</button>');
}
function wireOffer(){
  wireSig();
  const err=$('#err');
  $('#acceptGo').onclick=async()=>{
    err.textContent='';
    const nm=($('#sigName').value||'').trim();
    if(nm.length<2){err.textContent='Type your full legal name.';return;}
    if(!sigStrokes){err.textContent='Sign in the signature box.';return;}
    const b=$('#acceptGo');b.disabled=true;b.textContent='Saving…';
    const r=await call({action:'sign_offer',token:TOKEN,signed_name:nm,signature:sigCanvas.toDataURL('image/png')});
    if(!(r.status===200&&r.data.ok)){b.disabled=false;b.textContent='Accept & sign';
      err.textContent=r.data.error==='already_signed'?'Already signed — refresh the page.':'Could not save ('+(r.data.error||'error')+'). Try again.';return;}
    await refresh();
  };
  const dOpen=$('#decOpen');if(dOpen)dOpen.onclick=()=>{DECLINING=true;draw();};
  const dBack=$('#decBack');if(dBack)dBack.onclick=()=>{DECLINING=false;draw();};
  const dGo=$('#decGo');if(dGo)dGo.onclick=async()=>{
    dGo.disabled=true;dGo.textContent='Sending…';
    const r=await call({action:'decline_offer',token:TOKEN,note:($('#decNote').value||'').trim()||null});
    if(!(r.status===200&&r.data.ok)){dGo.disabled=false;dGo.textContent='Yes, decline';
      $('#err').textContent='Could not save ('+(r.data.error||'error')+'). Try again.';return;}
    await refresh();
  };
}
/* ---------- handbook phase ---------- */
function handbookBody(){
  const arts=HANDBOOK||[];
  const rows=arts.map((a,i)=>'<div class="hbrow'+(HBOPEN===i?' open':'')+'"><button class="hbbtn" data-hb="'+i+'">'
    +'<span class="t">'+esc(a.title.replace(/^Handbook\s*[—-]\s*/,''))+'</span>'+CHEVD+'</button>'
    +'<div class="hbbody">'+render(a.body)+'</div></div>').join('');
  const ackBox=ACK?'<div style="border:1.5px solid var(--border);border-radius:12px;background:#FDFDFE;padding:13px 15px;margin-top:14px">'
      +'<div style="font-family:Nunito,sans-serif;font-weight:900;font-size:.88rem;margin-bottom:2px">'+esc(ACK.title||'')+'</div>'
      +(ACK.version?'<div style="font-size:.7rem;font-weight:700;color:var(--grey2);margin-bottom:8px">Handbook Version: '+esc(ACK.version)+'</div>':'')
      +'<div style="font-size:.78rem;font-weight:600;line-height:1.55;white-space:pre-line">'+esc(ACK.body||'')+'</div></div>':'';
  return '<h2>Read through the handbook</h2>'
    +'<div class="hint">Tap each section to read it — the important stuff about pay, time off, and how we work.</div>'
    +(rows?'<div class="hb">'+rows+'</div>':'<div class="hint">Handbook unavailable — ask your manager.</div>')
    +ackBox
    +'<label class="agree"><input type="checkbox" id="hbAgree"><span>'+(ACK
      ?'I have read and agree to the acknowledgment above.'
      :'I acknowledge that I have received, read, and understand the CPR Employee Handbook, and I agree to follow its policies.')+'</span></label>'
    +'<div class="f full" style="margin-top:12px"><label>Your full legal name</label><input id="sigName" autocomplete="name" placeholder="Type your full name" value="'+esc(INVITE.offer_signed_name||INVITE.invited_name||'')+'"></div>'
    +sigHtml()
    +'<div class="errline" id="err"></div>'
    +'<div class="ftr"><button class="btn pri" id="hbGo" style="flex:1">Sign &amp; continue</button></div>';
}
function wireHandbook(){
  wireSig();
  document.querySelectorAll('[data-hb]').forEach(b=>b.onclick=()=>{
    const i=+b.getAttribute('data-hb');HBOPEN=HBOPEN===i?-1:i;draw();window.scrollTo(0,0);
  });
  $('#hbGo').onclick=async()=>{
    const err=$('#err');err.textContent='';
    const nm=($('#sigName').value||'').trim();
    if(!$('#hbAgree').checked){err.textContent='Check the acknowledgment box to continue.';return;}
    if(nm.length<2){err.textContent='Type your full legal name.';return;}
    if(!sigStrokes){err.textContent='Sign in the signature box.';return;}
    const b=$('#hbGo');b.disabled=true;b.textContent='Saving…';
    const r=await call({action:'sign_handbook',token:TOKEN,signed_name:nm,signature:sigCanvas.toDataURL('image/png')});
    if(!(r.status===200&&r.data.ok)){b.disabled=false;b.textContent='Sign & continue';
      err.textContent=r.data.error==='already_signed'?'Already signed — refresh the page.':'Could not save ('+(r.data.error||'error')+'). Try again.';return;}
    await refresh();
  };
}
/* ---------- form phase (the original 5-step wizard) ---------- */
function fld(key,label,ph,opts){
  opts=opts||{};
  const err=TRIED&&opts.req&&!D[key]?' err':'';
  return '<div class="f'+(opts.full?' full':'')+'"><label>'+esc(label)+'</label>'
    +'<input id="f_'+key+'" class="'+err.trim()+'" type="'+(opts.type||'text')+'" value="'+esc(D[key])+'" placeholder="'+esc(ph||'')+'"'
    +(opts.mode?' inputmode="'+opts.mode+'"':'')+'></div>';
}
function grab(){
  document.querySelectorAll('[id^=f_]').forEach(el=>{D[el.id.slice(2)]=el.value.trim();});
}
function stepBody(){
  if(STEP===1)return '<h2>About you</h2><div class="fields">'
    +fld('first','First name','Devon',{req:1})+fld('middle','Middle name','optional')
    +fld('last','Last name','Reyes',{req:1})+fld('preferred','Preferred name','What we call you')
    +fld('dob','Date of birth','MM/DD/YYYY',{req:1,type:'date'})+fld('phone','Phone','(555) 555-5555',{req:1,mode:'tel'})
    +fld('email','Personal email','you@example.com',{full:1,req:1,mode:'email'})
    +'</div><div class="ftr"><button class="btn pri" id="next">Next ›</button></div>';
  if(STEP===2)return '<h2>Address &amp; work details</h2><div class="fields">'
    +fld('street','Street address','123 Main St, Apt 4',{full:1,req:1})
    +fld('city','City','Eugene',{req:1})+fld('zip','ZIP','97401',{req:1,mode:'numeric'})
    +'<div class="f"><label>Shirt size</label><select id="f_shirt">'+['','S','M','L','XL','2XL'].map(s=>'<option value="'+s+'"'+(D.shirt===s?' selected':'')+'>'+(s||'Pick one')+'</option>').join('')+'</select></div>'
    +fld('i9','I-9 documents you\'ll bring','e.g. US passport')
    +'</div><div class="ftr"><button class="btn alt" id="back">‹ Back</button><button class="btn pri" id="next">Next ›</button></div>';
  if(STEP===3)return '<h2>Emergency contacts</h2><div class="fields">'
    +fld('e1name','Contact 1 — name & relation','e.g. Sam Reyes, parent',{req:1})
    +fld('e1phone','Contact 1 — phone','(555) 555-5555',{req:1,mode:'tel'})
    +fld('e2name','Contact 2 — name & relation','optional')
    +fld('e2phone','Contact 2 — phone','optional',{mode:'tel'})
    +'</div><div class="ftr"><button class="btn alt" id="back">‹ Back</button><button class="btn pri" id="next">Next ›</button></div>';
  if(STEP===4){
    let rows='';
    D.avail.forEach((a,i)=>{
      const open=OPENDAY===i;
      const val=a.mode==='all'?'All day':a.mode==='off'?'Off':(a.from+' – '+a.to);
      const cls=a.mode==='all'?'all':a.mode==='off'?'off':'hours';
      if(!open){
        rows+='<div class="avrow"><button class="avbtn" data-day="'+i+'"><span class="avday">'+DAYS[i]+'</span>'
          +'<span class="avval '+cls+'">'+esc(val)+'</span>'+CHEV+'</button></div>';
      }else{
        rows+='<div class="avrow"><div class="avopen"><div style="display:flex;align-items:center;gap:8px">'
          +'<span class="avday">'+DAYS[i]+'</span><span style="flex:1"></span>'
          +'<span class="seg">'
          +'<button data-mode="all" class="'+(a.mode==='all'?'on':'')+'">All day</button>'
          +'<button data-mode="hours" class="'+(a.mode==='hours'?'on':'')+'">Hours</button>'
          +'<button data-mode="off" class="'+(a.mode==='off'?'on off':'')+'">Off</button></span></div>'
          +(a.mode==='hours'?'<div class="avhours"><select id="avFrom">'+HOURS.map(x=>'<option'+(x===a.from?' selected':'')+'>'+x+'</option>').join('')+'</select>'
            +'<span class="to">to</span><select id="avTo">'+HOURS.map(x=>'<option'+(x===a.to?' selected':'')+'>'+x+'</option>').join('')+'</select></div>':'')
          +'</div></div>';
      }
    });
    return '<h2>Availability</h2><div class="hint">Everyone starts “All day” — tap a day only if it’s different.</div>'
      +'<div class="avlist">'+rows+'</div>'
      +'<div class="ftr"><button class="btn alt" id="back">‹ Back</button><button class="btn pri" id="next">Next ›</button></div>';
  }
  /* step 5 review */
  const rv=(k,v)=>v?'<div class="rvrow"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>':'';
  const name=[D.first,D.middle,D.last].filter(Boolean).join(' ');
  let av='';
  D.avail.forEach((a,i)=>{
    const val=a.mode==='all'?'All day':a.mode==='off'?'Off':(a.from+' – '+a.to);
    const col=a.mode==='hours'?'#1E7AA8':a.mode==='off'?'#B9BDCB':'#8A8FA0';
    av+='<div class="c"><span class="d">'+DAYS[i].slice(0,3)+'</span><span class="v" style="color:'+col+'">'+esc(val)+'</span></div>';
  });
  const ec=(n,p)=>{if(!n)return'';const parts=n.split(',');
    return '<div class="ecrow"><span class="n">'+esc(parts[0].trim())+'</span>'
      +(parts[1]?'<span class="rel">'+esc(parts.slice(1).join(',').trim())+'</span>':'')
      +'<span class="ph">'+esc(p||'')+'</span></div>';};
  return '<h2>Review &amp; submit</h2>'
    +'<div class="rvblock"><div class="rvhd"><span class="ey">Your info</span><a data-jump="1">Edit</a></div>'
    +rv('Name',name)+rv('Preferred',D.preferred)+rv('DOB',D.dob)+rv('Phone',D.phone)+rv('Email',D.email)
    +rv('Address',[D.street,D.city,D.zip].filter(Boolean).join(', '))+rv('Shirt',D.shirt)+rv('I-9 plan',D.i9)+'</div>'
    +'<div class="rvblock"><div class="rvhd"><span class="ey">Emergency contacts</span><a data-jump="3">Edit</a></div>'
    +ec(D.e1name,D.e1phone)+ec(D.e2name,D.e2phone)+'</div>'
    +'<div class="rvblock"><div class="rvhd"><span class="ey">Availability</span><a data-jump="4">Edit</a></div>'
    +'<div class="avgrid">'+av+'</div></div>'
    +'<div class="shield">'+SHIELD+'<span class="t">We’ll never ask for your SSN or bank details here — those go directly into QuickBooks Workforce after your first day.</span></div>'
    +'<div class="ftr"><button class="btn alt" id="back">‹ Back</button><button class="btn pri" id="submit">Submit</button></div>';
}
function wireForm(){
  const nx=$('#next');if(nx)nx.onclick=()=>{
    grab();TRIED=true;
    const need=STEP===1?['first','last','dob','phone','email']:STEP===2?['street','city','zip']:STEP===3?['e1name','e1phone']:[];
    if(need.some(k=>!D[k])){draw();return;}
    TRIED=false;OPENDAY=null;STEP++;draw();window.scrollTo(0,0);
  };
  const bk=$('#back');if(bk)bk.onclick=()=>{grab();TRIED=false;OPENDAY=null;STEP--;draw();window.scrollTo(0,0);};
  document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=()=>{STEP=+a.getAttribute('data-jump');draw();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{OPENDAY=+b.getAttribute('data-day');draw();});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    const a=D.avail[OPENDAY];a.mode=b.getAttribute('data-mode');
    if(a.mode!=='hours')OPENDAY=null;
    draw();
  });
  const af=$('#avFrom'),at=$('#avTo');
  if(af)af.onchange=()=>{D.avail[OPENDAY].from=af.value;};
  if(at)at.onchange=()=>{D.avail[OPENDAY].to=at.value;};
  const sub=$('#submit');if(sub)sub.onclick=async()=>{
    sub.disabled=true;sub.textContent='Sending…';
    const modes={all:'all',hours:'hours',off:'off'};
    const r=await call({action:'submit',token:TOKEN,
      legal_first:D.first,legal_middle:D.middle,legal_last:D.last,preferred_name:D.preferred,
      dob:D.dob,phone:D.phone,personal_email:D.email,
      address:{street:D.street,city:D.city,zip:D.zip},
      emergency:D.e1name?{name:D.e1name,phone:D.e1phone}:null,
      emergency2:D.e2name?{name:D.e2name,phone:D.e2phone}:null,
      shirt_size:D.shirt,i9_docs:D.i9,
      availability:D.avail.map(a=>({day:a.day,mode:modes[a.mode]||'all',from:a.mode==='hours'?a.from:null,to:a.mode==='hours'?a.to:null}))});
    if(r.status===200&&r.data.ok){SUBMITTED=true;PHASE='done';draw();}
    else{sub.disabled=false;sub.textContent='Submit';alert(r.data.error||'Something went wrong — try again.');}
  };
}
/* ---------- draw ---------- */
function draw(){
  const card=$('#card');
  card.classList.toggle('wide',PHASE==='handbook');
  if(PHASE==='done'){
    card.innerHTML='<div class="chd"><div class="logo"><b>my</b>Repair<b>Tools</b></div></div>'
      +'<div class="done"><span class="ck">'+CHECK+'</span><h2>All set'+(firstName()?', '+esc(firstName()):'')+'!</h2>'
      +'<p>Your manager has everything they need.<br>See you on your first day.</p>'
      +(INVITE&&INVITE.offer_signed_at?'<button class="btn alt" id="dlPdf" style="margin-top:16px;width:100%">⬇ Download your signed offer (PDF)</button>':'')
      +'</div>';
    const dl=$('#dlPdf');if(dl)dl.onclick=async()=>{
      dl.disabled=true;dl.textContent='Building…';
      try{
        const r=await call({action:'signed_pdf',token:TOKEN});
        if(!(r.status===200&&r.data.ok&&r.data.pdf))throw new Error(r.data.error||'failed');
        const bytes=Uint8Array.from(atob(r.data.pdf),c=>c.charCodeAt(0));
        const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
        const a=document.createElement('a');a.href=url;a.download=r.data.filename||'CPR Offer — signed.pdf';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
      }catch(e){alert('Download failed — try again.');}
      dl.disabled=false;dl.textContent='⬇ Download your signed offer (PDF)';
    };
    return;
  }
  if(PHASE==='declined'){
    card.innerHTML='<div class="chd"><div class="logo"><b>my</b>Repair<b>Tools</b></div></div>'
      +'<div class="done"><span class="ck grey">'+CHECK+'</span><h2>Offer declined</h2>'
      +'<p>Thanks for letting us know — we appreciate you considering us.<br>If anything changes, reach out any time.</p></div>';
    return;
  }
  const body=PHASE==='offer'?offerBody():PHASE==='handbook'?handbookBody():stepBody();
  card.innerHTML=head()+'<div class="cbd">'+prog()+body+'</div>';
  if(PHASE==='offer')wireOffer();
  else if(PHASE==='handbook')wireHandbook();
  else wireForm();
}
async function refresh(){
  const r=await call({action:'get',token:TOKEN});
  if(r.status===200&&r.data.ok){
    INVITE=r.data.intake;
    if(r.data.handbook)HANDBOOK=r.data.handbook;
    if(r.data.ack)ACK=r.data.ack;
    DECLINING=false;derivePhase();
  }
  draw();window.scrollTo(0,0);
}
(async()=>{
  if(!TOKEN){$('#card').innerHTML='<div class="gone">This link is missing its code — ask your manager to resend it.</div>';return;}
  const r=await call({action:'get',token:TOKEN});
  if(!(r.status===200&&r.data.ok)){$('#card').innerHTML='<div class="gone">This link isn’t valid anymore — ask your manager to resend it.</div>';return;}
  INVITE=r.data.intake;
  if(r.data.handbook)HANDBOOK=r.data.handbook;
  if(r.data.ack)ACK=r.data.ack;
  derivePhase();
  if(INVITE.invited_name&&!D.first){const p=INVITE.invited_name.split(' ');D.first=p[0]||'';D.last=p.slice(1).join(' ');}
  draw();
})();
</script>
</body>
</html>
