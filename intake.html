<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Welcome · CPR Cell Phone Repair</title>
<link rel="icon" type="image/svg+xml" href="assets/images/myrepairtools-favicon.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--red:#DC282E;--dark:#2D2D3B;--dark-grey:#4E4E50;--blue:#4FB0E3;--blued:#1E7AA8;--bluebg:#F3F9FD;
--grey:#B9BDCB;--grey2:#8A8FA0;--light-grey:#F3F2F2;--border:#E0E2EA;--green:#2E9E5B}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito Sans',sans-serif;color:var(--dark);background:var(--light-grey);
display:flex;justify-content:center;padding:18px 12px 40px;min-height:100vh}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:16px;
box-shadow:0 8px 28px rgba(45,45,59,.1);overflow:hidden;height:fit-content}
.card.wide{max-width:560px}
/* phones get the 420px card as-is (this page was built mobile-first); a
   desktop reader gets a wider measure and slightly larger type for the
   documents they actually have to read */
@media(min-width:720px){
  body{padding:36px 20px 60px}
  .card.wide{max-width:680px}
  .card.read{max-width:640px}
  .card.read .offerbox,.card.wide .hbbody{font-size:.94rem;line-height:1.72}
  .cbd{padding:18px 26px 24px}
  .chd{padding:16px 26px}
}
@media(max-width:400px){
  body{padding:10px 8px 32px}
  .cbd{padding:12px 14px 16px}
  .chd{padding:12px 14px}
  .f{flex:1 1 100%}
}
.chd{background:var(--dark);padding:14px 18px}
.logo{display:block;height:26px;width:auto}
.chd h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;color:#fff;margin:10px 0 0}
.cbd{padding:14px 18px 18px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ptrack{flex:1;height:5px;border-radius:999px;background:#ECEDF1;overflow:hidden}
.ptrack>i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .2s}
.ptrack>i.done{background:var(--green)}
.plabel{font-family:'Nunito',sans-serif;font-weight:800;font-size:.66rem;color:var(--grey2);white-space:nowrap}
h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.02rem;margin:0 0 10px}
.hint{font-size:.76rem;font-weight:700;color:var(--grey2);margin:-6px 0 10px}
/* a grid, not wrapped flex: rows line up even when one label wraps to two
   lines and its neighbour doesn't. min-width:0 stops iOS's date input from
   blowing past its column, and 16px inputs stop iOS zooming in on focus. */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{min-width:0;display:flex;flex-direction:column}
.f.full{grid-column:1/-1}
.f label{flex:1;display:flex;align-items:flex-end;font-family:'Nunito',sans-serif;font-weight:700;
font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--dark-grey);margin-bottom:4px;line-height:1.25}
.f input,.f select{width:100%;min-width:0;max-width:100%;height:44px;padding:0 10px;border:1.5px solid var(--border);
border-radius:8px;font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:16px;color:var(--dark);background:#fff}
/* iOS gives date inputs their own intrinsic height and width and ignores the
   padding, so the Date of Birth box sat taller than Phone beside it and spilled
   past its column. Stripping the native appearance and pinning the same height
   as every other field puts the row back in line. */
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;line-height:44px}
.f input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
@media(min-width:720px){.f input,.f select{font-size:.9rem}}
.f input:focus,.f select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,176,227,.15)}
.f .err{border-color:var(--red)!important}
.ftr{display:flex;gap:8px;margin-top:14px}
.ecsec{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}
.ecsec .ey{font-family:'Nunito',sans-serif;font-weight:900;font-size:.66rem;text-transform:uppercase;
letter-spacing:.5px;color:var(--grey2)}
.ecsec .rm{border:none;background:none;padding:2px;cursor:pointer;font-family:'Nunito',sans-serif;
font-weight:800;font-size:.72rem;color:var(--grey2);text-decoration:underline}
.addbtn{display:block;width:100%;margin-top:12px;padding:11px;border:1.5px dashed var(--border);border-radius:9px;
background:#fff;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;color:var(--blued)}
.addbtn:hover{border-color:var(--blue)}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;padding:12px;border:none;border-radius:9px;cursor:pointer}
.btn.pri{flex:2;background:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.pri:disabled{opacity:.6;cursor:default}
.btn.alt{flex:1;background:#fff;color:var(--dark);border:1.5px solid var(--border)}
/* offer letter */
.offerbox{border:1.5px solid var(--border);border-radius:12px;background:#FDFDFE;padding:16px 18px;
font-size:.88rem;font-weight:400;line-height:1.65;margin-bottom:14px}
.offerbox b,.offerbox strong{font-weight:800}
/* the letter is written in the same light markup as the PDF — render it, don't
   dump it, or the candidate reads '# Offer of Employment' literally */
.offerbox h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;margin:14px 0 6px;color:var(--dark)}
.offerbox h4{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;margin:12px 0 4px;color:var(--dark)}
.offerbox>h3:first-child,.offerbox>h4:first-child{margin-top:0}
.offerbox ul,.offerbox ol{margin:6px 0;padding-left:20px}
.offerbox li{margin:3px 0}
.offerbox hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.offerbox a{color:var(--blued)}
/* signed-offer bar: their copy is downloadable the moment they sign, not
   only after the whole form is done */
.pdfbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F1FAF4;border:1px solid #BFE6CE;
border-radius:10px;padding:9px 12px;margin-bottom:12px}
.pdfbar .t{flex:1;font-family:'Nunito',sans-serif;font-weight:800;font-size:.76rem;color:#1C6B41}
.pdfbar button{font-family:'Nunito',sans-serif;font-weight:800;font-size:.74rem;border:1px solid #BFE6CE;
background:#fff;color:#1C6B41;border-radius:8px;padding:6px 11px;cursor:pointer}
.pdfbar button:hover{filter:brightness(.98)}
/* their signature, shown back to them under the letter they signed */
.offerbox .acc{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.offerbox .acch{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;margin-bottom:6px}
.offerbox .sigimg{display:block;max-width:230px;max-height:78px;margin:2px 0 2px -4px}
.offerbox .ownersig{display:block;max-width:210px;max-height:70px;margin:4px 0 2px -4px}
.offerbox .accn{border-top:1px solid var(--dark);display:inline-block;padding-top:4px;
font-size:.78rem;font-weight:700;color:var(--grey2)}
.tail{font-size:.82rem;font-weight:700;color:var(--grey2);margin:14px 0 0;text-align:center}
.declink{display:block;text-align:center;margin-top:12px;font-family:'Nunito',sans-serif;font-weight:800;
font-size:.76rem;color:var(--grey2);background:none;border:none;cursor:pointer;width:100%;text-decoration:underline}
.decbox{border:1.5px solid #F6C9CA;background:#FDEBEC;border-radius:12px;padding:12px 14px;margin-top:12px}
.decbox .t{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--red);margin-bottom:8px}
.decbox textarea{width:100%;min-height:56px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:16px;resize:vertical}
/* signature */
.siglabel{display:block;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;
letter-spacing:.4px;color:var(--dark-grey);margin:12px 0 4px}
.sigwrap{position:relative;border:1.5px dashed var(--grey);border-radius:11px;background:#fff;height:140px;touch-action:none}
.sigwrap canvas{width:100%;height:100%;display:block;border-radius:11px}
.sigwrap .sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--grey);
font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;pointer-events:none}
.sigline{position:absolute;left:8%;right:8%;bottom:30px;border-bottom:1.5px solid var(--border);pointer-events:none}
.sigclear{position:absolute;top:8px;right:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.7rem;
border:1px solid var(--border);background:#fff;color:var(--dark-grey);border-radius:8px;padding:5px 10px;cursor:pointer}
.errline{color:var(--red);font-weight:800;font-size:.78rem;margin-top:8px;min-height:1em}
/* handbook accordion */
.hb{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:4px}
.hbrow{border-bottom:1px solid #F0F1F4}
.hbrow:last-child{border-bottom:none}
.hbbtn{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:none;padding:11px 14px;cursor:pointer;text-align:left}
.hbbtn:hover{background:#F8FAFD}
.hbbtn .t{font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;color:var(--dark);flex:1}
/* numbered so a candidate can see how many sections there are and where they are */
.hbbtn .hbn{flex:none;width:21px;height:21px;border-radius:50%;background:var(--light-grey);color:var(--grey2);
font-family:'Nunito',sans-serif;font-weight:900;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.hbrow.open .hbbtn .hbn{background:var(--red);color:#fff}
.hbbtn .chev{transition:transform .15s;color:#C7CAD4}
.hbrow.open .hbbtn .chev{transform:rotate(180deg)}
.hbbody{display:none;padding:2px 16px 14px;font-size:.83rem;line-height:1.6}
.hbrow.open .hbbody{display:block}
.hbbody h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;margin:12px 0 4px}
.hbbody h4{font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;margin:10px 0 3px}
.hbbody ul,.hbbody ol{margin:4px 0;padding-left:20px}
.hbbody li{margin:2px 0}
.hbbody code{background:#F3F2F2;border-radius:4px;padding:1px 5px;font-size:.78rem}
.hbbody img{max-width:100%;border-radius:8px}
.hbbody a{color:var(--blued)}
.hbbody .callout{display:flex;gap:8px;background:#FBF1DC;border:1px solid #EBD8AC;border-radius:8px;padding:8px 10px;margin:6px 0}
.hbbody hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.agree{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;cursor:pointer}
.agree input{margin-top:3px;width:16px;height:16px;accent-color:var(--red)}
.agree span{font-size:.79rem;font-weight:700;line-height:1.5}
/* availability */
/* pick-one list — a tap target per option, not a dropdown */
.picks{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);
border-radius:11px;padding:11px 13px;cursor:pointer}
.pick:hover{border-color:var(--blue)}
.pick.on{border-color:var(--red);background:#FFF7F7;box-shadow:0 0 0 3px rgba(220,40,46,.09)}
.pick .pt{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.87rem;color:var(--dark)}
.pick .pn{display:block;font-size:.74rem;font-weight:700;color:var(--grey2);margin-top:2px}
.avlist{border:1.5px solid var(--border);border-radius:10px;padding:2px 13px;margin-top:4px}
.avrow{border-bottom:1px solid #F7F7F9}
.avrow:last-child{border-bottom:none}
.avbtn{display:flex;align-items:center;width:100%;gap:8px;background:none;border:none;padding:9px 0;cursor:pointer;text-align:left}
.avbtn:hover{background:#F8FAFD}
.avday{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--dark);flex:1}
.avval{font-size:.78rem;font-weight:700}
.avval.all{color:var(--grey2)}.avval.hours{color:var(--blued)}.avval.off{color:var(--grey)}
.avopen{background:#F8FAFD;margin:0 -13px;padding:10px 13px 12px;border-bottom:1px solid #F7F7F9}
.avopen .avday{color:var(--blued)}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;padding:4px 8px;border:none;background:#fff;
color:var(--dark-grey);cursor:pointer;white-space:nowrap;border-left:1.5px solid var(--border)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--blue);color:#fff}
.seg button.on.off{background:var(--grey2)}
.avhours{display:flex;align-items:center;gap:8px;margin-top:8px}
.avhours select{flex:1;height:28px;padding:2px 8px;border:1.5px solid var(--border);border-radius:8px;
font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:.72rem}
.avhours .to{font-size:.7rem;font-weight:700;color:var(--grey)}
/* review */
.rvblock{border:1px solid #F0F1F4;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.rvhd{display:flex;align-items:center;margin-bottom:4px}
.rvhd .ey{font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--grey)}
.rvhd a{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--blue);text-decoration:none;cursor:pointer}
.rvrow{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #F7F7F9;font-size:.76rem}
.rvrow:last-child{border-bottom:none}
.rvrow .k{width:88px;flex:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.62rem;text-transform:uppercase;
letter-spacing:.4px;color:var(--grey);padding-top:2px}
.rvrow .v{font-weight:700;color:var(--dark)}
.ecrow{display:flex;align-items:center;padding:3px 0;font-size:.76rem}
.ecrow .n{font-family:'Nunito',sans-serif;font-weight:800}
.ecrow .rel{font-weight:700;color:var(--grey);margin-left:6px;font-size:.7rem}
.ecrow .ph{margin-left:auto;font-weight:700;color:var(--blued);font-size:.74rem}
.avgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.avgrid .c{display:flex;gap:6px;font-size:.72rem;padding:1px 0}
.avgrid .d{width:30px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.68rem;color:var(--dark)}
.avgrid .v{font-weight:700}
.shield{display:flex;gap:8px;background:var(--bluebg);border:1.5px solid #CDE8F7;border-radius:10px;padding:10px 12px;margin:12px 0 0}
.shield svg{flex:none;margin-top:1px}
.shield .t{font-size:.7rem;font-weight:700;color:var(--blued);line-height:1.5}
.done{padding:30px 20px;text-align:center}
.done .ck{width:52px;height:52px;border-radius:50%;background:#E1F5EE;color:#0f6e56;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.done .ck.grey{background:#F0F1F4;color:var(--grey2)}
.done h2{margin-bottom:6px}
.contact{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);
font-size:.82rem;font-weight:700;color:var(--grey2);text-align:center;line-height:1.5}
.contact a{color:var(--blued);text-decoration:none;font-weight:800}
.cards{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:left}
.cards .ey{display:block;font-family:'Nunito',sans-serif;font-weight:900;font-size:.72rem;
letter-spacing:.06em;text-transform:uppercase;color:var(--grey2);margin-bottom:8px}
.pcard{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.pcard:last-of-type{border-bottom:none}
.pcard .av{width:34px;height:34px;flex:none;border-radius:50%;background:var(--dark);color:#fff;
font-family:'Nunito',sans-serif;font-weight:900;font-size:.76rem;display:flex;align-items:center;justify-content:center}
.pcard .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pcard .nm{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;color:var(--dark);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ti{display:block;font-size:.75rem;font-weight:700;color:var(--grey2)}
.pcard .tel{font-weight:800;font-size:.84rem;color:var(--blued);text-decoration:none;white-space:nowrap}
.vcf{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;
border:1.5px solid var(--border);border-radius:10px;padding:11px;text-decoration:none;
font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;color:var(--dark)}
.vcf:hover{border-color:var(--blue);color:var(--blued)}
.done .linkbtn{display:block;margin:12px auto 0;border:none;background:none;padding:4px;cursor:pointer;
font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--blued);text-decoration:underline}
.done p{font-size:.85rem;font-weight:700;color:var(--grey2);margin:0}
.gone{padding:40px 20px;text-align:center;font-weight:700;color:var(--grey2)}
</style>
</head>
<body>
<div class="card" id="card"><div class="gone">Loading…</div></div>

<script src="assets/kb-markup.js"></script>
<script type="module">
const SB_URL='https://xuvsehrevxackuhmbmry.supabase.co';
const FN=SB_URL+'/functions/v1/intake';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SHIELD='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E7AA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>';
const CHEV='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#C7CAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const CHEVD='<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const LOGO='<img class="logo" src="assets/images/CPRLogo_NoAssurant_White.svg" alt="CPR Cell Phone Repair">';
const CHECK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const CONTACTICO='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>';

const Q=new URLSearchParams(location.search);
const TOKEN=Q.get('t')||'';
/* The offer link does the offer and nothing else. The handbook and the
   new-hire form live behind the welcome email's link (&s=hire), so a
   candidate deciding on an offer is never handed HR paperwork. */
const STAGE=Q.get('s')||'offer';
/* I-9 verification: one List A document, or one from List B plus one from
   List C. Worded as what a person actually carries, not as list letters. */
const I9_OPTIONS=[
 {v:'US passport (or passport card)',n:'On its own — nothing else needed'},
 {v:'Permanent Resident Card (green card)',n:'On its own — nothing else needed'},
 {v:'Driver\u2019s license or state ID + Social Security card',n:'Two documents'},
 {v:'Driver\u2019s license or state ID + birth certificate',n:'Two documents'},
 {v:'Employment Authorization Document (EAD)',n:'On its own — nothing else needed'},
 {v:'Something else',n:'We\u2019ll sort it out with you before your first day'}];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HOURS=['Open','8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM','7 PM','8 PM','Close'];
let PHASE='form';        // offer | signed | handbook | form | done | declined
let CONTACT=null;        // {store, phone, address, email} — how to reach us
let SHOWOFFER=false;     // the signed letter, expanded from the confirmation card
let STEP=1, SUBMITTED=false, TRIED=false, OPENDAY=null, DECLINING=false;
let EC2=false;           // the second emergency contact, added on request
let PINTAKEN=false;      // server says someone already signs in with it
let ACCEPTING=false;     // they've chosen Accept — show the signature
let JUSTSIGNED=false;    // stop at the signed card instead of running straight on
const D={first:'',middle:'',last:'',preferred:'',dob:'',phone:'',email:'',
  street:'',city:'',zip:'',shirt:'',i9:'',pin:'',
  e1name:'',e1rel:'',e1phone:'',e2name:'',e2rel:'',e2phone:'',
  avail:DAYS.map((d,i)=>({day:i,mode:'all',from:'Open',to:'Close'}))};
let INVITE=null,HANDBOOK=null,ACK=null,HBOPEN=0,OWNERSIG=null;

async function call(body){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return {status:r.status,data:await r.json().catch(()=>({}))};
}
/* light markup → safe HTML — the shared KB renderer (assets/kb-markup.js), so

let sigCanvas=null,sigStrokes=false;
function sigHtml(){
  return '<span class="siglabel">Signature — sign with your finger or mouse</span>'
    +'<div class="sigwrap"><canvas id="sig"></canvas><div class="sigline"></div>'
    +'<div class="sighint" id="sigHint">Sign here</div>'
    +'<button class="sigclear" id="sigClear" type="button">Clear</button></div>';
}
function wireSig(){
  sigCanvas=$('#sig');if(!sigCanvas)return;
  sigStrokes=false;
  const ctx=sigCanvas.getContext('2d');
  const scale=window.devicePixelRatio||1,r=sigCanvas.getBoundingClientRect();
  sigCanvas.width=r.width*scale;sigCanvas.height=r.height*scale;ctx.scale(scale,scale);
  ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2D2D3B';
  let drawing=false,last=null;
  const pos=e=>{const b=sigCanvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  sigCanvas.addEventListener('pointerdown',e=>{e.preventDefault();sigCanvas.setPointerCapture(e.pointerId);drawing=true;last=pos(e);sigStrokes=true;$('#sigHint').style.display='none';});
  sigCanvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>sigCanvas.addEventListener(ev,()=>{drawing=false;}));
  $('#sigClear').onclick=()=>{ctx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigStrokes=false;$('#sigHint').style.display='flex';};
}

  const af=$('#avFrom'),at=$('#avTo');
  if(af)af.onchange=()=>{D.avail[OPENDAY].from=af.value;};
  if(at)at.onchange=()=>{D.avail[OPENDAY].to=at.value;};
  const sub=$('#submit');if(sub)sub.onclick=async()=>{
    sub.disabled=true;sub.textContent='Sending…';
    const modes={all:'all',hours:'hours',off:'off'};
    const r=await call({action:'submit',token:TOKEN,
      legal_first:D.first,legal_middle:D.middle,legal_last:D.last,preferred_name:D.preferred,
      dob:D.dob,phone:D.phone,personal_email:D.email,
      address:{street:D.street,city:D.city,zip:D.zip},
      emergency:D.e1name?{name:D.e1name,relationship:D.e1rel||null,phone:D.e1phone}:null,
      emergency2:D.e2name?{name:D.e2name,relationship:D.e2rel||null,phone:D.e2phone}:null,
      shirt_size:D.shirt,i9_docs:D.i9,suggested_pin:D.pin,
      availability:D.avail.map(a=>({day:a.day,mode:modes[a.mode]||'all',from:a.mode==='hours'?a.from:null,to:a.mode==='hours'?a.to:null}))});
    if(r.status===200&&r.data.ok){SUBMITTED=true;PHASE='done';draw();}
    else if(r.data&&r.data.error==='pin_taken'){
      /* someone claimed it between their check and this submit */
      sub.disabled=false;sub.textContent='Submit';PINTAKEN=true;TRIED=true;STEP=4;draw();window.scrollTo(0,0);}
    else{sub.disabled=false;sub.textContent='Submit';alert((r.data&&r.data.error)||'Something went wrong — try again.');}
  };
}
/* ---------- draw ---------- */
/* Their signed copy — offered as soon as offer_signed_at exists, so nobody has
   to finish the whole new-hire form (or bring paper back) to get it. */
function pdfBarHtml(){
  return (INVITE&&INVITE.offer_signed_at)
    ? '<div class="pdfbar"><span class="t">Offer signed \u2713</span>'
      +'<button type="button" id="dlPdfBar">Download PDF</button></div>'
    : '';
}
async function downloadSigned(btn,label){
  const t=btn.textContent; btn.disabled=true; btn.textContent='Building\u2026';
  try{
    const r=await call({action:'signed_pdf',token:TOKEN});
    if(!(r.status===200&&r.data.ok&&r.data.pdf))throw new Error(r.data.error||'failed');
    const bytes=Uint8Array.from(atob(r.data.pdf),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=r.data.filename||'CPR Offer \u2014 signed.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ alert('Download failed \u2014 try again.'); }
  btn.disabled=false; btn.textContent=label||t;
}
function wirePdfBar(){
  const b=$('#dlPdfBar');
  if(b)b.onclick=()=>downloadSigned(b,'Download PDF');
}
function draw(){
  const card=$('#card');
  card.classList.toggle('wide',PHASE==='handbook');
  card.classList.toggle('read',PHASE==='offer');
  if(PHASE==='done'){
    card.innerHTML='<div class="chd">'+LOGO+'</div>'
      +'<div class="done"><span class="ck">'+CHECK+'</span><h2>All set'+(firstName()?', '+esc(firstName()):'')+'!</h2>'
      +'<p>Your manager has everything they need.<br>See you on your first day.</p>'
      +(INVITE&&INVITE.offer_signed_at?'<button class="btn alt" id="dlPdf" style="margin-top:16px;width:100%">⬇ Download your signed offer (PDF)</button>':'')
      +peopleHtml()+contactHtml()
      +'</div>';
    const dl=$('#dlPdf');
    if(dl)dl.onclick=()=>downloadSigned(dl,'\u2B07 Download your signed offer (PDF)');
    return;
  }
  if(PHASE==='signed'){
    /* Signing is a milestone, so it gets a confirmation card — the same shape
       the finished-form card uses — rather than dropping them back onto the
       full letter. The letter is still one tap away. */
    card.classList.remove('wide');
    card.classList.toggle('read',SHOWOFFER);
    const sig=INVITE.offer_signature
      ?'<img src="'+esc(INVITE.offer_signature)+'" alt="Your signature" class="sigimg">':'';
    card.innerHTML='<div class="chd">'+LOGO+'</div>'
      +'<div class="done"><span class="ck">'+CHECK+'</span>'
      +'<h2>Offer signed'+(firstName()?', '+esc(firstName()):'')+'!</h2>'
      +'<p>'+((INVITE&&INVITE.personal_email)
        ? 'Keep an eye on your email \u2014 the Employee Handbook and your new-hire form are on their way.'
        : 'Your manager will send the Employee Handbook and your new-hire form.')
      +'</p>'
      +'<button class="btn alt" id="dlPdf" style="margin-top:16px;width:100%">\u2B07 Download your signed offer (PDF)</button>'
      +'<button class="linkbtn" id="seeOffer">'+(SHOWOFFER?'Hide':'View')+' your signed offer</button>'
      +peopleHtml()+contactHtml()
      +'</div>'
      +(SHOWOFFER
        ?'<div class="cbd" style="padding-top:0"><div class="offerbox">'+renderOffer(INVITE.offer_body)
          +'<div class="acc"><div class="acch">Accepted and agreed</div>'+sig
          +'<div class="accn">'+esc(INVITE.offer_signed_name||'')
          +' &nbsp;\u00b7&nbsp; '+esc(fmtDate(INVITE.offer_signed_at))+'</div></div>'
          +'</div></div>'
        :'');
    const dl=$('#dlPdf');
    if(dl)dl.onclick=()=>downloadSigned(dl,'\u2B07 Download your signed offer (PDF)');
    $('#seeOffer').onclick=()=>{SHOWOFFER=!SHOWOFFER;draw();};
    return;
  }
  if(PHASE==='declined'){
    card.classList.remove('wide','read');
    card.innerHTML='<div class="chd">'+LOGO+'</div>'
      +'<div class="done"><span class="ck grey">'+CHECK+'</span><h2>Thanks for your time</h2>'
      +'<p>We appreciate you considering CPR, and for letting us know either way.<br>'
      +'If anything changes down the road, we\u2019d be glad to hear from you.</p></div>';
    return;
  }
  const body=PHASE==='offer'?offerBody():PHASE==='handbook'?handbookBody():stepBody();
  card.innerHTML=head()+'<div class="cbd">'+prog()+pdfBarHtml()+body+'</div>';
  wirePdfBar();
  if(PHASE==='offer')wireOffer();
  else if(PHASE==='handbook')wireHandbook();
  else wireForm();
}
async function refresh(){
  const r=await call({action:'get',token:TOKEN});
  if(r.status===200&&r.data.ok){
    INVITE=r.data.intake;
    if(r.data.contact)CONTACT=r.data.contact;
    if(r.data.handbook)HANDBOOK=r.data.handbook;
    if(r.data.ack)ACK=r.data.ack;
    OWNERSIG=r.data.owner_sig||OWNERSIG;
    DECLINING=false;ACCEPTING=false;derivePhase();
  }
  draw();window.scrollTo(0,0);
}
(async()=>{
  if(!TOKEN){$('#card').innerHTML='<div class="gone">This link is missing its code — ask your manager to resend it.</div>';return;}
  const r=await call({action:'get',token:TOKEN});
  if(!(r.status===200&&r.data.ok)){$('#card').innerHTML='<div class="gone">This link isn’t valid anymore — ask your manager to resend it.</div>';return;}
  INVITE=r.data.intake;
  if(r.data.contact)CONTACT=r.data.contact;
  if(r.data.handbook)HANDBOOK=r.data.handbook;
  if(r.data.ack)ACK=r.data.ack;
  OWNERSIG=r.data.owner_sig||null;
  derivePhase();
  if(INVITE.invited_name&&!D.first){const p=INVITE.invited_name.split(' ');D.first=p[0]||'';D.last=p.slice(1).join(' ');}
  draw();
})();
</script>
